<style>

<script>
(() => {
'use strict';
// ================= Songs =================
// token: Note+octave (C D E F G A B, with # or b), ":h" = hold tile (2 rows), ":H" = hold tile (3 rows)
const up = s => s.replace(/([A-G][#b]?)(\d)/g, (m, n, o) => n + (+o + 1));
// 夢中的婚禮 (Mariage d'Amour), G minor
const MA_A = 'G5 G5 A5 A5 Bb5 Bb5 A5 A5 G5 G5 D5 D5 Bb4 Bb4 G4 G4 F5 F5 Eb5 Eb5 D5 Eb5 F5 Eb5:h ' +
             'Eb5 Eb5 F5 F5 G5 G5 A5:h A5 F5 F5 C5 C5 Eb5 Eb5 D5 D5 C5 D5 Eb5 D5:H';
const MA_B = 'D5:h D5 C5 D5:h D5 C5 D5:h Eb5 D5 Eb5:h Eb5 D5 Eb5:h Eb5 D5 Eb5 E5 F5:h F5 G5 F5 G5 D5:H';
// 給愛麗絲 (Für Elise), A minor
const FE_A = 'E5 D#5 E5 D#5 E5 B4 D5 C5 A4:h C4 E4 A4 B4:h E4 G#4 B4 C5:h E4 ' +
             'E5 D#5 E5 D#5 E5 B4 D5 C5 A4:h C4 E4 A4 B4:h E4 C5 B4 A4:h';
const FE_B = 'B4 C5 D5 E5:h G4 F5 E5 D5:h F4 E5 D5 C5:h E4 D5 C5 B4:h E4 E5 E5 E6 D#5 E5 D#5 E5 D#5';
// 小星星 (Twinkle Twinkle Little Star), C major
const TW = 'C5 C5 G5 G5 A5 A5 G5:h F5 F5 E5 E5 D5 D5 C5:h G5 G5 F5 F5 E5 E5 D5:h G5 G5 F5 F5 E5 E5 D5:h ' +
           'C5 C5 G5 G5 A5 A5 G5:h F5 F5 E5 E5 D5 D5 C5:H';
// 卡農 (Pachelbel Canon in D)
const CA = 'F#5:h E5:h D5:h C#5:h B4:h A4:h B4:h C#5:h D5 C#5 B4 A4 G4 F#4 G4 E4 ' +
           'D4 F#4 A4 G4 F#4 D4 F#4 E4 D4 B3 D4 A4 G4 B4 A4 G4 ' +
           'F#4 D4 E4 C#5 D5 F#5 A5 A4 B4 G4 A4 F#4 D4 D5 D5:H';
// 歡樂頌 (Ode to Joy), C major
const OJ1 = 'E5 E5 F5 G5 G5 F5 E5 D5 C5 C5 D5 E5 E5:h D5 D5:h ';
const OJ2 = 'E5 E5 F5 G5 G5 F5 E5 D5 C5 C5 D5 E5 D5:h C5 C5:h ';
const OJ3 = 'D5 D5 E5 C5 D5 E5 F5 E5 C5 D5 E5 F5 E5 D5 C5 D5 G4:h ';
// ---- 公有領域新增歌曲 ----
const TM = 'B4 A4 G#4 A4 C5:h D5 C5 B4 C5 E5:h F5 E5 D#5 E5 B5 A5 G#5 A5 B5 A5 G#5 A5 C6:H A5 C6 B5 A5 G5 A5 B5 A5 G5 A5 B5 A5 G5 F#5 E5:h';
const TM_C = 'A5:h B5:h C#6:h C#6:h B5:h A5:h B5:h C#6:h B5:h A5:h G#5:h F#5:h E5:h A5:h B5:h C#6:h C#6:h B5:h A5:h B5:h C#6:h B5:h A5:h G#5:h A5:h';
const NK = 'G5 D5 G5 D5 G5 D5 G5 B5 D6:h C6 A5 C6 A5 C6 A5 F#5 A5 D5:h G5 G5 B5 A5 G5 G5 F#5 F#5 A5 C6 F#5 A5 G5:h';
const NK_C = 'G5:h G5:h F#5:h F#5:h E5:h E5:h D5:h D5:h G5:h A5:h B5:h C6:h D6:h C6:h B5:h A5:h G5:h';
const MS = 'G#4 C#5 E5 G#4 C#5 E5 G#4 C#5 E5 G#4 C#5 E5 A4 C#5 E5 A4 C#5 E5 A4 D5 F#5 A4 D5 F#5 G#4 C5 F#5 G#4 C#5 E5 G#4 C#5 D#5 F#4 C5 D#5';
const MS_C = 'G#5:h G#5:h G#5:h A5:h G#5:h C#6:h B5:h A5:h G#5:h F#5:h E5:h F#5:h G#5:h C#5:h';
const SW = 'G5:h F#5 B4 C#5 D5 E5:h F#5 E5:h D5 C#5 B4 C#5 D5:h E5 D5:h C#5 B4 A4 B4 C#5:H';
const SW_C = 'A5:h G5:h F#5:h E5:h D5:h F#5:h B5:h A5:h G5:h F#5:h E5:h D5:h C#5:h D5:h';
const HD = 'F#4 B4 D5 C#5 B4 F#4 B4 D5 C#5 B4 A#4 C#5 F#4 A#4 C#5 B4 A#4 F#4 F#4 B4 D5 C#5 B4 E5 D5 C#5 B4 C#5 B4 A#4 B4:h';
const HD_C = 'F#5:h G5:h A5:h G5:h F#5:h E5:h D5:h C#5:h B4:h D5:h F#5:h E5:h D5:h C#5:h B4:h';
const GS = 'A4 C5 D5 E5 F5 E5 D5:h B4 G4 A4 B4 C5:h A4 A4 G#4 A4 B4:h G#4 E4:h A4 C5 D5 E5 F5 E5 D5:h B4 G4 A4 B4 C5 B4 A4 G#4 F#4 G#4 A4:H';
const GS_C = 'C6:h C6:h B5:h A5:h G5:h E5:h F5:h G5:h A5:h F5:h D5:h E5:h F5:h E5:h D5:h C#5:h B4:h C#5:h A4:h';
const JS = 'E5 E5 G5 A5 C6 C6 A5 G5 G5 A5 G5:h E5 E5 G5 A5 C6 C6 A5 G5 G5 A5 G5:h G5 G5 G5 E5 G5 A5 A5 G5:h E5 D5 E5 G5 E5 D5 C5 C5 D5 C5:h';
const JS_C = 'G5:h A5:h C6:h A5:h G5:h E5:h G5:h A5:h G5:h E5:h D5:h E5:h C5:h';
const CH = 'D5 C#5 C5 B4 Bb4 A4 Ab4 G4 F5 E5 F5 E5 D5:h F5 E5 D5 C5 Bb4 A4 G4 A4 Bb4 A4 G4 F4 E4 D4:h';
const CH_C = 'A5:h G5:h F5:h E5:h D5:h E5:h F5:h E5:h D5:h C5:h D5:h E5:h D5:h C5:h Bb4:h A4:h';
const SONGS = [
  { id: 'mariage', title: '夢中的婚禮', sub: "Mariage d'Amour · Paul de Senneville", icon: '💍', diff: '普通', color: '#ffb3d9', text: [MA_A, MA_B, up(MA_B)].join(' '), speed: 3.2, accel: 0.035, max: 9.5 },
  { id: 'elise',   title: '給愛麗絲',   sub: 'Für Elise · 貝多芬 Beethoven',           icon: '🌹', diff: '困難', color: '#ff8a8a', text: [FE_A, FE_B, FE_A].join(' '), speed: 4.0, accel: 0.045, max: 11 },
  { id: 'twinkle', title: '小星星',     sub: 'Twinkle Twinkle Little Star · 童謠',     icon: '⭐', diff: '簡單', color: '#9bffb0', text: TW, speed: 2.4, accel: 0.022, max: 7 },
  { id: 'canon',   title: '卡農',       sub: 'Canon in D · 帕海貝爾 Pachelbel',        icon: '🎻', diff: '普通', color: '#ffe08a', text: CA, speed: 3.0, accel: 0.03, max: 9 },
  { id: 'ode',     title: '歡樂頌',     sub: 'Ode to Joy · 貝多芬 Beethoven',          icon: '🎉', diff: '簡單', color: '#9bffb0', text: OJ1 + OJ2 + OJ3 + OJ2, speed: 2.7, accel: 0.026, max: 8 },
  { id: 'turkish', title: '土耳其進行曲', sub: 'Rondo alla Turca · 莫扎特 Mozart', icon: '🥁', diff: '困難', color: '#ff8a8a', text: [TM, TM_C, TM].join(' '), speed: 3.8, accel: 0.04, max: 10.5 },
  { id: 'nacht', title: '小夜曲', sub: 'Eine kleine Nachtmusik · 莫扎特 Mozart', icon: '🌙', diff: '普通', color: '#ffe08a', text: [NK, NK_C, NK].join(' '), speed: 3.3, accel: 0.035, max: 9.5 },
  { id: 'moon', title: '月光奏鳴曲', sub: 'Moonlight Sonata 第一樂章 · 貝多芬 Beethoven', icon: '🌕', diff: '簡單', color: '#9bffb0', text: [MS, MS_C, MS].join(' '), speed: 2.6, accel: 0.024, max: 7.5 },
  { id: 'swan', title: '天鵝', sub: 'Le Cygne · 聖桑 Saint-Saëns', icon: '🦢', diff: '簡單', color: '#9bffb0', text: [SW, SW_C, SW].join(' '), speed: 2.5, accel: 0.022, max: 7.5 },
  { id: 'hungar', title: '匈牙利舞曲第5號', sub: 'Hungarian Dance No.5 · 布拉姆斯 Brahms', icon: '💃', diff: '困難', color: '#ff8a8a', text: [HD, HD_C, HD].join(' '), speed: 3.7, accel: 0.04, max: 10.5 },
  { id: 'green', title: '綠袖子', sub: 'Greensleeves · 英國民謠', icon: '🍀', diff: '普通', color: '#ffe08a', text: [GS, GS_C, GS].join(' '), speed: 2.9, accel: 0.03, max: 8.5 },
  { id: 'jasmine', title: '茉莉花', sub: 'Mo Li Hua · 中國民歌', icon: '🌼', diff: '簡單', color: '#9bffb0', text: [JS, JS_C, JS].join(' '), speed: 2.6, accel: 0.024, max: 7.5 },
  { id: 'carmen', title: '卡門 哈巴涅拉', sub: 'Habanera · 比才 Bizet', icon: '🌹', diff: '普通', color: '#ffe08a', text: [CH, CH_C, CH].join(' '), speed: 3.0, accel: 0.03, max: 9 },
];
const NOTE_IDX = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
function freqOf(name){ const m = name.match(/^([A-G][#b]?)(\d)$/); if (!m) throw new Error('bad note ' + name); const midi = (+m[2]+1)*12 + NOTE_IDX[m[1]]; return 440*Math.pow(2,(midi-69)/12); }
SONGS.forEach(sg => { if (sg.chart) { sg.notes = []; return; } sg.notes = sg.text.trim().split(/\s+/).map(tok => {
  const [body, dur] = tok.split('/'); const [n, h] = body.split(':');
  const d = dur ? +dur : 0;
  const len = h === 'H' ? 3 : h === 'h' ? (d || 2) : 1;
  return { f: freqOf(n), name: n, len, adv: Math.max(len, d || len) }; // adv = rows until next tile (rests = white rows)
}); });
let curSong = SONGS[0]; // 夢中的婚禮 is the default
let SONG = curSong.notes;

// ================= Audio (Web Audio piano synth) =================
let actx = null, master = null, reverb = null;
function initAudio(){
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }

let flash = null, dieTimer = 0, scrollTarget = null, bannerY = 0, overReason = '';

let chartStart = 0, chartIdx = 0;   // chart songs: absolute time of tile 0, running event index
const R_ROWS = () => curSong.speed;  // rows per second
function chartLen(){ return musicBuf ? musicBuf.duration : curSong.loopLen; }
let lastCols = [];
function pickCol(avoid){ const free = [0,1,2,3].filter(c => !avoid.includes(c)); return free[Math.floor(Math.random()*free.length)]; }
function addChartTile(){
  const C = curSong.chart, n = C.length, k = Math.floor(chartIdx / n), ev = C[chartIdx % n];
  const nx = C[(chartIdx + 1) % n], nextT = (chartIdx % n === n - 1 ? (k + 1) * chartLen() : k * chartLen()) + nx[0];

function addTile(){

  lastCol = col;
  const t = { row: nextRow, len: n.len, col, note: n, hold: n.len > 1, state: 'idle', hitAt: 0, fill: 0, offset: 0, sound: null, holdScroll: 0, bonus: 0 };

// ================= Input =================
function tileAt(x, y){

  return { col, w };
}
function press(id, x, y, fromKey){
  initAudio();

  const nt = nextTile(); if (!nt) return;
  let hit = null, col, w;
  if (fromKey != null){
    col = fromKey;
    if (sy(nt.row*ROW) < ROW*0.25) return; // next tile not on screen yet: ignore early key
    const twin = tiles.find(t => t.state === 'idle' && t.col === col && Math.abs(t.row - nt.row) < 0.01);
    if (twin && sy(nt.row*ROW) > 0){ hit = twin; w = nt.row*ROW + ROW*0.5; x = GX + (col+0.5)*LANE; y = sy(w); }
  } else {
    const r = tileAt(x, y); col = r.col; w = r.w; if (col < 0) return;
    if (r.tile && r.tile.state !== 'idle') return;            // re-tap of a done tile: ignore
    if (r.tile && r.tile !== nt && Math.abs(r.tile.row - nt.row) < 0.01) hit = r.tile;   // other tile of a double

    hit.state = 'hit';

function release(id){

  const total = t.len*ROW, frac = Math.min(1, t.fill/total);

  if (full){ const cx = GX + (t.col+0.5)*LANE, yy = sy(t.row*ROW + t.fill); collectItem(t, cx, Math.max(80, yy)); burst(cx, yy, 18, '#9be8ff'); hearts(cx, yy, 5); rings.push({ x: cx, y: yy, r: LANE*0.35, life: 1, color: '120,220,255' }); }

function rr(x, y, w, h, r){ r = Math.min(r, w/2, h/2); ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); }
function heartPath(x, y, s){ ctx.beginPath(); ctx.moveTo(x, y + s*0.35); ctx.bezierCurveTo(x - s*1.1, y - s*0.35, x - s*0.45, y - s*1.05, x, y - s*0.45); ctx.bezierCurveTo(x + s*0.45, y - s*1.05, x + s*1.1, y - s*0.35, x, y + s*0.35); ctx.closePath(); }

let snow = [];
function drawDittoBackground(time, dt){
  ctx.fillStyle = '#16233f'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.beginPath(); ctx.rect(GX, 0, GW, H); ctx.clip();
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#f2f8ff'); g.addColorStop(0.5, '#d6e8fc'); g.addColorStop(1, '#a9c8f0');
  ctx.fillStyle = g; ctx.fillRect(GX, 0, GW, H);
  // soft window-light rays
  for (let i = 0; i < 4; i++){
    const x0 = GX + GW*(-0.1 + i*0.32) + Math.sin(time*0.0001 + i)*GW*0.05;
    const rg = ctx.createLinearGradient(x0, 0, x0 + GW*0.3, H);
    rg.addColorStop(0, 'rgba(255,255,255,0.55)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0 + GW*0.1, 0); ctx.lineTo(x0 + GW*0.42, H); ctx.lineTo(x0 + GW*0.24, H); ctx.closePath(); ctx.fill();
  }
  // lane dividers (soft navy)
  ctx.strokeStyle = 'rgba(70,100,170,0.28)'; ctx.lineWidth = 1.2; ctx.shadowColor = 'rgba(255,255,255,1)'; ctx.shadowBlur = 6;
  for (let i = 1; i < 4; i++){ const x = Math.round(GX + i*LANE) + 0.5; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  ctx.shadowBlur = 0;
  // snow
  if (snow.length === 0) for (let i = 0; i < 70; i++) snow.push({ x: Math.random(), y: Math.random(), r: 1 + Math.random()*2.6, v: 0.03 + Math.random()*0.06, ph: Math.random()*6 });
  ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(255,255,255,1)'; ctx.shadowBlur = 6;
  for (const f of snow){
    f.y += f.v*dt; if (f.y > 1.05){ f.y = -0.05; f.x = Math.random(); }
    const xx = GX + ((f.x + Math.sin(time*0.0006 + f.ph)*0.02) % 1) * GW, yy = f.y*H;
    ctx.globalAlpha = 0.55 + 0.45*Math.sin(f.ph + time*0.002)**2; ctx.beginPath(); ctx.arc(xx, yy, f.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.restore();
}
// sailor uniform (水手服) drawn on canvas: navy top, striped sailor collar, white V, scarf bow
function drawSailor(x, y, w, h, alpha){
  ctx.save(); ctx.globalAlpha *= alpha == null ? 1 : alpha;
  const cx = x + w/2;
  const bg = ctx.createLinearGradient(0, y, 0, y + h); bg.addColorStop(0, '#2a3a72'); bg.addColorStop(1, '#141d3f');
  ctx.fillStyle = bg; rr(x, y, w, h, 7); ctx.fill();
  ctx.save(); rr(x, y, w, h, 7); ctx.clip();
  const ch = Math.min(h*0.78, w*0.9);
  // collar flap
  ctx.fillStyle = '#34488c';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + ch*0.38); ctx.lineTo(cx, y + ch); ctx.lineTo(x, y + ch*0.38); ctx.closePath(); ctx.fill();
  // two white stripes along the collar edge
  ctx.strokeStyle = '#f4f8ff'; ctx.lineWidth = Math.max(1.4, w*0.022);
  for (const d of [w*0.07, w*0.12]){
    ctx.beginPath(); ctx.moveTo(x - 2, y + ch*0.38 - d); ctx.lineTo(cx, y + ch - d*1.6); ctx.lineTo(x + w + 2, y + ch*0.38 - d); ctx.stroke();
  }
  // white V (dickey) with a navy line
  ctx.fillStyle = '#eef4ff';
  ctx.beginPath(); ctx.moveTo(cx - w*0.2, y - 1); ctx.lineTo(cx + w*0.2, y - 1); ctx.lineTo(cx, y + ch*0.6); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#2a3a72'; ctx.lineWidth = Math.max(1, w*0.015); ctx.beginPath(); ctx.moveTo(cx - w*0.13, y + ch*0.12); ctx.lineTo(cx + w*0.13, y + ch*0.12); ctx.stroke();
  // scarf bow at the V point
  const by = y + ch*0.66, bw = w*0.2;
  ctx.fillStyle = '#e8506b'; ctx.strokeStyle = 'rgba(120,20,40,0.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx, by); ctx.lineTo(cx - bw, by - bw*0.55); ctx.quadraticCurveTo(cx - bw*1.15, by, cx - bw, by + bw*0.55); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, by); ctx.lineTo(cx + bw, by - bw*0.55); ctx.quadraticCurveTo(cx + bw*1.15, by, cx + bw, by + bw*0.55); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - bw*0.18, by); ctx.lineTo(cx - bw*0.55, by + bw*1.5); ctx.lineTo(cx - bw*0.2, by + bw*1.35); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx + bw*0.18, by); ctx.lineTo(cx + bw*0.55, by + bw*1.5); ctx.lineTo(cx + bw*0.2, by + bw*1.35); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#c93a57'; ctx.beginPath(); ctx.arc(cx, by, bw*0.24, 0, Math.PI*2); ctx.fill();
  // hem stripe if there is room
  if (h > ch + 14){ ctx.fillStyle = 'rgba(240,246,255,0.75)'; ctx.fillRect(x, y + h - 9, w, 2); }
  ctx.restore(); ctx.restore();
}
// hold tile: long pleated skirt with a scarf trail down the middle and a bow at the press end
function drawSailorHold(x, y, w, h){
  const bg = ctx.createLinearGradient(0, y, 0, y + h); bg.addColorStop(0, '#2a3a72'); bg.addColorStop(1, '#141d3f');
  ctx.fillStyle = bg; rr(x, y, w, h, 7); ctx.fill();
  ctx.save(); rr(x, y, w, h, 7); ctx.clip();
  const n = 6;                                   // pleats
  for (let i = 0; i < n; i++){
    const px = x + (i + 0.5) * w / n;
    const pg = ctx.createLinearGradient(px - w/n/2, 0, px + w/n/2, 0);
    pg.addColorStop(0, 'rgba(255,255,255,0.10)'); pg.addColorStop(0.5, 'rgba(255,255,255,0)'); pg.addColorStop(1, 'rgba(0,0,0,0.25)');
    ctx.fillStyle = pg; ctx.fillRect(px - w/n/2, y, w/n, h);
  }
  ctx.fillStyle = 'rgba(240,246,255,0.85)'; ctx.fillRect(x, y + 6, w, 2); ctx.fillRect(x, y + 11, w, 2);   // waistband stripes
  // scarf trail
  const cx = x + w/2, sw = w*0.16;
  const sg = ctx.createLinearGradient(0, y, 0, y + h); sg.addColorStop(0, 'rgba(232,80,107,0.15)'); sg.addColorStop(1, 'rgba(232,80,107,0.95)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.moveTo(cx - sw*0.25, y + 16); ctx.lineTo(cx + sw*0.25, y + 16); ctx.lineTo(cx + sw*0.5, y + h - 10); ctx.lineTo(cx - sw*0.5, y + h - 10); ctx.closePath(); ctx.fill();
  ctx.restore();
}
let petals = [], lanterns = [];
function drawPalaceBackground(time, dt){
  ctx.fillStyle = '#1e0a0a'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.beginPath(); ctx.rect(GX, 0, GW, H); ctx.clip();
  const g = ctx.createLinearGradient(0, 0, 0, H);         // warm dusk sky
  g.addColorStop(0, '#3a1236'); g.addColorStop(0.35, '#8e2a3a'); g.addColorStop(0.7, '#d9653a'); g.addColorStop(1, '#f2b25a');
  ctx.fillStyle = g; ctx.fillRect(GX, 0, GW, H);
  // low sun glow
  const sg = ctx.createRadialGradient(GX + GW*0.7, H*0.86, 0, GX + GW*0.7, H*0.86, GW*0.6);
  sg.addColorStop(0, 'rgba(255,220,140,0.55)'); sg.addColorStop(1, 'rgba(255,220,140,0)'); ctx.fillStyle = sg; ctx.fillRect(GX, 0, GW, H);
  // distant palace roofline silhouette
  ctx.fillStyle = 'rgba(70,15,20,0.45)';
  ctx.beginPath(); ctx.moveTo(GX, H);
  const segs = [[0,0.9],[0.08,0.86],[0.2,0.86],[0.26,0.8],[0.42,0.8],[0.5,0.74],[0.58,0.8],[0.74,0.8],[0.8,0.86],[0.92,0.86],[1,0.9]];
  for (const [fx, fy] of segs) ctx.lineTo(GX + fx*GW, H*fy);
  ctx.lineTo(GX + GW, H); ctx.closePath(); ctx.fill();
  // gold lane dividers
  ctx.strokeStyle = 'rgba(255,215,120,0.4)'; ctx.lineWidth = 1.2; ctx.shadowColor = 'rgba(255,200,90,0.9)'; ctx.shadowBlur = 6;
  for (let i = 1; i < 4; i++){ const x = Math.round(GX + i*LANE) + 0.5; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  ctx.shadowBlur = 0;
  // floating lanterns (rising slowly)
  if (lanterns.length === 0) for (let i = 0; i < 6; i++) lanterns.push({ x: Math.random(), y: Math.random(), s: 0.7 + Math.random()*0.6, v: 0.008 + Math.random()*0.01, ph: Math.random()*6 });
  for (const l of lanterns){
    l.y -= l.v*dt; if (l.y < -0.1){ l.y = 1.1; l.x = Math.random(); }
    const lx = GX + l.x*GW + Math.sin(time*0.0005 + l.ph)*8, ly = l.y*H, r = 9*l.s;
    const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, r*3); lg.addColorStop(0, 'rgba(255,160,60,0.45)'); lg.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = lg; ctx.fillRect(lx - r*3, ly - r*3, r*6, r*6);
    ctx.fillStyle = '#e8402a'; ctx.beginPath(); ctx.ellipse(lx, ly, r, r*1.2, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffd76a'; ctx.fillRect(lx - r*0.6, ly - r*1.3, r*1.2, r*0.25); ctx.fillRect(lx - r*0.6, ly + r*1.05, r*1.2, r*0.25);
  }
  // falling plum blossom petals
  if (petals.length === 0) for (let i = 0; i < 40; i++) petals.push({ x: Math.random(), y: Math.random(), s: 2.5 + Math.random()*3, v: 0.03 + Math.random()*0.05, rot: Math.random()*6, vr: (Math.random()-0.5)*2, ph: Math.random()*6 });
  for (const f of petals){
    f.y += f.v*dt; f.rot += f.vr*dt; if (f.y > 1.05){ f.y = -0.05; f.x = Math.random(); }
    const px = GX + ((f.x + Math.sin(time*0.0007 + f.ph)*0.03 + 1) % 1)*GW, py = f.y*H;
    ctx.save(); ctx.translate(px, py); ctx.rotate(f.rot); ctx.fillStyle = 'rgba(255,190,205,0.85)';
    for (let k = 0; k < 5; k++){ ctx.rotate(Math.PI*2/5); ctx.beginPath(); ctx.ellipse(0, -f.s*0.6, f.s*0.42, f.s*0.65, 0, 0, Math.PI*2); ctx.fill(); }
    ctx.fillStyle = '#ffe08a'; ctx.beginPath(); ctx.arc(0, 0, f.s*0.25, 0, Math.PI*2); ctx.fill(); ctx.restore();
  }
  ctx.restore();
}
// golden glazed roof with upturned eaves + painted beam band; returns bottom y of the roof
function drawRoof(x, y, w, rh){
  const cx = x + w/2, eaveY = y + rh*0.72;
  // ridge
  ctx.fillStyle = '#b97a12'; rr(x + w*0.2, y + rh*0.06, w*0.6, rh*0.12, 2); ctx.fill();
  ctx.fillStyle = '#ffd76a'; ctx.beginPath(); ctx.arc(x + w*0.2, y + rh*0.08, rh*0.07, 0, Math.PI*2); ctx.arc(x + w*0.8, y + rh*0.08, rh*0.07, 0, Math.PI*2); ctx.fill(); // ridge-end ornaments
  // roof body (curved slopes, upturned corners)
  const rg = ctx.createLinearGradient(0, y, 0, eaveY); rg.addColorStop(0, '#ffe38a'); rg.addColorStop(1, '#d1921c');
  ctx.fillStyle = rg; ctx.beginPath();
  ctx.moveTo(x + w*0.22, y + rh*0.16); ctx.lineTo(x + w*0.78, y + rh*0.16);
  ctx.quadraticCurveTo(x + w*0.86, y + rh*0.55, x + w, y + rh*0.5);         // right slope, eave tip turns up
  ctx.lineTo(x + w - 2, eaveY);
  ctx.quadraticCurveTo(cx, y + rh*0.86, x + 2, eaveY);                       // gently curved eave line
  ctx.lineTo(x, y + rh*0.5);
  ctx.quadraticCurveTo(x + w*0.14, y + rh*0.55, x + w*0.22, y + rh*0.16);
  ctx.closePath(); ctx.fill();
  // glazed tile ribs
  ctx.strokeStyle = 'rgba(140,80,0,0.45)'; ctx.lineWidth = 1;
  for (let i = 1; i < 8; i++){ const fx = x + w*(0.1 + i*0.1); ctx.beginPath(); ctx.moveTo(x + w*0.22 + (fx - x - w*0.22)*0.6, y + rh*0.18); ctx.lineTo(fx, y + rh*0.74); ctx.stroke(); }
  ctx.strokeStyle = '#fff2b8'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x + 2, eaveY); ctx.quadraticCurveTo(cx, y + rh*0.86, x + w - 2, eaveY); ctx.stroke();
  // painted beam band (blue-green with gold dots)
  const by = y + rh*0.8, bh = rh*0.16;
  ctx.fillStyle = '#1f6f6b'; ctx.fillRect(x + w*0.06, by, w*0.88, bh);
  ctx.fillStyle = '#ffd76a'; for (let i = 0; i < 6; i++){ ctx.beginPath(); ctx.arc(x + w*(0.14 + i*0.144), by + bh/2, Math.max(1.2, bh*0.22), 0, Math.PI*2); ctx.fill(); }
  return by + bh;
}
// palace hall tile: gold roof, red wall & pillars, lattice door, marble base
function drawPalace(x, y, w, h){
  ctx.save(); rr(x, y, w, h, 6); ctx.clip();
  ctx.fillStyle = 'rgba(60,10,10,0.35)'; ctx.fillRect(x, y, w, h);
  const rh = Math.min(h*0.48, w*0.62);
  const wallTop = drawRoof(x, y, w, rh);
  const baseH = Math.max(4, h*0.09), wallBot = y + h - baseH;
  const wg = ctx.createLinearGradient(0, wallTop, 0, wallBot); wg.addColorStop(0, '#c62a22'); wg.addColorStop(1, '#8c1712');
  ctx.fillStyle = wg; ctx.fillRect(x + w*0.08, wallTop, w*0.84, wallBot - wallTop);
  ctx.fillStyle = '#6e0f0c';                                                   // pillars
  for (const fx of [0.1, 0.33, 0.62, 0.85]) ctx.fillRect(x + w*fx, wallTop, w*0.05, wallBot - wallTop);
  const dh = (wallBot - wallTop)*0.72, dw = w*0.24, dx = x + w/2 - dw/2, dy = wallBot - dh;   // lattice door
  if (dh > 6){
    ctx.fillStyle = '#e9b23c'; ctx.fillRect(dx, dy, dw, dh);
    ctx.strokeStyle = '#7a1a10'; ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++){ ctx.beginPath(); ctx.moveTo(dx + dw*i/4, dy); ctx.lineTo(dx + dw*i/4, dy + dh); ctx.stroke(); }
    for (let i = 1; i < 4; i++){ ctx.beginPath(); ctx.moveTo(dx, dy + dh*i/4); ctx.lineTo(dx + dw, dy + dh*i/4); ctx.stroke(); }
  }
  ctx.fillStyle = '#e8e2d6'; ctx.fillRect(x + w*0.02, wallBot, w*0.96, baseH);      // white marble terrace
  ctx.fillStyle = 'rgba(120,110,100,0.6)'; ctx.fillRect(x + w*0.02, wallBot, w*0.96, 1.5);
  ctx.restore();
}
// hold tile: tall red palace wall / gate tower with a gold roof on top and a studded gate at the press end
function drawPalaceHold(x, y, w, h){

const smooth01 = x => x <= 0 ? 0 : x >= 1 ? 1 : x*x*(3 - 2*x);
function histPos(){ return (curSong && curSong.chart && musicSrc) ? ((songPos() % chartLen()) + chartLen()) % chartLen() : 0; }
function histClimaxAt(p){       // 0..1 weight, 1.5 s cross-fades at climax edges
  let w = 0; for (const [a, b] of (curSong.climax || [])) w = Math.max(w, Math.min(smooth01((p - a + 0.75)/1.5), smooth01((b - p + 0.75)/1.5)));
  return w;
}
const tileIsBook = t => t.tAbs !== undefined && (curSong.climax || []).some(([a, b]) => { const p = ((t.tAbs % chartLen()) + chartLen()) % chartLen(); return p >= a - 0.01 && p < b - 0.01; });

  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#f1ede2'); g.addColorStop(1, '#d9d5c8'); ctx.fillStyle = g; ctx.fillRect(GX, 0, GW, H);
  const layers = [[0.42, 'rgba(120,125,120,0.35)', 0.9], [0.52, 'rgba(80,88,84,0.5)', 1.3], [0.62, 'rgba(40,46,44,0.65)', 1.9]];

    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(GX, H*0.8);
    for (let i = 0; i <= 40; i++){ const fx = i/40; const yy = H*(base - 0.12*Math.abs(Math.sin(fx*3.1*f + base*9)) - 0.05*Math.sin(fx*11*f + base*3)); ctx.lineTo(GX + fx*GW, yy); }
    ctx.lineTo(GX + GW, H*0.8); ctx.closePath(); ctx.fill();

    ctx.fillStyle = m; ctx.fillRect(GX, H*(base - 0.05), GW, H*0.17);
  }
  const rv = ctx.createLinearGradient(0, H*0.74, 0, H); rv.addColorStop(0, 'rgba(160,175,170,0)'); rv.addColorStop(0.15, 'rgba(160,175,170,0.5)'); rv.addColorStop(1, 'rgba(200,210,205,0.3)');
  ctx.fillStyle = rv; ctx.fillRect(GX, H*0.74, GW, H*0.26);

  for (let i = 0; i < 7; i++){ const yy = H*(0.78 + i*0.03), off = (time*0.01 + i*37) % GW; ctx.beginPath(); ctx.moveTo(GX + off, yy); ctx.lineTo(GX + off + GW*0.12, yy); ctx.stroke(); }

// ================= Update loop =================
let last = performance.now();
function update(dt, now){
  if (state === 'play'){
    if (curSong.chart && musicSrc){ speed = R_ROWS()*ROW; scroll = (songPos() - chartStart) * speed; }
    else { speed = baseSpeed() * (power.slow > 0 ? 0.55 : 1); scroll += speed*dt; }   // synth songs really slow down; audio songs keep tempo (wider window instead)
    gameT += dt; for (const k in power) power[k] = Math.max(0, power[k] - dt);
    if (power.auto > 0){                                   // 自動撳: tiles reaching the bottom are tapped for you
      for (let g = 0; g < 4; g++){
        const at = nextTile(); if (!at || sy(at.row*ROW) < H - ROW*0.45) break;
        tiles.filter(t => t.state === 'idle' && Math.abs(t.row - at.row) < 0.01).forEach(t => { const w = t.row*ROW + ROW*0.3; doHit(t, 'auto' + (++autoId), w, sy(w)); });
      }
    }
    while (nextRow*ROW < scroll + H*1.6) addTile();
    // holds
    for (const t of tiles){
      if (t.state === 'holding'){
        t.fill = t.offset + (scroll - t.holdScroll);
        if (t.fill >= t.len*ROW){ t.fill = t.len*ROW; for (const [k, v] of holds) if (v === t) holds.delete(k); finishHold(t, true); }
      }
    }
    // miss detection: unhit tile bottom passes screen bottom
    const nt = nextTile();
    if (nt && sy(nt.row*ROW) > H){
      // the tile counts as passed (both tiles of a double), costs one life; game over only when lives run out
      const group = tiles.filter(t => t.state === 'idle' && Math.abs(t.row - nt.row) < 0.01);
      group.forEach(t => { t.state = 'missed'; t.hitAt = performance.now(); });
      const cell = { col: nt.col, row: nt.row, len: nt.len, tile: nt };
      loseLife(cell, txt('miss', '漏咗黑色方塊！'), nt);
      if (state === 'dying') scrollTarget = nt.row*ROW - ROW*0.6;
    }
    // cleanup
    while (tiles.length && sy((tiles[0].row + tiles[0].len)*ROW) > H + ROW && tiles[0].state !== 'idle' && tiles[0].state !== 'holding') tiles.shift();
  } else if (state === 'dying'){
    if (scrollTarget != null) scroll += (scrollTarget - scroll) * Math.min(1, dt*8);
    dieTimer -= dt; if (dieTimer <= 0) gameOver();
  }
}
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  update(dt, now);
  let sx = 0, syy = 0; if (shakeT > 0){ shakeT -= dt; const a = 9 * Math.max(0, shakeT) / 0.35; sx = (Math.random()*2-1)*a; syy = (Math.random()*2-1)*a*0.5; }
  ctx.setTransform(DPR, 0, 0, DPR, sx*DPR, syy*DPR); ctx.lineJoin = 'round';
  drawBackground(now);
  if (state !== 'menu'){
    ctx.save(); ctx.beginPath(); ctx.rect(GX, 0, GW, H); ctx.clip(); drawTiles(now); drawItems(now); drawFlash(dt); ctx.restore();
    drawHoldFx(now); drawFx(dt); drawBanner(dt, now); drawHUD(dt);
  }

}

function showMenu(){ stopMusic(0.3); state = 'menu'; document.body.dataset.theme = ''; selIdx = Math.max(0, SONGS.indexOf(curSong)); renderSongs(); $('startScreen').classList.remove('hidden'); $('overScreen').classList.add('hidden'); }
function startSong(sg){ curSong = sg; musicBuf = musicBufs[sg.id] || null; document.body.dataset.theme = sg.theme || ''; SONG = sg.notes; best = getBest(sg); startFromMenu(); if (sg.chart) loadMusic(); }
function startFromMenu(){ initAudio(); $('startScreen').classList.add('hidden'); $('overScreen').classList.add('hidden'); resetGame(); }
function gameOver(){
  state = 'over';
  const isNew = score > best; if (isNew){ best = score; try{ localStorage.setItem(bestKey(curSong), best); }catch(e){} }
  $('overSong').textContent = '♪ ' + curSong.title;
  $('overReason').textContent = '遊戲結束 · ' + overReason;
  $('overScore').textContent = score; $('overBest').textContent = best;
  $('newBest').style.display = isNew && score > 0 ? 'block' : 'none';
  $('overStars').innerHTML = starHTML(starsOf(score));
  $('overLives').innerHTML = '生命 ' + [...Array(Math.max(3, lives)).keys()].map(i => i >= 3 ? '<span class="lv on gold">♥</span>' : i < lives ? '<span class="lv on">♥</span>' : '<span class="lv">♡</span>').join('');
  $('overScreen').classList.remove('hidden');
}
$('againBtn').addEventListener('click', startFromMenu);
$('homeBtn').addEventListener('click', showMenu);
window.addEventListener('keydown', e => {
  if (state !== 'menu') return;
  if (e.code === 'ArrowDown' || e.code === 'ArrowUp'){ e.preventDefault(); selIdx = (selIdx + (e.code === 'ArrowDown' ? 1 : SONGS.length - 1)) % SONGS.length; renderSongs(); document.querySelector('.card.sel')?.scrollIntoView({ block: 'nearest' }); }
});
showMenu();
// expose for testing
window.__pt = { get power(){ return power; }, get toast(){ return toast; }, applyItem, setLives(n){ lives = n; }, get state(){ return state; }, get score(){ return score; }, get tiles(){ return tiles; }, get scroll(){ return scroll; }, sy, get ROW(){ return ROW; }, get LANE(){ return LANE; }, get GX(){ return GX; }, nextTile, press, release, get SONG(){ return SONG; }, SONGS, get song(){ return curSong.id; }, songPos: () => musicSrc ? songPos() : null, get musicDur(){ return musicBuf ? musicBuf.duration : null; }, get musicPlaying(){ return !!musicSrc; }, get chartStart(){ return chartStart; }, get lives(){ return lives; } };
})();

// hide the instant splash once the game is ready
(function(){ const sp = document.getElementById('splash'); if (!sp) return; setTimeout(() => { sp.classList.add('out'); setTimeout(() => sp.remove(), 450); }, 350); })();
</script>
