function pf(r){return r<=1?1:r>=2?.03:1-(r-1)*.97}
function V(k){S.ven=S.ven||{};return S.ven[k]=S.ven[k]||{earn:0,log:[],cust:[],last:Date.now(),own:{},tanks:Array(6).fill(null),price:0}}

function aqBase(v){return Math.round(30+v.tanks.filter(Boolean).reduce((a,id)=>a+IT[id][3]*.04,0))}
function aqAttr(v){return Math.min(.95,v.tanks.filter(Boolean).reduce((a,id)=>a+.06*IT[id][2]*IT[id][2]+.04,0))}
function vUnits(k){const v=V(k);if(k=='aq')return v.tanks.some(Boolean)?[{n:'水族館門票',price:v.price||aqBase(v),base:aqBase(v),at:aqAttr(v)}]:[];
 const L=k=='onsen'?POOLS:HELIS;return L.filter(x=>v.own[x[0]]).map(x=>({n:x[1],price:v.own[x[0]],base:x[4],at:x[5]}))}
const VLB={aq:15000,onsen:30000,heli:50000},VLN={aq:'水族館',onsen:'溫泉',heli:'直升機坪'};
function vLv(k){return V(k).lv||1}function vAtL(k,at){return Math.min(.97,at*(1+.03*(vLv(k)-1)))}function vPfL(k,p,b){return pf(p/(b*(1+.02*(vLv(k)-1))))}
function vLvCost(k){return Math.round(VLB[k]*Math.pow(1.6,vLv(k)-1))}
function vUp(k){const v=V(k),l=vLv(k);if(l>=10)return toast('已經滿級 Lv10');const c=vLvCost(k);if(S.gold<c)return toast('金幣不足：需要 '+c.toLocaleString()+'🪙');S.gold-=c;v.lv=l+1;save();toast(`⬆️ ${VLN[k]} 升到 Lv${v.lv}！成交率 +${(v.lv-1)*3}%`);render()}
function vLvCard(k){const l=vLv(k);return `<div class="card">⭐ ${VLN[k]}等級 <b>Lv${l}/10</b>｜客人成交率 <b>+${(l-1)*3}%</b>｜可接受票價 <b>+${(l-1)*2}%</b><br>${l<10?`<button class="buy" style="min-height:44px" ${S.gold>=vLvCost(k)?'':'disabled'} onclick="vUp('${k}')">⬆️ 升級到 Lv${l+1}（🪙 ${vLvCost(k).toLocaleString()}）</button> <small>下一級：成交率 +${l*3}%</small>`:'<b>✅ 已滿級</b>'}</div>`}
function vStep(k){const v=V(k),U=vUnits(k);if(!U.length)return;const u=U[Math.random()*U.length|0],c=VCUS[Math.random()*VCUS.length|0];
 const ok=Math.random()<vAtL(k,u.at)*vPfL(k,u.price,u.base);if(ok){v.earn+=u.price;v.log.unshift(`${c} 買咗 ${u.n} +${u.price}🪙`)}
 v.cust.unshift({c,ok,say:ok?['好正呀！','值回票價！','下次再嚟！'][Math.random()*3|0]+'（'+u.n+'）':u.price>u.base*1.5?u.n+'咁貴？唔玩喇…':'今日唔得閒，下次先'});v.cust=v.cust.slice(0,4);v.log=v.log.slice(0,12)}
function vTick(k,st){const v=V(k);if(S.home<st){v.last=now();return}let n=Math.floor((now()-v.last)/15000);if(n<=0)return;v.last+=n*15000;n=Math.min(n,240);for(let i=0;i<n;i++)vStep(k);save()}
function vCollect(k){const v=V(k);S.gold+=v.earn;toast('收取 +'+v.earn+'🪙');v.earn=0;save();render()}
function vPrice(k,id,d){const v=V(k);if(k=='aq'){const b=aqBase(v);v.price=Math.max(1,(v.price||b)+d*Math.max(1,Math.round(b*.05)))}else{const x=(k=='onsen'?POOLS:HELIS).find(y=>y[0]==id);v.own[id]=Math.max(1,v.own[id]+d*Math.max(1,Math.round(x[4]*.05)))}save();render()}

function airInit(){S.air=S.air||{};const A=S.air;A.al=A.al||{island:1};A.aSel=A.aSel||'island';if(!A.al[A.aSel])A.aSel='island';A.routes=A.routes||{};A.tab=A.tab||'pad';A.reg=A.reg||null;A.sel=A.sel||null;A.earn=A.earn||0;A.today=A.today||0;A.total=A.total||0;A.pax=A.pax||0;A.reviews=A.reviews||[];A.last=A.last||Date.now();const d=new Date(),key=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();if(A.day!=key){A.day=key;A.today=0}return A}
function ownedAir(){const A=airInit();return AIRLINES.filter(x=>A.al[x[0]])}
function AL(){const L=ownedAir();return L[Math.random()*L.length|0]||AIRLINES[0]} // random owned for log flavour
function airBon(){const L=ownedAir();let sight=1,spd=1,pmHi=1,pmLo=1,pf=.9,long=0;L.forEach(x=>{const b=x[5];sight+=Math.max(0,(b.sight||1)-1);spd=Math.max(spd,b.spd||1);const pm=b.pm==null?1:b.pm;if(pm>1)pmHi=Math.max(pmHi,pm);if(pm<1)pmLo=Math.min(pmLo,pm);pf=Math.max(pf,b.pf||1);if(b.long)long=1});sight+=guideBon().sight;return{sight:Math.min(2.1,sight),spd,pm:pmHi*pmLo,pf,long,regs:L.filter(x=>x[5].reg).map(x=>x[5].reg),lcc:L.some(x=>x[5].lcc)}} // stack: sight cap 2.0; spd max; pm premium×LCC disc; long OR; regs
function airDur(d){const spd=airBon().spd||1;return Math.max(1,Math.round((d[5]/900)/spd))}
function destOf(id){return DEST.find(x=>x[0]==id)}
function buyAirline(id){const A=airInit(),x=AIRLINES.find(y=>y[0]==id);if(!x)return;if(A.al[id])return toast('已安裝 '+x[2]+' '+x[1]);if(S.gold<x[3])return toast('金幣不足');S.gold-=x[3];A.al[id]=1;A.aSel=id;save();toast('✅ 安裝 '+x[2]+' '+x[1]+'（加成會同其他航空疊加）');render()}

const HFLEET_EMO={reef:HFLEET_LV,palm:HFLEET_LV.map((e,i)=>i===1?'🛺':i===6?'🛻':e),over:HFLEET_LV.map((e,i)=>i===5?'🏎️':e),lagoon:HFLEET_LV,pearl:HFLEET_LV,royal:HFLEET_LV.map((e,i)=>i>=11?['👑🚗','🦄🚗','🔥🚘','🌌🚗','♾️🏎️'][i-11]:e)};
const HBOAT_EMO={reef:HBOAT_LV,palm:HBOAT_LV.map((e,i)=>i===1?'🚤':e),over:HBOAT_LV.map((e,i)=>i===4?'⛴️':e),lagoon:HBOAT_LV,pearl:HBOAT_LV,royal:HBOAT_LV.map((e,i)=>i>=11?['👑🚢','🦄🛳️','🔥🛳️','🌌🛳️','♾️🚢'][i-11]:e)};
function hotelFleetEmoji(id,lv){const L=HFLEET_EMO[id]||HFLEET_LV;const i=Math.min(L.length-1,Math.max(0,(lv|0)-1));return L[i]||HFLEET_LV[i]||'🚗'}
function hotelBoatEmoji(id,lv){const L=HBOAT_EMO[id]||HBOAT_LV;const i=Math.min(L.length-1,Math.max(0,(lv|0)-1));return L[i]||HBOAT_LV[i]||'🚢'}
/* v25.1: strong Lv→count — Lv0/1 few, mid medium, Lv16 packed (exterior especially) */
function hotelAnimUnitCount(lv){lv=lv|0;if(lv<=0)return 1;if(lv<=1)return 1;if(lv<=2)return 2;
  return Math.min(12,2+Math.floor((lv-1)*10/15))}
function hotelMapFleetNeed(maxF,sumF,nRoads,nOwned){maxF=maxF|0;sumF=sumF|0;nRoads=Math.max(1,nRoads|0);nOwned=Math.max(1,nOwned|0);
  if(maxF<=0)return 0;if(maxF<=1)return Math.min(2,nRoads);if(maxF<=2)return Math.min(3,nRoads*2);
  const per=Math.min(16,2+Math.floor(maxF*14/16)+Math.floor(sumF/6));
  return Math.min(64,Math.max(nRoads,per*nRoads+Math.floor(sumF/3)+Math.max(0,nOwned-1)))}
function hotelMapBoatNeed(maxB,sumB,nOwned){maxB=maxB|0;sumB=sumB|0;nOwned=Math.max(1,nOwned|0);
  /* Lv0–2 極少；Lv16 拉滿水面 */
  if(maxB<=0)return 0;if(maxB<=1)return 1;if(maxB<=2)return 2;
  return Math.min(32,1+Math.floor(maxB*24/16)+Math.floor(sumB/4)+Math.max(0,nOwned-1))}

function hotelPickByDeptLv(owned,kind,i){/* kind: fleet|boat — 高級酒店優先出圖，低級極少 */
 if(!owned||!owned.length)return (HOTELS[0]||['reef'])[0];
 const scored=owned.map(h=>{const id=h[0];const lv=kind==='boat'?(hotelBoatLv(id)|0):(hotelFleetLv(id)|0);return{id,lv}}).sort((a,b)=>b.lv-a.lv);
 const top=scored.filter(x=>x.lv>=scored[0].lv);
 /* 前 70% 名額用最高 Lv；其餘先用次高，幾乎唔用最低 */
 const n=scored.length;
 if(i%10<7)return top[i%top.length].id;
 const mid=scored.filter(x=>x.lv>=Math.max(1,scored[0].lv-4));
 if(mid.length)return mid[i%mid.length].id;
 return scored[0].id}
function hotelRoadBuff(){const base=(S.roads&&S.roads.length)?1.08:1;return base*hotelFleetBuff()*hotelBoatBuff()}
function hotelDeptEarn(id,dept){const st=hotelSt(id);const lv=st[dept]|0;if(lv<1)return 0;const t=hotelDeptTier(dept,lv);if(!t)return 0;return Math.round(t.earn*(HMULT[id]||1))}
function hotelTickEarn(id){const st=hotelSt(id);if(!hotelOwned(id))return;let add=0;HDEPTS.forEach(d=>{const lv=st[d[0]]|0;if(lv<1)return;const t=hotelDeptTier(d[0],lv);if(!t)return;if(Math.random()<t.at)add+=Math.round(t.earn*(HMULT[id]||1))});st.earn+=Math.round(add*hotelRoadBuff())}
function hotelTick(){if(S.home<16)return;hotelInit();HOTELS.forEach(h=>{if(!hotelOwned(h[0]))return;const st=hotelSt(h[0]);let n=Math.floor((now()-st.last)/18000);if(n<=0)return;st.last+=n*18000;n=Math.min(n,200);for(let i=0;i<n;i++)hotelTickEarn(h[0])})}
function openHotels(){if(S.home<16)return toast('🔒 酒店島：需建造滿 Lv16（而家 Lv'+S.home+'）');hotelInit();S.hotels.focus=null;HDRAW.on=0;go('hotels')}
function openHotel(id){if(HDRAW.on)return;if(!hotelOf(id))return;if(!hotelOwned(id))return;hotelInit();S.hotels.focus=id;S.hotels.tab='look';HDRAW.on=0;save();render()}
function setHotelTab(t){hotelInit();S.hotels.tab=t;save();render()}
function buyHotel(id){if(HDRAW.on)return;const h=hotelOf(id);if(!h)return;hotelInit();if(S.hotels.own[id])return toast('已擁有');if(S.home<16)return toast('需 Lv16');if(S.gold<h[3])return toast('金幣不足');S.gold-=h[3];S.hotels.own[id]=1;const st=hotelSt(id);st.look=1;st.room=1;st.dine=1;st.spa=1;st.last=now();hqEvent('unlock');save();toast('✅ 解鎖 '+h[2]+' '+h[1]);render()}
function hotelUp(id,dept){if(!hotelOwned(id))return toast('未擁有');const st=hotelSt(id);const lv=st[dept]|0;const next=hotelDeptTier(dept,lv+1);if(!next)return toast('已滿級');const cost=Math.round(next.cost*(HMULT[id]||1));if(lv>=1&&S.gold<cost)return toast('金幣不足');if(lv>=1)S.gold-=cost;st[dept]=lv+1;hqEvent('up');if(dept==='fleet')hqEvent('fleet');if(dept==='boat')hqEvent('boat');save();toast('⬆️ '+HDEPTS.find(d=>d[0]==dept)[1]+' → '+next.n);render()}
function hotelOpenDept(id,dept){if(!hotelOwned(id))return;const st=hotelSt(id);if((st[dept]|0)>0)return;st[dept]=1;st.last=now();save();toast('🆓 開放 '+HDEPTS.find(d=>d[0]==dept)[1]);render()}
function hotelCollect(id){hotelTick();const st=hotelSt(id);const n=st.earn|0;if(!n)return toast('冇待收');S.gold+=n;st.earn=0;hqEvent('collect');save();toast((hotelOf(id)||[])[2]+' 收取 +'+n+'🪙');render()}
function hotelCollectAll(){hotelTick();hotelInit();const parts=[];let n=0;HOTELS.forEach(h=>{if(!hotelOwned(h[0]))return;const st=hotelSt(h[0]);const a=st.earn|0;parts.push(h[2]+h[1]+' +'+a);if(a){n+=a;st.earn=0}});if(!n)return toast('冇待收');S.gold+=n;hqEvent('collect');hqEvent('collectAll');toast(parts.join('｜')+'｜合計 +'+n+'🪙');save();render()}
function hotelInIco(id,dept){const M={reef:{room:'🛏',dine:'🍹',spa:'💆',look:'🪑'},palm:{room:'🛏',dine:'🥥',spa:'🌿',look:'🪑'},over:{room:'🛏',dine:'🦞',spa:'🛁',look:'🛋️'},lagoon:{room:'🛏',dine:'🥂',spa:'💧',look:'🪑'},pearl:{room:'🛏',dine:'🍰',spa:'💅',look:'🪞'},royal:{room:'🛏',dine:'🍷',spa:'👑',look:'🛋️'}};const m=M[id]||M.reef;return(m[dept]||m.look)}
function hotelInLvBand(lv){lv=lv|0;if(lv>=13)return 4;if(lv>=9)return 3;if(lv>=5)return 2;return 1}
function hotelInMainParts(id,dept,lv){const b=hotelInLvBand(lv);
 if(dept==='room')return[['🛏'],['🛏️'],['🛏️','✨'],['🛏️','👑']][b-1]||['🛏'];
 if(dept==='dine')return[['🍽️'],['🦞'],['🥂'],['👑','🍷']][b-1]||['🍽️'];
 if(dept==='spa')return[['💆'],['🛁'],['🧖'],['👑','♨️']][b-1]||['💆'];
 return[hotelInIco(id,dept)]}
function hotelInMainIco(id,dept,lv){return hotelInMainParts(id,dept,lv).join('')}
function hotelInPropsHTML(id,dept,lv){lv=Math.max(1,lv|0);const b=hotelInLvBand(lv);const parts=hotelInMainParts(id,dept,lv);
 let html='';const add=(cls,emo,st,delay)=>{html+='<span class="prop '+cls+'" style="'+(st||'')+(delay!=null?';animation-delay:'+delay+'s':'')+'">'+emo+'</span>'};
 /* 圖案／人頭：同一底線打橫 left% 步进；滿一行先再開下一橫行 */
 const hRow=(arr,cls,bottom,left0,step,fs,del0,maxN)=>{
  maxN=maxN||8;(arr||[]).forEach((emo,i)=>{const r=Math.floor(i/maxN),c=i%maxN;
   let st='left:'+(left0+c*step)+'%;bottom:'+(bottom+r*12)+'%';
   if(fs)st+=';font-size:'+fs+'px';
   if(cls.indexOf('pMain')>=0)st+=';transform:translateX(-50%)';
   add(cls,emo,st,(del0||0)+i*0.12)})};
 if(dept==='room'){
  html+='<div class="bedBase"></div>';
  /* 主圖拆開打橫（唔再 🛏️👑 疊字） */
  const mw=parts.length;parts.forEach((emo,i)=>{const L=50-(mw-1)*8+i*16;add('pMain',emo,'left:'+L+'%;bottom:12%;transform:translateX(-50%)',i*0.08)});
  /* 升級裝飾圖案：同一底橫排（同人頭風格） */
  const decor=[];
  decor.push('🛏️');
  if(b>=2){decor.push('🪴','🪟')}
  if(b>=3){decor.push('🪞','🧳')}
  if(b>=4){decor.push('🧸','💐')}
  const nExtra=Math.min(6,Math.floor((lv-1)/2));
  const extras=['🧴','📚','🕯️','🖼️','🛎️','🧦'];
  for(let i=0;i<nExtra;i++)decor.push(extras[i%extras.length]);
  hRow(decor,'pSide',20,6,11,16,0.1,8);
  /* 人頭橫排（參考基線） */
  const G=['🙂','😊','🤗','😎'];
  const heads=[];
  if(b>=3)heads.push('😴');
  if(b>=4){heads.push('🧑‍💼','👩‍💼')}
  const guests=Math.min(4,lv>=4?Math.floor((lv-1)/3):0);
  for(let i=0;i<guests;i++)heads.push(G[i%G.length]);
  hRow(heads,'pGuest',36,14,16,18,0.2,6);
  const sparks=b>=4?['✨','⭐','💫']:b>=2?['✨','🌟']:['✨'];
  sparks.forEach((e,i)=>add('pSpark',e,'left:'+(18+i*22)+'%;top:'+(24+(i%2)*14)+'%',i*.3));
  if(b>=4)add('pTinyPlane','✈️<span class="hpMark">💎</span>','top:8%;left:-10%',0);
 }
 else if(dept==='dine'){
  html+='<div class="tableTop"></div>';
  const mw=parts.length;parts.forEach((emo,i)=>{const L=50-(mw-1)*8+i*16;add('pMain',emo,'left:'+L+'%;bottom:18%;transform:translateX(-50%)',i*0.08)});
  /* 餐飲升級圖案／菜式：打橫一至兩行 */
  const decor=['🍽️','🍷'];
  if(b>=2){decor.push('🥗','🦐')}
  if(b>=3){decor.push('🕯️','🕯️')}
  if(b>=4){decor.push('🍾','🧁','🎼')}
  const nDish=Math.min(8,1+Math.floor((lv-1)/2));
  const dishes=['🍣','🍜','🥩','🍰','🍹','🍤','🧀','🍇'];
  for(let i=0;i<nDish;i++)decor.push(dishes[i%dishes.length]);
  hRow(decor,'pSide',16,6,11,15,0.1,8);
  /* 人頭／廚師橫排 */
  const D=['🙂','😊','🤩','😎','🥰'];
  const heads=[];
  if(b>=2)heads.push('👨‍🍳');
  if(b>=3){heads.push('🧑‍🍳','😋','😍')}
  if(b>=4)heads.push('🤵');
  const diners=Math.min(5,lv>=3?Math.floor(lv/3):0);
  for(let i=0;i<diners;i++)heads.push(D[i%D.length]);
  hRow(heads,'pGuest',36,10,14,18,0.15,7);
  const sparks=b>=4?['✨','⭐','💫','🎆']:b>=2?['✨','🌟']:['✨'];
  sparks.forEach((e,i)=>add('pSpark',e,'left:'+(14+i*18)+'%;top:'+(18+(i%3)*12)+'%',i*.25));
  if(b>=3)add('pTinyPlane','✈️<span class="hpMark">🏝️</span>','top:6%;left:-8%',0);
 }
 else if(dept==='spa'){
  html+='<div class="tubRing"></div>';
  const mw=parts.length;parts.forEach((emo,i)=>{const L=50-(mw-1)*8+i*16;add('pMain',emo,'left:'+L+'%;bottom:16%;transform:translateX(-50%)',i*0.08)});
  /* SPA 升級側飾圖案：打橫（蒸汽仍可向上飄） */

  if(b>=2){decor.push('🧴','🧺')}
  if(b>=3){decor.push('🕯️','🕯️','🌴')}

  hRow(decor,'pSide',18,6,11,16,0.1,8);
  if(b>=2){add('pSteam','🫧','left:30%;top:30%',0.1);add('pSteam','🫧','right:28%;top:28%',0.5)}
  if(b>=3){add('pSteam','💨','left:42%;top:22%',0.3);add('pSteam','🫧','left:55%;top:26%',0.7)}
  if(b>=4){add('pSteam','🫧','left:48%;top:14%',0.2)}
  const nSteam=Math.min(7,1+Math.floor((lv-1)/2));
  for(let i=0;i<nSteam;i++){add('pSteam','🫧','left:'+(20+(i*13)%60)+'%;top:'+(20+(i%4)*10)+'%',i*0.35)}
  const G=['😌','😊','🥰','😇'];
  const heads=[];
  if(b>=3)heads.push('🧖');
  if(b>=4)heads.push('🧘');

  hRow(heads,'pGuest',38,12,15,18,0.2,6);

  sparks.forEach((e,i)=>add('pSpark',e,'left:'+(16+i*20)+'%;top:'+(22+(i%2)*14)+'%',i*.3));
  if(b>=4)add('pTinyPlane','✈️<span class="hpMark">💎</span>','top:7%;left:-10%',0);
 }
 else {
  add('pMain',hotelInIco(id,'look'),'');
 }
 return html}

function hotelAnimHTML(id,mode){const h=hotelOf(id);if(!h)return'';const rich=hotelRich(id);const sc=hotelScore(id);const ico=h[2];const flv=hotelFleetLv(id),blv=hotelBoatLv(id);
 const m=(mode===true||mode===1)?'out':(mode===false||mode===0||mode==null||mode==='mini')?'mini':String(mode);
 if(m==='mini'||m==='in-mini'){const cls='hMini r-'+rich+' h-'+id+(m==='in-mini'?' in':'');const emoji=m==='in-mini'?hotelInIco(id,'look'):ico;return'<div class="'+cls+'"><span class="mb">'+emoji+'</span><span class="mw"></span></div>'}
 const RNM=rich=='hi'?'華麗':rich=='mid'?'進階':'入門';
 const tabNow=(S.hotels&&S.hotels.tab)||'look';
 const tag='<div style="position:absolute;left:8px;bottom:6px;font:900 11px sans-serif;background:#0007;border-radius:8px;padding:2px 6px;z-index:2">'+(m==='in'?'入面':'出面')+'・'+RNM+'・Lv'+sc+'/'+hotelMaxScore()+'</div>';
 /* v25.1 strong scale: Lv1→2, mid→~7, Lv16→12 (visibly packed) */
 const vCount=hotelAnimUnitCount(flv||0);
 const bCount=hotelAnimUnitCount(blv||0);
 const vEmoji=hotelFleetEmoji(id,Math.max(1,flv||1)),bEmoji=hotelBoatEmoji(id,Math.max(1,blv||1));
 let cars='',boats='';
 /* cars ONLY on land/road; boats ONLY on sea band */
 const vDur=Math.max(3.2,5.4-Math.min(2.4,(flv||1)*0.12));
 const bDur=Math.max(3.6,7-Math.min(3,(blv||1)*0.14));
 /* negative delay spread across visible outbound arc so lo/hi both show on-screen density */
 for(let i=0;i<vCount;i++){const d=-(0.06+(i+0.5)/Math.max(1,vCount)*0.40)*vDur;cars+='<span class="hCar c'+((i%4)+1)+'" style="animation-delay:'+d+'s;animation-duration:'+vDur+'s">'+hotelFleetEmoji(id,Math.max(1,flv||1))+'</span>'}
 for(let i=0;i<bCount;i++){const d=-(0.05+(i+0.5)/Math.max(1,bCount)*0.85)*bDur;boats+='<span class="hBoat b'+((i%12)+1)+'" style="animation-delay:'+d+'s;animation-duration:'+bDur+'s">'+hotelBoatEmoji(id,Math.max(1,blv||1))+'</span>'}
 if(m==='in'){const tab=tabNow;const dept=(tab==='room'||tab==='dine'||tab==='spa')?tab:'room';
  const stIn=hotelSt(id);const dlv=(stIn[dept]|0)||1;const band=hotelInLvBand(dlv);
  const DNM={room:'客房',dine:'餐飲',spa:'Spa'};
  const tagIn='<div style="position:absolute;left:8px;bottom:6px;font:900 11px sans-serif;background:#0007;border-radius:8px;padding:2px 6px;z-index:5">入面・'+(DNM[dept]||dept)+'・Lv'+dlv+'/16</div>';
  let inBoats='';
  /* window view: boats stay in water band of window sea */
  const winB=Math.min(6,bCount);
  for(let i=0;i<winB;i++){inBoats+='<span class="hBoatIn" style="animation-delay:'+(i*0.9)+'s;animation-duration:'+(6-Math.min(2,blv*0.08))+'s;bottom:'+(5+i*3)+'%">'+hotelBoatEmoji(id,Math.max(1,blv||1))+'</span>'}
  const props=hotelInPropsHTML(id,dept,dlv);
  const lampHtml=band>=4?'<div class="lamp">✨</div><div class="lamp2">✨</div>':band>=3?'<div class="lamp">💡</div><div class="lamp2">✨</div>':'<div class="lamp">💡</div><div class="lamp2">💡</div>';
  return'<div class="hanim mode-in dept-'+dept+' in-lv'+band+' h-'+id+' r-'+rich+'" style="border-color:'+h[4].acc+'"><div class="wall"></div><div class="win">'+inBoats+'</div><div class="floor"></div><div class="rug"></div>'+lampHtml+props+tagIn+'</div>'}
 const sparks=rich=='hi'?['✨','⭐','💫','✈️','🎆']:rich=='mid'?['✨','💧','🌟']:['💧','✨'];
 let sp='';sparks.forEach((e,i)=>{sp+='<span class="spark" style="left:'+(12+i*18)+'%;top:'+(20+(i%3)*18)+'%;animation-delay:'+(i*.25)+'s">'+e+'</span>'});
 /* center icon: fleet/boat tab shows matching tier emoji (not hotel crown alone) */
 const focusDept=(tabNow==='fleet'||tabNow==='boat')?tabNow:'look';
 const bldIco=focusDept==='fleet'?vEmoji:(focusDept==='boat'?bEmoji:ico);
 const deptCls=focusDept==='fleet'||focusDept==='boat'?(' dept-'+focusDept):'';
 const tagOut='<div style="position:absolute;left:8px;bottom:6px;font:900 11px sans-serif;background:#0007;border-radius:8px;padding:2px 6px;z-index:2">出面・'+(focusDept==='fleet'?'🚗'+((hotelDeptTier('fleet',Math.max(1,flv||1))||{}).n||'車輛'):(focusDept==='boat'?'🚢'+((hotelDeptTier('boat',Math.max(1,blv||1))||{}).n||'船隊'):RNM))+'・Lv'+(focusDept==='fleet'?Math.max(1,flv||1):(focusDept==='boat'?Math.max(1,blv||1):sc))+'/'+(focusDept==='fleet'||focusDept==='boat'?16:hotelMaxScore())+'</div>';
 const packedCls=(vCount>=8||bCount>=8)?' packed':'';
 return'<div class="hanim mode-out'+deptCls+packedCls+' h-'+id+' r-'+rich+'" style="border-color:'+h[4].acc+'"><div class="sky"></div><div class="sea"></div><div class="isle"></div><div class="road"></div><div class="wave"></div><span class="palmL">🌴</span><span class="palmR">🌴</span><span class="heli">🚁</span>'+boats+cars+'<div class="bld">'+bldIco+'</div>'+sp+tagOut+'</div>'}
function deptCard(id,dept,lv,tier,next){const meta=HDEPTS.find(x=>x[0]==dept);const m=HMULT[id]||1;

function hotelRoadLen(pts){let L=0;for(let i=1;i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);return L||0.001}

function hotelNearRoad(x,y,rad){rad=rad==null?7:rad;const roads=(S.roads||[]);
 for(let s=0;s<roads.length;s++){const pts=roads[s].pts||[];for(let i=0;i<pts.length;i++){if(Math.hypot(x-pts[i][0]*100,y-pts[i][1]*100)<rad)return 1}
  for(let i=1;i<pts.length;i++){const ax=pts[i-1][0]*100,ay=pts[i-1][1]*100,bx=pts[i][0]*100,by=pts[i][1]*100;const dx=bx-ax,dy=by-ay,len2=dx*dx+dy*dy||1;let t=((x-ax)*dx+(y-ay)*dy)/len2;t=Math.max(0,Math.min(1,t));if(Math.hypot(x-(ax+dx*t),y-(ay+dy*t))<rad)return 1}}
 return 0}
function hotelWaterYOk(px,y){const isles=HOTELS.map(h=>h[5]);

function hotelWaterY(preferX,keepY){const px=preferX==null?50:Math.min(95,Math.max(5,preferX));
 /* ocean bands only — never road latitudes / island sand */
 const bands=[[3,8],[28,36],[40,48],[54,60],[66,74],[90,97]];
 if(keepY!=null&&hotelWaterYOk(px,keepY))return keepY;
 /* nearest stable mid to keepY (no random teleport spasm) */
 const mids=bands.map(b=>(b[0]+b[1])/2).sort((a,b)=>Math.abs(a-(keepY==null?50:keepY))-Math.abs(b-(keepY==null?50:keepY)));
 for(let i=0;i<mids.length;i++){if(hotelWaterYOk(px,mids[i]))return mids[i]}
 for(let t=0;t<64;t++){const b=bands[t%bands.length];const y=b[0]+Math.random()*(b[1]-b[0]);if(hotelWaterYOk(px,y))return y}
 for(let u=0;u<32;u++){const b2=bands[u%bands.length];const y2=b2[0]+Math.random()*(b2[1]-b2[0]);if(!hotelNearRoad(px,y2,11))return y2}

S.fxB=S.fxB||{};for(const f in S.fx2)if(S.fx2[f]>now()&&!S.fxB[f])S.fxB[f]=[{m:2,end:S.fx2[f]}];
function fxL(f){const t=now();return S.fxB[f]=(S.fxB[f]||[]).filter(b=>b.end>t)}
function fxMul(f,at){return Math.min(64,fxL(f).filter(b=>b.end>at).reduce((a,b)=>a*b.m,1))}
function fxWork(f,t,end){let w=0,c=t;const E=fxL(f).map(b=>b.end).filter(e=>e>t&&e<end).sort((a,b)=>a-b).concat([end]);for(const e of E){w+=(e-c)*fxMul(f,c);c=e}return w}
function fxEnd(f,t,W){let c=t;const E=fxL(f).map(b=>b.end).filter(e=>e>t).sort((a,b)=>a-b);for(const e of E){const m=fxMul(f,c),seg=(e-c)*m;if(W<=seg)return c+W/m;W-=seg;c=e}return c+W}
S.fxP=S.fxP||{};
function fxPause(f){const t=now();if(S.fxP[f]){const P=S.fxP[f];delete S.fxP[f];const W=S[f].map(s=>s&&s.end>t?s.end-t:null);S.fxB[f]=P.map(b=>({m:b.m,end:t+b.left}));S[f].forEach((s,i)=>{if(W[i]!=null)s.end=fxEnd(f,t,W[i])});toast('▶ 加速繼續 x'+fxMul(f,t))}else{const L=fxL(f);if(!L.length)return toast('而家冇生效中嘅加速');const W=S[f].map(s=>s&&s.end>t?fxWork(f,t,s.end):null);S.fxP[f]=L.map(b=>({m:b.m,left:b.end-t}));S.fxB[f]=[];S[f].forEach((s,i)=>{if(W[i]!=null)s.end=t+W[i]});toast('⏸ 加速已暫停（時間唔會減少）')}save();render()}
function fdur(f,sec){const t=now();return fxEnd(f,t,sec*1000)-t}
function speedSlot(f,i,silent){const id=S.spdSel,s=S[f][i];if(id=='x2')return;if(!s||s.end<=now())return 0;if(!(S.spd[id]>0)){silent||toast('冇呢件道具，去魚市場「加速」買');return 0}
 S.spd[id]--;s.end=Math.max(now(),s.end-SPD.find(y=>y[0]==id)[2]*1000);if(!silent){save();toast('已加速 #'+(i+1));render()}return 1}
function speedAll(f){if(S.spdSel=='x2'||S.spdSel=='x4')return useX2(f,S.spdSel);let n=0;for(let i=0;i<20;i++)n+=speedSlot(f,i,1)||0;save();toast(n?'已加速 '+n+' 個槽':'冇可加速嘅槽或道具不足');render()}
function useX2(f,id){id=id||'x2';const m=id=='x4'?4:2;if(!(S.spd[id]>0))return toast('冇呢個全廠加速，去魚市場「加速」買');const t=now();if(S.fxP[f])return toast('加速暫停中，先撳 ▶繼續');const cm=fxMul(f,t);if(cm*m>64)return toast('已達上限 x64，等現有加速完咗先再用');S.spd[id]--;
 const W=S[f].map(s=>s&&s.end>t?fxWork(f,t,s.end):null);S.fxB[f].push({m,end:t+600000});S[f].forEach((s,i)=>{if(W[i]!=null)s.end=fxEnd(f,t,W[i])});save();toast(`🔥 全廠加速 x${m}！而家總共 x${fxMul(f,t)}（10分鐘）`);render()}
function speedBar(f){const t=now(),L=fxL(f),a=L.length,P=S.fxP[f];return `<div class="card">🚀 加速道具：`+SPD.map(x=>`<button ${S.spdSel==x[0]?'style="background:#4caf50"':''} onclick="S.spdSel='${x[0]}';save();render()">${x[1]}×${S.spd[x[0]]||0}</button>`).join('')+`<br><button class="buy" onclick="speedAll('${f}')">${S.spdSel=='x2'||S.spdSel=='x4'?'啟動全廠加速（相乘疊加）':'用喺全部生產中槽'}</button> <small>或點生產中槽嘅 ⏩ 用喺單一槽</small>${a?`<br>🔥 目前總倍率 <b>x${fxMul(f,t)}</b>（上限x64）｜`+L.map(b=>`x${b.m} 剩${fmt((b.end-t)/1000)}`).join('・'):''}${a||P?`<br><button style="min-height:44px" onclick="fxPause('${f}')">${P?'▶ 繼續加速':'⏸ 暫停加速'}</button>`:''}${P?` ⏸ 暫停中：`+P.map(b=>`x${b.m} 剩${fmt(b.left/1000)}`).join('・'):''}</div>`}
const TRASH=['trash','bag','sodacan'];
function trashBtn(){const n=TRASH.reduce((a,k)=>a+(S.inv[k]||0)*IT[k][3],0),c=TRASH.reduce((a,k)=>a+(S.inv[k]||0),0);return `<div class="card mk">🗑️ 垃圾回收（每件 1-2🪙）<br>共 ${c} 件<br><button class="buy" ${c?'':'disabled'} onclick="sellTrash()">全賣垃圾 +${n}🪙</button></div>`}
function sellTrash(){let g=0;TRASH.forEach(k=>{g+=(S.inv[k]||0)*IT[k][3];delete S.inv[k]});S.gold+=g;save();toast('賣垃圾 +'+g+'🪙');render()}
function sellOne(k,all){const n=all?S.inv[k]||0:1;if(!n)return;add(k,-n);S.gold+=IT[k][3]*n;save();render()}

function startCraft(f,ri){const r=REC[f][ri],i=selSlot[f];if(i==null||S[f][i])return toast('請先選空槽');if(!canMake(r))return toast('材料不足');
 for(const[k,v]of Object.entries(r[1]))add(k,-v);S[f][i]={id:r[0],end:now()+fdur(f,r[2])};S.alast[f]=r[0];selSlot[f]=null;qEvent('craft');save();render()}
function autoFill(f){let n=0;for(let i=0;i<20;i++){if(S[f][i])continue;let r=null;for(let k=REC[f].length-1;k>=0;k--)if(canMake(REC[f][k])){r=REC[f][k];break}
 if(!r)break;for(const[k,v]of Object.entries(r[1]))add(k,-v);S[f][i]={id:r[0],end:now()+fdur(f,r[2])};n++;qEvent('craft')}save();toast(n?'一鍵生產：已開始 '+n+' 項':'材料不足或沒有空槽');render();return n}
S.auto=S.auto||{};S.apref=S.apref||{};S.alast=S.alast||{};
function aPick(f,rot){const P=S.apref[f],L=REC[f].filter(canMake);if(!L.length)return null;if(P&&P!='best'){const x=L.find(r=>r[0]==P);if(x)return x}if(P!='best'&&S.alast[f]){const x=L.find(r=>r[0]==S.alast[f]);if(x&&!P)return x}L.sort((a,b)=>IT[b[0]][3]-IT[a[0]][3]);return L[Math.min(rot,L.length-1)%Math.max(1,Math.min(3,L.length))]}
function autoProd(f,quiet){if(S.auto[f]===false)return 0;const t=now();let got=0,st=0,g=0,rot=0;
 for(let i=0;i<20;i++){let s=S[f][i];while(s&&s.end<=t&&g++<2000){add(s.id);got++;const st0=s.end;S[f][i]=null;const r=aPick(f,rot++);if(!r)break;for(const[k,v]of Object.entries(r[1]))add(k,-v);qEvent('craft');S[f][i]=s={id:r[0],end:st0+r[2]*1000};if(s.end>t)s.end=Math.min(s.end,t+fdur(f,(s.end-t)/1000));st++}}
 for(let i=0;i<20;i++)if(!S[f][i]){const r=aPick(f,rot++);if(!r)break;for(const[k,v]of Object.entries(r[1]))add(k,-v);S[f][i]={id:r[0],end:t+fdur(f,r[2])};qEvent('craft');st++}
 if(got||st)save();if(got&&!quiet&&cur==f)toast(`🤖 自動收取 ${got} 件・開工 ${st} 槽`);return got}
function autoTick(){['fishf','jewf'].forEach(f=>autoProd(f,cur!=f))}
function collect(f,i){const s=S[f][i];if(!s||s.end>now())return;add(s.id);S[f][i]=null;save();toast('收取 '+IT[s.id][0]);render()}
function collectAll(f){S[f].forEach((s,i)=>{if(s&&s.end<=now()){add(s.id);S[f][i]=null}});save();render()}
function factory(f,title){const on=S.auto[f]!==false;let h=`<h2>${title}（20槽）</h2><div class="card autoC"><button class="autoT ${on?'on':''}" onclick="S.auto['${f}']=${on?'false':'true'};save();autoProd('${f}');render()">🤖 自動生產：${on?'ON':'OFF'}</button><select class="aSel" onchange="S.apref['${f}']=this.value;save();render()"><option value="">優先：上次揀嘅配方</option><option value="best" ${S.apref[f]=='best'?'selected':''}>優先：最高價值（輪流分配）</option>${REC[f].map(r=>`<option value="${r[0]}" ${S.apref[f]==r[0]?'selected':''}>優先：${IT[r[0]][0]}</option>`).join('')}</select><br><small>${on?'空槽會自動用倉庫材料開工，完成品自動收入倉庫（離線都會補做）':'已關閉：需要手動選槽製作／收取'}</small></div><button onclick="collectAll('${f}')">全部收取</button><button onclick="autoFill('${f}')">⚡ 一鍵生產</button>`+speedBar(f)+`<div class="grid">`;
 S[f].forEach((s,i)=>{h+=`<div class="card" style="border:2px solid ${selSlot[f]===i?'#f6a821':'transparent'}" onclick="${s?`collect('${f}',${i})`:`selSlot['${f}']=${i};render()`}">#${i+1} `+
 (s?(s.end<=now()?nm(s.id)+' ✅點擊收取':'生產中：'+nm(s.id)+' ⏳'+fmt((s.end-now())/1000)+`<br><button onclick="event.stopPropagation();speedSlot('${f}',${i})">⏩ 加速</button>`):(S.auto[f]!==false?'⏸ 等待材料':'空槽（點選）'))+'</div>'});
 h+='</div><h3>📜 可生產物品</h3><div class="grid">';REC[f].forEach((r,ri)=>{h+=`<div class="card">${nm(r[0])}【${RN[IT[r[0]][2]]}】<br>售價 ${IT[r[0]][3]}💰 ${canMake(r)?'✅材料足夠':'❌材料不足'}<br>需：${Object.entries(r[1]).map(([k,v])=>nm(k)+'×'+v+'('+(S.inv[k]||0)+')').join(' ')}<br>⏱${fmt(r[2])}<br><button ${canMake(r)?'':'disabled'} onclick="startCraft('${f}',${ri})">製作</button></div>`});return h+'</div>'}
// orders
function genOrder(){const w=[50,28,13,6,3];let x=Math.random()*100,r=0;while(x>w[r]){x-=w[r];r++}
 const BK=[['fish',35],['shellsp',12],['mat',8],['food',25],['jew',20]];const items={};const n=1+(Math.random()*Math.min(3,r+1)|0);
 for(let k=0;k<n;k++){let x=Math.random()*100,bi=0;while(x>BK[bi][1]){x-=BK[bi][1];bi++}const kind=BK[bi][0];let cand=[];for(let d=0;d<5&&!cand.length;d++)cand=Object.keys(IT).filter(i=>IT[i][4]==kind&&(IT[i][2]==r||IT[i][2]==r-1-d||IT[i][2]==r+d&&d>0));
  const id=cand[Math.random()*cand.length|0];items[id]=(items[id]||0)+1+(Math.random()*(IT[id][2]<2&&kind!='jew'&&kind!='food'?4:2)|0)}
 const c=CUST[r][Math.random()*CUST[r].length|0],k0=IT[Object.keys(items)[0]][4];const lines=LINES[k0]||LINES.fish;
 return{id:now()+Math.random(),v2:1,r,items,reward:ordReward(r,items),cu:c,say:(r>=3?'錢唔係問題，最緊要靚！':'')+lines[Math.random()*lines.length|0]}}
const RB=[2000,8000,20000,50000,100000];function ordReward(r,items){const v=Object.entries(items).reduce((a,[k,n])=>a+(IT[k]?IT[k][3]*n:0),0);return Math.round((RB[r]*(1+Math.random()*1.2)+v*4)/10)*10}
const CUST=[[['👵','陳婆婆'],['🧒','小明'],['👨‍🔧','維修師傅'],['👩‍🦳','李師奶']],[['👨‍🍳','酒店廚師'],['👮','巡警阿Sir'],['🧑‍🏫','張老師']],[['🧑‍💼','海鮮酒家老闆'],['👩‍🎨','珠寶設計師'],['🧑‍✈️','郵輪船長']],[['🤵','富豪何生'],['🧙','海島巫師']],[['🤴','海島王子'],['👸','人魚公主']]];
const LINES={fish:['今晚想煲魚湯，幫幫手啦！','啲魚要新鮮㗎，唔該晒！','屋企開飯等緊呀～'],shellsp:['收集緊靚貝殼，拜託！','想砌個貝殼擺設呀'],mat:['要啲靚料做嘢，靠晒你！'],food:['酒席要用，唔該快啲！','啲客等緊食呀！'],jew:['想送份靚禮物俾老婆～','下個月結婚用，唔該晒！']};
let seenOrd=new Set(),dropArm=null;
function dropOrder(i){const o=S.orders[i];if(!o)return;if(dropArm!==o.id){dropArm=o.id;render();setTimeout(()=>{if(dropArm===o.id){dropArm=null;render()}},3000);return}
 dropArm=null;const nw=genOrder();S.orders.splice(i,1,nw);save();toast('🗑️ 已掟咗 '+(o.cu?o.cu[1]:'')+' 嘅訂單；'+nw.cu[0]+' '+nw.cu[1]+'落咗新訂單！');render()}
function tickOrders(){S.orders.forEach(o=>{if(!o.v2){delete o.exp;o.reward=ordReward(o.r,o.items);o.v2=1}});if(!S.nextOrder)S.nextOrder=now();let nw=null;while(S.orders.length<6&&S.nextOrder<=now()){nw=genOrder();S.orders.push(nw);S.nextOrder+=90000}if(nw&&window._ob)toast(nw.cu[0]+' '+nw.cu[1]+'落咗新訂單！');window._ob=1;S.orders.forEach(o=>{if(!o.cu){o.cu=CUST[o.r][0];o.say=LINES.fish[0];o.id=o.id||Math.random()}})
 if(S.orders.length>=6&&S.nextOrder<now())S.nextOrder=now()+90000;save()}
function fill(i){const o=S.orders[i];if(!Object.entries(o.items).every(([k,v])=>(S.inv[k]||0)>=v))return toast('貨物不足');
 for(const[k,v]of Object.entries(o.items))add(k,-v);S.gold+=o.reward;S.orders.splice(i,1);save();toast('完成訂單 +'+o.reward+'💰');render()}
function render(){autoTick();fwKick();if(S.home>=16&&!S.fwShown&&cur=='map'&&!document.getElementById('title-scr'))fwCelebrate();tickOrders();restTick();vTick('aq',10);vTick('onsen',13);vTick('heli',14);airTick();scenicTick();hotelTick();stepMkt();hud();if(cur=='map')drawHome();$('gold').textContent=S.gold;if(cur=='sea'){$('seasel').innerHTML=seaSel();$('gearinfo').textContent=`船：${BOATS[S.boat][0]}｜網：${NETS[S.net][0]}｜鉤：${HOOKS[S.hook][0]}｜竿：${RODS[S.rod][0]}｜目前：${AREAS[S.area][0]}・${DEPTHS[S.depth]}`;drawBoat();document.body.classList.toggle('boss',!!BOSS);$('sea').style.background=`linear-gradient(hsl(${195+S.area*10},70%,${60-S.depth*15}%),hsl(${215+S.area*8},80%,${22-S.depth*6}%))`}
 if(cur=='shop')$('s-shop').innerHTML=marketView();
 if(cur=='bag'){let h='<h2>🎒 倉庫</h2><button style="min-height:44px;width:100%;margin:4px 0;font-size:16px" onclick="openAllShells()">🐚 一鍵開全部貝殼</button><div class="grid">'+trashBtn();for(const[k,v]of Object.entries(S.inv))h+=`<div class="card">${nm(k)} ×${v}<br>${RN[IT[k][2]]}${IT[k][4]=='trash'?`<br>🪙${IT[k][3]}/件<br><button onclick="sellOne('${k}')">賣1</button><button onclick="sellOne('${k}',1)">全賣</button>`:''}${IT[k][4]=='shellsp'?`<br><button onclick="openShell('${k}')">開貝殼</button><button onclick="openShell('${k}',1)">全開</button>`:''}</div>`;$('s-bag').innerHTML=h+'</div>'}
 if(cur=='fishf')$('s-fishf').innerHTML=factory('fishf','🏭 魚類加工廠');
 if(cur=='jewf')$('s-jewf').innerHTML=factory('jewf','💍 首飾加工廠');
 if(cur=='rest')$('s-rest').innerHTML=restView();
 if(cur=='aq')$('s-aq').innerHTML=aqView();if(cur=='onsen')$('s-onsen').innerHTML=ownView('onsen',POOLS,'♨️ 溫泉',13,'🛁 溫泉池');if(cur=='heli'){$('s-heli').innerHTML=heliView();requestAnimationFrame(globeKick)}else{GL.on=0}if(cur=='lh')$('s-lh').innerHTML=lhView();if(cur=='scenic')$('s-scenic').innerHTML=scenicView();if(cur=='guide')$('s-guide').innerHTML=guideView();if(cur=='hotels'){$('s-hotels').innerHTML=hotelsView();hotelsAfterRender()}else{HPL.on=0;HCAR.on=0}
 if(cur=='dex')$('s-dex').innerHTML=dexView();
 if(cur=='prop'){$('s-prop').innerHTML=propView();chart()}
 if(cur=='orders'){let h=`<h2>📋 訂單</h2><p>下一張訂單：${S.orders.length>=6?'訂單已滿':fmt((S.nextOrder-now())/1000)}</p><div class="grid">`;
  S.orders.forEach((o,i)=>{const ok=Object.entries(o.items).every(([k,v])=>(S.inv[k]||0)>=v);const fresh=!seenOrd.has(o.id);seenOrd.add(o.id);h+=`<div class="card ord${fresh?' slidein':''}"><div class="cust"><span class="av">${o.cu[0]}</span><div><b>${o.cu[1]}</b><div class="bub">「${o.say}」</div></div></div><b class="r${o.r}">【${RN[o.r]}】</b><br>${Object.entries(o.items).map(([k,v])=>nm(k)+'×'+v+'('+(S.inv[k]||0)+')').join('<br>')}<br>獎勵 ${o.reward}💰<br><button ${ok?'':'disabled'} onclick="fill(${i})">交貨</button><button class="drop" onclick="dropOrder(${i})">${dropArm===o.id?'確定掟？':'🗑️ 唔要'}</button></div>`});$('s-orders').innerHTML=h+'</div>'}}
let _at=0;setInterval(()=>{if(document.activeElement&&document.activeElement.classList.contains('aSel'))return hud();if(++_at%5==0&&!['fishf','jewf'].includes(cur))autoTick();if(cur=='hotels'&&typeof HDRAW!=='undefined'&&HDRAW.on){hotelTick();hud()}else if(['fishf','jewf','orders','prop','rest','aq','onsen','heli','scenic','guide','hotels'].includes(cur))render();else{tickOrders()}hud()},1000);applySkin();render();addEventListener('scroll',()=>document.body.classList.toggle('scrolled',scrollY>10),{passive:true});document.addEventListener('pointerdown',e=>{if(!fishing||cur!='sea')return;const t=e.target.closest&&e.target.closest('button,select,input,a,#hud,#hudTL,#hudBR,#hqPill');if(t&&t.id!='reelBtn')return;e.preventDefault();reel()},true);if(BOSS){$('bossFish').textContent=BOSS.b[4];$('bossFish').style.display='block'}setInterval(()=>{if(!fishing&&!WAIT&&$('castBtn').disabled)$('castBtn').disabled=false},1000);
