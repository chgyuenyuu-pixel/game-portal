<!DOCTYPE html>

<title>English Garden · 我的英語學習樂園</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(180deg,#e8f5e9 0%,#f1f8e9 40%,#fafafa 100%);color:#1b2e1c;min-height:100%;min-height:100dvh}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input{font:inherit;touch-action:manipulation}
button{cursor:pointer;border:none;background:none}

.screen{display:none}.screen.on{display:block;animation:fadeIn .18s ease}

.home-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px;padding:4px 2px}
.home-head h1{margin:0;font-size:1.5rem;font-weight:800;color:#1b5e20;letter-spacing:-.02em}
.home-head .tag{margin:4px 0 0;font-size:.82rem;color:#558b2f;font-weight:500}
.level-chip{flex-shrink:0;background:#fff;border:1.5px solid #c8e6c9;border-radius:999px;padding:8px 12px;font-size:.78rem;font-weight:700;color:#2e7d32;box-shadow:0 2px 8px rgba(46,125,50,.08)}
.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 4px 18px rgba(27,94,32,.07);margin-bottom:12px}
.goal-card h2{margin:0 0 10px;font-size:1rem;font-weight:700}

.goal-row b{color:#2e7d32}

.tile.t1 .ic{background:#e8f5e9}.tile.t2 .ic{background:#e3f2fd}.tile.t3 .ic{background:#fff3e0}.tile.t4 .ic{background:#fce4ec}
.extra{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}

.extra .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.extra h3{margin:0;font-size:.88rem;font-weight:750}.extra p{margin:2px 0 0;font-size:.68rem;color:#78909c}
.news-card{display:flex;align-items:center;gap:12px;padding:14px;width:100%;text-align:left;border:1.5px solid #e8f5e9}
.news-card .ic{width:42px;height:42px;border-radius:12px;background:#e0f2f1;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.news-card h3{margin:0;font-size:.95rem;font-weight:750}.news-card p{margin:2px 0 0;font-size:.72rem;color:#78909c}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:4px 0}
.back{width:40px;height:40px;border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06);font-size:1.2rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topbar h2{margin:0;font-size:1.12rem;font-weight:750;flex:1}
.pill{font-size:.72rem;background:#e8f5e9;color:#2e7d32;padding:4px 10px;border-radius:999px;font-weight:700}
.path{display:flex;flex-direction:column;gap:10px}
.path-item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.04);border:1.5px solid #eee;text-align:left;width:100%}
.path-item:active{transform:scale(.98)}
.path-item .num{width:40px;height:40px;border-radius:50%;background:#c8e6c9;color:#1b5e20;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.path-item.done .num{background:#43a047;color:#fff}
.path-item .info{flex:1;min-width:0}.path-item .info b{display:block;font-size:.95rem}.path-item .info span{font-size:.72rem;color:#78909c}
.path-item .stars{color:#ffc107;font-size:.85rem}
.progress-tiny{height:6px;background:#e0e0e0;border-radius:999px;overflow:hidden;margin-bottom:12px}
.progress-tiny>i{display:block;height:100%;background:#66bb6a;width:0;transition:width .25s}
.q-card{background:#fff;border-radius:20px;padding:20px 16px;box-shadow:0 4px 18px rgba(0,0,0,.06);margin-bottom:12px;text-align:center}
.q-card .hint{font-size:.76rem;color:#90a4ae;margin-bottom:8px}
.q-card .word{font-size:1.9rem;font-weight:800;margin:6px 0;color:#1b5e20;word-break:break-word}
.q-card .zh{font-size:1.02rem;color:#455a64;margin:6px 0}
.q-card .ex{font-size:.88rem;color:#37474f;margin-top:10px;line-height:1.45;padding:10px 12px;background:#f5faf5;border-radius:12px;text-align:left}
.q-card .exZh{font-size:.8rem;color:#78909c;margin-top:4px;text-align:left;padding:0 4px}
.q-card .passage{font-size:.92rem;line-height:1.55;text-align:left;color:#37474f;background:#f7faf7;border-radius:12px;padding:12px;margin:8px 0}
.speak-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:#e8f5e9;color:#2e7d32;border-radius:14px;padding:14px 16px;font-weight:750;font-size:1rem;margin:8px 0;min-height:52px;position:relative;z-index:5;-webkit-user-select:none;user-select:none;border:2px solid #a5d6a7}
.speak-btn:active{transform:scale(.98);background:#c8e6c9}
.speak-row{display:flex;flex-direction:column;gap:0;margin:10px 0;position:relative;z-index:5}
.tap-speak{cursor:pointer;-webkit-user-select:none;user-select:none;position:relative;z-index:5}
.tap-speak:active{opacity:.85}
.q-card .word.tap-speak{padding:8px 4px;border-radius:12px}
.q-card .ex.tap-speak{border:2px dashed #a5d6a7}
.speak-btn.big{width:76px;height:76px;border-radius:50%;font-size:1.9rem;padding:0;margin:8px auto;background:linear-gradient(145deg,#66bb6a,#43a047);color:#fff;box-shadow:0 6px 16px rgba(67,160,71,.35);border:none}
.speak-btn.mic{background:linear-gradient(145deg,#42a5f5,#1565c0);box-shadow:0 6px 16px rgba(21,101,192,.35)}
.speak-btn.mic.rec{background:linear-gradient(145deg,#ef5350,#c62828);animation:pop .4s infinite alternate}
.speak-btn.big:active{transform:scale(.94)}
.choices{display:flex;flex-direction:column;gap:9px}
.choice{background:#fff;border:2px solid #e0e0e0;border-radius:14px;padding:14px 15px;font-size:.98rem;font-weight:600;text-align:left;color:#263238;min-height:52px}
.choice:active{transform:scale(.98)}
.choice.ok{border-color:#43a047;background:#e8f5e9;color:#1b5e20;animation:pop .28s}
.choice.bad{border-color:#e53935;background:#ffebee;color:#c62828;animation:shake .3s}
.choice:disabled,.choice.picked{pointer-events:none}
.choice.match{text-align:center}
.choice.sel{border-color:#42a5f5;background:#e3f2fd}
.fill-wrap{display:flex;gap:8px;margin-top:8px}
.fill-wrap input{flex:1;border:2px solid #c8e6c9;border-radius:12px;padding:12px 14px;font-size:1.05rem;outline:none;background:#fff;width:100%}
.fill-wrap input:focus{border-color:#43a047}
.btn-primary{width:100%;background:linear-gradient(135deg,#66bb6a,#2e7d32);color:#fff;border-radius:14px;padding:15px;font-size:1.02rem;font-weight:750;margin-top:10px;box-shadow:0 4px 14px rgba(46,125,50,.25)}
.btn-primary:active{transform:scale(.98)}.btn-primary:disabled{opacity:.5}
.btn-ghost{width:100%;background:#f5f5f5;color:#455a64;border-radius:14px;padding:13px;font-size:.95rem;font-weight:650;margin-top:8px}
.fb{text-align:center;padding:10px;border-radius:12px;font-weight:700;font-size:.92rem;margin:8px 0;display:none}
.fb.show{display:block;animation:pop .28s}.fb.ok{background:#e8f5e9;color:#2e7d32}.fb.bad{background:#ffebee;color:#c62828}
.result{text-align:center;padding:28px 16px}.result .big{font-size:3rem;margin-bottom:8px}
.result h3{margin:0 0 6px;font-size:1.3rem}.result p{color:#607d8b;margin:0 0 16px}
.stat-row{display:flex;justify-content:center;gap:14px;margin:16px 0}
.stat{background:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.stat b{display:block;font-size:1.35rem;color:#2e7d32}.stat span{font-size:.7rem;color:#78909c}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;display:none;align-items:flex-end;justify-content:center;padding:16px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:22px 22px 18px 18px;padding:20px 16px 24px;width:100%;max-width:430px;max-height:80vh;overflow:auto;animation:fadeIn .2s}
.modal h3{margin:0 0 4px;font-size:1.15rem}.modal .sub{font-size:.8rem;color:#78909c;margin-bottom:14px}
.lv-opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;border:2px solid #eee;margin-bottom:8px;text-align:left;background:#fff}
.lv-opt.on{border-color:#43a047;background:#e8f5e9}
.lv-opt .badge{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex-shrink:0}
.lv-opt b{display:block;font-size:.95rem}.lv-opt span{font-size:.72rem;color:#78909c}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(80px);background:#263238;color:#fff;padding:10px 18px;border-radius:999px;font-size:.88rem;font-weight:600;z-index:9500;opacity:0;transition:.28s;pointer-events:none;max-width:90vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:.82rem;font-weight:700}
.hud .xp-live{color:#1565c0}.hud .streak-live{color:#f57f17}
.hearts{display:flex;gap:2px;font-size:1rem}
.situ-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.situ-tabs button{flex-shrink:0;padding:8px 14px;border-radius:999px;background:#fff;border:1.5px solid #e0e0e0;font-size:.8rem;font-weight:650;color:#546e7a}
.situ-tabs button.on{background:#2e7d32;color:#fff;border-color:#2e7d32}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match-grid .choice{min-height:56px;font-size:.9rem;padding:12px}
.mic-status{font-size:.85rem;color:#546e7a;margin-top:8px;min-height:1.2em}
.scr-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.scr-tile{min-width:40px;height:44px;padding:0 12px;border-radius:10px;background:#fff;border:2px solid #c8e6c9;font-weight:800;font-size:1.05rem;color:#1b5e20}
.scr-tile.used{opacity:.3}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid #43a047;margin:0 4px;color:#2e7d32;font-weight:800}
</style>
</head>
<body>
<div class="app" id="app">
<section class="screen on" id="sc-home">
  <div class="home-head">
    <div>
      <h1>🌱 English Garden</h1>
      <p class="tag">輕鬆學英文 · 每日進步一點點</p>
    </div>
    <button class="level-chip" id="btn-level" type="button"><span id="lv-label">初階</span> ▾</button>
  </div>
  <div class="card goal-card">
    <h2>🎯 今日學習目標</h2>
    <div class="goal-row"><span>單字</span><b id="g-vocab">0 / 10</b></div>
    <div class="goal-row"><span>小測</span><b id="g-quiz">0 / 5</b></div>
    <div class="bar"><i id="g-bar"></i></div>
    <div class="goal-meta">
      <span id="g-pct">完成 0%</span>
      <div style="display:flex;gap:6px">
        <span class="streak" id="g-streak">🔥 0</span>
        <span class="xp" id="g-xp">⭐ 0 XP</span>
      </div>
    </div>
  </div>
  <div class="tiles">
    <button class="tile t1" type="button" data-go="vocab"><div class="ic">📖</div><h3>單字學習</h3><p>例子 + 配對遊戲</p></button>
    <button class="tile t2" type="button" data-go="listen"><div class="ic">🎧</div><h3>聽力練習</h3><p>聽完選答案</p></button>
    <button class="tile t3" type="button" data-go="situ"><div class="ic">💬</div><h3>情境英文</h3><p>旅行、購物、工作</p></button>
    <button class="tile t4" type="button" data-go="quiz"><div class="ic">✅</div><h3>每日小測</h3><p>答完自動批改</p></button>
  </div>
  <div class="extra">
    <button class="card" type="button" data-go="speak"><div class="ic" style="background:#e3f2fd">🎙️</div><div><h3>發音練習</h3><p>開口講 · 即時評分</p></div></button>
    <button class="card" type="button" data-go="culture"><div class="ic" style="background:#f3e5f5">🌏</div><div><h3>文化練習</h3><p>禮儀 · 節日 · 職場</p></div></button>
  </div>
  <button class="card news-card" type="button" data-go="news">
    <div class="ic">📰</div>
    <div><h3>今日香港新聞英文</h3><p>用新聞學詞彙 · 跟住你嘅程度</p></div>
  </button>
</section>

<section class="screen" id="sc-list">
  <div class="topbar">
    <button class="back" type="button" data-back>←</button>
    <h2 id="list-title">課程</h2>
    <span class="pill" id="list-pill">初階</span>
  </div>
  <div class="path" id="list-path"></div>
</section>

<section class="screen" id="sc-play">
  <div class="topbar">
    <button class="back" type="button" id="play-back">←</button>
    <h2 id="play-title">練習</h2>
    <div class="hearts" id="play-hearts"></div>
  </div>
  <div class="hud">
    <span class="streak-live" id="play-streak">連續 0</span>
    <span class="xp-live" id="play-xp">+0 XP</span>
  </div>
  <div class="progress-tiny"><i id="play-bar"></i></div>
  <div id="play-body"></div>
  <div class="fb" id="play-fb"></div>
  <button class="btn-primary" id="play-next" type="button" style="display:none">繼續</button>
</section>

<section class="screen" id="sc-result">
  <div class="result">
    <div class="big" id="res-emoji">🎉</div>
    <h3 id="res-title">做得好！</h3>
    <p id="res-msg">你完成咗呢一關</p>
    <div class="stat-row">
      <div class="stat"><b id="res-correct">0</b><span>答啱</span></div>
      <div class="stat"><b id="res-xp">0</b><span>XP</span></div>
      <div class="stat"><b id="res-streak">0</b><span>最高連續</span></div>
    </div>
    <button class="btn-primary" type="button" data-back>返主頁</button>
    <button class="btn-ghost" type="button" id="res-again">再玩一次</button>
  </div>
</section>
</div>

<div class="modal-bg" id="lv-modal">
  <div class="modal">
    <h3>選擇學習程度</h3>
    <p class="sub">全部單元都會跟住程度調整 · 隨時可以轉</p>
    <div id="lv-opts"></div>
    <button class="btn-ghost" type="button" id="lv-close">關閉</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
var LS={
  get:function(k,d){try{var v=localStorage.getItem('eg_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set:function(k,v){try{localStorage.setItem('eg_'+k,JSON.stringify(v));}catch(e){}}
};
var LEVELS=[
  {id:'beginner',zh:'初階',en:'Beginner',color:'#81c784',desc:'日常基礎詞彙同短句'},
  {id:'intermediate',zh:'中階',en:'Intermediate',color:'#64b5f6',desc:'生活對話同職場用語'},
  {id:'advanced',zh:'高階',en:'Advanced',color:'#ba68c8',desc:'較複雜句式同正式英文'},
  {id:'ielts',zh:'雅思',en:'IELTS',color:'#ff8a65',desc:'學術詞彙、閱讀同改寫練習'}
];
function todayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function state(){
  var s=LS.get('state',null);
  if(!s)s={level:'beginner',xp:0,streakBest:0,dayStreak:0,lastDay:'',speakAttempts:0};
  var day=LS.get('day_'+todayKey(),null);
  if(!day)day={vocab:0,quiz:0,listen:0,situ:0,news:0,speak:0,culture:0,xp:0};
  return{s:s,day:day};
}
function saveState(st){LS.set('state',st.s);LS.set('day_'+todayKey(),st.day);}

{"title":"Transit-Oriented Retail and Seasonal Demand","body":"Analysts argue that retail performance in airport-adjacent districts is predominantly shaped by transit flows rather than resident spending alone. While holiday peaks generate substantial turnover, revenues fluctuate with flight schedules. Observers note that clear wayfinding and bilingual service remain indispensable if shops are to convert short dwell times into sales.","q":"Which statement best reflects the passage?","opts":["Airport-area retail is mainly driven by transit passenger flows.","Only local residents shop near airports.","Flight schedules never affect sales.","Rents have no impact on store decisions."],"a":0,"words":[{"en":"predominantly","zh":"主要地"},{"en":"dwell time","zh":"逗留時間"},{"en":"indispensable","zh":"不可或缺"}]},{"title":"The Implications of Discount Culture","body":"Although promotions can stimulate short-term consumer spending, critics claim an overreliance on discounts may exacerbate price sensitivity and erode brand value. In Tung Chung's competitive mall environment, managers must balance footfall gains against the long-term implications for perceived quality.","q":"Best paraphrase of the critics' concern?","opts":["Heavy discounting may worsen price sensitivity and weaken brands.","Discounts always improve brand value.","Promotions are illegal.","Loyalty is unrelated to marketing."],"a":0,"words":[{"en":"erode","zh":"削弱"},{"en":"perceived","zh":"被視為嘅"},{"en":"exacerbate","zh":"加劇"}]},{"title":"Correlation Is Not Causation in Footfall Analytics","body":"Managers sometimes treat simultaneous spikes in arrivals and sales as proof that one causes the other. Methodologists caution that weather, holidays, and marketing campaigns are confounding variables; without careful design, charts show correlation rather than causation.","q":"Main caution?","opts":["Do not treat correlation as proof of causation.","Arrivals never relate to sales.","Weather is irrelevant.","Charts are always causal."],"a":0,"words":[{"en":"confounding","zh":"混淆變數"},{"en":"causation","zh":"因果"},{"en":"methodology","zh":"方法論"}]},{"title":"Labour Resilience Under Volatile Demand","body":"Airport-adjacent retail faces inherently volatile demand. Firms that cross-train staff and maintain flexible rosters show greater resilience when passenger volumes plunge during storms or soar after holiday peaks.","q":"What builds resilience?","opts":["Cross-training and flexible rosters","Fixed tiny teams only","Ignoring storms","Banning overtime forever"],"a":0,"words":[{"en":"volatile","zh":"波動大"},{"en":"resilience","zh":"韌性"},{"en":"roster","zh":"更表"}]},{"title":"Governance of Discretionary Discounts","body":"Where frontline staff can grant discretionary discounts, clear ceilings and audit trails are essential for governance. Without accountability, margin leakage becomes chronic rather than exceptional.","q":"Without controls, discretionary discounts may cause…","opts":["Chronic margin leakage","Automatic profit growth","Legal immunity","Zero sales"],"a":0,"words":[{"en":"discretionary","zh":"酌情"},{"en":"governance","zh":"管治"},{"en":"chronic","zh":"長期"}]},{"title":"Empirical Support for Shorter Queue Targets","body":"A longitudinal study across three malls found that setting rigorous sub-three-minute queue targets, paired with bilingual greetings, was associated with higher satisfaction scores. The authors stress the link is not purely causal but remains pragmatically useful.","q":"Authors' stance on the finding?","opts":["Useful though not purely causal","Proof of pure causation","Irrelevant to managers","Evidence queues should be longer"],"a":0,"words":[{"en":"longitudinal","zh":"縱向"},{"en":"rigorous","zh":"嚴謹"},{"en":"pragmatically","zh":"務實地"}]},{"title":"Regulatory Pressure on Liquid Retail","body":"Stringent aviation security legislation constrains how outlets display and sell liquids airside. Compliance teams argue that clear signage mitigates both safety risk and customer frustration at checkpoints.","q":"What constrains airside liquid sales?","opts":["Aviation security legislation","Fashion trends alone","Music volume rules","Parking fees"],"a":0,"words":[{"en":"stringent","zh":"嚴格"},{"en":"legislation","zh":"法例"},{"en":"airside","zh":"禁區一側"}]},{"title":"Prospects Tied to Capacity Expansion","body":"The near-term outlook for airport-area retail is positive if flight capacity continues to expand; conversely, prolonged capacity caps would likely flatten the upward sales trajectory observed this quarter.","q":"Sales trajectory depends mainly on…","opts":["Flight capacity trends","Wallpaper colour","One cashier mood only","Irrelevant tea prices"],"a":0,"words":[{"en":"outlook","zh":"展望"},{"en":"trajectory","zh":"軌跡"},{"en":"capacity","zh":"運力"}]}]};
var CULTURE={"beginner":[{"title":"超市膠袋要錢","body":"In Hong Kong, many shops charge for plastic bags. Saying \"No bag, please\" is common and eco-friendly.","zh":"香港好多舖頭膠袋要錢。講「唔使袋」好平常，又環保。","q":"香港買嘢時膠袋？","opts":["好多時要額外畀錢","永遠免費","只能用布袋","法律禁止用袋"],"a":0},{"title":"Thank you vs Please","body":"In English shops, \"please\" and \"thank you\" appear in almost every request. In HK Cantonese retail, tone and \"唔該／多謝\" do similar work.","zh":"英文舖頭幾乎每句請求都會用 please / thank you。粵語零售用語氣同「唔該／多謝」。","q":"英文店舖好常見嘅禮貌詞？","opts":["please / thank you","only goodbye","only sorry","never thank you"],"a":0},{"title":"Keep the receipt","body":"In many places, you need the receipt to return or exchange goods. Staff often say \"Please keep your receipt.\"","zh":"好多地方退換貨要收據。店員常講請保留收據。","q":"退換貨常常要？","opts":["收據","寵物相","天氣報告","無關紙條"],"a":0},{"title":"Queue politely","body":"Jumping the queue is rude in HK and in English-speaking countries. Wait behind the line.","zh":"打尖喺香港同英語國家都唔禮貌。請喺線後等。","q":"排隊時應該？","opts":["喺線後等","插隊","推人","大聲吵"],"a":0},{"title":"Octopus everywhere","body":"In HK, Octopus cards pay for MTR, buses, and many shops. Visitors may need cash or cards instead.","zh":"香港八達通搭車同買嘢好普遍；訪客可能要用現金或信用卡。","q":"香港好常用嚟拍卡付款嘅係？","opts":["八達通","只有金幣","只有支票","指紋必須"],"a":0},{"title":"Small talk at the till","body":"English-speaking cashiers often make light small talk (\"Have a nice day\"). In HK, service can be shorter but still polite.","zh":"英語收銀常有簡短寒暄；香港服務可以短啲但依然有禮。","q":"英文收銀常見？","opts":["簡短友善寒暄","必須長篇演講","禁止說話","只准唱歌"],"a":0},{"title":"Tipping culture","body":"In the US, tipping servers is common; in HK retail shops, tipping at the till is unusual.","zh":"美國飲食常給小費；香港舖頭收銀一般唔使打賞。","q":"香港零售收銀小費？","opts":["通常唔使","一定要 30%","必須每日","只限外幣"],"a":0},{"title":"Shoes in fitting rooms","body":"Some shops ask you to wear socks or covers in fitting rooms. Follow the sign on the door.","zh":"有啲舖試身室要著襪或鞋套。跟門上指示。","q":"試身室應該？","opts":["跟門上指示","無視所有牌","帶走衣架","關燈匿藏"],"a":0}],"intermediate":[{"title":"八達通同信用卡","body":"In HK retail, Octopus and contactless cards are everyday. In many Western shops, chip-and-PIN or mobile wallets are more common than Octopus-style stored value.","zh":"香港零售日常用八達通同感應卡；西方好多舖更常見芯片密碼卡或手機錢包。","q":"香港舖頭好常見但外國未必有嘅係？","opts":["Octopus（八達通）","只用現金","無電子支付","只收支票"],"a":0},{"title":"排隊文化","body":"Whether in a Tung Chung mall or a London store, jumping the queue is rude. Staff may say \"Please wait behind the line.\"","zh":"無論東湧商場定倫敦舖頭，打尖都唔禮貌。店員可能會講請喺線後等候。","q":"打尖被視為？","opts":["無禮貌","精明","必須","法例要求"],"a":0},{"title":"聖誕同農曆新年","body":"English-speaking countries highlight Christmas for retail peaks; HK also has huge Lunar New Year shopping. Knowing both calendars helps airport retail staff.","zh":"英語國家零售高峰常係聖誕；香港仲有農曆新年大購物潮。機場店員識兩個節日會好用。","q":"香港零售仲有一個好重要嘅節日高峰係？","opts":["農曆新年","萬聖節一定最大","只有暑假","無節日高峰"],"a":0},{"title":"Returning without a tag","body":"In some Western chains, missing tags block returns; in HK, managers sometimes allow goodwill exchanges. Ask politely either way.","zh":"一啲西方連鎖無吊牌就唔退；香港經理有時商譽換貨。兩邊都禮貌問。","q":"無吊牌時最好？","opts":["禮貌查詢政策","即刻發脾氣","偷走第二件","永不問"],"a":0},{"title":"Personal space at counters","body":"In some cultures, standing very close feels normal; in others, a little space shows respect. Watch local cues at busy tills.","zh":"有文化企好近好平常；有啲覺得留位係尊重。繁忙收銀睇現場。","q":"對距離最好？","opts":["觀察當地習慣","強迫擁抱","永遠背向客人","踩腳表示友善"],"a":0},{"title":"Rainy-day retail","body":"HK shoppers often carry umbrellas; wet floors near entrances are a shared worry worldwide. Staff put out signs: \"Wet floor.\"","zh":"香港人成日攞遮；全世界入口湿地板都麻煩。員工會摆「湿地板」牌。","q":"湿地板要？","opts":["放警告牌","隱藏危險","鼓勵跑步","關灯"],"a":0},{"title":"Name order","body":"English forms often want given name then family name; Chinese order is often family name first. Double-check boarding passes and receipts.","zh":"英文表格常名先姓後；中文常姓先。登機證收據要核對。","q":"填英文表要留意？","opts":["名同姓順序","字體顏色","紙張香味","無關"],"a":0},{"title":"Silence vs chat","body":"Some travellers prefer quiet service; others enjoy chat. Matching the customer's energy is a useful soft skill.","zh":"有旅客鍾意安靜服務；有啲鍾意傾偈。配合顧客節奏係軟技巧。","q":"好用嘅軟技巧？","opts":["配合顧客節奏","強迫傾偈","完全唔出聲","只講政策編號"],"a":0}],"advanced":[{"title":"服務距離同眼神","body":"In some Western service cultures, steady eye contact signals confidence. In HK retail, polite warmth with slightly softer eye contact can feel more natural — both aim to show respect.","zh":"一啲西方服務文化用穩定眼神表示自信；香港零售偏柔和眼神更自然——兩者都係表達尊重。","q":"兩種文化共同目標？","opts":["表達尊重同專業","刻意冷淡","避免打招呼","只講價錢"],"a":0},{"title":"投訴升級","body":"In UK/US retail, customers often ask for \"a manager\" early. In HK, staff may first offer on-the-spot solutions, then escalate. Clear apology language helps in both.","zh":"英美顧客好多時好快要求見經理；香港店員多數先現場解決再上報。兩邊都需要清晰道歉用語。","q":"兩邊投訴處理都重要嘅係？","opts":["清晰道歉同解決方案","立刻關門","拒絕溝通","只講政策編號"],"a":0},{"title":"Gift wrapping norms","body":"In Japan, wrapping can be highly ceremonial; in many English-speaking contexts, simple gift wrap is enough. Airport souvenir shops serve mixed expectations.","zh":"日本包裝可以好儀式感；好多英語場合簡單包裝就夠。機場手信舖要彈性。","q":"多元旅客場合宜？","opts":["保持彈性期望","強迫單一禮儀","拒絕包裝","嘲笑習俗"],"a":0},{"title":"Refund negotiations","body":"Some cultures treat refund talks as firm policy; others expect negotiation. Knowing when you can offer goodwill vouchers prevents escalation.","zh":"有文化退款好硬性；有啲預期傾偈。知唔知可以商譽禮券可免升級。","q":"避免投訴升級可以？","opts":["清楚商譽選項","堅持無任何彈性","提高聲線","消失"],"a":0},{"title":"Time pressure near gates","body":"Travellers with tight connections value speed over small talk. Reading urgency is part of professional service near airports.","zh":"轉機趕嘅旅客重視速度多過寒暄。機場零售要讀得明急切。","q":"趕時間旅客更重視？","opts":["速度","長篇閒聊","無關服務","額外表格"],"a":0},{"title":"Indirect refusals","body":"In some East Asian contexts, a soft \"Maybe difficult\" can mean no. English-speaking guests may need a clearer \"I'm afraid we can't.\"","zh":"一啲東亞語境「可能有啲難」等於拒絕；英語客人可能需要更直接說明。","q":"對英語客人拒絕時宜？","opts":["更清晰說明做唔到","永遠含糊","答應做唔到嘅事","沉默"],"a":0},{"title":"Public vs private correction","body":"Correcting a colleague loudly on the floor can cause loss of face. Step aside when possible — a tip useful across cultures.","zh":"喺賣場大聲糾正同事可能令人冇面。可以嘅話拉側邊講。","q":"糾正同事較好？","opts":["盡量側邊私下","公開羞辱","上網直播","忽視錯誤"],"a":0}],"ielts":[{"title":"Service scripts and cultural capital","body":"Sociolinguists note that formulaic politeness (\"How may I help you?\") functions as cultural capital in English-medium retail. In bilingual HK airport shops, code-switching between Cantonese and English is not a deficit but a strategic resource for rapport.","zh":"社會語言學指出套語禮貌喺英語零售係一種文化資本；香港機場雙語舖嘅語碼轉換係建立關係嘅策略資源，唔係缺陷。","q":"Best interpretation?","opts":["Bilingual code-switching can be a strategic service resource.","Only monolingual English is professional.","Cantonese must never be used.","Scripts have no cultural value."],"a":0},{"title":"Gift-giving norms","body":"In many English-speaking contexts, opening a gift immediately is polite. In some East Asian settings, restraint is valued. Airport souvenir staff serving mixed travellers benefit from flexible expectations.","zh":"好多英語文化即場拆禮物被視為禮貌；一啲東亞場合更重視含蓄。機場手信店員面對多元旅客宜保持彈性。","q":"對多元旅客最合適嘅態度？","opts":["Keep flexible expectations about gift norms.","Force every guest to open gifts now.","Refuse to sell gifts.","Ignore cultural differences."],"a":0},{"title":"Face and complaint discourse","body":"Researchers argue that \"face\" shapes how complaints unfold: some customers prefer private redress, while others stage discontent publicly to gain leverage. Staff trained in de-escalation navigate both scripts.","zh":"研究指「面」影響投訴展開：有人要私下補救，有人公開表達爭取籌碼。","q":"De-escalation training helps staff…","opts":["Handle both private and public complaint styles","Ignore all complaints","Only serve silent customers","Ban bilingual talk"],"a":0},{"title":"Chronemics in service","body":"Chronemics — the cultural use of time — explains why some guests accept queues calmly while others perceive short waits as disrespect. Airport retail sits at the intersection of punctual flight culture and leisure shopping.","zh":"時間文化解釋點解有人淡定排隊、有人覺得短等都係不敬。","q":"Chronemics concerns…","opts":["Cultural attitudes to time and waiting","Only currency exchange","Lighting design alone","Uniform colour rules"],"a":0},{"title":"Indexical politeness markers","body":"Please/thank-you density indexes politeness in English service encounters; Cantonese relies more on particles and tone. Translating force rather than word count improves bilingual scripts.","zh":"英文服務嘅 please/thank you 密度標示禮貌；粵語更多靠語氣助詞。","q":"Better bilingual scripts prioritise…","opts":["Pragmatic force over literal word counts","Maximum English words only","Deleting all politeness","Machine tone only"],"a":0},{"title":"Hybrid consumer spaces","body":"Airport malls are hybrid spaces where tourist, worker, and resident identities overlap. Service design that assumes a single \"ideal customer\" underperforms.","zh":"機場商場係遊客、員工、居民身份重疊嘅混合空間。","q":"Service design should…","opts":["Allow for overlapping customer identities","Assume one ideal customer only","Ignore workers","Ban tourists"],"a":0},{"title":"Power distance at the till","body":"In higher power-distance settings, customers may expect managers to appear quickly; in lower ones, empowered frontline staff are admired. Global airport shops need flexible escalation paths.","zh":"高權力距離場合顧客預期經理快出現；低權力距離欣賞前線有權處理。","q":"Global outlets benefit from…","opts":["Flexible escalation paths","One rigid hierarchy forever","No managers","No frontline power"],"a":0}]};

/* ===== TTS / AUDIO ===== */
function ttsUrl(text){
  var s=String(text||'').replace(/\s+/g,' ').trim().slice(0,200);
  if(!s)return '';
  return 'https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(s)+'&type=2';
}
function speak(text,rate){
  try{
    if(!text)return;
    var s=String(text).replace(/\s+/g,' ').trim();
    if(!s)return;
    var url=ttsUrl(s);
    try{if(window._egAudio){window._egAudio.pause();}}catch(e){}
    try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}

    // Update any on-page players
    var slot=document.getElementById('tts-player');
    if(slot){
      slot.innerHTML='<div style="font-size:.78rem;color:#607d8b;margin:0 0 6px">播唔出就撳下面 ▶</div>'+
        '<audio id="tts-audio" controls playsinline preload="auto" style="width:100%;height:40px;margin:0" src="'+url.replace(/"/g,'&quot;')+'"></audio>';
      var au=document.getElementById('tts-audio');
      window._egAudio=au;
      var p=au.play();
      if(p&&p.catch)p.catch(function(){toast('撳下面 ▶ 播放');});
      toast('🔊 朗讀');
      return;
    }
    var a=new Audio(url);
    a.setAttribute('playsinline','');
    window._egAudio=a;
    var p2=a.play();
    if(p2&&p2.catch)p2.catch(function(){speakSynth(s,rate);toast('改用系統朗讀／請開聲');});
    else toast('🔊 朗讀');
  }catch(e){speakSynth(String(text),rate);}
}
function speakSynth(text,rate){
  try{
    if(!window.speechSynthesis){toast('朗讀唔到');return;}
    try{speechSynthesis.cancel();}catch(e){}
    var u=new SpeechSynthesisUtterance(String(text));
    u.lang='en-US';u.rate=rate||0.92;
    speechSynthesis.speak(u);
    setTimeout(function(){try{speechSynthesis.resume();}catch(e){}},30);
  }catch(e){}
}
function bindTap(el,fn){
  if(!el)return;
  el.style.cursor='pointer';
  el.onclick=function(ev){
    try{if(ev){ev.preventDefault();ev.stopPropagation();}}catch(e){}
    try{fn(ev);}catch(err){}
  };
}
function beep(ok){
  try{
    var ctx=new(window.AudioContext||window.webkitAudioContext)();
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.frequency.value=ok?880:220;g.gain.value=0.07;
    o.start();g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.22);
    o.stop(ctx.currentTime+0.22);
  }catch(e){}
}
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  clearTimeout(toast._tm);toast._tm=setTimeout(function(){t.classList.remove('on');},1700);
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0;var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9\s']/g,' ').replace(/\s+/g,' ').trim();}

/* ===== STATE UI ===== */
var st=state(),play=null;
function levelObj(){for(var i=0;i<LEVELS.length;i++)if(LEVELS[i].id===st.s.level)return LEVELS[i];return LEVELS[0];}
function show(id){document.querySelectorAll('.screen').forEach(function(el){el.classList.remove('on');});document.getElementById(id).classList.add('on');window.scrollTo(0,0);}
function refreshHome(){
  st=state();var lv=levelObj();
  document.getElementById('lv-label').textContent=lv.zh;
  var v=Math.min(10,st.day.vocab|0),q=Math.min(5,st.day.quiz|0);
  document.getElementById('g-vocab').textContent=v+' / 10';
  document.getElementById('g-quiz').textContent=q+' / 5';
  var pct=Math.round(((v/10)*0.5+(q/5)*0.5)*100);
  document.getElementById('g-bar').style.width=pct+'%';
  document.getElementById('g-pct').textContent='完成 '+pct+'%';
  document.getElementById('g-streak').textContent='🔥 '+(st.s.dayStreak||0);
  document.getElementById('g-xp').textContent='⭐ '+(st.s.xp||0)+' XP';
}
function addXP(n){
  st.s.xp=(st.s.xp||0)+n;st.day.xp=(st.day.xp||0)+n;
  if(st.s.lastDay!==todayKey()){
    var y=new Date();y.setDate(y.getDate()-1);
    var yk=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
    st.s.dayStreak=(st.s.lastDay===yk)?(st.s.dayStreak||0)+1:1;
    st.s.lastDay=todayKey();
  }
  saveState(st);
}
function bumpGoal(kind,n){st.day[kind]=(st.day[kind]|0)+(n||1);saveState(st);refreshHome();}

function openLevelModal(){
  var box=document.getElementById('lv-opts');box.innerHTML='';

function buildLessons(mod){
  var lv=st.s.level;
  if(mod==='vocab'){
    var words=VOCAB[lv]||VOCAB.beginner,out=[],size=lv==='ielts'?6:6;
    for(var i=0;i<words.length;i+=size){
      var slice=words.slice(i,i+size);
      out.push({id:lv+'_v'+(i/size|0),title:'第 '+(out.length+1)+' 關 · 單字＋讀出嚟',sub:slice.length+' 個生字 · 睇卡→開口講→遊戲',words:slice,mode:'vocab'});
    }
    return out;
  }
  if(mod==='listen'){
    var items=LISTEN[lv]||LISTEN.beginner,out=[],size=4;
    for(var i=0;i<items.length;i+=size){var slice=items.slice(i,i+size);out.push({id:lv+'_l'+(i/size|0),title:'第 '+(out.length+1)+' 關 · 聽力',sub:slice.length+' 題',items:slice,mode:'listen'});}
    return out;
  }
  if(mod==='quiz'){
    var items=QUIZ[lv]||QUIZ.beginner,out=[],size=5;
    for(var i=0;i<items.length;i+=size){var slice=items.slice(i,i+size);out.push({id:lv+'_q'+(i/size|0),title:'每日小測 · 第 '+(out.length+1)+' 組',sub:slice.length+' 題 · 即時批改',items:slice,mode:'quiz'});}
    return out;
  }
  if(mod==='news'){
    return (NEWS[lv]||NEWS.beginner).map(function(n,i){return{id:lv+'_n'+i,title:n.title,sub:'閱讀＋詞彙＋理解題',news:n,mode:'news'};});
  }
  if(mod==='culture'){
    return (CULTURE[lv]||CULTURE.beginner).map(function(c,i){return{id:lv+'_c'+i,title:c.title,sub:'文化短篇＋小測',culture:c,mode:'culture'};});
  }
  if(mod==='speak'){
    var lines=SPEAK_SETS[lv]||SPEAK_SETS.beginner,out=[],size=4;
    for(var i=0;i<lines.length;i+=size){
      var slice=lines.slice(i,i+size);
      out.push({id:lv+'_sp'+(i/size|0),title:'第 '+(out.length+1)+' 關 · 開口講',sub:slice.length+' 句 · 撳咪高聲讀',lines:slice,mode:'speak'});
    }
    return out;
  }
  return [];
}
function buildSituLessons(cat){
  var lv=st.s.level;
  if(lv==='ielts'){
    var dial=SITU.ielts||[],out=[],chunk=4;
    for(var i=0;i<dial.length;i+=chunk){
      var slice=dial.slice(i,i+chunk);
      out.push({id:'ielts_s'+(i/chunk|0),title:'雅思 · 學術改寫 · 第 '+(out.length+1)+' 關',sub:slice.length+' 段 · paraphrase',dial:slice,mode:'situ-ielts'});
    }
    return out.length?out:[{id:'ielts_s0',title:'雅思 · 學術改寫',sub:'短文＋paraphrase 題',dial:dial,mode:'situ-ielts'}];
  }
  var packs=((SITU[lv]||SITU.beginner)[cat])||SITU.beginner.shop;
  if(packs.length && packs[0] && packs[0].role) packs=[packs];
  var labels={shop:'店鋪接待',airport:'機場／東湧交通',work:'零售班務'};
  return packs.map(function(pack,i){
    return {id:lv+'_'+cat+'_'+i,title:(labels[cat]||cat)+' · 第 '+(i+1)+' 關',sub:pack.length+' 句對話 · 跟讀＋開口講',dial:pack,mode:'situ',cat:cat};
  });
}

/* ===== PLAY ===== */
function startLesson(mod,L){
  play={mod:mod,L:L,fromList:true,i:0,correct:0,wrong:0,streak:0,bestStreak:0,xp:0,hearts:5,steps:buildSteps(L)};
  document.getElementById('play-title').textContent=L.title;
  document.getElementById('play-next').style.display='none';
  document.getElementById('play-fb').className='fb';
  renderHearts();show('sc-play');renderStep();
}
function blankExample(w){
  var ex=w.ex||w.en, target=w.en, re=new RegExp(target.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');
  if(re.test(ex))return ex.replace(re,'___');
  return 'Please use the word ___ in this sentence: '+ex;
}
function buildSteps(L){
  var steps=[],lv=st.s.level;
  if(L.mode==='vocab'){
    L.words.forEach(function(w){
      steps.push({kind:'flash',word:w});
      steps.push({kind:'speak',target:w.en,hint:'讀出嚟 · '+w.zh,mustSpeak:true});
      if(w.ex && w.ex.split(/\s+/).length<=10){
        steps.push({kind:'speak',target:w.ex,hint:'讀出例子 · '+w.zh,mustSpeak:true});
      }
    });
    // Match game EN↔ZH (pairs of 4)
    var matchPool=shuffle(L.words).slice(0,Math.min(4,L.words.length));
    if(matchPool.length>=2)steps.push({kind:'match',pairs:matchPool});
    // Fill blank in example
    shuffle(L.words).slice(0,Math.min(3,L.words.length)).forEach(function(w){
      steps.push({kind:'exfill',word:w,blank:blankExample(w)});
    });
    // Hear word → pick ZH
    shuffle(L.words).slice(0,Math.min(3,L.words.length)).forEach(function(w){
      var opts=shuffle([w.zh].concat(shuffle((VOCAB[lv]||VOCAB.beginner).map(function(x){return x.zh;}).filter(function(z){return z!==w.zh;})).slice(0,3)));
      steps.push({kind:'listen',say:w.en,prompt:'你聽到邊個意思？',opts:opts,a:opts.indexOf(w.zh)});
    });
    // Grammar taps
    shuffle(GRAMMAR[lv]||GRAMMAR.beginner).slice(0,3).forEach(function(g){
      steps.push({kind:'mc',prompt:g.q,hint:'文法小遊戲 · '+(g.tip||'揀正確答案'),opts:g.opts,a:g.a});
    });
    // Optional letter scramble for one short word
    var short=L.words.filter(function(w){return w.en.indexOf(' ')<0&&w.en.length>=3&&w.en.length<=10;});
    if(short.length){var w=short[Math.random()*short.length|0];steps.push({kind:'scramble',word:w});}
  }
  if(L.mode==='listen')L.items.forEach(function(it){steps.push({kind:'listen',say:it.say,prompt:it.q,opts:it.opts,a:it.a});});
  if(L.mode==='quiz')L.items.forEach(function(it){
    if(it.type==='mc')steps.push({kind:'mc',prompt:it.q,hint:'選擇正確答案',opts:it.opts,a:it.a});
    else steps.push({kind:'fill',prompt:it.q,answers:it.a});
  });
  if(L.mode==='news'){
    var n=L.news;steps.push({kind:'newsread',news:n});
    n.words.forEach(function(w){
      var ww={en:w.en,zh:w.zh,ex:'From today\'s news.',exZh:'來自今日新聞。',ipa:''};
      steps.push({kind:'flash',word:ww});
      steps.push({kind:'speak',target:w.en,hint:'讀出嚟 · '+w.zh,mustSpeak:true});
    });
    steps.push({kind:'mc',prompt:n.q,hint:'根據新聞揀答案',opts:n.opts,a:n.a});
  }
  if(L.mode==='culture'){
    var c=L.culture;
    steps.push({kind:'culture',culture:c});
    steps.push({kind:'mc',prompt:c.q,hint:'文化小測',opts:c.opts,a:c.a});
  }
  if(L.mode==='speak'){
    L.lines.forEach(function(line){steps.push({kind:'speak',target:line});});
  }
  if(L.mode==='situ'){
    L.dial.forEach(function(line){
      steps.push({kind:'dialogue',line:line});
      if(/你/.test(line.role)) steps.push({kind:'speak',target:line.en,hint:'讀出嚟 · 你嘅對白',mustSpeak:true});
    });
    var youLines=L.dial.filter(function(x){return /你/.test(x.role);});
    if(youLines.length){
      var pick=youLines[youLines.length-1];
      var opts=shuffle([pick.en,'Please leave now.','I do not work here.','The shop is closed forever.']);
      steps.push({kind:'mc',prompt:'啱啱對話，你／店員講過邊句？',hint:'情境記憶',opts:opts,a:opts.indexOf(pick.en),speak:pick.en});
    }
  }
  if(L.mode==='situ-ielts'){
    L.dial.forEach(function(row){
      if(row.mc)steps.push({kind:'mc',prompt:row.zh||row.en,hint:row.en,opts:row.opts,a:row.a});
      else steps.push({kind:'passage',text:row.en,zh:row.zh});
    });
  }
  return steps;
}
function renderHearts(){
  var h=document.getElementById('play-hearts'),s='';
  for(var i=0;i<5;i++)s+=i<play.hearts?'💚':'🖤';
  h.innerHTML=s;
  document.getElementById('play-streak').textContent='連續 '+play.streak;
  document.getElementById('play-xp').textContent='+'+play.xp+' XP';
  document.getElementById('play-bar').style.width=(play.steps.length?Math.round((play.i/play.steps.length)*100):0)+'%';
}
function renderStep(){
  var body=document.getElementById('play-body');
  var fb=document.getElementById('play-fb'),next=document.getElementById('play-next');
  fb.className='fb';next.style.display='none';
  if(play.i>=play.steps.length){finishLesson();return;}
  var step=play.steps[play.i];renderHearts();body.innerHTML='';

  if(step.kind==='flash'){
    var w=step.word;
    body.innerHTML='<div class="q-card"><div class="hint">生字卡 · 撳掣朗讀（無聲就撳 ▶）</div><div id="tts-player" style="margin:8px 0 4px"></div>'+
      '<div class="word tap-speak" id="tap-word" role="button" tabindex="0">'+esc(w.en)+'</div>'+
      (w.ipa?'<div style="color:#90a4ae;font-size:.85rem">'+esc(w.ipa)+'</div>':'')+
      '<div class="zh">'+esc(w.zh)+'</div>'+
      '<div class="speak-row">'+
      '<button class="speak-btn" type="button" id="spk">🔊 讀單字</button>'+
      (w.ex?'<button class="speak-btn" type="button" id="spk2">🔊 讀例子</button>':'')+
      '</div>'+
      (w.ex?'<div class="ex tap-speak" id="tap-ex" role="button" tabindex="0">'+esc(w.ex)+'</div>':'')+
      (w.exZh?'<div class="exZh">'+esc(w.exZh)+'</div>':'')+
      '</div><button class="btn-primary" type="button" id="gotit">睇完 · 下一題讀出嚟</button>';
    bindTap(document.getElementById('spk'),function(){speak(w.en);});
    bindTap(document.getElementById('tap-word'),function(){speak(w.en);});
    var s2=document.getElementById('spk2');
    if(s2)bindTap(s2,function(){speak(w.ex,0.95);});
    var tex=document.getElementById('tap-ex');
    if(tex)bindTap(tex,function(){speak(w.ex,0.95);});
    bindTap(document.getElementById('gotit'),function(){play.i++;bumpGoal('vocab',1);addXP(2);play.xp+=2;play.correct++;toast('👍 +2 XP');renderStep();});
    // Do NOT auto-speak (steals first gesture on Xiaomi); user taps directly
    return;
  }

  if(step.kind==='match'){
    var left=shuffle(step.pairs.map(function(p){return{t:p.en,id:p.en,side:'en'};}));
    var right=shuffle(step.pairs.map(function(p){return{t:p.zh,id:p.en,side:'zh'};}));
    var cards=left.concat(right);
    body.innerHTML='<div class="q-card"><div class="hint">🎮 配對遊戲 · 撳英文再撳中文</div><div class="zh">將英文同意思配對</div></div><div class="match-grid" id="mg"></div>';
    var sel=null,leftCount=step.pairs.length,mg=document.getElementById('mg');
    cards.forEach(function(c){
      var b=document.createElement('button');b.type='button';b.className='choice match';b.textContent=c.t;b.dataset.id=c.id;b.dataset.side=c.side;
      b.onclick=function(){
        if(b.classList.contains('ok'))return;
        if(!sel){sel=b;b.classList.add('sel');return;}
        if(sel===b){sel.classList.remove('sel');sel=null;return;}
        if(sel.dataset.side===b.dataset.side){toast('揀另一邊（英文↔中文）');return;}
        if(sel.dataset.id===b.dataset.id){
          sel.classList.remove('sel');sel.classList.add('ok');b.classList.add('ok');sel.disabled=true;b.disabled=true;sel=null;leftCount--;beep(true);
          if(leftCount<=0){feedback(true,'配對完成！');afterAnswer(true);}
        }else{
          b.classList.add('bad');sel.classList.add('bad');beep(false);
          var s0=sel;sel=null;
          setTimeout(function(){b.classList.remove('bad');s0.classList.remove('bad','sel');},350);
        }
      };
      mg.appendChild(b);
    });
    return;
  }

  if(step.kind==='exfill'){
    var w=step.word;
    body.innerHTML='<div class="q-card"><div class="hint">🎮 例子填充 · 填返個生字</div>'+
      '<div class="ex" style="font-size:1.05rem">'+esc(step.blank).replace('___','<span class="blank">？</span>')+'</div>'+
      (w.exZh?'<div class="exZh">'+esc(w.exZh)+'</div>':'')+
      '<div class="fill-wrap"><input id="fill" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入英文…"></div>'+
      '<button class="speak-btn" type="button" id="spk">🔊 聽完整例子</button></div>'+
      '<button class="btn-primary" type="button" id="chk">提交</button>';
    bindTap(document.getElementById('spk'),function(){speak(w.ex||w.en);});
    var inp=document.getElementById('fill');setTimeout(function(){inp.focus();},150);
    function go(){checkFill({answers:[w.en]},inp.value);}
    document.getElementById('chk').onclick=go;
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')go();});
    return;
  }

  if(step.kind==='scramble'){
    var w=step.word,letters=shuffle(w.en.toLowerCase().split(''));
    body.innerHTML='<div class="q-card"><div class="hint">🎮 拼字遊戲 · 撳字母排順序</div><div class="zh">'+esc(w.zh)+'</div>'+
      '<div class="word" id="built" style="min-height:1.2em;letter-spacing:.08em"></div>'+
      '<div class="scr-row" id="tiles"></div>'+
      '<button class="speak-btn" type="button" id="spk">🔊 提示發音</button></div>'+

    letters.forEach(function(ch,idx){
      var b=document.createElement('button');b.type='button';b.className='scr-tile';b.textContent=ch;b.dataset.i=idx;
      b.onclick=function(){if(b.classList.contains('used'))return;b.classList.add('used');built.push({ch:ch,el:b});document.getElementById('built').textContent=built.map(function(x){return x.ch;}).join('');};
      tiles.appendChild(b);
    });
    document.getElementById('clr').onclick=function(){built.forEach(function(x){x.el.classList.remove('used');});built=[];document.getElementById('built').textContent='';};
    document.getElementById('chk').onclick=function(){checkFill({answers:[w.en]},built.map(function(x){return x.ch;}).join(''));};
    return;
  }

  if(step.kind==='listen'){

    if(step.speak)bindTap(document.getElementById('spk'),function(){speak(step.speak);});
    renderChoices(step);return;
  }

  if(step.kind==='fill'){
    body.innerHTML='<div class="q-card"><div class="hint">填充題</div><div class="zh">'+esc(step.prompt)+'</div>'+
      '<div class="fill-wrap"><input id="fill" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入英文…"></div></div>'+
      '<button class="btn-primary" type="button" id="chk">提交</button>';
    var inp=document.getElementById('fill');setTimeout(function(){inp.focus();},150);
    document.getElementById('chk').onclick=function(){checkFill(step,inp.value);};
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')checkFill(step,inp.value);});
    return;
  }

  if(step.kind==='dialogue'){
    var line=step.line;
    body.innerHTML='<div class="q-card"><div class="hint">'+esc(line.role)+'</div><div class="word" style="font-size:1.15rem;line-height:1.4">'+esc(line.en)+'</div>'+
      '<div class="zh">'+esc(line.zh)+'</div><button class="speak-btn" type="button" id="spk">🔊 跟讀</button></div>'+
      '<button class="btn-primary" type="button" id="gotit">下一句</button>';

    setTimeout(function(){speak(line.en);},200);return;

  if(step.kind==='passage'){

      '<button class="speak-btn" type="button" id="spk">🔊 朗讀</button></div><button class="btn-primary" type="button" id="gotit">繼續答題</button>';

      '<button class="btn-primary" type="button" id="gotit">學詞彙 →</button>';
    bindTap(document.getElementById('spk'),function(){speak(n.title+'. '+n.body,0.95);});
    document.getElementById('gotit').onclick=function(){play.i++;bumpGoal('news',1);renderStep();};return;
  }

  if(step.kind==='culture'){
    var c=step.culture;
    body.innerHTML='<div class="q-card" style="text-align:left"><div class="hint">🌏 文化練習</div><div class="word" style="font-size:1.1rem;text-align:left">'+esc(c.title)+'</div>'+
      '<div class="passage">'+esc(c.body)+'</div><div class="exZh" style="padding:8px 4px">'+esc(c.zh)+'</div>'+
      '<button class="speak-btn" type="button" id="spk">🔊 朗讀英文</button></div>'+
      '<button class="btn-primary" type="button" id="gotit">去做小測 →</button>';
    bindTap(document.getElementById('spk'),function(){speak(c.body,0.95);});
    document.getElementById('gotit').onclick=function(){play.i++;bumpGoal('culture',1);addXP(2);play.xp+=2;renderStep();};return;
  }

  if(step.kind==='speak'){
    renderSpeakStep(step);return;
  }
}


var egRec={stream:null,mr:null,chunks:[],url:null};
function egClearRec(){
  try{if(egRec.mr&&egRec.mr.state!=='inactive')egRec.mr.stop();}catch(e){}
  try{if(egRec.stream)egRec.stream.getTracks().forEach(function(tr){tr.stop();});}catch(e){}
  if(egRec.url){try{URL.revokeObjectURL(egRec.url);}catch(e){}}
  egRec={stream:null,mr:null,chunks:[],url:null};
}
function egPlayMine(){
  if(!egRec.url){toast('未錄到你把聲，再講一次');return;}
  try{
    if(window._egMine){try{window._egMine.pause();}catch(e){}}
    var a=new Audio(egRec.url);window._egMine=a;a.play();
    toast('▶️ 你把聲');
  }catch(e){toast('播唔到錄音');}
}
function egStartRec(){
  egClearRec();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    return Promise.resolve(false);
  }
  return navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    egRec.stream=stream;egRec.chunks=[];
    if(!window.MediaRecorder){
      try{stream.getTracks().forEach(function(tr){tr.stop();});}catch(e){}
      return false;
    }
    var mime='';
    try{
      if(MediaRecorder.isTypeSupported('audio/webm;codecs=opus'))mime='audio/webm;codecs=opus';
      else if(MediaRecorder.isTypeSupported('audio/webm'))mime='audio/webm';
      else if(MediaRecorder.isTypeSupported('audio/mp4'))mime='audio/mp4';
      else if(MediaRecorder.isTypeSupported('audio/aac'))mime='audio/aac';
    }catch(e){}
    try{egRec.mr=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);}
    catch(e){try{egRec.mr=new MediaRecorder(stream);}catch(e2){return false;}}
    egRec.mr.ondataavailable=function(ev){if(ev.data&&ev.data.size)egRec.chunks.push(ev.data);};
    egRec.mr.start(200);
    return true;
  }).catch(function(err){
    console&&console.warn(err);
    return false;
  });
}
function egStopRec(){
  return new Promise(function(ok){
    try{
      if(!egRec.mr||egRec.mr.state==='inactive'){ok(!!egRec.url);return;}
      egRec.mr.onstop=function(){
        try{
          var blob=new Blob(egRec.chunks,{type:(egRec.mr&&egRec.mr.mimeType)||'audio/webm'});
          if(egRec.url)URL.revokeObjectURL(egRec.url);
          egRec.url=URL.createObjectURL(blob);
        }catch(e){}
        try{if(egRec.stream)egRec.stream.getTracks().forEach(function(tr){tr.stop();});}catch(e){}
        ok(!!egRec.url);
      };
      egRec.mr.stop();
    }catch(e){ok(false);}
  });
}

function micSupported(){
  return !!(window.SpeechRecognition||window.webkitSpeechRecognition);
}
function renderSpeakStep(step){
  var body=document.getElementById('play-body');

  egClearRec();

    '<div id="tts-player" style="margin:8px 0 4px"></div>'+
    '<div class="word" style="font-size:1.35rem;line-height:1.4;margin:10px 0">'+esc(step.target)+'</div>'+
    '<div class="speak-row">'+
    '<button class="speak-btn" type="button" id="spk">🔊 先聽示範</button>'+
    '</div>'+
    '<div style="display:flex;align-items:center;justify-content:center;gap:14px;margin:16px 0;flex-wrap:wrap">'+
    '<button class="speak-btn big mic" type="button" id="mic" aria-label="錄音">🎙️</button>'+

    '</div>'+
    '<div class="mic-status" id="mst">① 撳左邊咪錄音　② 再撳停止　③ 撳右邊「聽返」</div>'+
    '<div id="rec-actions" style="display:none;margin-top:8px">'+
    '<button class="btn-primary" type="button" id="passOk">聽完覺得 OK · 過關</button>'+
    '<button class="btn-ghost" type="button" id="retryRec">再錄一次</button>'+
    '</div>'+
    '<div id="mine-player" style="margin-top:10px;display:none"></div>'+
    '<button class="btn-ghost" type="button" id="skip" style="margin-top:8px">咪唔得 · 跳過呢題</button>'+
    '</div>';

  (function(){
    var slot=document.getElementById('tts-player');
    var url=ttsUrl(step.target);
    if(slot&&url){
      slot.innerHTML='<div style="font-size:.78rem;color:#607d8b;margin:0 0 6px">示範（無聲就撳 ▶）</div>'+
        '<audio id="tts-audio" controls playsinline preload="auto" style="width:100%;height:40px" src="'+url.replace(/"/g,'&quot;')+'"></audio>';
    }
  })();

  var playMineBtn=document.getElementById('playMine');
  playMineBtn.disabled=true;
  playMineBtn.style.opacity='0.45';

  function showMinePlayer(){
    var box=document.getElementById('mine-player');
    if(!egRec.url){toast('未有錄音');return;}
    box.style.display='block';
    box.innerHTML='<div style="font-size:.78rem;color:#1565c0;margin:0 0 6px;font-weight:700">你把聲（可再撳 ▶）</div>'+
      '<audio id="mine-audio" controls playsinline autoplay style="width:100%;height:42px" src="'+egRec.url+'"></audio>';
    playMineBtn.disabled=false;
    playMineBtn.style.opacity='1';
    document.getElementById('rec-actions').style.display='block';
    try{document.getElementById('mine-audio').play();}catch(e){}
  }

  bindTap(document.getElementById('spk'),function(){speak(step.target,0.9);});
  bindTap(document.getElementById('skip'),function(){feedback(true,'已跳過');afterAnswer(true);});
  bindTap(playMineBtn,function(){
    if(!egRec.url){toast('未錄音：請先撳左邊藍色咪');return;}
    showMinePlayer();
    egPlayMine();
  });
  bindTap(document.getElementById('passOk'),function(){
    if(!egRec.url){toast('請先錄音再過關');return;}
    bumpGoal('speak',1);feedback(true,'做得好！');afterAnswer(true);
  });
  bindTap(document.getElementById('retryRec'),function(){
    egClearRec();
    document.getElementById('rec-actions').style.display='none';
    document.getElementById('mine-player').style.display='none';
    document.getElementById('mine-player').innerHTML='';
    playMineBtn.disabled=true;playMineBtn.style.opacity='0.45';
    document.getElementById('mst').textContent='① 撳左邊咪錄音　② 再撳停止　③ 撳右邊「聽返」';
    var mic=document.getElementById('mic');mic.classList.remove('rec');mic.textContent='🎙️';
  });

  var mic=document.getElementById('mic'),mst=document.getElementById('mst'),listening=false;
  bindTap(mic,function(){
    if(!listening){
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
        mst.textContent='開唔到咪。請允許麥克風，或撳跳過。';
        return;
      }
      mst.textContent='開緊咪…';
      egStartRec().then(function(ok){
        if(!ok){
          mst.textContent='開咪失敗。請允許麥克風權限（網址左邊鎖頭）。';
          return;
        }
        listening=true;
        mic.classList.add('rec');
        mic.textContent='⏹️';
        mst.textContent='錄音中… 讀完撳紅色 ⏹️ 停止';
        toast('開始錄音');
      });
      return;
    }
    listening=false;
    mic.classList.remove('rec');
    mic.textContent='🎙️';
    mst.textContent='處理緊錄音…';
    egStopRec().then(function(ok){
      if(!ok){
        mst.textContent='未錄到，再撳咪試一次';
        return;
      }
      mst.textContent='已錄好！撳右邊「▶️ 聽返」聽自己';
      showMinePlayer();
      toast('可以聽返啦');
    });
  });
}
function trySoftRecognize(target,mst){

}
function scoreSpeech(target,said,mst,retryOnFail){
  st.s.speakAttempts=(st.s.speakAttempts||0)+1;saveState(st);bumpGoal('speak',1);
  var t=norm(target),s=norm(said);
  mst.textContent='你講咗：'+(said||'（空白）');
  if(!s){
    feedback(false,'聽唔到，再撳咪讀一次');
    if(retryOnFail){document.getElementById('play-next').style.display='none';return;}
    afterAnswer(false);return;
  }
  if(s===t||s.replace(/\s/g,'')===t.replace(/\s/g,'')){feedback(true,'完美！講得啱晒');afterAnswer(true);return;}
  var tt=t.split(' ').filter(Boolean),ss=s.split(' ').filter(Boolean),hit=0;
  tt.forEach(function(w){if(ss.indexOf(w)>=0)hit++;});
  var ratio=tt.length?hit/tt.length:0;
  // soft match: allow close pronunciation / missing tiny words
  if(ratio>=0.55||t.indexOf(s)>=0||s.indexOf(t)>=0||(tt.length===1&&ss.some(function(x){return x.indexOf(tt[0])===0||tt[0].indexOf(x)===0;}))){
    feedback(true,'好接近！過關');afterAnswer(true);return;
  }
  feedback(false,'再試吓 · 目標：「'+target+'」');
  if(retryOnFail){
    mst.textContent+=' · 再撳咪讀，唔好跳過';
    document.getElementById('play-next').style.display='none';
    return;
  }
  afterAnswer(false);
}

function renderChoices(step){
  var box=document.getElementById('chs');
  step.opts.forEach(function(opt,idx){
    var b=document.createElement('button');b.type='button';b.className='choice';b.textContent=opt;
    b.onclick=function(){pickChoice(step,idx,b);};box.appendChild(b);
  });
}
function pickChoice(step,idx,btn){
  var box=document.getElementById('chs');
  box.querySelectorAll('.choice').forEach(function(c){c.disabled=true;});
  var ok=idx===step.a;btn.classList.add(ok?'ok':'bad');
  if(!ok&&box.children[step.a])box.children[step.a].classList.add('ok');
  feedback(ok,ok?'答啱喇！':'唔啱，睇吓正確答案');afterAnswer(ok);
}
function checkFill(step,val){
  var v=norm(val);var ok=step.answers.some(function(a){return norm(a)===v;});
  feedback(ok,ok?'答啱喇！':'正確答案：'+step.answers[0]);
  var inp=document.getElementById('fill');if(inp)inp.disabled=true;
  var chk=document.getElementById('chk');if(chk)chk.disabled=true;
  afterAnswer(ok);
}
function feedback(ok,msg){
  var fb=document.getElementById('play-fb');
  fb.textContent=(ok?'✨ ':'😅 ')+msg;fb.className='fb show '+(ok?'ok':'bad');beep(ok);
}
function afterAnswer(ok){
  if(ok){
    play.correct++;play.streak++;play.bestStreak=Math.max(play.bestStreak,play.streak);
    var gain=5+Math.min(5,play.streak);play.xp+=gain;addXP(gain);
    if(play.mod==='quiz')bumpGoal('quiz',1);
    if(play.mod==='listen')bumpGoal('listen',1);
  }else{
    play.wrong++;play.streak=0;play.hearts=Math.max(0,play.hearts-1);renderHearts();
  }
  var next=document.getElementById('play-next');next.style.display='block';
  if(play.hearts<=0){next.textContent='心心用晒 · 睇成績';next.onclick=function(){finishLesson();};}
  else{next.textContent='繼續';next.onclick=function(){play.i++;renderStep();};}
}
function finishLesson(){
  var stars=play.correct===0?0:play.wrong===0?3:play.correct>=play.steps.length*0.7?2:1;
  LS.set(lessonKey(play.mod,play.L.id),{stars:stars,correct:play.correct,t:Date.now()});
  if(play.bestStreak>(st.s.streakBest||0)){st.s.streakBest=play.bestStreak;saveState(st);}
  document.getElementById('res-emoji').textContent=stars>=3?'🏆':stars>=2?'🎉':'💪';
  document.getElementById('res-title').textContent=stars>=3?'完美通關！':stars>=2?'做得好！':'繼續加油！';
  document.getElementById('res-msg').textContent='你完成咗「'+play.L.title+'」';
  document.getElementById('res-correct').textContent=play.correct;
  document.getElementById('res-xp').textContent=play.xp;
  document.getElementById('res-streak').textContent=play.bestStreak;
  document.getElementById('res-again').onclick=function(){startLesson(play.mod,play.L);};
  show('sc-result');refreshHome();if(stars>=2)toast('關卡完成 ⭐×'+stars);
}

refreshHome();
if(!LS.get('welcomed',false)){LS.set('welcomed',true);setTimeout(function(){toast('撳右上角轉程度 · 全部單元跟住變');},500);}
