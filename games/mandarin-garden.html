àn shàng tā de yī fú tǎng zài chuáng shàng 。","paragraph":1},{"zh":"小紅帽來到床前，覺得祖母的耳朵、眼睛和嘴巴都變得很大。","py":"xiǎo hóng mào lái dào chuáng qián ， jué de zǔ mǔ de ěr duǒ 、 yǎn jīng hé zuǐ bā dōu biàn de hěn dà 。","paragraph":2},{"zh":"她還沒來得及離開，也被狼吞了下去。","py":"tā hái méi lái de jí lí kāi ， yě bèi láng tūn le xià qù 。","paragraph":2},{"zh":"吃飽的狼隨即睡着了。","py":"chī bǎo de láng suí jí shuì zháo le 。","paragraph":2},{"zh":"一位經過的獵人聽見異常的鼾聲，進屋查看，設法救出了祖母和小紅帽。","py":"yī wèi jīng guò de liè rén tīng jiàn yì cháng de hān shēng ， jìn wū chá kàn ， shè fǎ jiù chū le zǔ mǔ hé xiǎo hóng mào 。","paragraph":3},{"zh":"經過這件事，小紅帽記住媽媽的叮囑，不再隨便相信陌生人的話。","py":"jīng guò zhè jiàn shì ， xiǎo hóng mào jì zhù mā mā de dīng zhǔ ， bù zài suí biàn xiāng xìn mò shēng rén de huà 。","paragraph":3}]},{"id":"grimm-12","paragraphs":["一對夫婦住在女巫花園旁邊。妻子很想吃園裏的菜，丈夫便偷偷進去採摘。他被女巫發現後，答應把將來出生的孩子交給她，才獲准離開。","孩子出生後被帶走，長大成了長髮公主。女巫把她關在一座沒有樓梯的高塔，每次都叫她垂下長髮，自己沿着頭髮爬上去。","一位王子聽見塔裏的歌聲，也學會了上塔的方法。女巫發現兩人來往，剪下公主的長髮，把她送往荒野。王子後來受傷，失去了視力。","王子流浪多時，終於再次聽見熟悉的歌聲，找到了公主。公主流下的淚水落在他的眼睛上，讓他重見光明。他們一同離開荒野，重新開始生活。"],"questions":[{"q":"女巫通常怎樣進入高塔？","options":["從地底的隧道進入","請小鳥拉開窗戶","沿着公主垂下的長髮爬上去","乘坐會飛的馬車"],"answer":2,"explanation":"高塔沒有樓梯，長髮成了女巫上塔的方法。","id":"grimm-12:q0"},{"q":"王子最初被甚麼吸引到塔旁？","options":["公主的歌聲","塔頂的金鐘","花園裏的蘋果","女巫的宴會"],"answer":0,"explanation":"故事寫王子先聽見歌聲，才注意到塔裏的人。","id":"grimm-12:q1"},{"q":"王子怎樣重見光明？","options":["他喝完一瓶蜂蜜","獵人替他點亮油燈","公主的淚水落在他眼睛上","女巫送回剪下的頭髮"],"answer":2,"explanation":"結尾以公主淚水使王子恢復視力，完成兩人重聚的情節。","id":"grimm-12:q2"}],"title":"長髮公主","author":"格林兄弟","group":"grimm","sourceTitle":"12 Rapunzel (Rapunzel)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap12","lines":[{"zh":"一對夫婦住在女巫花園旁邊。","py":"yī duì fū fù zhù zài nǚ wū huā yuán páng biān 。","paragraph":0},{"zh":"妻子很想吃園裏的菜，丈夫便偷偷進去採摘。","py":"qī zǐ hěn xiǎng chī yuán lǐ de cài ， zhàng fū biàn tōu tōu jìn qù cǎi zhāi 。","paragraph":0},{"zh":"他被女巫發現後，答應把將來出生的孩子交給她，才獲准離開。","py":"tā bèi nǚ wū fā xiàn hòu ， dā ying bǎ jiāng lái chū shēng de hái zi jiāo gěi tā ， cái huò zhǔn lí kāi 。","paragraph":0},{"zh":"孩子出生後被帶走，長大成了長髮公主。","py":"hái zi chū shēng hòu bèi dài zǒu ， zhǎng dà chéng le cháng fà gōng zhǔ 。","paragraph":1},{"zh":"女巫把她關在一座沒有樓梯的高塔，每次都叫她垂下長髮，自己沿着頭髮爬上去。","py":"nǚ wū bǎ tā guān zài yī zuò méi yǒu lóu tī de gāo tǎ ， měi cì dōu jiào tā chuí xià cháng fà ， zì jǐ yán zhe tóu fà pá shàng qù 。","paragraph":1},{"zh":"一位王子聽見塔裏的歌聲，也學會了上塔的方法。","py":"yī wèi wáng zǐ tīng jiàn tǎ lǐ de gē shēng ， yě xué huì le shàng tǎ de fāng fǎ 。","paragraph":2},{"zh":"女巫發現兩人來往，剪下公主的長髮，把她送往荒野。","py":"nǚ wū fā xiàn liǎng rén lái wǎng ， jiǎn xià gōng zhǔ de cháng fà ， bǎ tā sòng wǎng huāng yě 。","paragraph":2},{"zh":"王子後來受傷，失去了視力。","py":"wáng zǐ hòu lái shòu shāng ， shī qù le shì lì 。","paragraph":2},{"zh":"王子流浪多時，終於再次聽見熟悉的歌聲，找到了公主。","py":"wáng zǐ liú làng duō shí ， zhōng yú zài cì tīng jiàn shú xī de gē shēng ， zhǎo dào le gōng zhǔ 。","paragraph":3},{"zh":"公主流下的淚水落在他的眼睛上，讓他重見光明。","py":"gōng zhǔ liú xià de lèi shuǐ luò zài tā de yǎn jīng shàng ， ràng tā chóng jiàn guāng míng 。","paragraph":3},{"zh":"他們一同離開荒野，重新開始生活。","py":"tā men yī tóng lí kāi huāng yě ， chóng xīn kāi shǐ shēng huó 。","paragraph":3}]},{"id":"grimm-15","paragraphs":["漢斯和格蕾特家裏缺乏食物。大人把兄妹帶進森林，漢斯第一次沿路留下白石子，讓兩人能循着月光下的石子回家。","第二次進森林時，他只能留下麵包屑，卻全被鳥吃掉了。迷路的兄妹又餓又累，終於看見一間用餅乾和糖果做成的小屋。","屋裏的女巫假裝熱情，讓他們住下。她其實想把漢斯養胖，還逼格蕾特做家事。漢斯伸出細骨頭代替手指，暫時拖延了女巫的計劃。","到了危急時刻，格蕾特假裝不懂怎樣查看烤爐。女巫自己探身示範時，女孩把她推進去，救出哥哥。兄妹帶着找到的財物回家，終於不用再挨餓。"],"questions":[{"q":"漢斯第一次靠甚麼找到回家的路？","options":["月光下的白石子","女巫留下的腳印","會說話的蘋果","父親掛起的風箏"],"answer":0,"explanation":"白石子沒有被吃掉，在月光下仍然看得見。","id":"grimm-15:q0"},{"q":"第二次留下的麵包屑為甚麼失去作用？","options":["被藏進糖果屋","被鳥吃掉了","變成了白石子","被河水沖進城裏"],"answer":1,"explanation":"麵包屑被鳥吃掉，兄妹便找不到原來的道路。","id":"grimm-15:q1"},{"q":"格蕾特如何救出漢斯？","options":["利用女巫查看烤爐的時機反制她","答應永遠留在糖果屋","把哥哥變成一隻鳥","請國王買下整座森林"],"answer":0,"explanation":"她假裝不懂，使女巫親自示範，才找到逃脫的機會。","id":"grimm-15:q2"}],"title":"糖果屋","author":"格林兄弟","group":"grimm","sourceTitle":"15 Hansel and Gretel (Hänsel und Gretel)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap15","lines":[{"zh":"漢斯和格蕾特家裏缺乏食物。","py":"hàn sī hé gé lěi tè jiā lǐ quē fá shí wù 。","paragraph":0},{"zh":"大人把兄妹帶進森林，漢斯第一次沿路留下白石子，讓兩人能循着月光下的石子回家。","py":"dà rén bǎ xiōng mèi dài jìn sēn lín ， hàn sī dì yī cì yán lù liú xià bái shí zǐ ， ràng liǎng rén néng xún zhe yuè guāng xià de shí zǐ huí jiā 。","paragraph":0},{"zh":"第二次進森林時，他只能留下麵包屑，卻全被鳥吃掉了。","py":"dì èr cì jìn sēn lín shí ， tā zhǐ néng liú xià miàn bāo xiè ， què quán bèi niǎo chī diào le 。","paragraph":1},{"zh":"迷路的兄妹又餓又累，終於看見一間用餅乾和糖果做成的小屋。","py":"mí lù de xiōng mèi yòu è yòu lèi ， zhōng yú kàn jiàn yī jiān yòng bǐng gān hé táng guǒ zuò chéng de xiǎo wū 。","paragraph":1},{"zh":"屋裏的女巫假裝熱情，讓他們住下。","py":"wū lǐ de nǚ wū jiǎ zhuāng rè qíng ， ràng tā men zhù xià 。","paragraph":2},{"zh":"她其實想把漢斯養胖，還逼格蕾特做家事。","py":"tā qí shí xiǎng bǎ hàn sī yǎng pàng ， hái bī gé lěi tè zuò jiā shì 。","paragraph":2},{"zh":"漢斯伸出細骨頭代替手指，暫時拖延了女巫的計劃。","py":"hàn sī shēn chū xì gǔ tou dài tì shǒu zhǐ ， zàn shí tuō yán le nǚ wū de jì huà 。","paragraph":2},{"zh":"到了危急時刻，格蕾特假裝不懂怎樣查看烤爐。","py":"dào le wēi jí shí kè ， gé lěi tè jiǎ zhuāng bù dǒng zěn yàng chá kàn kǎo lú 。","paragraph":3},{"zh":"女巫自己探身示範時，女孩把她推進去，救出哥哥。","py":"nǚ wū zì jǐ tàn shēn shì fàn shí ， nǚ hái bǎ tā tuī jìn qù ， jiù chū gē gē 。","paragraph":3},{"zh":"兄妹帶着找到的財物回家，終於不用再挨餓。","py":"xiōng mèi dài zhe zhǎo dào de cái wù huí jiā ， zhōng yú bù yòng zài ái è 。","paragraph":3}]},{"id":"grimm-1","paragraphs":["公主在井旁玩金球，一不留神把球掉進水裏。青蛙答應替她撿球，條件是公主讓牠作伴，一起吃飯和休息。公主急着拿回金球，便答應了。","可是金球一回來，公主就跑回王宮，把約定忘在腦後。青蛙追到門口，要求她守信。國王得知經過，告訴女兒，答應了的事不能隨意反悔。","公主勉強讓青蛙進屋，心裏仍然生氣。經過一番爭執，青蛙突然恢復成王子，原來他一直受到魔法束縛，等待咒語解除。","王子忠心的僕人亨利前來迎接主人。他以前因太過傷心，在胸前束了三道鐵箍。看見主人平安歸來，亨利喜悅得讓鐵箍一一崩開。"],"questions":[{"q":"青蛙替公主撿回甚麼？","options":["被風吹走的餐巾","掉進井裏的金球","放在塔上的長髮","藏在山洞的王冠"],"answer":1,"explanation":"公主的金球落井，這才需要青蛙幫忙。","id":"grimm-1:q0"},{"q":"國王為甚麼要求公主讓青蛙進屋？","options":["青蛙要替王宮唱歌","她已經答應讓青蛙作伴","青蛙送來一座城堡","他打算把井填平"],"answer":1,"explanation":"國王要求公主履行自己先前作出的承諾。","id":"grimm-1:q1"},{"q":"亨利胸前的鐵箍為甚麼崩開？","options":["公主用金球敲打鐵箍","青蛙拿走了鐵匠的工具","主人獲救令他非常喜悅","馬車撞上了井口"],"answer":2,"explanation":"鐵箍原是因傷心而束上，主人平安歸來使亨利重新感到快樂。","id":"grimm-1:q2"}],"title":"青蛙王子","author":"格林兄弟","group":"grimm","sourceTitle":"1 The Frog King, or Iron Henry (Der Froschkönig oder der eiserne Heinrich)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap01","lines":[{"zh":"公主在井旁玩金球，一不留神把球掉進水裏。","py":"gōng zhǔ zài jǐng páng wán jīn qiú ， yī bù liú shén bǎ qiú diào jìn shuǐ lǐ 。","paragraph":0},{"zh":"青蛙答應替她撿球，條件是公主讓牠作伴，一起吃飯和休息。","py":"qīng wā dā ying tì tā jiǎn qiú ， tiáo jiàn shì gōng zhǔ ràng tā zuò bàn ， yì qǐ chī fàn hé xiū xī 。","paragraph":0},{"zh":"公主急着拿回金球，便答應了。","py":"gōng zhǔ jí zhe ná huí jīn qiú ， biàn dā ying le 。","paragraph":0},{"zh":"可是金球一回來，公主就跑回王宮，把約定忘在腦後。","py":"kě shì jīn qiú yī huí lái ， gōng zhǔ jiù pǎo huí wáng gōng ， bǎ yuē dìng wàng zài nǎo hòu 。","paragraph":1},{"zh":"青蛙追到門口，要求她守信。","py":"qīng wā zhuī dào mén kǒu ， yāo qiú tā shǒu xìn 。","paragraph":1},{"zh":"國王得知經過，告訴女兒，答應了的事不能隨意反悔。","py":"guó wáng dé zhī jīng guò ， gào sù nǚ ér ， dā ying le de shì bù néng suí yì fǎn huǐ 。","paragraph":1},{"zh":"公主勉強讓青蛙進屋，心裏仍然生氣。","py":"gōng zhǔ miǎn qiǎng ràng qīng wā jìn wū ， xīn lǐ réng rán shēng qì 。","paragraph":2},{"zh":"經過一番爭執，青蛙突然恢復成王子，原來他一直受到魔法束縛，等待咒語解除。","py":"jīng guò yī fān zhēng zhí ， qīng wā tū rán huī fù chéng wáng zǐ ， yuán lái tā yì zhí shòu dào mó fǎ shù fù ， děng dài zhòu yǔ jiě chú 。","paragraph":2},{"zh":"王子忠心的僕人亨利前來迎接主人。","py":"wáng zǐ zhōng xīn de pú rén hēng lì qián lái yíng jiē zhǔ rén 。","paragraph":3},{"zh":"他以前因太過傷心，在胸前束了三道鐵箍。","py":"tā yǐ qián yīn tài guò shāng xīn ， zài xiōng qián shù le sān dào tiě gū 。","paragraph":3},{"zh":"看見主人平安歸來，亨利喜悅得讓鐵箍一一崩開。","py":"kàn jiàn zhǔ rén píng ān guī lái ， hēng lì xǐ yuè de ràng tiě gū yī yī bēng kāi 。","paragraph":3}]},{"id":"grimm-5","paragraphs":["山羊媽媽出門前，叮囑七隻小山羊提防狼。狼先模仿媽媽的聲音敲門，卻因聲音粗啞被識破。牠又設法讓聲音變細，還把黑爪子弄成白色。","小山羊看見白色的爪子，以為媽媽回來了，便打開門。狼闖進屋裏，吃掉六隻小山羊。最小的一隻躲進大鐘裏，逃過一劫。","媽媽回家後，聽見最小的孩子哭着說出經過。她找到正在樹下睡覺的狼，看見肚子裏還有動靜，便設法把六個孩子救出來。","大家把石頭放進狼肚裏，再把肚子縫好。狼醒來走到井邊喝水，被石頭的重量拉下去。小山羊重新聚在媽媽身旁，記住不能只憑一個特徵認人。"],"questions":[{"q":"最小的小山羊躲在哪裏？","options":["媽媽的籃子裏","屋頂的煙囪裏","大鐘裏","井底"],"answer":2,"explanation":"牠躲進大鐘，才沒有被狼找到。","id":"grimm-5:q0"},{"q":"小山羊後來為甚麼替狼開門？","options":["牠送來七頂帽子","牠說井裏有金球","媽媽真的和牠一起回來","看見牠偽裝成白色的爪子"],"answer":3,"explanation":"狼改變聲音與爪子的外觀，使小山羊誤認牠是媽媽。","id":"grimm-5:q1"},{"q":"山羊媽媽怎樣知道六個孩子可能還活着？","options":["獵人送來一封信","她看見狼肚裏還有動靜","她聽見井裏有人唱歌","鐘突然變成玻璃"],"answer":1,"explanation":"故事交代狼睡着後，肚子裏仍有動靜，媽媽才開始營救。","id":"grimm-5:q2"}],"title":"狼和七隻小山羊","author":"格林兄弟","group":"grimm","sourceTitle":"5 The Wolf and the Seven Young Kids (Der Wolf und die sieben jungen Geißlein)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap05","lines":[{"zh":"山羊媽媽出門前，叮囑七隻小山羊提防狼。","py":"shān yáng mā mā chū mén qián ， dīng zhǔ qī zhǐ xiǎo shān yáng dī fáng láng 。","paragraph":0},{"zh":"狼先模仿媽媽的聲音敲門，卻因聲音粗啞被識破。","py":"láng xiān mó fǎng mā mā de shēng yīn qiāo mén ， què yīn shēng yīn cū yǎ bèi shí pò 。","paragraph":0},{"zh":"牠又設法讓聲音變細，還把黑爪子弄成白色。","py":"tā yòu shè fǎ ràng shēng yīn biàn xì ， hái bǎ hēi zhuǎ zi nòng chéng bái sè 。","paragraph":0},{"zh":"小山羊看見白色的爪子，以為媽媽回來了，便打開門。","py":"xiǎo shān yáng kàn jiàn bái sè de zhuǎ zi ， yǐ wéi mā mā huí lái le ， biàn dǎ kāi mén 。","paragraph":1},{"zh":"狼闖進屋裏，吃掉六隻小山羊。","py":"láng chuǎng jìn wū lǐ ， chī diào liù zhǐ xiǎo shān yáng 。","paragraph":1},{"zh":"最小的一隻躲進大鐘裏，逃過一劫。","py":"zuì xiǎo de yī zhī duǒ jìn dà zhōng lǐ ， táo guò yī jié 。","paragraph":1},{"zh":"媽媽回家後，聽見最小的孩子哭着說出經過。","py":"mā mā huí jiā hòu ， tīng jiàn zuì xiǎo de hái zi kū zhe shuō chū jīng guò 。","paragraph":2},{"zh":"她找到正在樹下睡覺的狼，看見肚子裏還有動靜，便設法把六個孩子救出來。","py":"tā zhǎo dào zhèng zài shù xià shuì jiào de láng ， kàn jiàn dù zi lǐ hái yǒu dòng jìng ， biàn shè fǎ bǎ liù gè hái zi jiù chū lái 。","paragraph":2},{"zh":"大家把石頭放進狼肚裏，再把肚子縫好。","py":"dà jiā bǎ shí tou fàng jìn láng dù lǐ ， zài bǎ dù zi féng hǎo 。","paragraph":3},{"zh":"狼醒來走到井邊喝水，被石頭的重量拉下去。","py":"láng xǐng lái zǒu dào jǐng biān hē shuǐ ， bèi shí tou de zhòng liàng lā xià qù 。","paragraph":3},{"zh":"小山羊重新聚在媽媽身旁，記住不能只憑一個特徵認人。","py":"xiǎo shān yáng chóng xīn jù zài mā mā shēn páng ， jì zhù bù néng zhǐ píng yí gè tè zhēng rèn rén 。","paragraph":3}]},{"id":"grimm-27","paragraphs":["一頭老驢因為不能再做重活，決定去不來梅當音樂家。路上牠遇見老狗、老貓和老公雞，大家都有被主人拋棄的煩惱，於是結伴同行。","晚上，牠們看見森林裏有一間亮着燈的屋子。屋內坐着強盜，桌上擺滿食物。四個伙伴又餓又累，商量怎樣才能得到一處歇腳的地方。","驢、狗、貓和公雞疊在一起，同時大叫，還從窗戶闖進屋裏。強盜以為可怕的怪物來了，嚇得四散逃走，四個伙伴便安心吃飯。","強盜派人回去察看，又被貓抓、狗咬、驢踢和公雞的叫聲嚇跑。從此沒人再來打擾。牠們雖然沒有到達不來梅，卻一起找到了新家。"],"questions":[{"q":"四個伙伴最初打算去哪裏？","options":["皇宮的高塔","海底王國","七座山後的礦場","不來梅"],"answer":3,"explanation":"老驢提出去不來梅當音樂家，其他動物也加入了。","id":"grimm-27:q0"},{"q":"強盜第一次為甚麼逃走？","options":["聽見鐘樓報時","把動物疊起來的身影和叫聲當成怪物","知道國王正在門外","看見桌上的食物消失"],"answer":1,"explanation":"四隻動物合力製造的形象與聲音，使強盜受到驚嚇。","id":"grimm-27:q1"},{"q":"四個伙伴最後在哪裏安頓下來？","options":["原本被強盜佔用的屋子","已經到達的不來梅宮殿","大鐘的裏面","公主的花園"],"answer":0,"explanation":"牠們沒有繼續趕路，而是把森林中的屋子當成新家。","id":"grimm-27:q2"}],"title":"不來梅的音樂家","author":"格林兄弟","group":"grimm","sourceTitle":"27 The Bremen Town Musicians (Die Bremer Stadtmusikanten)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap27","lines":[{"zh":"一頭老驢因為不能再做重活，決定去不來梅當音樂家。","py":"yī tóu lǎo lǘ yīn wèi bù néng zài zuò zhòng huó ， jué dìng qù bù lái méi dāng yīn yuè jiā 。","paragraph":0},{"zh":"路上牠遇見老狗、老貓和老公雞，大家都有被主人拋棄的煩惱，於是結伴同行。","py":"lù shàng tā yù jiàn lǎo gǒu 、 lǎo māo hé lǎo gōng jī ， dà jiā dōu yǒu bèi zhǔ rén pāo qì de fán nǎo ， yú shì jié bàn tóng háng 。","paragraph":0},{"zh":"晚上，牠們看見森林裏有一間亮着燈的屋子。","py":"wǎn shàng ， tā men kàn jiàn sēn lín lǐ yǒu yī jiān liàng zhe dēng de wū zi 。","paragraph":1},{"zh":"屋內坐着強盜，桌上擺滿食物。","py":"wū nèi zuò zhe qiáng dào ， zhuō shàng bǎi mǎn shí wù 。","paragraph":1},{"zh":"四個伙伴又餓又累，商量怎樣才能得到一處歇腳的地方。","py":"sì gè huǒ bàn yòu è yòu lèi ， shāng liáng zěn yàng cái néng dé dào yī chù xiē jiǎo de dì fāng 。","paragraph":1},{"zh":"驢、狗、貓和公雞疊在一起，同時大叫，還從窗戶闖進屋裏。","py":"lǘ 、 gǒu 、 māo hé gōng jī dié zài yì qǐ ， tóng shí dà jiào ， hái cóng chuāng hù chuǎng jìn wū lǐ 。","paragraph":2},{"zh":"強盜以為可怕的怪物來了，嚇得四散逃走，四個伙伴便安心吃飯。","py":"qiáng dào yǐ wéi kě pà de guài wù lái le ， xià de sì sàn táo zǒu ， sì gè huǒ bàn biàn ān xīn chī fàn 。","paragraph":2},{"zh":"強盜派人回去察看，又被貓抓、狗咬、驢踢和公雞的叫聲嚇跑。","py":"qiáng dào pài rén huí qù chá kàn ， yòu bèi māo zhuā 、 gǒu yǎo 、 lǘ tī hé gōng jī de jiào shēng xià pǎo 。","paragraph":3},{"zh":"從此沒人再來打擾。","py":"cóng cǐ méi rén zài lái dǎ rǎo 。","paragraph":3},{"zh":"牠們雖然沒有到達不來梅，卻一起找到了新家。","py":"tā men suī rán méi yǒu dào dá bù lái méi ， què yì qǐ zhǎo dào le xīn jiā 。","paragraph":3}]},{"id":"grimm-55","paragraphs":["一個磨坊主誇口說，女兒能把稻草紡成金線。國王聽見後，把姑娘關在堆滿稻草的房間，命她在天亮前完成這件不可能的事。","一個小侏儒出現，先收下姑娘的項鍊和戒指，幫她把稻草變成金子。第三次，姑娘已沒有東西可給，只好答應將來把自己的第一個孩子交給他。","姑娘後來成了王后，也有了孩子。小侏儒前來索取約定的報酬。她苦苦哀求，侏儒才給她三天：只要猜中他的名字，就可以留下孩子。","王后的信使四處打聽，終於聽見侏儒在火堆旁唱出自己的名字。王后於是說出正確答案，使他的計劃落空。她也明白，隨口許下的承諾可能帶來沉重後果。"],"questions":[{"q":"國王命姑娘把甚麼紡成金線？","options":["山羊的鐘","公主的長髮","稻草","森林裏的白雪"],"answer":2,"explanation":"磨坊主的誇口，令女兒被迫面對把稻草變成金線的難題。","id":"grimm-55:q0"},{"q":"侏儒後來給王后甚麼機會？","options":["一晚內把井水喝完","替他蓋一座高塔","三天內猜出他的名字","三天內找到金鳥"],"answer":2,"explanation":"猜出名字是王后可以留下孩子的條件。","id":"grimm-55:q1"},{"q":"信使怎樣得知侏儒的名字？","options":["向七隻小山羊借來名冊","在稻草上找到刻字","聽見他在火堆旁唱出來","從魔鏡上看見"],"answer":2,"explanation":"信使偶然聽見侏儒的歌，才把關鍵答案帶回王宮。","id":"grimm-55:q2"}],"title":"侏儒怪的名字","author":"格林兄弟","group":"grimm","sourceTitle":"55 Rumpelstiltskin (Rumpelstilzchen)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap55","lines":[{"zh":"一個磨坊主誇口說，女兒能把稻草紡成金線。","py":"yí gè mò fáng zhǔ kuā kǒu shuō ， nǚ ér néng bǎ dào cǎo fǎng chéng jīn xiàn 。","paragraph":0},{"zh":"國王聽見後，把姑娘關在堆滿稻草的房間，命她在天亮前完成這件不可能的事。","py":"guó wáng tīng jiàn hòu ， bǎ gū niang guān zài duī mǎn dào cǎo de fáng jiān ， mìng tā zài tiān liàng qián wán chéng zhè jiàn bù kě néng de shì 。","paragraph":0},{"zh":"一個小侏儒出現，先收下姑娘的項鍊和戒指，幫她把稻草變成金子。","py":"yí gè xiǎo zhū rú chū xiàn ， xiān shōu xià gū niang de xiàng liàn hé jiè zhǐ ， bāng tā bǎ dào cǎo biàn chéng jīn zi 。","paragraph":1},{"zh":"第三次，姑娘已沒有東西可給，只好答應將來把自己的第一個孩子交給他。","py":"dì sān cì ， gū niang yǐ méi yǒu dōng xī kě gěi ， zhǐ hǎo dā ying jiāng lái bǎ zì jǐ de dì yí gè hái zi jiāo gěi tā 。","paragraph":1},{"zh":"姑娘後來成了王后，也有了孩子。","py":"gū niang hòu lái chéng le wáng hòu ， yě yǒu le hái zi 。","paragraph":2},{"zh":"小侏儒前來索取約定的報酬。","py":"xiǎo zhū rú qián lái suǒ qǔ yuē dìng de bào chóu 。","paragraph":2},{"zh":"她苦苦哀求，侏儒才給她三天：只要猜中他的名字，就可以留下孩子。","py":"tā kǔ kǔ āi qiú ， zhū rú cái gěi tā sān tiān ： zhǐ yào cāi zhōng tā de míng zì ， jiù kě yǐ liú xià hái zi 。","paragraph":2},{"zh":"王后的信使四處打聽，終於聽見侏儒在火堆旁唱出自己的名字。","py":"wáng hòu de xìn shǐ sì chù dǎ tīng ， zhōng yú tīng jiàn zhū rú zài huǒ duī páng chàng chū zì jǐ de míng zì 。","paragraph":3},{"zh":"王后於是說出正確答案，使他的計劃落空。","py":"wáng hòu yú shì shuō chū zhèng què dá àn ， shǐ tā de jì huà luò kōng 。","paragraph":3},{"zh":"她也明白，隨口許下的承諾可能帶來沉重後果。","py":"tā yě míng bái ， suí kǒu xǔ xià de chéng nuò kě néng dài lái chén zhòng hòu guǒ 。","paragraph":3}]},{"id":"grimm-20","paragraphs":["一個小裁縫用手帕一下打死七隻蒼蠅。他得意地做了一條腰帶，寫上「一下打死七個」，便離開家去闖世界。","巨人看見腰帶，以為他能打敗七個人。小裁縫用乾酪假裝石頭，擠出水來，又把小鳥拋向天空，讓巨人以為他把石頭扔得看不見了。","國王後來給他難題，要他對付巨人、獨角獸和野豬。小裁縫沒有硬拼，而是設法讓敵人互相爭鬥，或利用樹木、房屋和地形脫身。","完成任務後，他得到國王承諾的婚事與土地。這個故事裏，別人常因腰帶上的幾個字誤判他的力量，小裁縫則不斷靠觀察和機智找到出路。"],"questions":[{"q":"腰帶上的「七個」原本指甚麼？","options":["七隻蒼蠅","七個巨人","七名國王","七座王宮"],"answer":0,"explanation":"最初被打死的是蒼蠅，旁人卻把這句話理解成能打敗七個人。","id":"grimm-20:q0"},{"q":"小裁縫用甚麼假裝能擠出水的石頭？","options":["鐵箍","乾酪","金球","羽毛"],"answer":1,"explanation":"他握住柔軟的乾酪擠出水，讓巨人誤以為那是一塊石頭。","id":"grimm-20:q1"},{"q":"小裁縫完成難題主要靠甚麼？","options":["命令王后替他戰鬥","觀察環境與設計方法","身體比所有巨人更大","一口氣喝乾大海"],"answer":1,"explanation":"故事多次描寫他善用誤解、物品與地形，而不是靠巨大力氣硬拼。","id":"grimm-20:q2"}],"title":"勇敢的小裁縫","author":"格林兄弟","group":"grimm","sourceTitle":"20 The Brave Little Tailor (Das tapfere Schneiderlein)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap20","lines":[{"zh":"一個小裁縫用手帕一下打死七隻蒼蠅。","py":"yí gè xiǎo cái féng yòng shǒu pà yī xià dǎ sǐ qī zhǐ cāng yíng 。","paragraph":0},{"zh":"他得意地做了一條腰帶，寫上「一下打死七個」，便離開家去闖世界。","py":"tā dé yì dì zuò le yī tiáo yāo dài ， xiě shàng 「 yī xià dǎ sǐ qī gè 」 ， biàn lí kāi jiā qù chuǎng shì jiè 。","paragraph":0},{"zh":"巨人看見腰帶，以為他能打敗七個人。","py":"jù rén kàn jiàn yāo dài ， yǐ wéi tā néng dǎ bài qī gè rén 。","paragraph":1},{"zh":"小裁縫用乾酪假裝石頭，擠出水來，又把小鳥拋向天空，讓巨人以為他把石頭扔得看不見了。","py":"xiǎo cái féng yòng gān lào jiǎ zhuāng shí tou ， jǐ chū shuǐ lái ， yòu bǎ xiǎo niǎo pāo xiàng tiān kōng ， ràng jù rén yǐ wéi tā bǎ shí tou rēng de kàn bú jiàn le 。","paragraph":1},{"zh":"國王後來給他難題，要他對付巨人、獨角獸和野豬。","py":"guó wáng hòu lái gěi tā nán tí ， yào tā duì fù jù rén 、 dú jiǎo shòu hé yě zhū 。","paragraph":2},{"zh":"小裁縫沒有硬拼，而是設法讓敵人互相爭鬥，或利用樹木、房屋和地形脫身。","py":"xiǎo cái féng méi yǒu yìng pīn ， ér shì shè fǎ ràng dí rén hù xiāng zhēng dòu ， huò lì yòng shù mù 、 fáng wū hé dì xíng tuō shēn 。","paragraph":2},{"zh":"完成任務後，他得到國王承諾的婚事與土地。","py":"wán chéng rèn wù hòu ， tā dé dào guó wáng chéng nuò de hūn shì yǔ tǔ dì 。","paragraph":3},{"zh":"這個故事裏，別人常因腰帶上的幾個字誤判他的力量，小裁縫則不斷靠觀察和機智找到出路。","py":"zhè ge gù shì lǐ ， bié rén cháng yīn yāo dài shàng de jǐ gè zì wù pàn tā de lì liàng ， xiǎo cái féng zé bù duàn kào guān chá hé jī zhì zhǎo dào chū lù 。","paragraph":3}]},{"id":"grimm-19","paragraphs":["一位漁夫捕到會說話的比目魚。魚說自己原是一位中了魔法的王子，漁夫便放牠回海裏，沒有索取報酬。","漁夫的妻子卻嫌小屋太破，叫丈夫向魚要一間好房子。願望實現後，她仍不滿足，又先後要求城堡、王位和更大的權力。","每當漁夫走到海邊，海水就變得更黑，風浪也更強。他雖然不安，仍一次又一次替妻子傳話，直到她想連太陽和月亮都聽她指揮。","最後，比目魚叫漁夫回家。眼前不再是華麗的宮殿，而是最初那間破小屋。妻子因永不知足的要求，失去了曾經得到的一切。"],"questions":[{"q":"漁夫最初為甚麼放走比目魚？","options":["國王答應替他捕魚","魚說自己是中了魔法的王子","妻子已經送來一座城堡","海裏突然沒有水"],"answer":1,"explanation":"漁夫聽懂魚的求情，並沒有先要求任何報酬。","id":"grimm-19:q0"},{"q":"隨着妻子的要求越來越大，海面有甚麼變化？","options":["一直平靜而明亮","結成一面金色鏡子","變成可以步行的道路","變得更黑，風浪更強"],"answer":3,"explanation":"海面的變化呼應妻子的貪念，也讓漁夫越來越不安。","id":"grimm-19:q1"},{"q":"漁夫夫婦最後住在哪裏？","options":["比目魚的新城堡","太陽和月亮之間","森林中的糖果屋","原先的破小屋"],"answer":3,"explanation":"結尾讓夫婦回到起點，表現不知足可能使人失去已有的東西。","id":"grimm-19:q2"}],"title":"漁夫和他的妻子","author":"格林兄弟","group":"grimm","sourceTitle":"19 The Fisherman and His Wife (Von dem Fischer un syner Fru)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap19","lines":[{"zh":"一位漁夫捕到會說話的比目魚。","py":"yī wèi yú fū bǔ dào huì shuō huà de bǐ mù yú 。","paragraph":0},{"zh":"魚說自己原是一位中了魔法的王子，漁夫便放牠回海裏，沒有索取報酬。","py":"yú shuō zì jǐ yuán shì yī wèi zhōng le mó fǎ de wáng zǐ ， yú fū biàn fàng tā huí hǎi lǐ ， méi yǒu suǒ qǔ bào chóu 。","paragraph":0},{"zh":"漁夫的妻子卻嫌小屋太破，叫丈夫向魚要一間好房子。","py":"yú fū de qī zǐ què xián xiǎo wū tài pò ， jiào zhàng fū xiàng yú yào yī jiān hǎo fáng zi 。","paragraph":1},{"zh":"願望實現後，她仍不滿足，又先後要求城堡、王位和更大的權力。","py":"yuàn wàng shí xiàn hòu ， tā réng bù mǎn zú ， yòu xiān hòu yāo qiú chéng bǎo 、 wáng wèi hé gèng dà de quán lì 。","paragraph":1},{"zh":"每當漁夫走到海邊，海水就變得更黑，風浪也更強。","py":"měi dāng yú fū zǒu dào hǎi biān ， hǎi shuǐ jiù biàn de gèng hēi ， fēng làng yě gèng qiáng 。","paragraph":2},{"zh":"他雖然不安，仍一次又一次替妻子傳話，直到她想連太陽和月亮都聽她指揮。","py":"tā suī rán bù ān ， réng yī cì yòu yī cì tì qī zǐ chuán huà ， zhí dào tā xiǎng lián tài yáng hé yuè liàng dōu tīng tā zhǐ huī 。","paragraph":2},{"zh":"最後，比目魚叫漁夫回家。","py":"zuì hòu ， bǐ mù yú jiào yú fū huí jiā 。","paragraph":3},{"zh":"眼前不再是華麗的宮殿，而是最初那間破小屋。","py":"yǎn qián bù zài shì huá lì de gōng diàn ， ér shì zuì chū nà jiān pò xiǎo wū 。","paragraph":3},{"zh":"妻子因永不知足的要求，失去了曾經得到的一切。","py":"qī zǐ yīn yǒng bù zhī zú de yāo qiú ， shī qù le céng jīng dé dào de yī qiè 。","paragraph":3}]},{"id":"grimm-24","paragraphs":["一個女孩每天在井邊紡線，雙手忙得發痛。有一天，紡錘掉進井裏，繼母卻叫她自己找回。女孩只好跳下去，醒來時發現自己來到一片明亮的草地。","路上，麵包在烤爐裏喊着快熟過頭了，她便把麵包取出；蘋果樹請她搖下成熟的果實，她也立刻幫忙。後來她來到霍勒太太家，答應替她做家事。","女孩每天認真整理床鋪。她把被子抖得羽毛飛舞時，人間便下起雪來。住了一段日子，她想念家人，霍勒太太讓她回去，並用金子獎勵她。","繼母的親生女兒也跳進井裏，想得到同樣的金子。她卻不肯幫麵包和蘋果樹，在屋裏也懶得做事。最後，她帶回的不是金子，而是一身洗不掉的瀝青。"],"questions":[{"q":"女孩在路上替蘋果樹做了甚麼？","options":["把樹搬進屋裏","搖下成熟的果實","把果子塗成金色","砍去所有樹枝"],"answer":1,"explanation":"蘋果已經成熟，需要有人幫忙採下。","id":"grimm-24:q0"},{"q":"霍勒太太的被子抖起羽毛時，人間會怎樣？","options":["漲潮","日蝕","長出金樹","下雪"],"answer":3,"explanation":"故事把飛舞的羽毛與人間的雪聯繫起來。","id":"grimm-24:q1"},{"q":"第二個女孩為甚麼沒有得到金子？","options":["她來的時候已經沒有雪","她不肯幫忙，也不認真做事","她找錯了紡錘","她把金子全送給姐姐"],"answer":1,"explanation":"同一條路上的表現不同，帶來了不同的結果。","id":"grimm-24:q2"}],"title":"霍勒太太","author":"格林兄弟","group":"grimm","sourceTitle":"24 Frau Holle (Frau Holle)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap24","lines":[{"zh":"一個女孩每天在井邊紡線，雙手忙得發痛。","py":"yí gè nǚ hái měi tiān zài jǐng biān fǎng xiàn ， shuāng shǒu máng de fā tòng 。","paragraph":0},{"zh":"有一天，紡錘掉進井裏，繼母卻叫她自己找回。","py":"yǒu yī tiān ， fǎng chuí diào jìn jǐng lǐ ， jì mǔ què jiào tā zì jǐ zhǎo huí 。","paragraph":0},{"zh":"女孩只好跳下去，醒來時發現自己來到一片明亮的草地。","py":"nǚ hái zhǐ hǎo tiào xià qù ， xǐng lái shí fā xiàn zì jǐ lái dào yī piàn míng liàng de cǎo dì 。","paragraph":0},{"zh":"路上，麵包在烤爐裏喊着快熟過頭了，她便把麵包取出；蘋果樹請她搖下成熟的果實，她也立刻幫忙。","py":"lù shàng ， miàn bāo zài kǎo lú lǐ hǎn zhe kuài shú guò tóu le ， tā biàn bǎ miàn bāo qǔ chū ； píng guǒ shù qǐng tā yáo xià chéng shú de guǒ shí ， tā yě lì kè bāng máng 。","paragraph":1},{"zh":"後來她來到霍勒太太家，答應替她做家事。","py":"hòu lái tā lái dào huò lēi tài tài jiā ， dā ying tì tā zuò jiā shì 。","paragraph":1},{"zh":"女孩每天認真整理床鋪。","py":"nǚ hái měi tiān rèn zhēn zhěng lǐ chuáng pù 。","paragraph":2},{"zh":"她把被子抖得羽毛飛舞時，人間便下起雪來。","py":"tā bǎ bèi zi dǒu de yǔ máo fēi wǔ shí ， rén jiān biàn xià qǐ xuě lái 。","paragraph":2},{"zh":"住了一段日子，她想念家人，霍勒太太讓她回去，並用金子獎勵她。","py":"zhù le yī duàn rì zi ， tā xiǎng niàn jiā rén ， huò lēi tài tài ràng tā huí qù ， bìng yòng jīn zi jiǎng lì tā 。","paragraph":2},{"zh":"繼母的親生女兒也跳進井裏，想得到同樣的金子。","py":"jì mǔ de qīn shēng nǚ ér yě tiào jìn jǐng lǐ ， xiǎng dé dào tóng yàng de jīn zi 。","paragraph":3},{"zh":"她卻不肯幫麵包和蘋果樹，在屋裏也懶得做事。","py":"tā què bù kěn bāng miàn bāo hé píng guǒ shù ， zài wū lǐ yě lǎn de zuò shì 。","paragraph":3},{"zh":"最後，她帶回的不是金子，而是一身洗不掉的瀝青。","py":"zuì hòu ， tā dài huí de bú shì jīn zi ， ér shì yī shēn xǐ bù diào de lì qīng 。","paragraph":3}]},{"id":"grimm-25","paragraphs":["一家人盼望多時，終於有了小女兒。父親叫七個兒子去打水，大家卻不小心把水罐掉進井裏。父親氣得說，希望他們都變成烏鴉，話一出口，七個男孩真的飛走了。","妹妹長大後知道這件事，決定尋回哥哥。她帶上家人的戒指，走過漫長道路，向太陽、月亮和星星打聽，終於找到哥哥們住的玻璃山。","她進入山裏，從哥哥的杯子和盤子裏各取一點食物，還把戒指放進一隻杯子。七隻烏鴉回來，發現屋內有人來過，便仔細查看。","一個哥哥找到戒指，認出那是父親母親的東西。妹妹於是走出來，兄妹相認，魔法也隨之解除。七個哥哥恢復人形，和妹妹一起踏上回家的路。"],"questions":[{"q":"七個哥哥變成烏鴉之前，做錯了甚麼？","options":["打碎了魔鏡","剪斷妹妹的頭髮","偷走王子的金球","把打水的罐子掉進井裏"],"answer":3,"explanation":"打水時失手，引出了父親生氣的話。","id":"grimm-25:q0"},{"q":"妹妹帶去的哪件物品幫助哥哥認出家人？","options":["一把金剪刀","一盞藍燈","一頂熊皮帽","家人的戒指"],"answer":3,"explanation":"哥哥在杯子裏找到戒指，才認出家人的信物。","id":"grimm-25:q1"},{"q":"七個哥哥在甚麼情況下恢復人形？","options":["與妹妹重逢相認時","喝完井裏的水時","學會飛行時","住進國王的城堡時"],"answer":0,"explanation":"妹妹找到他們並相認，故事中的魔法才解除。","id":"grimm-25:q2"}],"title":"七隻烏鴉","author":"格林兄弟","group":"grimm","sourceTitle":"25 The Seven Ravens (Die sieben Raben)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap25","lines":[{"zh":"一家人盼望多時，終於有了小女兒。","py":"yī jiā rén pàn wàng duō shí ， zhōng yú yǒu le xiǎo nǚ ér 。","paragraph":0},{"zh":"父親叫七個兒子去打水，大家卻不小心把水罐掉進井裏。","py":"fù qīn jiào qī gè ér zi qù dǎ shuǐ ， dà jiā què bù xiǎo xīn bǎ shuǐ guàn diào jìn jǐng lǐ 。","paragraph":0},{"zh":"父親氣得說，希望他們都變成烏鴉，話一出口，七個男孩真的飛走了。","py":"fù qīn qì de shuō ， xī wàng tā men dōu biàn chéng wū yā ， huà yī chū kǒu ， qī gè nán hái zhēn de fēi zǒu le 。","paragraph":0},{"zh":"妹妹長大後知道這件事，決定尋回哥哥。","py":"mèi mèi zhǎng dà hòu zhī dào zhè jiàn shì ， jué dìng xún huí gē gē 。","paragraph":1},{"zh":"她帶上家人的戒指，走過漫長道路，向太陽、月亮和星星打聽，終於找到哥哥們住的玻璃山。","py":"tā dài shàng jiā rén de jiè zhǐ ， zǒu guò màn cháng dào lù ， xiàng tài yáng 、 yuè liàng hé xīng xīng dǎ tīng ， zhōng yú zhǎo dào gē gē men zhù de bō lí shān 。","paragraph":1},{"zh":"她進入山裏，從哥哥的杯子和盤子裏各取一點食物，還把戒指放進一隻杯子。","py":"tā jìn rù shān lǐ ， cóng gē gē de bēi zi hé pán zi lǐ gè qǔ yì diǎn shí wù ， hái bǎ jiè zhǐ fàng jìn yī zhī bēi zi 。","paragraph":2},{"zh":"七隻烏鴉回來，發現屋內有人來過，便仔細查看。","py":"qī zhǐ wū yā huí lái ， fā xiàn wū nèi yǒu rén lái guò ， biàn zǐ xì chá kàn 。","paragraph":2},{"zh":"一個哥哥找到戒指，認出那是父親母親的東西。","py":"yí gè gē gē zhǎo dào jiè zhǐ ， rèn chū nà shì fù qīn mǔ qīn de dōng xī 。","paragraph":3},{"zh":"妹妹於是走出來，兄妹相認，魔法也隨之解除。","py":"mèi mèi yú shì zǒu chū lái ， xiōng mèi xiāng rèn ， mó fǎ yě suí zhī jiě chú 。","paragraph":3},{"zh":"七個哥哥恢復人形，和妹妹一起踏上回家的路。","py":"qī gè gē gē huī fù rén xíng ， hé mèi mèi yì qǐ tà shàng huí jiā de lù 。","paragraph":3}]},{"id":"grimm-17","paragraphs":["一位國王每天都獨自吃一道用蓋子遮着的菜。僕人十分好奇，偷偷掀開蓋子，發現盤裏是一條白蛇。他嚐了一小口，從此竟聽得懂動物說話。","王后的戒指遺失後，他從鴨子的談話得知戒指被吞進肚裏，幫忙找了回來。離開王宮後，他又救過魚、螞蟻和幾隻小烏鴉，沒有向牠們索取報答。","後來，他想向一位公主求婚，卻必須完成幾件幾乎不可能的任務：找回掉進水裏的戒指、撿起散在草地上的小米，還要找來生命之樹上的蘋果。","被他救過的魚、螞蟻和烏鴉分別前來幫忙。最後一個難題也解決了，公主看見他的善意與勇氣，接受了他。他原來對小生命的幫助，在需要時都回到了自己身上。"],"questions":[{"q":"僕人怎樣獲得聽懂動物說話的能力？","options":["戴上王后的戒指","在玻璃山上睡覺","嚐了一口白蛇","吃下金蘋果的種子"],"answer":2,"explanation":"這項能力來自國王盤中的白蛇。","id":"grimm-17:q0"},{"q":"哪種動物幫忙撿回草地上的小米？","options":["螞蟻","鴨子","山羊","青蛙"],"answer":0,"explanation":"螞蟻細小而數量多，幫他完成了撿米的任務。","id":"grimm-17:q1"},{"q":"動物為甚麼願意幫助這位僕人？","options":["他偷走了牠們的食物","他曾經救過牠們","他答應送出王宮","國王命令牠們服從"],"answer":1,"explanation":"幫助來自他旅途中曾經付出的善意。","id":"grimm-17:q2"}],"title":"白蛇","author":"格林兄弟","group":"grimm","sourceTitle":"17 The White Snake (Die weiße Schlange)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap17","lines":[{"zh":"一位國王每天都獨自吃一道用蓋子遮着的菜。","py":"yī wèi guó wáng měi tiān dōu dú zì chī yī dào yòng gài zi zhē zhe de cài 。","paragraph":0},{"zh":"僕人十分好奇，偷偷掀開蓋子，發現盤裏是一條白蛇。","py":"pú rén shí fēn hào qí ， tōu tōu xiān kāi gài zi ， fā xiàn pán lǐ shì yī tiáo bái shé 。","paragraph":0},{"zh":"他嚐了一小口，從此竟聽得懂動物說話。","py":"tā cháng le yī xiǎo kǒu ， cóng cǐ jìng tīng de dǒng dòng wù shuō huà 。","paragraph":0},{"zh":"王后的戒指遺失後，他從鴨子的談話得知戒指被吞進肚裏，幫忙找了回來。","py":"wáng hòu de jiè zhǐ yí shī hòu ， tā cóng yā zi de tán huà dé zhī jiè zhǐ bèi tūn jìn dù lǐ ， bāng máng zhǎo le huí lái 。","paragraph":1},{"zh":"離開王宮後，他又救過魚、螞蟻和幾隻小烏鴉，沒有向牠們索取報答。","py":"lí kāi wáng gōng hòu ， tā yòu jiù guò yú 、 mǎ yǐ hé jǐ zhī xiǎo wū yā ， méi yǒu xiàng tā men suǒ qǔ bào dá 。","paragraph":1},{"zh":"後來，他想向一位公主求婚，卻必須完成幾件幾乎不可能的任務：找回掉進水裏的戒指、撿起散在草地上的小米，","py":"hòu lái ， tā xiǎng xiàng yī wèi gōng zhǔ qiú hūn ， què bì xū wán chéng jǐ jiàn jī hū bù kě néng de rèn wù ： zhǎo huí diào jìn shuǐ lǐ de jiè zhǐ 、 jiǎn qǐ sàn zài cǎo dì shàng de xiǎo mǐ ，","paragraph":2},{"zh":"還要找來生命之樹上的蘋果。","py":"hái yào zhǎo lái shēng mìng zhī shù shàng de píng guǒ 。","paragraph":2},{"zh":"被他救過的魚、螞蟻和烏鴉分別前來幫忙。","py":"bèi tā jiù guò de yú 、 mǎ yǐ hé wū yā fēn bié qián lái bāng máng 。","paragraph":3},{"zh":"最後一個難題也解決了，公主看見他的善意與勇氣，接受了他。","py":"zuì hòu yí gè nán tí yě jiě jué le ， gōng zhǔ kàn jiàn tā de shàn yì yǔ yǒng qì ， jiē shòu le tā 。","paragraph":3},{"zh":"他原來對小生命的幫助，在需要時都回到了自己身上。","py":"tā yuán lái duì xiǎo shēng mìng de bāng zhù ， zài xū yào shí dōu huí dào le zì jǐ shēn shàng 。","paragraph":3}]},{"id":"grimm-57","paragraphs":["國王的花園有一棵金蘋果樹，果子每晚卻少一個。小王子守在樹旁，看見一隻金鳥來啄果實。他射下一根金羽毛，國王便命兒子們去尋找整隻金鳥。","兩個哥哥途中忘了任務，只有小王子繼續前行。一隻狐狸教他怎樣找到金鳥、金馬和公主，也提醒他不要被華麗的籠子與馬鞍吸引。","小王子幾次沒有照做，遇上困難，狐狸仍幫他補救。回程時，哥哥們又把他推進井裏，想把所有功勞據為己有。狐狸再次把他救起。","金鳥、金馬和公主在哥哥們身邊都不快樂。小王子回來後，真相才被揭開。狐狸也終於解除身上的魔法，恢復原來的身份，大家不再被謊言蒙蔽。"],"questions":[{"q":"小王子最初在金蘋果樹旁看見甚麼？","options":["替國王修鞋的狐狸","沉睡在井裏的公主","會紡金線的鴨子","來偷啄果實的金鳥"],"answer":3,"explanation":"金鳥偷啄金蘋果，引出了尋鳥的旅程。","id":"grimm-57:q0"},{"q":"一路反覆幫小王子脫困的是誰？","options":["女巫的鄰居","狐狸","兩個哥哥","魔鏡"],"answer":1,"explanation":"狐狸提供提醒，也在小王子遇險後再次救他。","id":"grimm-57:q1"},{"q":"哥哥們把小王子推進井裏，主要想做甚麼？","options":["替狐狸解除魔法","讓金鳥學會游泳","搶走功勞","幫他找井水"],"answer":2,"explanation":"他們想帶着成果回去，假裝任務由自己完成。","id":"grimm-57:q2"}],"title":"金鳥","author":"格林兄弟","group":"grimm","sourceTitle":"57 The Golden Bird (Der goldene Vogel)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap57","lines":[{"zh":"國王的花園有一棵金蘋果樹，果子每晚卻少一個。","py":"guó wáng de huā yuán yǒu yī kē jīn píng guǒ shù ， guǒ zi měi wǎn què shǎo yí gè 。","paragraph":0},{"zh":"小王子守在樹旁，看見一隻金鳥來啄果實。","py":"xiǎo wáng zǐ shǒu zài shù páng ， kàn jiàn yī zhī jīn niǎo lái zhuó guǒ shí 。","paragraph":0},{"zh":"他射下一根金羽毛，國王便命兒子們去尋找整隻金鳥。","py":"tā shè xià yī gēn jīn yǔ máo ， guó wáng biàn mìng ér zi men qù xún zhǎo zhěng zhǐ jīn niǎo 。","paragraph":0},{"zh":"兩個哥哥途中忘了任務，只有小王子繼續前行。","py":"liǎng gè gē gē tú zhōng wàng le rèn wù ， zhǐ yǒu xiǎo wáng zǐ jì xù qián xíng 。","paragraph":1},{"zh":"一隻狐狸教他怎樣找到金鳥、金馬和公主，也提醒他不要被華麗的籠子與馬鞍吸引。","py":"yī zhī hú lí jiāo tā zěn yàng zhǎo dào jīn niǎo 、 jīn mǎ hé gōng zhǔ ， yě tí xǐng tā bú yào bèi huá lì de lóng zi yǔ mǎ ān xī yǐn 。","paragraph":1},{"zh":"小王子幾次沒有照做，遇上困難，狐狸仍幫他補救。","py":"xiǎo wáng zǐ jǐ cì méi yǒu zhào zuò ， yù shàng kùn nán ， hú lí réng bāng tā bǔ jiù 。","paragraph":2},{"zh":"回程時，哥哥們又把他推進井裏，想把所有功勞據為己有。","py":"huí chéng shí ， gē gē men yòu bǎ tā tuī jìn jǐng lǐ ， xiǎng bǎ suǒ yǒu gōng láo jù wéi jǐ yǒu 。","paragraph":2},{"zh":"狐狸再次把他救起。","py":"hú lí zài cì bǎ tā jiù qǐ 。","paragraph":2},{"zh":"金鳥、金馬和公主在哥哥們身邊都不快樂。","py":"jīn niǎo 、 jīn mǎ hé gōng zhǔ zài gē gē men shēn biān dōu bù kuài lè 。","paragraph":3},{"zh":"小王子回來後，真相才被揭開。","py":"xiǎo wáng zǐ huí lái hòu ， zhēn xiàng cái bèi jiē kāi 。","paragraph":3},{"zh":"狐狸也終於解除身上的魔法，恢復原來的身份，大家不再被謊言蒙蔽。","py":"hú lí yě zhōng yú jiě chú shēn shàng de mó fǎ ， huī fù yuán lái de shēn fèn ， dà jiā bù zài bèi huǎng yán méng bì 。","paragraph":3}]},{"id":"grimm-62","paragraphs":["三個兄弟出門闖世界。兩個哥哥看不起最小的弟弟，常笑他反應慢。途中，弟弟卻阻止他們破壞蟻窩、傷害鴨子，也不許他們放火燒蜂巢。","兄弟們來到一座中了魔法的城堡。要解除魔法，必須找齊森林裏的一千顆珍珠、從湖底取回鑰匙，還要從三位外貌相同的公主中認出最年輕的一位。","兩個哥哥先去嘗試，都因失敗而變成石頭。輪到弟弟時，螞蟻替他找珍珠，鴨子替他取鑰匙，蜂王則飛到吃過蜂蜜的公主嘴邊。","弟弟因此找到了正確的人，城堡裏的魔法也一同解除。哥哥們重新變成人，才知道自己看不起的弟弟，原來擁有最願意保護弱小的心。"],"questions":[{"q":"弟弟不許哥哥們放火燒甚麼？","options":["蜂巢","王宮","大鐘","金鳥的籠子"],"answer":0,"explanation":"他先前保護了蜜蜂，後來也得到蜜蜂幫助。","id":"grimm-62:q0"},{"q":"湖底的鑰匙由誰幫忙取回？","options":["螞蟻","蜂王","石頭士兵","鴨子"],"answer":3,"explanation":"鴨子會游水，所以能替弟弟找回湖底的鑰匙。","id":"grimm-62:q1"},{"q":"蜂王怎樣幫弟弟認出公主？","options":["在窗外敲三下鐘","飛到吃過蜂蜜的公主嘴邊","替公主換上金冠","把三人都變成石頭"],"answer":1,"explanation":"蜂王循着蜂蜜的氣味，指出最年輕的公主。","id":"grimm-62:q2"}],"title":"蜂王","author":"格林兄弟","group":"grimm","sourceTitle":"62 The Queen Bee (Die Bienenkönigin)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap62","lines":[{"zh":"三個兄弟出門闖世界。","py":"sān gè xiōng dì chū mén chuǎng shì jiè 。","paragraph":0},{"zh":"兩個哥哥看不起最小的弟弟，常笑他反應慢。","py":"liǎng gè gē gē kàn bù qǐ zuì xiǎo de dì di ， cháng xiào tā fǎn yìng màn 。","paragraph":0},{"zh":"途中，弟弟卻阻止他們破壞蟻窩、傷害鴨子，也不許他們放火燒蜂巢。","py":"tú zhōng ， dì di què zǔ zhǐ tā men pò huài yǐ wō 、 shāng hài yā zi ， yě bù xǔ tā men fàng huǒ shāo fēng cháo 。","paragraph":0},{"zh":"兄弟們來到一座中了魔法的城堡。","py":"xiōng dì men lái dào yī zuò zhōng le mó fǎ de chéng bǎo 。","paragraph":1},{"zh":"要解除魔法，必須找齊森林裏的一千顆珍珠、從湖底取回鑰匙，還要從三位外貌相同的公主中認出最年輕的一位。","py":"yào jiě chú mó fǎ ， bì xū zhǎo qí sēn lín lǐ de yī qiān kē zhēn zhū 、 cóng hú dǐ qǔ huí yào shi ， hái yào cóng sān wèi wài mào xiàng tóng de gōng zhǔ zhōng rèn chū zuì nián qīng de yī wèi 。","paragraph":1},{"zh":"兩個哥哥先去嘗試，都因失敗而變成石頭。","py":"liǎng gè gē gē xiān qù cháng shì ， dōu yīn shī bài ér biàn chéng shí tou 。","paragraph":2},{"zh":"輪到弟弟時，螞蟻替他找珍珠，鴨子替他取鑰匙，蜂王則飛到吃過蜂蜜的公主嘴邊。","py":"lún dào dì di shí ， mǎ yǐ tì tā zhǎo zhēn zhū ， yā zi tì tā qǔ yào shi ， fēng wáng zé fēi dào chī guò fēng mì de gōng zhǔ zuǐ biān 。","paragraph":2},{"zh":"弟弟因此找到了正確的人，城堡裏的魔法也一同解除。","py":"dì di yīn cǐ zhǎo dào le zhèng què de rén ， chéng bǎo lǐ de mó fǎ yě yī tóng jiě chú 。","paragraph":3},{"zh":"哥哥們重新變成人，才知道自己看不起的弟弟，原來擁有最願意保護弱小的心。","py":"gē gē men chóng xīn biàn chéng rén ， cái zhī dào zì jǐ kàn bù qǐ de dì di ， yuán lái yōng yǒu zuì yuàn yì bǎo hù ruò xiǎo de xīn 。","paragraph":3}]},{"id":"grimm-63","paragraphs":["一位年老的國王想決定由哪個兒子繼承王位。他吹起三根羽毛，叫三人沿着羽毛飄去的方向，分別找來最好的地毯、戒指和新娘。","兩個哥哥走向遠方，最小的弟弟卻因羽毛落在附近而留了下來。他在地上發現一扇門，往下走，遇見一隻願意幫忙的大蟾蜍。","哥哥們以為事情容易，隨便找些東西交差。弟弟每次都認真求助，帶回精美的地毯和戒指。到最後，蟾蜍還幫他完成迎接新娘的難題。","哥哥們不肯服氣，又提出新的比試。弟弟和新娘仍然完成了考驗。國王終於明白，不能只憑平日的印象判斷一個人，便把王位交給最小的兒子。"],"questions":[{"q":"國王用甚麼決定兒子們尋物的方向？","options":["三根羽毛","三塊金子","三隻蝴蝶","三道城門"],"answer":0,"explanation":"羽毛飄落的方向，決定了每個兒子的路線。","id":"grimm-63:q0"},{"q":"最小的王子在哪裏找到幫手？","options":["太陽上的花園","皇后的鏡子中","地下門後的大蟾蜍身邊","哥哥的馬車裏"],"answer":2,"explanation":"落在附近的羽毛，讓他發現地下的入口。","id":"grimm-63:q1"},{"q":"兩個哥哥起初為甚麼找得很隨便？","options":["他們根本沒有收到任務","羽毛被風吹進大海","他們輕視任務，也看不起弟弟","國王禁止他們走遠"],"answer":2,"explanation":"自以為一定勝過弟弟，使哥哥們沒有認真準備。","id":"grimm-63:q2"}],"title":"三根羽毛","author":"格林兄弟","group":"grimm","sourceTitle":"63 The Three Feathers (Die drei Federn)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap63","lines":[{"zh":"一位年老的國王想決定由哪個兒子繼承王位。","py":"yī wèi nián lǎo de guó wáng xiǎng jué dìng yóu nǎ ge ér zi jì chéng wáng wèi 。","paragraph":0},{"zh":"他吹起三根羽毛，叫三人沿着羽毛飄去的方向，分別找來最好的地毯、戒指和新娘。","py":"tā chuī qǐ sān gēn yǔ máo ， jiào sān rén yán zhe yǔ máo piāo qù de fāng xiàng ， fēn bié zhǎo lái zuì hǎo de dì tǎn 、 jiè zhǐ hé xīn niáng 。","paragraph":0},{"zh":"兩個哥哥走向遠方，最小的弟弟卻因羽毛落在附近而留了下來。","py":"liǎng gè gē gē zǒu xiàng yuǎn fāng ， zuì xiǎo de dì di què yīn yǔ máo luò zài fù jìn ér liú le xià lái 。","paragraph":1},{"zh":"他在地上發現一扇門，往下走，遇見一隻願意幫忙的大蟾蜍。","py":"tā zài dì shàng fā xiàn yī shàn mén ， wǎng xià zǒu ， yù jiàn yī zhī yuàn yì bāng máng de dà chán chú 。","paragraph":1},{"zh":"哥哥們以為事情容易，隨便找些東西交差。","py":"gē gē men yǐ wéi shì qíng róng yì ， suí biàn zhǎo xiē dōng xī jiāo chāi 。","paragraph":2},{"zh":"弟弟每次都認真求助，帶回精美的地毯和戒指。","py":"dì di měi cì dōu rèn zhēn qiú zhù ， dài huí jīng měi de dì tǎn hé jiè zhǐ 。","paragraph":2},{"zh":"到最後，蟾蜍還幫他完成迎接新娘的難題。","py":"dào zuì hòu ， chán chú hái bāng tā wán chéng yíng jiē xīn niáng de nán tí 。","paragraph":2},{"zh":"哥哥們不肯服氣，又提出新的比試。","py":"gē gē men bù kěn fú qì ， yòu tí chū xīn de bǐ shì 。","paragraph":3},{"zh":"弟弟和新娘仍然完成了考驗。","py":"dì di hé xīn niáng réng rán wán chéng le kǎo yàn 。","paragraph":3},{"zh":"國王終於明白，不能只憑平日的印象判斷一個人，便把王位交給最小的兒子。","py":"guó wáng zhōng yú míng bái ， bù néng zhǐ píng píng rì de yìn xiàng pàn duàn yí gè rén ， biàn bǎ wáng wèi jiāo gěi zuì xiǎo de ér zi 。","paragraph":3}]},{"id":"grimm-64","paragraphs":["一個常被哥哥們取笑的年輕人，帶着簡單的食物進森林。他遇見一位飢餓的老人，願意分一半給他，老人便指點他找到一隻羽毛金燦燦的鵝。","旅店裏的姑娘想偷偷拔走金羽毛，手卻黏在鵝身上。後來想拉開她的人，也一個接一個黏住，形成一條古怪的長隊。","年輕人帶着長隊經過城裏，讓從不開口笑的公主終於笑了出來。國王原來承諾，能使公主發笑的人可以娶她，這時卻又提出幾個難題。","曾被年輕人幫助的老人再次出現，替他找來能吃、能喝的幫手和一艘能行走的船。最後，國王履行承諾，這個常被看輕的年輕人終於得到公平的對待。"],"questions":[{"q":"老人為甚麼先幫助年輕人？","options":["他答應送出公主","他願意分享食物","他擁有最多金幣","他的哥哥是國王"],"answer":1,"explanation":"年輕人的慷慨，換來老人的指點。","id":"grimm-64:q0"},{"q":"旅店姑娘碰到金鵝後發生甚麼事？","options":["忘了自己的名字","得到一整座森林","手黏在鵝身上","立刻變成國王"],"answer":2,"explanation":"想偷拔羽毛的人，被魔法黏住了。","id":"grimm-64:q1"},{"q":"甚麼情景讓公主笑了？","options":["國王把羽毛吹上天","老人住進金色鳥籠","哥哥把地毯放進井裏","一長串黏在一起的人經過"],"answer":3,"explanation":"那條古怪的長隊，是公主發笑的直接原因。","id":"grimm-64:q2"}],"title":"金鵝","author":"格林兄弟","group":"grimm","sourceTitle":"64 The Golden Goose (Die goldene Gans)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap64","lines":[{"zh":"一個常被哥哥們取笑的年輕人，帶着簡單的食物進森林。","py":"yí gè cháng bèi gē gē men qǔ xiào de nián qīng rén ， dài zhe jiǎn dān de shí wù jìn sēn lín 。","paragraph":0},{"zh":"他遇見一位飢餓的老人，願意分一半給他，老人便指點他找到一隻羽毛金燦燦的鵝。","py":"tā yù jiàn yī wèi jī è de lǎo rén ， yuàn yì fēn yí bàn gěi tā ， lǎo rén biàn zhǐ diǎn tā zhǎo dào yī zhī yǔ máo jīn càn càn de é 。","paragraph":0},{"zh":"旅店裏的姑娘想偷偷拔走金羽毛，手卻黏在鵝身上。","py":"lǚ diàn lǐ de gū niang xiǎng tōu tōu bá zǒu jīn yǔ máo ， shǒu què nián zài é shēn shàng 。","paragraph":1},{"zh":"後來想拉開她的人，也一個接一個黏住，形成一條古怪的長隊。","py":"hòu lái xiǎng lā kāi tā de rén ， yě yí gè jiē yí gè nián zhù ， xíng chéng yī tiáo gǔ guài de cháng duì 。","paragraph":1},{"zh":"年輕人帶着長隊經過城裏，讓從不開口笑的公主終於笑了出來。","py":"nián qīng rén dài zhe cháng duì jīng guò chéng lǐ ， ràng cóng bù kāi kǒu xiào de gōng zhǔ zhōng yú xiào le chū lái 。","paragraph":2},{"zh":"國王原來承諾，能使公主發笑的人可以娶她，這時卻又提出幾個難題。","py":"guó wáng yuán lái chéng nuò ， néng shǐ gōng zhǔ fā xiào de rén kě yǐ qǔ tā ， zhè shí què yòu tí chū jǐ gè nán tí 。","paragraph":2},{"zh":"曾被年輕人幫助的老人再次出現，替他找來能吃、能喝的幫手和一艘能行走的船。","py":"céng bèi nián qīng rén bāng zhù de lǎo rén zài cì chū xiàn ， tì tā zhǎo lái néng chī 、 néng hē de bāng shǒu hé yī sōu néng xíng zǒu de chuán 。","paragraph":3},{"zh":"最後，國王履行承諾，這個常被看輕的年輕人終於得到公平的對待。","py":"zuì hòu ， guó wáng lǚ xíng chéng nuò ， zhè ge cháng bèi kàn qīng de nián qīng rén zhōng yú dé dào gōng píng de duì dài 。","paragraph":3}]},{"id":"grimm-89","paragraphs":["一位公主帶着母親的祝福和一匹會說話的馬出嫁。路上，侍女逼她交換衣服，還要她發誓不能說出真相。到了王宮，侍女冒充新娘，真正的公主卻被派去牧鵝。","公主每天帶着鵝群到野外，仍然保持整潔與禮貌。她失去的馬雖然已不能陪伴她，牠留下的說話，卻讓旁人察覺這位姑娘的身份不尋常。","老國王開始留意她，問她受過甚麼委屈。公主因誓言不能直接回答，便對着一座鐵爐訴說。國王在旁聽見了完整經過。","真相終於大白，公主恢復身份，假新娘也受到懲罰。故事讓人看見，沉默與粗布衣服不能抹去一個人的身份，細小的線索也可能幫助真相出現。"],"questions":[{"q":"公主為甚麼到了王宮後去牧鵝？","options":["她把自己的王冠送給馬","侍女冒充了她的新娘身份","她原本只想當牧羊人","國王不知道鵝會飛"],"answer":1,"explanation":"侍女在路上逼她交換身份，使她失去原來的位置。","id":"grimm-89:q0"},{"q":"公主最後對甚麼訴說遭遇？","options":["金鳥","豌豆","紡錘","鐵爐"],"answer":3,"explanation":"她不能直接對人說，便把心事告訴鐵爐。","id":"grimm-89:q1"},{"q":"老國王怎樣知道完整的真相？","options":["在玻璃山上找到戒指","聽侍女主動承認全部事情","在旁聽見公主向鐵爐訴說","向金鵝索取羽毛"],"answer":2,"explanation":"公主的訴說使國王終於了解交換身份的經過。","id":"grimm-89:q2"}],"title":"牧鵝姑娘","author":"格林兄弟","group":"grimm","sourceTitle":"89 The Goose-Girl (Die Gänsemagd)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap89","lines":[{"zh":"一位公主帶着母親的祝福和一匹會說話的馬出嫁。","py":"yī wèi gōng zhǔ dài zhe mǔ qīn de zhù fú hé yì pǐ huì shuō huà de mǎ chū jià 。","paragraph":0},{"zh":"路上，侍女逼她交換衣服，還要她發誓不能說出真相。","py":"lù shàng ， shì nǚ bī tā jiāo huàn yī fú ， hái yào tā fā shì bù néng shuō chū zhēn xiàng 。","paragraph":0},{"zh":"到了王宮，侍女冒充新娘，真正的公主卻被派去牧鵝。","py":"dào le wáng gōng ， shì nǚ mào chōng xīn niáng ， zhēn zhèng de gōng zhǔ què bèi pài qù mù é 。","paragraph":0},{"zh":"公主每天帶着鵝群到野外，仍然保持整潔與禮貌。","py":"gōng zhǔ měi tiān dài zhe é qún dào yě wài ， réng rán bǎo chí zhěng jié yǔ lǐ mào 。","paragraph":1},{"zh":"她失去的馬雖然已不能陪伴她，牠留下的說話，卻讓旁人察覺這位姑娘的身份不尋常。","py":"tā shī qù de mǎ suī rán yǐ bù néng péi bàn tā ， tā liú xià de shuō huà ， què ràng páng rén chá jué zhè wèi gū niang de shēn fèn bù xún cháng 。","paragraph":1},{"zh":"老國王開始留意她，問她受過甚麼委屈。","py":"lǎo guó wáng kāi shǐ liú yì tā ， wèn tā shòu guò shén me wěi qū 。","paragraph":2},{"zh":"公主因誓言不能直接回答，便對着一座鐵爐訴說。","py":"gōng zhǔ yīn shì yán bù néng zhí jiē huí dá ， biàn duì zhe yī zuò tiě lú sù shuō 。","paragraph":2},{"zh":"國王在旁聽見了完整經過。","py":"guó wáng zài páng tīng jiàn le wán zhěng jīng guò 。","paragraph":2},{"zh":"真相終於大白，公主恢復身份，假新娘也受到懲罰。","py":"zhēn xiàng zhōng yú dà bái ， gōng zhǔ huī fù shēn fèn ， jiǎ xīn niáng yě shòu dào chéng fá 。","paragraph":3},{"zh":"故事讓人看見，沉默與粗布衣服不能抹去一個人的身份，細小的線索也可能幫助真相出現。","py":"gù shì ràng rén kàn jiàn ， chén mò yǔ cū bù yī fú bù néng mǒ qù yí gè rén de shēn fèn ， xì xiǎo de xiàn suǒ yě kě néng bāng zhù zhēn xiàng chū xiàn 。","paragraph":3}]},{"id":"grimm-97","paragraphs":["老國王病重，三個兒子聽說生命之水能救他，便先後出發尋找。兩個哥哥自以為本領高，不肯好好回答小矮人的問題，因此被困在山谷裏。","最小的王子禮貌地向小矮人求助，得到進入魔法城堡的方法。他在時限之前找到泉水，離開時也沒有忘記幫助別人，還請小矮人放出哥哥們。","可是哥哥們妒忌弟弟，在船上偷偷換掉他的水。老國王喝到假的水，誤以為弟弟想害他；哥哥們卻拿着真正的生命之水，冒領了救父的功勞。","後來，王子一路幫助過的國家送來謝禮，城堡中的公主也證明他的作為。老國王終於知道真相，願意重新接納這位善良而勇敢的小兒子。"],"questions":[{"q":"最小的王子怎樣得到小矮人的幫助？","options":["先送走所有泉水","嘲笑小矮人的身高","命哥哥替自己回答","有禮貌地回答並求助"],"answer":3,"explanation":"哥哥的傲慢使他們受困，弟弟的禮貌則換來指點。","id":"grimm-97:q0"},{"q":"哥哥們在回程中做了甚麼？","options":["把小矮人帶回當國王","將弟弟的馬車塗成金色","偷偷換掉弟弟的生命之水","把王宮變成玻璃山"],"answer":2,"explanation":"換水使老國王誤會弟弟，也讓哥哥們冒領功勞。","id":"grimm-97:q1"},{"q":"甚麼幫助老國王看清小兒子的為人？","options":["受過幫助的人送來謝禮與證明","魔鏡宣布自己說謊","井裏浮出一張地圖","哥哥們突然學會飛行"],"answer":0,"explanation":"王子曾經付出的善意，後來成了證明真相的線索。","id":"grimm-97:q2"}],"title":"生命之水","author":"格林兄弟","group":"grimm","sourceTitle":"97 The Water of Life (Das Wasser des Lebens)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap97","lines":[{"zh":"老國王病重，三個兒子聽說生命之水能救他，便先後出發尋找。","py":"lǎo guó wáng bìng zhòng ， sān gè ér zi tīng shuō shēng mìng zhī shuǐ néng jiù tā ， biàn xiān hòu chū fā xún zhǎo 。","paragraph":0},{"zh":"兩個哥哥自以為本領高，不肯好好回答小矮人的問題，因此被困在山谷裏。","py":"liǎng gè gē gē zì yǐ wéi běn lǐng gāo ， bù kěn hǎo hǎo huí dá xiǎo ǎi rén de wèn tí ， yīn cǐ bèi kùn zài shān gǔ lǐ 。","paragraph":0},{"zh":"最小的王子禮貌地向小矮人求助，得到進入魔法城堡的方法。","py":"zuì xiǎo de wáng zǐ lǐ mào dì xiàng xiǎo ǎi rén qiú zhù ， dé dào jìn rù mó fǎ chéng bǎo de fāng fǎ 。","paragraph":1},{"zh":"他在時限之前找到泉水，離開時也沒有忘記幫助別人，還請小矮人放出哥哥們。","py":"tā zài shí xiàn zhī qián zhǎo dào quán shuǐ ， lí kāi shí yě méi yǒu wàng jì bāng zhù bié rén ， hái qǐng xiǎo ǎi rén fàng chū gē gē men 。","paragraph":1},{"zh":"可是哥哥們妒忌弟弟，在船上偷偷換掉他的水。","py":"kě shì gē gē men dù jì dì di ， zài chuán shàng tōu tōu huàn diào tā de shuǐ 。","paragraph":2},{"zh":"老國王喝到假的水，誤以為弟弟想害他；哥哥們卻拿着真正的生命之水，冒領了救父的功勞。","py":"lǎo guó wáng hē dào jiǎ de shuǐ ， wù yǐ wéi dì di xiǎng hài tā ； gē gē men què ná zhe zhēn zhèng de shēng mìng zhī shuǐ ， mào lǐng le jiù fù de gōng láo 。","paragraph":2},{"zh":"後來，王子一路幫助過的國家送來謝禮，城堡中的公主也證明他的作為。","py":"hòu lái ， wáng zǐ yī lù bāng zhù guò de guó jiā sòng lái xiè lǐ ， chéng bǎo zhōng de gōng zhǔ yě zhèng míng tā de zuò wéi 。","paragraph":3},{"zh":"老國王終於知道真相，願意重新接納這位善良而勇敢的小兒子。","py":"lǎo guó wáng zhōng yú zhī dào zhēn xiàng ， yuàn yì chóng xīn jiē nà zhè wèi shàn liáng ér yǒng gǎn de xiǎo ér zi 。","paragraph":3}]},{"id":"grimm-103","paragraphs":["一個貧窮的小女孩在森林裏遇見老人，得到一個小鍋。只要說出煮粥的口令，小鍋就會煮出香甜的粥；再說停止的口令，鍋便安靜下來。","有了小鍋，女孩和母親不再挨餓。有一天女孩出門，母親想吃粥，便讓小鍋開始煮，吃飽後才發現自己忘了怎樣叫它停下。","粥越煮越多，先流過爐子，再湧出屋門，最後沿着街道流遍整個村子。母親急得團團轉，卻怎樣也想不起正確的口令。","女孩回來後，立刻說出停止的話，小鍋終於停下。村民要通過滿是粥的街道，只好一路吃出通道。母女也記住，使用神奇的工具之前，必須知道怎樣控制它。"],"questions":[{"q":"小鍋怎樣開始煮粥？","options":["喝下井裏的水","聽見指定的口令","看見一枚金戒指","等到月亮出來"],"answer":1,"explanation":"小鍋依照女孩學會的口令工作。","id":"grimm-103:q0"},{"q":"母親為甚麼讓粥流遍村子？","options":["女孩叫她不要關火","忘了停止煮粥的口令","想替所有屋子換顏色","故意把粥倒進井裏"],"answer":1,"explanation":"問題不在粥不好，而在她不知道怎樣停止小鍋。","id":"grimm-103:q1"},{"q":"最後是誰讓小鍋停下來？","options":["國王的馬","回家的小女孩","七個小矮人","村口的商人"],"answer":1,"explanation":"女孩知道完整的使用方法，回來後立刻叫小鍋停止。","id":"grimm-103:q2"}],"title":"甜粥","author":"格林兄弟","group":"grimm","sourceTitle":"103 Sweet Porridge (Der süße Brei)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap103","lines":[{"zh":"一個貧窮的小女孩在森林裏遇見老人，得到一個小鍋。","py":"yí gè pín qióng de xiǎo nǚ hái zài sēn lín lǐ yù jiàn lǎo rén ， dé dào yí gè xiǎo guō 。","paragraph":0},{"zh":"只要說出煮粥的口令，小鍋就會煮出香甜的粥；再說停止的口令，鍋便安靜下來。","py":"zhǐ yào shuō chū zhǔ zhōu de kǒu lìng ， xiǎo guō jiù huì zhǔ chū xiāng tián de zhōu ； zài shuō tíng zhǐ de kǒu lìng ， guō biàn ān jìng xià lái 。","paragraph":0},{"zh":"有了小鍋，女孩和母親不再挨餓。","py":"yǒu le xiǎo guō ， nǚ hái hé mǔ qīn bù zài ái è 。","paragraph":1},{"zh":"有一天女孩出門，母親想吃粥，便讓小鍋開始煮，吃飽後才發現自己忘了怎樣叫它停下。","py":"yǒu yī tiān nǚ hái chū mén ， mǔ qīn xiǎng chī zhōu ， biàn ràng xiǎo guō kāi shǐ zhǔ ， chī bǎo hòu cái fā xiàn zì jǐ wàng le zěn yàng jiào tā tíng xià 。","paragraph":1},{"zh":"粥越煮越多，先流過爐子，再湧出屋門，最後沿着街道流遍整個村子。","py":"zhōu yuè zhǔ yuè duō ， xiān liú guò lú zi ， zài yǒng chū wū mén ， zuì hòu yán zhe jiē dào liú biàn zhěng gè cūn zi 。","paragraph":2},{"zh":"母親急得團團轉，卻怎樣也想不起正確的口令。","py":"mǔ qīn jí de tuán tuán zhuàn ， què zěn yàng yě xiǎng bù qǐ zhèng què de kǒu lìng 。","paragraph":2},{"zh":"女孩回來後，立刻說出停止的話，小鍋終於停下。","py":"nǚ hái huí lái hòu ， lì kè shuō chū tíng zhǐ de huà ， xiǎo guō zhōng yú tíng xià 。","paragraph":3},{"zh":"村民要通過滿是粥的街道，只好一路吃出通道。","py":"cūn mín yào tōng guò mǎn shì zhōu de jiē dào ， zhǐ hǎo yī lù chī chū tōng dào 。","paragraph":3},{"zh":"母女也記住，使用神奇的工具之前，必須知道怎樣控制它。","py":"mǔ nǚ yě jì zhù ， shǐ yòng shén qí de gōng jù zhī qián ， bì xū zhī dào zěn yàng kòng zhì tā 。","paragraph":3}]},{"id":"grimm-39","paragraphs":["一位鞋匠十分貧窮，最後只剩下一塊能做一雙鞋的皮革。他把皮革裁好，準備第二天再縫，沒想到早上起來時，桌上已放着一雙精美的鞋。","客人很喜歡那雙鞋，付的錢讓鞋匠能再買皮革。此後，每晚裁好的材料，到了早上都變成漂亮的成品。鞋匠的生活慢慢好轉，卻不知道是誰在幫忙。","他和妻子躲起來察看，才發現兩個小精靈在深夜工作。牠們身上沒有合適的衣服，夫妻便決定縫製小衣裳和鞋子，放在桌上答謝牠們。","小精靈看見禮物，高興得又唱又跳，穿好後便離開了。牠們沒有再來，但鞋匠已能憑自己的手藝好好生活，也一直記得那份悄悄而來的幫助。"],"questions":[{"q":"鞋匠最初怎樣發現有人幫忙？","options":["裁好的皮革早上變成了鞋","店門突然變成金色","客人送來一面魔鏡","所有針線都消失了"],"answer":0,"explanation":"他沒有在夜裏縫鞋，桌上卻出現了成品。","id":"grimm-39:q0"},{"q":"夫妻送小精靈甚麼禮物？","options":["一座玻璃城堡","合身的小衣裳和鞋子","一把能飛的雨傘","七枚金蘋果"],"answer":1,"explanation":"他們看見小精靈缺乏衣物，便親手準備禮物。","id":"grimm-39:q1"},{"q":"小精靈離開後，鞋匠的生活怎樣？","options":["再也不願做鞋","改去海邊捕金魚","把店鋪交給強盜","仍能靠手藝好好生活"],"answer":3,"explanation":"先前得到的幫助已讓他重新站穩腳步。","id":"grimm-39:q2"}],"title":"小精靈和鞋匠","author":"格林兄弟","group":"grimm","sourceTitle":"39 The Elves (Die Wichtelmänner)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap39","lines":[{"zh":"一位鞋匠十分貧窮，最後只剩下一塊能做一雙鞋的皮革。","py":"yī wèi xié jiàng shí fēn pín qióng ， zuì hòu zhǐ shèng xià yī kuài néng zuò yī shuāng xié de pí gé 。","paragraph":0},{"zh":"他把皮革裁好，準備第二天再縫，沒想到早上起來時，桌上已放着一雙精美的鞋。","py":"tā bǎ pí gé cái hǎo ， zhǔn bèi dì èr tiān zài féng ， méi xiǎng dào zǎo shàng qǐ lái shí ， zhuō shàng yǐ fàng zhe yī shuāng jīng měi de xié 。","paragraph":0},{"zh":"客人很喜歡那雙鞋，付的錢讓鞋匠能再買皮革。","py":"kè rén hěn xǐ huān nà shuāng xié ， fù de qián ràng xié jiàng néng zài mǎi pí gé 。","paragraph":1},{"zh":"此後，每晚裁好的材料，到了早上都變成漂亮的成品。","py":"cǐ hòu ， měi wǎn cái hǎo de cái liào ， dào le zǎo shàng dōu biàn chéng piào liàng de chéng pǐn 。","paragraph":1},{"zh":"鞋匠的生活慢慢好轉，卻不知道是誰在幫忙。","py":"xié jiàng de shēng huó màn màn hǎo zhuǎn ， què bù zhī dào shì shuí zài bāng máng 。","paragraph":1},{"zh":"他和妻子躲起來察看，才發現兩個小精靈在深夜工作。","py":"tā hé qī zǐ duǒ qǐ lái chá kàn ， cái fā xiàn liǎng gè xiǎo jīng líng zài shēn yè gōng zuò 。","paragraph":2},{"zh":"牠們身上沒有合適的衣服，夫妻便決定縫製小衣裳和鞋子，放在桌上答謝牠們。","py":"tā men shēn shàng méi yǒu hé shì de yī fú ， fū qī biàn jué dìng féng zhì xiǎo yī shang hé xié zi ， fàng zài zhuō shàng dá xiè tā men 。","paragraph":2},{"zh":"小精靈看見禮物，高興得又唱又跳，穿好後便離開了。","py":"xiǎo jīng líng kàn jiàn lǐ wù ， gāo xìng de yòu chàng yòu tiào ， chuān hǎo hòu biàn lí kāi le 。","paragraph":3},{"zh":"牠們沒有再來，但鞋匠已能憑自己的手藝好好生活，也一直記得那份悄悄而來的幫助。","py":"tā men méi yǒu zài lái ， dàn xié jiàng yǐ néng píng zì jǐ de shǒu yì hǎo hǎo shēng huó ， yě yì zhí jì de nà fèn qiāo qiāo ér lái de bāng zhù 。","paragraph":3}]},{"id":"grimm-37","paragraphs":["一對夫婦有個只有拇指般大的兒子，大家叫他大拇指湯姆。他雖然身形小，想法卻靈活，還能坐在馬耳朵裏，指引馬匹把車拉到森林。","兩個陌生人看見這件事，想把他買走。湯姆偷偷告訴父親，自己一定會找路回來。離開後，他利用小小的身體鑽進洞穴，從陌生人手上逃脫。","回家的路並不容易。他先後被牛和狼吞進肚裏，卻沒有放棄。他在牛肚裏大聲說話，後來又哄狼去父母家找食物。","父母認出兒子的聲音，終於把他救出來。湯姆見過外面的危險後，更珍惜自己的家；父母也發現，孩子的勇氣與智慧並不由身材大小決定。"],"questions":[{"q":"湯姆怎樣指引馬匹前進？","options":["把馬變成小鳥","拿金球敲車輪","站在王宮屋頂大喊","坐在馬耳朵裏說話"],"answer":3,"explanation":"他的小身體讓他能坐進馬耳朵，近距離指路。","id":"grimm-37:q0"},{"q":"湯姆被陌生人帶走後怎樣逃脫？","options":["向國王借來大船","把陌生人變成石頭","請金鵝帶走他們","利用小身體鑽進洞穴"],"answer":3,"explanation":"他善用小巧的身體，找到陌生人進不去的地方。","id":"grimm-37:q1"},{"q":"父母最後怎樣知道湯姆回來了？","options":["認出了他的聲音","發現門口有玻璃鞋","收到女巫寄來的信","看見空中有三根羽毛"],"answer":0,"explanation":"湯姆的叫聲，讓父母知道孩子就在附近。","id":"grimm-37:q2"}],"title":"大拇指湯姆","author":"格林兄弟","group":"grimm","sourceTitle":"37 Thumbling (Daumesdick)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap37","lines":[{"zh":"一對夫婦有個只有拇指般大的兒子，大家叫他大拇指湯姆。","py":"yī duì fū fù yǒu gè zhǐ yǒu mǔ zhǐ bān dà de ér zi ， dà jiā jiào tā dà mǔ zhǐ tāng mǔ 。","paragraph":0},{"zh":"他雖然身形小，想法卻靈活，還能坐在馬耳朵裏，指引馬匹把車拉到森林。","py":"tā suī rán shēn xíng xiǎo ， xiǎng fǎ què líng huó ， hái néng zuò zài mǎ ěr duǒ lǐ ， zhǐ yǐn mǎ pǐ bǎ chē lā dào sēn lín 。","paragraph":0},{"zh":"兩個陌生人看見這件事，想把他買走。","py":"liǎng gè mò shēng rén kàn jiàn zhè jiàn shì ， xiǎng bǎ tā mǎi zǒu 。","paragraph":1},{"zh":"湯姆偷偷告訴父親，自己一定會找路回來。","py":"tāng mǔ tōu tōu gào sù fù qīn ， zì jǐ yí dìng huì zhǎo lù huí lái 。","paragraph":1},{"zh":"離開後，他利用小小的身體鑽進洞穴，從陌生人手上逃脫。","py":"lí kāi hòu ， tā lì yòng xiǎo xiǎo de shēn tǐ zuān jìn dòng xué ， cóng mò shēng rén shǒu shàng táo tuō 。","paragraph":1},{"zh":"回家的路並不容易。","py":"huí jiā de lù bìng bù róng yì 。","paragraph":2},{"zh":"他先後被牛和狼吞進肚裏，卻沒有放棄。","py":"tā xiān hòu bèi niú hé láng tūn jìn dù lǐ ， què méi yǒu fàng qì 。","paragraph":2},{"zh":"他在牛肚裏大聲說話，後來又哄狼去父母家找食物。","py":"tā zài niú dù lǐ dà shēng shuō huà ， hòu lái yòu hǒng láng qù fù mǔ jiā zhǎo shí wù 。","paragraph":2},{"zh":"父母認出兒子的聲音，終於把他救出來。","py":"fù mǔ rèn chū ér zi de shēng yīn ， zhōng yú bǎ tā jiù chū lái 。","paragraph":3},{"zh":"湯姆見過外面的危險後，更珍惜自己的家；父母也發現，孩子的勇氣與智慧並不由身材大小決定。","py":"tāng mǔ jiàn guò wài miàn de wēi xiǎn hòu ， gèng zhēn xī zì jǐ de jiā ； fù mǔ yě fā xiàn ， hái zi de yǒng qì yǔ zhì huì bìng bù yóu shēn cái dà xiǎo jué dìng 。","paragraph":3}]},{"id":"grimm-36","paragraphs":["一個裁縫的三個兒子先後離家學藝。他們勤奮工作，分別得到神奇的獎勵：會自己擺出食物的小桌子、能帶來金子的驢，還有裝着木棒的袋子。","大兒子帶着小桌子回家，二兒子也牽着金驢上路。兩人途中住進同一家旅店，店主看見寶物，趁他們睡覺時偷偷換成普通的桌子和驢。","最小的弟弟知道哥哥受騙，便帶着自己的袋子也住進旅店。店主想再偷寶物時，他叫出袋中的木棒，讓貪心的店主吃了苦頭。","店主只好把偷走的寶物交還。三個兄弟帶着真正的桌子、金驢和木棒回家，與父親團聚，也明白不能只因別人笑臉迎人，就完全失去戒心。"],"questions":[{"q":"小桌子有甚麼特別本領？","options":["讓人聽懂鳥語","自己擺出食物","變成一條大河","替人紡成金線"],"answer":1,"explanation":"大兒子的獎勵是一張能提供食物的桌子。","id":"grimm-36:q0"},{"q":"旅店店主怎樣欺騙兩個哥哥？","options":["請蜜蜂趕走他們","趁睡覺時換走寶物","把他們送上高塔","假裝自己是王子"],"answer":1,"explanation":"寶物回家後失效，是因為早已被掉包。","id":"grimm-36:q1"},{"q":"最小的弟弟靠甚麼取回寶物？","options":["一把銀色梳子","六片天鵝羽毛","會從袋中出來的木棒","王后的鏡子"],"answer":2,"explanation":"木棒使店主不能再假裝不知道，才交還偷來的東西。","id":"grimm-36:q2"}],"title":"小桌子、金驢和木棒","author":"格林兄弟","group":"grimm","sourceTitle":"36 The Wishing-table, the Gold-ass, and the Cudgel in the Sack (Tischchendeckdich, Goldesel und Knüppel aus dem Sack)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap36","lines":[{"zh":"一個裁縫的三個兒子先後離家學藝。","py":"yí gè cái féng de sān gè ér zi xiān hòu lí jiā xué yì 。","paragraph":0},{"zh":"他們勤奮工作，分別得到神奇的獎勵：會自己擺出食物的小桌子、能帶來金子的驢，還有裝着木棒的袋子。","py":"tā men qín fèn gōng zuò ， fēn bié dé dào shén qí de jiǎng lì ： huì zì jǐ bǎi chū shí wù de xiǎo zhuō zi 、 néng dài lái jīn zi de lǘ ， hái yǒu zhuāng zhe mù bàng de dài zi 。","paragraph":0},{"zh":"大兒子帶着小桌子回家，二兒子也牽着金驢上路。","py":"dà ér zi dài zhe xiǎo zhuō zi huí jiā ， èr ér zi yě qiān zhe jīn lǘ shàng lù 。","paragraph":1},{"zh":"兩人途中住進同一家旅店，店主看見寶物，趁他們睡覺時偷偷換成普通的桌子和驢。","py":"liǎng rén tú zhōng zhù jìn tóng yī jiā lǚ diàn ， diàn zhǔ kàn jiàn bǎo wù ， chèn tā men shuì jiào shí tōu tōu huàn chéng pǔ tōng de zhuō zi hé lǘ 。","paragraph":1},{"zh":"最小的弟弟知道哥哥受騙，便帶着自己的袋子也住進旅店。","py":"zuì xiǎo de dì di zhī dào gē gē shòu piàn ， biàn dài zhe zì jǐ de dài zi yě zhù jìn lǚ diàn 。","paragraph":2},{"zh":"店主想再偷寶物時，他叫出袋中的木棒，讓貪心的店主吃了苦頭。","py":"diàn zhǔ xiǎng zài tōu bǎo wù shí ， tā jiào chū dài zhōng de mù bàng ， ràng tān xīn de diàn zhǔ chī le kǔ tóu 。","paragraph":2},{"zh":"店主只好把偷走的寶物交還。","py":"diàn zhǔ zhǐ hǎo bǎ tōu zǒu de bǎo wù jiāo huán 。","paragraph":3},{"zh":"三個兄弟帶着真正的桌子、金驢和木棒回家，與父親團聚，也明白不能只因別人笑臉迎人，就完全失去戒心。","py":"sān gè xiōng dì dài zhe zhēn zhèng de zhuō zi 、 jīn lǘ hé mù bàng huí jiā ， yǔ fù qīn tuán jù ， yě míng bái bù néng zhǐ yīn bié rén xiào liǎn yíng rén ， jiù wán quán shī qù jiè xīn 。","paragraph":3}]},{"id":"grimm-83","paragraphs":["漢斯替主人工作多年，得到一大塊金子作報酬。他背着金子回家，覺得又重又累，便和騎士交換成一匹馬，心想這下終於輕鬆了。","可是馬不聽使喚，他又把馬換成牛。後來，牛換成豬，豬換成鵝；每次遇到新的困難，漢斯都相信下一樣東西會更適合自己。","最後，他用鵝換來磨刀石，打算靠磨刀賺錢。走到井旁休息時，石頭卻掉進水裏，再也撈不回來。漢斯身上已沒有任何報酬。","他沒有哭，反而覺得自己終於不用再背重物，開開心心地跑回母親身邊。故事留下兩種看法：漢斯的交換未必明智，但他的快樂也不是由財物多少決定。"],"questions":[{"q":"漢斯最初得到甚麼報酬？","options":["一匹金馬","一個打火匣","一大塊金子","一座旅店"],"answer":2,"explanation":"他工作多年，最初拿到的是金子。","id":"grimm-83:q0"},{"q":"漢斯第一次交換的原因是甚麼？","options":["國王禁止他帶金子","想把金子送給狼","發現金子是假貨","覺得金子太重"],"answer":3,"explanation":"沉重的金子使他疲累，便換成可以騎的馬。","id":"grimm-83:q1"},{"q":"磨刀石掉進井裏後，漢斯有甚麼反應？","options":["要求井替自己工作","覺得卸下重擔，開心回家","立刻變成石像","把母親的屋子賣掉"],"answer":1,"explanation":"他把失去石頭理解成終於不用再負重，仍然保持快樂。","id":"grimm-83:q2"}],"title":"幸運的漢斯","author":"格林兄弟","group":"grimm","sourceTitle":"83 Hans in Luck (Hans im Glück)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap83","lines":[{"zh":"漢斯替主人工作多年，得到一大塊金子作報酬。","py":"hàn sī tì zhǔ rén gōng zuò duō nián ， dé dào yī dà kuài jīn zi zuò bào chóu 。","paragraph":0},{"zh":"他背着金子回家，覺得又重又累，便和騎士交換成一匹馬，心想這下終於輕鬆了。","py":"tā bēi zhe jīn zi huí jiā ， jué de yòu zhòng yòu lèi ， biàn hé qí shì jiāo huàn chéng yì pǐ mǎ ， xīn xiǎng zhè xià zhōng yú qīng sōng le 。","paragraph":0},{"zh":"可是馬不聽使喚，他又把馬換成牛。","py":"kě shì mǎ bù tīng shǐ huàn ， tā yòu bǎ mǎ huàn chéng niú 。","paragraph":1},{"zh":"後來，牛換成豬，豬換成鵝；每次遇到新的困難，漢斯都相信下一樣東西會更適合自己。","py":"hòu lái ， niú huàn chéng zhū ， zhū huàn chéng é ； měi cì yù dào xīn de kùn nán ， hàn sī dōu xiāng xìn xià yī yàng dōng xī huì gèng shì hé zì jǐ 。","paragraph":1},{"zh":"最後，他用鵝換來磨刀石，打算靠磨刀賺錢。","py":"zuì hòu ， tā yòng é huàn lái mó dāo shí ， dǎ suàn kào mó dāo zhuàn qián 。","paragraph":2},{"zh":"走到井旁休息時，石頭卻掉進水裏，再也撈不回來。","py":"zǒu dào jǐng páng xiū xī shí ， shí tou què diào jìn shuǐ lǐ ， zài yě lāo bù huí lái 。","paragraph":2},{"zh":"漢斯身上已沒有任何報酬。","py":"hàn sī shēn shàng yǐ méi yǒu rèn hé bào chóu 。","paragraph":2},{"zh":"他沒有哭，反而覺得自己終於不用再背重物，開開心心地跑回母親身邊。","py":"tā méi yǒu kū ， fǎn ér jué de zì jǐ zhōng yú bù yòng zài bēi zhòng wù ， kāi kāi xīn xīn dì pǎo huí mǔ qīn shēn biān 。","paragraph":3},{"zh":"故事留下兩種看法：漢斯的交換未必明智，但他的快樂也不是由財物多少決定。","py":"gù shì liú xià liǎng zhǒng kàn fǎ ： hàn sī de jiāo huàn wèi bì míng zhì ， dàn tā de kuài lè yě bú shì yóu cái wù duō shǎo jué dìng 。","paragraph":3}]},{"id":"grimm-78","paragraphs":["一位老祖父年紀大了，雙手常常發抖。吃飯時，他會把湯灑到桌上，還不小心打破了碗。兒子和媳婦嫌他麻煩，便讓他獨自坐到角落吃飯。","他們不再給祖父好碗，只拿一個木碗給他。老人望着家人吃飯，心裏很難過，卻沒有多說甚麼。","有一天，小孫子坐在地上，認真把幾塊木片拼在一起。父親問他在做甚麼，他回答：等你們老了，我要用這個木槽盛飯給你們吃。","父母聽完，終於看見自己的做法會教給孩子甚麼。他們把祖父請回餐桌，一家人重新坐在一起，也不再因他動作緩慢而責備他。"],"questions":[{"q":"祖父吃飯容易出狀況，主要是因為甚麼？","options":["聽不見森林的聲音","年老後雙手發抖","故意和家人作對","想把碗換成金子"],"answer":1,"explanation":"故事先交代身體的衰老，而不是老人故意添亂。","id":"grimm-78:q0"},{"q":"小孫子用木片做東西，打算將來給誰用？","options":["王宮的裁縫","森林中的狐狸","年老後的父母","井裏的青蛙"],"answer":2,"explanation":"孩子說，等父母老了便用木槽給他們盛飯。","id":"grimm-78:q1"},{"q":"父母後來改變了甚麼？","options":["叫祖父離開村子","只讓孩子用木碗","把所有桌子搬進井裏","讓祖父重新和家人同桌吃飯"],"answer":3,"explanation":"孩子的話使他們反省，恢復了對祖父的尊重。","id":"grimm-78:q2"}],"title":"老祖父和小孫子","author":"格林兄弟","group":"grimm","sourceTitle":"78 The Old Man and His Grandson (Der alte Großvater und der Enkel)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap78","lines":[{"zh":"一位老祖父年紀大了，雙手常常發抖。","py":"yī wèi lǎo zǔ fù nián jì dà le ， shuāng shǒu cháng cháng fā dǒu 。","paragraph":0},{"zh":"吃飯時，他會把湯灑到桌上，還不小心打破了碗。","py":"chī fàn shí ， tā huì bǎ tāng sǎ dào zhuō shàng ， hái bù xiǎo xīn dǎ pò le wǎn 。","paragraph":0},{"zh":"兒子和媳婦嫌他麻煩，便讓他獨自坐到角落吃飯。","py":"ér zi hé xí fù xián tā má fán ， biàn ràng tā dú zì zuò dào jiǎo luò chī fàn 。","paragraph":0},{"zh":"他們不再給祖父好碗，只拿一個木碗給他。","py":"tā men bù zài gěi zǔ fù hǎo wǎn ， zhǐ ná yí gè mù wǎn gěi tā 。","paragraph":1},{"zh":"老人望着家人吃飯，心裏很難過，卻沒有多說甚麼。","py":"lǎo rén wàng zhe jiā rén chī fàn ， xīn lǐ hěn nán guò ， què méi yǒu duō shuō shén me 。","paragraph":1},{"zh":"有一天，小孫子坐在地上，認真把幾塊木片拼在一起。","py":"yǒu yī tiān ， xiǎo sūn zi zuò zài dì shàng ， rèn zhēn bǎ jǐ kuài mù piàn pīn zài yì qǐ 。","paragraph":2},{"zh":"父親問他在做甚麼，他回答：等你們老了，我要用這個木槽盛飯給你們吃。","py":"fù qīn wèn tā zài zuò shén me ， tā huí dá ： děng nǐ men lǎo le ， wǒ yào yòng zhè ge mù cáo chéng fàn gěi nǐ men chī 。","paragraph":2},{"zh":"父母聽完，終於看見自己的做法會教給孩子甚麼。","py":"fù mǔ tīng wán ， zhōng yú kàn jiàn zì jǐ de zuò fǎ huì jiāo gěi hái zi shén me 。","paragraph":3},{"zh":"他們把祖父請回餐桌，一家人重新坐在一起，也不再因他動作緩慢而責備他。","py":"tā men bǎ zǔ fù qǐng huí cān zhuō ， yī jiā rén chóng xīn zuò zài yì qǐ ， yě bù zài yīn tā dòng zuò huǎn màn ér zé bèi tā 。","paragraph":3}]},{"id":"grimm-13","paragraphs":["一個姑娘在寒冷的冬天，被繼母逼着穿紙衣去森林找草莓。她又冷又餓，遇見三個小矮人，仍願意分出自己的麵包，並替他們掃去門前積雪。","小矮人因此祝福她，還指點她在雪下找到草莓。姑娘回家後，說話時會落下金幣；繼母看見，立刻叫自己的女兒也走同一條路。","可是第二個姑娘不肯分享食物，也拒絕幫忙。她得到的結果與姐姐完全相反。後來，善良的姑娘嫁給國王，繼母仍想害她，讓親生女兒取代她的位置。","姑娘雖然再次遇險，仍得到回到孩子身邊的機會。國王察覺異常，查出交換身份的真相，讓真正的王后回到家中，壞人的計劃也終於失敗。"],"questions":[{"q":"第一個姑娘在雪地裏分享了甚麼？","options":["一瓶生命之水","三根金頭髮","自己的麵包","國王的王冠"],"answer":2,"explanation":"她雖然自己也很飢餓，仍願意分享食物。","id":"grimm-13:q0"},{"q":"三個小矮人為甚麼幫助她？","options":["她有禮貌，也願意幫忙","她帶了最多金子","繼母已經付了錢","她答應替他們當國王"],"answer":0,"explanation":"分享與掃雪的行動，使小矮人看見她的善意。","id":"grimm-13:q1"},{"q":"故事後段，繼母主要想做甚麼？","options":["把森林改成麥田","替國王尋找金鳥","讓小矮人住進玻璃山","讓親生女兒取代真正的王后"],"answer":3,"explanation":"她不滿足於得到財物，還想交換兩個姑娘的身份。","id":"grimm-13:q2"}],"title":"森林裏的三個小矮人","author":"格林兄弟","group":"grimm","sourceTitle":"13 The Three Little Men in the Forest (Die drei Männlein im Walde)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap13","lines":[{"zh":"一個姑娘在寒冷的冬天，被繼母逼着穿紙衣去森林找草莓。","py":"yí gè gū niang zài hán lěng de dōng tiān ， bèi jì mǔ bī zhe chuān zhǐ yī qù sēn lín zhǎo cǎo méi 。","paragraph":0},{"zh":"她又冷又餓，遇見三個小矮人，仍願意分出自己的麵包，並替他們掃去門前積雪。","py":"tā yòu lěng yòu è ， yù jiàn sān gè xiǎo ǎi rén ， réng yuàn yì fēn chū zì jǐ de miàn bāo ， bìng tì tā men sǎo qù mén qián jī xuě 。","paragraph":0},{"zh":"小矮人因此祝福她，還指點她在雪下找到草莓。","py":"xiǎo ǎi rén yīn cǐ zhù fú tā ， hái zhǐ diǎn tā zài xuě xià zhǎo dào cǎo méi 。","paragraph":1},{"zh":"姑娘回家後，說話時會落下金幣；繼母看見，立刻叫自己的女兒也走同一條路。","py":"gū niang huí jiā hòu ， shuō huà shí huì là xià jīn bì ； jì mǔ kàn jiàn ， lì kè jiào zì jǐ de nǚ ér yě zǒu tóng yī tiáo lù 。","paragraph":1},{"zh":"可是第二個姑娘不肯分享食物，也拒絕幫忙。","py":"kě shì dì èr gè gū niang bù kěn fēn xiǎng shí wù ， yě jù jué bāng máng 。","paragraph":2},{"zh":"她得到的結果與姐姐完全相反。","py":"tā dé dào de jié guǒ yǔ jiě jiě wán quán xiāng fǎn 。","paragraph":2},{"zh":"後來，善良的姑娘嫁給國王，繼母仍想害她，讓親生女兒取代她的位置。","py":"hòu lái ， shàn liáng de gū niang jià gěi guó wáng ， jì mǔ réng xiǎng hài tā ， ràng qīn shēng nǚ ér qǔ dài tā de wèi zhì 。","paragraph":2},{"zh":"姑娘雖然再次遇險，仍得到回到孩子身邊的機會。","py":"gū niang suī rán zài cì yù xiǎn ， réng dé dào huí dào hái zi shēn biān de jī huì 。","paragraph":3},{"zh":"國王察覺異常，查出交換身份的真相，讓真正的王后回到家中，壞人的計劃也終於失敗。","py":"guó wáng chá jué yì cháng ， chá chū jiāo huàn shēn fèn de zhēn xiàng ， ràng zhēn zhèng de wáng hòu huí dào jiā zhōng ， huài rén de jì huà yě zhōng yú shī bài 。","paragraph":3}]},{"id":"grimm-14","paragraphs":["一個姑娘不擅長紡紗，母親卻向王后誇口，說她整天只想紡線。王后把姑娘接到宮裏，給她幾間堆滿亞麻的屋子，還說完成後就可以嫁給王子。","姑娘望着那些材料，不知道怎樣才做得完。三位模樣特別的紡紗女在窗下經過，答應替她工作，條件是姑娘將來要請她們參加婚禮，並承認她們是親戚。","材料很快被紡成線，姑娘也遵守約定，熱情地接待三位客人。王子好奇她們的外貌，才知道那些變化都與長年不停地紡紗有關。","王子不希望新娘也變成那樣，便表示她以後不必再紡紗。姑娘既沒有忘記幫過自己的人，也終於擺脫了一開始根本不適合自己的重擔。"],"questions":[{"q":"王后為甚麼認為姑娘很會紡紗？","options":["從魔鏡得到答案","聽信了母親的誇口","親眼見她完成三間屋子","收到三位紡紗女的證書"],"answer":1,"explanation":"母親的說法，讓王后誤以為她非常擅長紡紗。","id":"grimm-14:q0"},{"q":"三位紡紗女要求姑娘怎樣報答？","options":["請她們參加婚禮並認作親戚","把王子變成一隻鳥","交出所有金蘋果","搬進沒有窗的高塔"],"answer":0,"explanation":"她們要的不是金子，而是在婚禮中受到接納。","id":"grimm-14:q1"},{"q":"王子後來為甚麼不讓姑娘再紡紗？","options":["姑娘忘了自己的名字","怕長年紡紗影響她的身體","王宮突然失去所有亞麻","紡紗女偷走了全部工具"],"answer":1,"explanation":"聽完三位客人的解釋，他不想妻子也受同樣的勞損。","id":"grimm-14:q2"}],"title":"三個紡紗女","author":"格林兄弟","group":"grimm","sourceTitle":"14 The Three Spinning Women (Die drei Spinnerinnen)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap14","lines":[{"zh":"一個姑娘不擅長紡紗，母親卻向王后誇口，說她整天只想紡線。","py":"yí gè gū niang bù shàn cháng fǎng shā ， mǔ qīn què xiàng wáng hòu kuā kǒu ， shuō tā zhěng tiān zhǐ xiǎng fǎng xiàn 。","paragraph":0},{"zh":"王后把姑娘接到宮裏，給她幾間堆滿亞麻的屋子，還說完成後就可以嫁給王子。","py":"wáng hòu bǎ gū niang jiē dào gōng lǐ ， gěi tā jǐ jiān duī mǎn yà má de wū zi ， hái shuō wán chéng hòu jiù kě yǐ jià gěi wáng zǐ 。","paragraph":0},{"zh":"姑娘望着那些材料，不知道怎樣才做得完。","py":"gū niang wàng zhe nà xiē cái liào ， bù zhī dào zěn yàng cái zuò de wán 。","paragraph":1},{"zh":"三位模樣特別的紡紗女在窗下經過，答應替她工作，條件是姑娘將來要請她們參加婚禮，並承認她們是親戚。","py":"sān wèi mú yàng tè bié de fǎng shā nǚ zài chuāng xià jīng guò ， dā ying tì tā gōng zuò ， tiáo jiàn shì gū niang jiāng lái yào qǐng tā men cān jiā hūn lǐ ， bìng chéng rèn tā men shì qīn qī 。","paragraph":1},{"zh":"材料很快被紡成線，姑娘也遵守約定，熱情地接待三位客人。","py":"cái liào hěn kuài bèi fǎng chéng xiàn ， gū niang yě zūn shǒu yuē dìng ， rè qíng dì jiē dài sān wèi kè rén 。","paragraph":2},{"zh":"王子好奇她們的外貌，才知道那些變化都與長年不停地紡紗有關。","py":"wáng zǐ hào qí tā men de wài mào ， cái zhī dào nà xiē biàn huà dōu yǔ cháng nián bù tíng dì fǎng shā yǒu guān 。","paragraph":2},{"zh":"王子不希望新娘也變成那樣，便表示她以後不必再紡紗。","py":"wáng zǐ bù xī wàng xīn niáng yě biàn chéng nà yàng ， biàn biǎo shì tā yǐ hòu bù bì zài fǎng shā 。","paragraph":3},{"zh":"姑娘既沒有忘記幫過自己的人，也終於擺脫了一開始根本不適合自己的重擔。","py":"gū niang jì méi yǒu wàng jì bāng guò zì jǐ de rén ， yě zhōng yú bǎi tuō le yī kāi shǐ gēn běn bú shì hé zì jǐ de zhòng dàn 。","paragraph":3}]},{"id":"grimm-11","paragraphs":["小弟弟和小姐姐離開被繼母欺負的家，一起走進森林。弟弟很渴，姐姐卻聽見泉水警告，喝下去會變成動物。弟弟忍了兩次，最後仍喝了第三道泉水，變成一隻小鹿。","姐姐沒有拋下他，帶他住進林中的小屋。國王打獵時發現這對特別的姐弟，聽見他們的遭遇後，把姐姐接回王宮，也讓小鹿得到照顧。","繼母知道姐姐成了王后，又設計讓自己的女兒冒充她。真正的王后遇害後，仍回到孩子和小鹿身邊，直到國王認出她，才有機會解除魔法。","真相揭開後，姐姐恢復原來的生活，弟弟也不再被困在鹿的身體裏。兩人經過許多波折，始終沒有放棄彼此，終於重新以姐弟的身份相聚。"],"questions":[{"q":"弟弟為甚麼變成小鹿？","options":["穿上繼母的外衣","碰到國王的金球","把麵包送給小矮人","喝下受到魔法影響的泉水"],"answer":3,"explanation":"姐姐先聽見警告，但弟弟最後仍因口渴喝了泉水。","id":"grimm-11:q0"},{"q":"弟弟變成小鹿後，姐姐怎樣對待他？","options":["命獵人把他帶走","帶着他一起生活","把他留在井底","假裝不認識他"],"answer":1,"explanation":"姐姐始終照顧弟弟，沒有因他的外形改變而離開。","id":"grimm-11:q1"},{"q":"繼母想讓誰冒充王后？","options":["國王的妹妹","自己的女兒","森林裏的白蛇","一位紡紗女"],"answer":1,"explanation":"她打算利用女兒取代姐姐在王宮的位置。","id":"grimm-11:q2"}],"title":"小弟弟和小姐姐","author":"格林兄弟","group":"grimm","sourceTitle":"11 Little Brother and Little Sister (Brüderchen und Schwesterchen)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap11","lines":[{"zh":"小弟弟和小姐姐離開被繼母欺負的家，一起走進森林。","py":"xiǎo dì dì hé xiǎo jiě jiě lí kāi bèi jì mǔ qī fù de jiā ， yì qǐ zǒu jìn sēn lín 。","paragraph":0},{"zh":"弟弟很渴，姐姐卻聽見泉水警告，喝下去會變成動物。","py":"dì di hěn kě ， jiě jiě què tīng jiàn quán shuǐ jǐng gào ， hē xià qù huì biàn chéng dòng wù 。","paragraph":0},{"zh":"弟弟忍了兩次，最後仍喝了第三道泉水，變成一隻小鹿。","py":"dì di rěn le liǎng cì ， zuì hòu réng hē le dì sān dào quán shuǐ ， biàn chéng yī zhī xiǎo lù 。","paragraph":0},{"zh":"姐姐沒有拋下他，帶他住進林中的小屋。","py":"jiě jiě méi yǒu pāo xià tā ， dài tā zhù jìn lín zhōng de xiǎo wū 。","paragraph":1},{"zh":"國王打獵時發現這對特別的姐弟，聽見他們的遭遇後，把姐姐接回王宮，也讓小鹿得到照顧。","py":"guó wáng dǎ liè shí fā xiàn zhè duì tè bié de jiě dì ， tīng jiàn tā men de zāo yù hòu ， bǎ jiě jiě jiē huí wáng gōng ， yě ràng xiǎo lù dé dào zhào gù 。","paragraph":1},{"zh":"繼母知道姐姐成了王后，又設計讓自己的女兒冒充她。","py":"jì mǔ zhī dào jiě jiě chéng le wáng hòu ， yòu shè jì ràng zì jǐ de nǚ ér mào chōng tā 。","paragraph":2},{"zh":"真正的王后遇害後，仍回到孩子和小鹿身邊，直到國王認出她，才有機會解除魔法。","py":"zhēn zhèng de wáng hòu yù hài hòu ， réng huí dào hái zi hé xiǎo lù shēn biān ， zhí dào guó wáng rèn chū tā ， cái yǒu jī huì jiě chú mó fǎ 。","paragraph":2},{"zh":"真相揭開後，姐姐恢復原來的生活，弟弟也不再被困在鹿的身體裏。","py":"zhēn xiàng jiē kāi hòu ， jiě jiě huī fù yuán lái de shēng huó ， dì di yě bù zài bèi kùn zài lù de shēn tǐ lǐ 。","paragraph":3},{"zh":"兩人經過許多波折，始終沒有放棄彼此，終於重新以姐弟的身份相聚。","py":"liǎng rén jīng guò xǔ duō bō zhé ， shǐ zhōng méi yǒu fàng qì bǐ cǐ ， zhōng yú chóng xīn yǐ jiě dì de shēn fèn xiāng jù 。","paragraph":3}]},{"id":"grimm-9","paragraphs":["一位國王決定，如果新生孩子是女孩，就要犧牲原來的十二個兒子。王后非常難過，偷偷叫兒子們躲進森林，也用旗子的顏色傳遞消息。","妹妹出生後，哥哥們一直留在林中。她長大得知家中有十二個哥哥，便帶着他們的小衣服出發，終於找到哥哥們住的屋子，兄妹重新團聚。","可是她不小心摘下十二朵花，哥哥們便變成十二隻烏鴉。為了救他們，她必須連續七年不說話，也不能笑，即使受委屈也不能解釋。","一位年輕國王娶了她，卻有人把她的沉默當成罪過。到了最危急的時刻，七年期滿，哥哥們恢復人形趕來救她，妹妹終於能說出一切。"],"questions":[{"q":"十二個哥哥起初為甚麼躲進森林？","options":["他們打算尋找金蘋果","他們不喜歡穿新衣","女巫把王宮變成石頭","母親想保護他們免受國王傷害"],"answer":3,"explanation":"王后知道國王的決定後，提前安排兒子們避難。","id":"grimm-9:q0"},{"q":"妹妹做了甚麼，讓哥哥們變成烏鴉？","options":["丟掉家人的戒指","喝光三道泉水","把旗子染成黑色","摘下十二朵花"],"answer":3,"explanation":"那些花與哥哥們的命運相連，摘下後便觸動了魔法。","id":"grimm-9:q1"},{"q":"妹妹要救回哥哥，必須完成甚麼考驗？","options":["一夜紡完所有金線","把十二座山搬走","找齊一千枚玻璃鞋","七年不說話也不笑"],"answer":3,"explanation":"她承受沉默帶來的誤會，直到七年期滿才解除魔法。","id":"grimm-9:q2"}],"title":"十二個兄弟","author":"格林兄弟","group":"grimm","sourceTitle":"9 The Twelve Brothers (Die zwölf Brüder)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap09","lines":[{"zh":"一位國王決定，如果新生孩子是女孩，就要犧牲原來的十二個兒子。","py":"yī wèi guó wáng jué dìng ， rú guǒ xīn shēng hái zi shì nǚ hái ， jiù yào xī shēng yuán lái de shí èr gè ér zi 。","paragraph":0},{"zh":"王后非常難過，偷偷叫兒子們躲進森林，也用旗子的顏色傳遞消息。","py":"wáng hòu fēi cháng nán guò ， tōu tōu jiào ér zi men duǒ jìn sēn lín ， yě yòng qí zi de yán sè chuán dì xiāo xī 。","paragraph":0},{"zh":"妹妹出生後，哥哥們一直留在林中。","py":"mèi mèi chū shēng hòu ， gē gē men yì zhí liú zài lín zhōng 。","paragraph":1},{"zh":"她長大得知家中有十二個哥哥，便帶着他們的小衣服出發，終於找到哥哥們住的屋子，兄妹重新團聚。","py":"tā zhǎng dà dé zhī jiā zhōng yǒu shí èr gè gē gē ， biàn dài zhe tā men de xiǎo yī fú chū fā ， zhōng yú zhǎo dào gē gē men zhù de wū zi ， xiōng mèi chóng xīn tuán jù 。","paragraph":1},{"zh":"可是她不小心摘下十二朵花，哥哥們便變成十二隻烏鴉。","py":"kě shì tā bù xiǎo xīn zhāi xià shí èr duǒ huā ， gē gē men biàn biàn chéng shí èr zhǐ wū yā 。","paragraph":2},{"zh":"為了救他們，她必須連續七年不說話，也不能笑，即使受委屈也不能解釋。","py":"wèi le jiù tā men ， tā bì xū lián xù qī nián bù shuō huà ， yě bù néng xiào ， jí shǐ shòu wěi qū yě raph":1},{"zh":"國王以為他別有用心，準備懲罰他。","py":"guó wáng yǐ wéi tā bié yǒu yòng xīn ， zhǔn bèi chéng fá tā 。","paragraph":2},{"zh":"約翰只好說出烏鴉的警告，解釋所有行動，話一說完卻變成石像，國王這才知道自己錯怪了忠臣。","py":"yuē hàn zhǐ hǎo shuō chū wū yā de jǐng gào ， jiě shì suǒ yǒu xíng dòng ， huà yī shuō wán què biàn chéng shí xiàng ， guó wáng zhè cái zhī dào zì jǐ cuò guài le zhōng chén 。","paragraph":2},{"zh":"往後的日子，國王始終記着約翰的犧牲。","py":"wǎng hòu de rì zi ， guó wáng shǐ zhōng jì zhe yuē hàn de xī shēng 。","paragraph":3},{"zh":"當新的考驗來到，他也願意付出代價救回約翰。","py":"dāng xīn de kǎo yàn lái dào ， tā yě yuàn yì fù chū dài jià jiù huí yuē hàn 。","paragraph":3},{"zh":"最後，忠誠的僕人重新恢復生命，誤會不再把他們分開。","py":"zuì hòu ， zhōng chéng de pú rén chóng xīn huī fù shēng mìng ， wù huì bù zài bǎ tā men fēn kāi 。","paragraph":3}]},{"id":"grimm-4","paragraphs":["一個年輕人總聽別人說害怕得發抖，自己卻不明白那是甚麼感覺。他離開家，到處請人教他害怕；別人覺得可怕的墓地和黑夜，他都能平靜面對。","後來，他聽說一座城堡鬧鬼，只要有人連住三夜，就能解除城堡的災禍。他帶着火種和工具住進去，遇上怪聲、怪物和各種奇異的考驗。","他沒有被那些景象嚇倒，反而把難題一一解決。三夜過後，城堡恢復安寧，國王也讓他迎娶公主。可是他仍然常說，自己還不知道發抖是怎麼回事。","公主聽了侍女的主意，把一桶帶着小魚的冷水倒在熟睡的丈夫身上。他猛然醒來，冷得直發抖，這才開心地說，原來這就是自己一直想學的感覺。"],"questions":[{"q":"年輕人離家最想學會甚麼？","options":["在海底呼吸的方法","害怕得發抖的感覺","用麥子紡成金線","聽懂三種鳥叫"],"answer":1,"explanation":"他不懂別人口中的害怕，才四處求教。","id":"grimm-4:q0"},{"q":"他在鬧鬼城堡住了多少夜？","options":["十二夜","三夜","一夜","七夜"],"answer":1,"explanation":"連續三夜的考驗結束後，城堡恢復了安寧。","id":"grimm-4:q1"},{"q":"甚麼最後使年輕人真的發抖？","options":["一匹會說話的馬","帶着小魚的冷水","城堡裏的怪聲","公主的王冠"],"answer":1,"explanation":"他不怕鬼怪，卻被突如其來的冷水凍得發抖。","id":"grimm-4:q2"}],"title":"學害怕的年輕人","author":"格林兄弟","group":"grimm","sourceTitle":"4 The Story of the Youth Who Went Forth to Learn What Fear Was (Märchen von einem, der auszog, das Fürchten zu lernen)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap04","lines":[{"zh":"一個年輕人總聽別人說害怕得發抖，自己卻不明白那是甚麼感覺。","py":"yí gè nián qīng rén zǒng tīng bié rén shuō hài pà de fā dǒu ， zì jǐ què bù míng bái nà shì shén me gǎn jué 。","paragraph":0},{"zh":"他離開家，到處請人教他害怕；別人覺得可怕的墓地和黑夜，他都能平靜面對。","py":"tā lí kāi jiā ， dào chù qǐng rén jiāo t up":"grimm","sourceTitle":"16 The Three Snake-Leaves (Die drei Schlangenblätter)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap16","lines":[{"zh":"一個窮人的兒子離家從軍，因為勇敢立功，娶了國王的女兒。","py":"yí gè qióng rén de ér zi lí jiā cóng jūn ， yīn wèi yǒng gǎn lì gōng ， qǔ le guó wáng de nǚ ér 。","paragraph":0},{"zh":"公主曾要求，夫妻之中若有人先去世，另一人必須陪伴在墓中；青年答應了這個沉重的約定。","py":"gōng zhǔ céng yāo qiú ， fū qī zhī zhōng ruò yǒu rén xiān qù shì ， lìng yī rén bì xū péi bàn zài mù zhōng ； qīng nián dā ying le zhè ge chén zhòng de yuē dìng 。","paragraph":0},{"zh":"公主不久病逝，青年被留在墓室裏。","py":"gōng zhǔ bù jiǔ bìng shì ， qīng nián bèi liú zài mù shì lǐ 。","paragraph":1},{"zh":"他看見一條蛇用三片葉子救活另一條蛇，便學着把葉子放在公主身上，竟也讓她醒了過來，兩人重新回到地面。","py":"tā kàn jiàn yī tiáo shé yòng sān piàn yè zi jiù huó lìng yī tiáo shé ， biàn xué zhe bǎ yè zi fàng zài gōng zhǔ shēn shàng ， jìng yě ràng tā xǐng le guò lái ， liǎng rén chóng xīn huí dào dì miàn 。","paragraph":1},{"zh":"可是公主後來變了心，在海上與船長合謀，把熟睡的丈夫拋進海裏。","py":"kě shì gōng zhǔ hòu lái biàn le xīn ， zài hǎi shàng yǔ chuán zhǎng hé móu ， bǎ shú shuì de zhàng fū pāo jìn hǎi lǐ 。","paragraph":2},{"zh":"一個忠心的僕人暗中救起青年，又用保存下來的蛇葉，使他再次恢復生命。","py":"yí gè zhōng xīn de pú rén àn zhōng jiù qǐ qīng nián ， yòu yòng bǎo cún xià lái de shé yè ， shǐ tā zài cì huī fù shēng mìng 。","paragraph":2},{"zh":"青年比大船更早回到王宮，向國王說明經過。","py":"qīng nián bǐ dà chuán gèng zǎo huí dào wáng gōng ， xiàng guó wáng shuō míng jīng guò 。","paragraph":3},{"zh":"公主回來後，謊稱丈夫病死；當青年走出藏身的房間，她的謊言便被揭穿，國王也查明了真相。","py":"gōng zhǔ huí lái hòu ， huǎng chēng zhàng fū bìng sǐ ； dāng qīng nián zǒu chū cáng shēn de fáng jiān ， tā de huǎng yán biàn bèi jiē chuān ， guó wáng yě chá míng le zhēn xiàng 。","paragraph":3}]},{"id":"grimm-22","paragraphs":["王子帶着僕人出外旅行，在森林借宿時，遇上一個想用毒酒害人的女巫。毒酒沒有落進他們口中，卻使馬倒下；烏鴉吃了死馬，也被毒倒了。","僕人帶走那隻烏鴉，後來又遇見一群強盜。強盜吃下用烏鴉煮成的湯，接連中毒，王子與僕人因此逃過一劫，記住了這段離奇的經歷。","一位公主宣布，誰能提出她猜不中的謎語，就可以娶她。王子便把旅途的事變成謎題：甚麼東西沒有殺死一人，卻殺死了十二人？公主怎樣想也想不通。","公主夜裏悄悄打聽答案，王子卻留下她的披風作證。第二天，公主雖然說出了答案，評判仍發現她曾偷聽，王子的謎語考驗便有了真正的結果。"],"questions":[{"q":"王子的謎語取材自甚麼？","options":["旅途中烏鴉和強盜的經歷","公主丟失王冠的經過","一場紡紗比賽","森林裏的婚禮"],"answer":0,"explanation":"他把馬、烏鴉和強盜之間的連鎖事件變成謎題。","id":"grimm-22:q0"},{"q":"烏鴉為甚麼倒下？","options":["撞上公主的城門","吃了中了毒的死馬","喝光一口井的水","吞下金色戒指"],"answer":1,"explanation":"毒從馬傳到烏鴉，再隨食物傳到強盜。","id":"grimm-22:q1"},{"q":"王子留下甚麼，證明公主夜裏來過？","options":["一隻玻璃鞋","十二根羽毛","僕人的木碗","公主的披風"],"answer":3,"explanation":"披風成為她曾偷偷打聽答案的證物。","id":"grimm-22:q2"}],"title":"謎語","author":"格林兄弟","group":"grimm","sourceTitle":"22 The Riddle (Das Rätsel)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap22","lines":[{"zh":"王子帶着僕人出外旅行，在森林借宿時，遇上一個想用毒酒害人的女巫。","py":"wáng zǐ dài zhe pú rén chū wài lǚ xíng ， zài sēn lín jiè sù shí ， yù shàng yí gè xiǎng yòng dú jiǔ hài rén de nǚ wū 。","paragraph":0},{"zh":"毒酒沒有落進他們口中，卻使馬倒下；烏鴉吃了死馬，也被毒倒了。","py":"dú jiǔ méi yǒu luò jìn tā men kǒu zhōng ， què shǐ mǎ dǎo xià ； wū yā chī le sǐ mǎ ， yě bèi dú dǎo le 。","paragraph":0},{"zh":"僕人帶走那隻烏鴉，後來又遇見一群強盜。","py":"pú rén dài zǒu nà zhǐ wū yā ， hòu lái yòu yù jiàn yī qún qiáng dào 。","paragraph":1},{"zh":"強盜吃下用烏鴉煮成的湯，接連中毒，王子與僕人因此逃過一劫，記住了這段離奇的經歷。","py":"qiáng dào chī xià yòng wū yā zhǔ chéng de tāng ， jiē lián zhòng dú ， wáng zǐ yǔ pú rén yīn cǐ táo guò yī jié ， jì zhù le zhè duàn lí qí de jīng lì 。","paragraph":1},{"zh":"一位公主宣布，誰能提出她猜不中的謎語，就可以娶她。","py":"yī wèi gōng zhǔ xuān bù ， shuí néng tí chū tā cāi bù zhōng de mí yǔ ， jiù kě yǐ qǔ tā 。","paragraph":2},{"zh":"王子便把旅途的事變成謎題：甚麼東西沒有殺死一人，卻殺死了十二人？","py":"wáng zǐ biàn bǎ lǚ tú de shì biàn chéng mí tí ： shén me dōng xī méi yǒu shā sǐ yī rén ， què shā sǐ le shí èr rén ？","paragraph":2},{"zh":"公主怎樣想也想不通。","py":"gōng zhǔ zěn yàng xiǎng yě xiǎng bù tōng 。","paragraph":2},{"zh":"公主夜裏悄悄打聽答案，王子卻留下她的披風作證。","py":"gōng zhǔ yè lǐ qiāo qiāo dǎ tīng dá àn ， wáng zǐ què liú xià tā de pī fēng zuò zhèng 。","paragraph":3},{"zh":"第二天，公主雖然說出了答案，評判仍發現她曾偷聽，王子的謎語考驗便有了真正的結果。","py":"dì èr tiān ， gōng zhǔ suī rán shuō chū le dá àn ， píng pàn réng fā xiàn tā céng tōu tīng ， wáng zǐ de mí yǔ kǎo yàn biàn yǒu le zhēn zhèng de jié guǒ 。","paragraph":3}]},{"id":"grimm-29","paragraphs":["一個孩子出生時，人們預言他將來會娶公主。國王很不高興，幾次設法阻止，孩子卻總能脫險。長大後，他仍與公主成婚，國王便要他去取魔鬼的三根金髮。","青年出發後，沿途遇到三個難題：不再出酒的泉、不再結果的樹，以及不能離開工作的渡船人。他答應順便替大家問明原因，才繼續走向魔鬼的住處。","魔鬼的祖母同情青年，把他藏好。她趁魔鬼睡覺，拔下三根金髮，又裝作做夢，問出三個難題的答案。青年帶着金髮回程，逐一幫人解決困難。","渡船人只要把船槳交到另一人手中，就能離開。國王看見青年帶回的財物，貪心地親自去尋找更多，結果接過船槳，自己留在河上替人渡船。"],"questions":[{"q":"國王要青年帶回甚麼？","options":["三隻會唱歌的貓","魔鬼的三根金髮","公主的三件外衣","山上的三顆種子"],"answer":1,"explanation":"國王故意提出危險的要求，希望阻止青年。","id":"grimm-29:q0"},{"q":"誰幫青年問出三個難題的答案？","options":["一位鞋匠","守井的青蛙","魔鬼的祖母","城堡的獵人"],"answer":2,"explanation":"祖母藏起青年，趁魔鬼睡覺設法套出答案。","id":"grimm-29:q1"},{"q":"貪心國王最後為甚麼留下渡船？","options":["找不到自己的金頭髮","把河水全喝光了","忘記公主的名字","接過渡船人交來的船槳"],"answer":3,"explanation":"船槳交到新的人手上，原來的渡船人才能離開。","id":"grimm-29:q2"}],"title":"魔鬼的三根金髮","author":"格林兄弟","group":"grimm","sourceTitle":"29 The Devil with the Three Golden Hairs (Der Teufel mit den drei goldenen Haaren)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap29","lines":[{"zh":"一個孩子出生時，人們預言他將來會娶公主。","py":"yí gè hái zi chū shēng shí ， rén men yù yán tā jiāng lái huì qǔ gōng zhǔ 。","paragraph":0},{"zh":"國王很不高興，幾次設法阻止，孩子卻總能脫險。","py":"guó wáng hěn bù gāo xìng ， jǐ cì shè fǎ zǔ zhǐ ， hái zi què zǒng néng tuō xiǎn 。","paragraph":0},{"zh":"長大後，他仍與公主成婚，國王便要他去取魔鬼的三根金髮。","py":"zhǎng dà hòu ， tā réng yǔ gōng zhǔ chéng hūn ， guó wáng biàn yào tā qù qǔ mó guǐ de sān gēn jīn fà 。","paragraph":0},{"zh":"青年出發後，沿途遇到三個難題：不再出酒的泉、不再結果的樹，以及不能離開工作的渡船人。","py":"qīng nián chū fā hòu ， yán tú yù dào sān gè nán tí ： bù zài chū jiǔ de quán 、 bù zài jié guǒ de shù ， yǐ jí bù néng lí kāi gōng zuò de dù chuán rén 。","paragraph":1},{"zh":"他答應順便替大家問明原因，才繼續走向魔鬼的住處。","py":"tā dā ying shùn biàn tì dà jiā wèn míng yuán yīn ， cái jì xù zǒu xiàng mó guǐ de zhù chù 。","paragraph":1},{"zh":"魔鬼的祖母同情青年，把他藏好。","py":"mó guǐ de zǔ mǔ tóng qíng qīng nián ， bǎ tā cáng hǎo 。","paragraph":2},{"zh":"她趁魔鬼睡覺，拔下三根金髮，又裝作做夢，問出三個難題的答案。","py":"tā chèn mó guǐ shuì jiào ， bá xià sān gēn jīn fà ， yòu zhuāng zuò zuò mèng ， wèn chū sān gè nán tí de dá àn 。","paragraph":2},{"zh":"青年帶着金髮回程，逐一幫人解決困難。","py":"qīng nián dài zhe jīn fà huí chéng ， zhú yī bāng rén jiě jué kùn nán 。","paragraph":2},{"zh":"渡船人只要把船槳交到另一人手中，就能離開。","py":"dù chuán rén zhǐ yào bǎ chuán jiǎng jiāo dào lìng yī rén shǒu zhōng ， jiù néng lí kāi 。","paragraph":3},{"zh":"國王看見青年帶回的財物，貪心地親自去尋找更多，結果接過船槳，自己留在河上替人渡船。","py":"guó wáng kàn jiàn qīng nián dài huí de cái wù ， tān xīn dì qīn zì qù xún zhǎo gèng duō ， jié guǒ jiē guò chuán jiǎng ， zì jǐ liú zài hé shàng tì rén dù chuán 。","paragraph":3}]},{"id":"grimm-33","paragraphs":["伯爵把兒子送去求學，盼他學到有用的本領。兒子三次回來，分別說自己學會了狗、鳥和青蛙的語言。父親十分生氣，以為這些全是沒有用的知識。","青年離家後，在一座被惡犬困擾的城堡借宿。別人不敢接近那些狗，他卻聽懂牠們的話，知道地底藏着寶物，牠們只是被迫守在那裏。","找到寶物後，狗不再吵鬧，青年也證明了本領的用處。他繼續旅行，經過沼澤時，又聽見青蛙談論他未來的命運，心裏感到驚訝而不安。","他抵達羅馬時，當地正在選新的教宗。兩隻白鴿停在他肩上，人們把這看作指引，選中了他。典禮中，白鴿仍在耳邊幫忙，那些被輕視的語言終於派上用場。"],"questions":[{"q":"父親起初怎樣看兒子學到的語言？","options":["請他指揮軍隊","叫他教所有國王","覺得沒有用而生氣","立刻替他舉行慶典"],"answer":2,"explanation":"父親不認為動物語言是有價值的學問。","id":"grimm-33:q0"},{"q":"城堡裏的狗為甚麼一直守在那裏？","options":["想阻止白鴿唱歌","替青蛙尋找池塘","被迫看守地底的寶物","等待主人送來金鞋"],"answer":2,"explanation":"青年聽懂狗的話，才知道牠們守着寶物。","id":"grimm-33:q1"},{"q":"甚麼動物停在青年肩上，影響了選教宗的結果？","options":["兩隻白鴿","七隻烏鴉","一對天鵝","三隻老鼠"],"answer":0,"explanation":"人們把白鴿停留在肩上，看成選中他的指引。","id":"grimm-33:q2"}],"title":"三種語言","author":"格林兄弟","group":"grimm","sourceTitle":"33 The Three Languages (Die drei Sprachen)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap33","lines":[{"zh":"伯爵把兒子送去求學，盼他學到有用的本領。","py":"bó jué bǎ ér zi sòng qù qiú xué ， pàn tā xué dào yǒu yòng de běn lǐng 。","paragraph":0},{"zh":"兒子三次回來，分別說自己學會了狗、鳥和青蛙的語言。","py":"ér zi sān cì huí lái ， fēn bié shuō zì jǐ xué huì le gǒu 、 niǎo hé qīng wā de yǔ yán 。","paragraph":0},{"zh":"父親十分生氣，以為這些全是沒有用的知識。","py":"fù qīn shí fēn shēng qì ， yǐ wéi zhè xiē quán shì méi yǒu yòng de zhī shí 。","paragraph":0},{"zh":"青年離家後，在一座被惡犬困擾的城堡借宿。","py":"qīng nián lí jiā hòu ， zài yī zuò bèi è quǎn kùn rǎo de chéng bǎo jiè sù 。","paragraph":1},{"zh":"別人不敢接近那些狗，他卻聽懂牠們的話，知道地底藏着寶物，牠們只是被迫守在那裏。","py":"bié rén bù gǎn jiē jìn nà xiē gǒu ， tā què tīng dǒng tā men de huà ， zhī dào dì dǐ cáng zhe bǎo wù ， tā men zhǐ shì bèi pò shǒu zài nà lǐ 。","paragraph":1},{"zh":"找到寶物後，狗不再吵鬧，青年也證明了本領的用處。","py":"zhǎo dào bǎo wù hòu ， gǒu bù zài chǎo nào ， qīng nián yě zhèng míng le běn lǐng de yòng chù 。","paragraph":2},{"zh":"他繼續旅行，經過沼澤時，又聽見青蛙談論他未來的命運，心裏感到驚訝而不安。","py":"tā jì xù lǚ xíng ， jīng guò zhǎo zé shí ， yòu tīng jiàn qīng wā tán lùn tā wèi lái de mìng yùn ， xīn lǐ gǎn dào jīng yà ér bù ān 。","paragraph":2},{"zh":"他抵達羅馬時，當地正在選新的教宗。","py":"tā dǐ dá luó mǎ shí ， dāng dì zhèng zài xuǎn xīn de jiào zōng 。","paragraph":3},{"zh":"兩隻白鴿停在他肩上，人們把這看作指引，選中了他。","py":"liǎng zhǐ bái gē tíng zài tā jiān shàng ， rén men bǎ zhè kàn zuò zhǐ yǐn ， xuǎn zhōng le tā 。","paragraph":3},{"zh":"典禮中，白鴿仍在耳邊幫忙，那些被輕視的語言終於派上用場。","py":"diǎn lǐ zhōng ， bái gē réng zài ěr biān bāng máng ， nà xiē bèi qīng shì de yǔ yán zhōng yú pài shàng yòng chǎng 。","paragraph":3}]},{"id":"grimm-51","paragraphs":["獵人在高樹上救下一個孩子，把他帶回家，取名小鳥。小鳥與獵人的女兒莉娜一起長大，兩人十分親近，總是不願離開對方，也把彼此當成家人。","家中的老廚娘暗中計劃傷害小鳥，莉娜察覺後，立刻帶他逃走。追趕的人靠近時，兩人先變成玫瑰樹和花朵，使對方找不到原來的孩子。","廚娘不肯放棄，又派人追來。這次兩人變成教堂和裏面的燭台，仍然避過追查。每次變化之前，他們都提醒彼此，無論怎樣都不要分開。","最後，廚娘親自趕到，小鳥變成池塘，莉娜變成池上的鴨子。廚娘想對池塘下手，卻被鴨子制止，再也不能追害他們。兩個孩子終於平安回家。"],"questions":[{"q":"小鳥最初是怎樣來到獵人家中的？","options":["由國王派人送來","獵人從高樹上救下他","自己乘着飛箱到來","從金蛋裏走出來"],"answer":1,"explanation":"獵人發現樹上的孩子，便把他帶回家照顧。","id":"grimm-51:q0"},{"q":"第一次躲避追趕時，兩人變成甚麼？","options":["王冠和金球","玫瑰樹和花朵","磨坊和麵粉","星星和月亮"],"answer":1,"explanation":"他們利用玫瑰樹與花朵的模樣，避過第一次追查。","id":"grimm-51:q1"},{"q":"最後一次變化中，莉娜變成了甚麼？","options":["塔頂的白鴿","教堂的大鐘","森林中的狐狸","池塘上的鴨子"],"answer":3,"explanation":"小鳥變池塘，莉娜則變成保護池塘的鴨子。","id":"grimm-51:q2"}],"title":"棄兒小鳥","author":"格林兄弟","group":"grimm","sourceTitle":"51 Foundling-Bird (Fundevogel)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap51","lines":[{"zh":"獵人在高樹上救下一個孩子，把他帶回家，取名小鳥。","py":"liè rén zài gāo shù shàng jiù xià yí gè hái zi ， bǎ tā dài huí jiā ， qǔ míng xiǎo niǎo 。","paragraph":0},{"zh":"小鳥與獵人的女兒莉娜一起長大，兩人十分親近，總是不願離開對方，也把彼此當成家人。","py":"xiǎo niǎo yǔ liè rén de nǚ ér lì nà yì qǐ zhǎng dà ， liǎng rén shí fēn qīn jìn ， zǒng shì bù yuàn lí kāi duì fāng ， yě bǎ bǐ cǐ dàng chéng jiā rén 。","paragraph":0},{"zh":"家中的老廚娘暗中計劃傷害小鳥，莉娜察覺後，立刻帶他逃走。","py":"jiā zhōng de lǎo chú niáng àn zhōng jì huà shāng hài xiǎo niǎo ， lì nà chá jué hòu ， lì kè dài tā táo zǒu 。","paragraph":1},{"zh":"追趕的人靠近時，兩人先變成玫瑰樹和花朵，使對方找不到原來的孩子。","py":"zhuī gǎn de rén kào jìn shí ， liǎng rén xiān biàn chéng méi guī shù hé huā duǒ ， shǐ duì fāng zhǎo bú dào yuán lái de hái zi 。","paragraph":1},{"zh":"廚娘不肯放棄，又派人追來。","py":"chú niáng bù kěn fàng qì ， yòu pài rén zhuī lái 。","paragraph":2},{"zh":"這次兩人變成教堂和裏面的燭台，仍然避過追查。","py":"zhè cì liǎng rén biàn chéng jiào táng hé lǐ miàn de zhú tái ， réng rán bì guò zhuī chá 。","paragraph":2},{"zh":"每次變化之前，他們都提醒彼此，無論怎樣都不要分開。","py":"měi cì biàn huà zhī qián ， tā men dōu tí xǐng bǐ cǐ ， wú lùn zěn yàng dōu bú yào fēn kāi 。","paragraph":2},{"zh":"最後，廚娘親自趕到，小鳥變成池塘，莉娜變成池上的鴨子。","py":"zuì hòu ， chú niáng qīn zì gǎn dào ， xiǎo niǎo biàn chéng chí táng ， lì nà biàn chéng chí shàng de yā zi 。","paragraph":3},{"zh":"廚娘想對池塘下手，卻被鴨子制止，再也不能追害他們。","py":"chú niáng xiǎng duì chí táng xià shǒu ， què bèi yā zi zhì zhǐ ， zài yě bù néng zhuī hài tā men 。","paragraph":3},{"zh":"兩個孩子終於平安回家。","py":"liǎng gè hái zi zhōng yú píng ān huí jiā 。","paragraph":3}]},{"id":"grimm-52","paragraphs":["一位公主十分驕傲，總拿求婚者的外貌取笑。她看見一位國王的下巴有些彎，便叫他畫眉嘴國王。父王生氣了，說要把她嫁給下一個上門的乞者。","一個拉琴的人來到宮外，公主只好跟他離開。兩人住進小屋，她從前甚麼也不用做，現在卻要學着料理生活，才發現自己並不了解普通人的辛苦。","她試過編籃、紡線和賣陶器，都遇上挫折，後來到王宮廚房幫忙。一次宴會上，她藏在衣服裏的食物掉了出來，周圍的笑聲使她又羞又難過。","畫眉嘴國王這時走來，說自己就是那個拉琴的人。公主想起從前嘲笑別人的樣子，承認自己的傲慢。故事以婚禮作結，她也終於學會體會他人的處境。"],"questions":[{"q":"畫眉嘴這個外號是誰取的？","options":["國王的祖母","一位老廚娘","森林裏的獵人","驕傲的公主"],"answer":3,"explanation":"公主因國王下巴的形狀，取了嘲笑他的外號。","id":"grimm-52:q0"},{"q":"離開王宮後，公主發現自己缺少甚麼？","options":["辨認金鳥的眼力","在海裏游泳的能力","記住魔法咒語的本領","料理普通生活的經驗"],"answer":3,"explanation":"從前被人照料的她，做許多日常工作都很吃力。","id":"grimm-52:q1"},{"q":"拉琴人的真正身份是甚麼？","options":["被施法的青蛙","看守地底的士兵","賣陶器的老祖父","畫眉嘴國王"],"answer":3,"explanation":"結尾揭示，他與曾被公主嘲笑的國王是同一人。","id":"grimm-52:q2"}],"title":"畫眉嘴國王","author":"格林兄弟","group":"grimm","sourceTitle":"52 King Thrushbeard (König Drosselbart)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap52","lines":[{"zh":"一位公主十分驕傲，總拿求婚者的外貌取笑。","py":"yī wèi gōng zhǔ shí fēn jiāo ào ， zǒng ná qiú hūn zhě de wài mào qǔ xiào 。","paragraph":0},{"zh":"她看見一位國王的下巴有些彎，便叫他畫眉嘴國王。","py":"tā kàn jiàn yī wèi guó wáng de xià bā yǒu xiē wān ， biàn jiào tā huà méi zuǐ guó wáng 。","paragraph":0},{"zh":"父王生氣了，說要把她嫁給下一個上門的乞者。","py":"fù wáng shēng qì le ， shuō yào bǎ tā jià gěi xià yí gè shàng mén de qǐ zhě 。","paragraph":0},{"zh":"一個拉琴的人來到宮外，公主只好跟他離開。","py":"yí gè lā qín de rén lái dào gōng wài ， gōng zhǔ zhǐ hǎo gēn tā lí kāi 。","paragraph":1},{"zh":"兩人住進小屋，她從前甚麼也不用做，現在卻要學着料理生活，才發現自己並不了解普通人的辛苦。","py":"liǎng rén zhù jìn xiǎo wū ， tā cóng qián shén me yě bù yòng zuò ， xiàn zài què yào xué zhe liào lǐ shēng huó ， cái fā xiàn zì jǐ bìng bù liǎo jiě pǔ tōng rén de xīn kǔ 。","paragraph":1},{"zh":"她試過編籃、紡線和賣陶器，都遇上挫折，後來到王宮廚房幫忙。","py":"tā shì guò biān lán 、 fǎng xiàn hé mài táo qì ， dōu yù shàng cuò zhé ， hòu lái dào wáng gōng chú fáng bāng máng 。","paragraph":2},{"zh":"一次宴會上，她藏在衣服裏的食物掉了出來，周圍的笑聲使她又羞又難過。","py":"yī cì yàn huì shàng ， tā cáng zài yī fú lǐ de shí wù diào le chū lái ， zhōu wéi de xiào shēng shǐ tā yòu xiū yòu nán guò 。","paragraph":2},{"zh":"畫眉嘴國王這時走來，說自己就是那個拉琴的人。","py":"huà méi zuǐ guó wáng zhè shí zǒu lái ， shuō zì jǐ jiù shì nà ge lā qín de rén 。","paragraph":3},{"zh":"公主想起從前嘲笑別人的樣子，承認自己的傲慢。","py":"gōng zhǔ xiǎng qǐ cóng qián cháo xiào bié rén de yàng zi ， chéng rèn zì jǐ de ào màn 。","paragraph":3},{"zh":"故事以婚禮作結，她也終於學會體會他人的處境。","py":"gù shì yǐ hūn lǐ zuò jié ， tā yě zhōng yú xué huì tǐ huì tā rén de chǔ jìng 。","paragraph":3}]},{"id":"grimm-69","paragraphs":["約琳德和約林格在森林散步，不小心走近女巫的城堡。踏進魔法範圍後，約林格不能動彈，約琳德則變成夜鶯，被女巫裝進鳥籠帶走了。",
