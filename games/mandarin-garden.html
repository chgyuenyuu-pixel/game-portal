paragraphs":["商人的兒子繼承大筆財產，卻很快花光，朋友也漸漸疏遠。他只剩一隻別人送來的箱子，沒有東西可裝，便自己坐進去，沒想到箱子竟飛了起來。","飛箱把他帶到遠方。他飛上公主的住處，聲稱自己來自天上，用有趣的故事打動她，後來又替國王王后講了一個火柴與廚房用具的故事，獲准成婚。","婚禮前，他想讓全城看見自己的神奇，便買了許多煙火，坐飛箱升空放出亮光。人們望着夜空，紛紛誇大所見，他聽了十分得意，又到街上打聽大家的評價。","可是回到森林時，飛箱已被殘留的火星燒成灰。他再也不能飛到公主身邊，只能四處講故事謀生。公主仍在高處等待，華麗的表演卻讓他失去了真正的出路。"],"questions":[{"q":"商人的兒子為甚麼自己坐進箱子？","options":["已沒有財物可裝","想躲避海上的暴風雨","公主要求他這樣做","要替國王測量箱子"],"answer":0,"explanation":"他耗盡家產，空箱反而成了載着自己飛行的工具。","id":"andersen-flying_t:q0"},{"q":"他怎樣取得公主及其父母的好感？","options":["送上整座金山","打敗海底巨龍","替王后織十一件衣服","講有趣的故事"],"answer":3,"explanation":"說故事的能力，讓他被公主和國王王后接納。","id":"andersen-flying_t:q1"},{"q":"飛箱最後為甚麼不能再使用？","options":["被煙火殘留的火星燒毀","被公主鎖在海底","變成一隻小鳥飛走","被老鼠咬成紙船"],"answer":0,"explanation":"為炫耀而放的煙火，意外燒掉了他唯一的飛行工具。","id":"andersen-flying_t:q2"}],"title":"會飛的箱子","author":"安徒生","group":"andersen","sourceTitle":"The Flying Trunk","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#flying_t","lines":[{"zh":"商人的兒子繼承大筆財產，卻很快花光，朋友也漸漸疏遠。","py":"shāng rén de ér zi jì chéng dà bǐ cái chǎn ， què hěn kuài huā guāng ， péng yǒu yě jiàn jiàn shū yuǎn 。","paragraph":0},{"zh":"他只剩一隻別人送來的箱子，沒有東西可裝，便自己坐進去，沒想到箱子竟飛了起來。","py":"tā zhǐ shèng yī zhī bié rén sòng lái de xiāng zi ， méi yǒu dōng xī kě zhuāng ， biàn zì jǐ zuò jìn qù ， méi xiǎng dào xiāng zi jìng fēi le qǐ lái 。","paragraph":0},{"zh":"飛箱把他帶到遠方。","py":"fēi xiāng bǎ tā dài dào yuǎn fāng 。","paragraph":1},{"zh":"他飛上公主的住處，聲稱自己來自天上，用有趣的故事打動她，","py":"tā fēi shàng gōng zhǔ de zhù chù ， shēng chēng zì jǐ lái zì tiān shàng ， yòng yǒu qù de gù shì dǎ dòng tā ，","paragraph":1},{"zh":"後來又替國王王后講了一個火柴與廚房用具的故事，獲准成婚。","py":"hòu lái yòu tì guó wáng wáng hòu jiǎng le yí gè huǒ chái yǔ chú fáng yòng jù de gù shì ， huò zhǔn chéng hūn 。","paragraph":1},{"zh":"婚禮前，他想讓全城看見自己的神奇，便買了許多煙火，坐飛箱升空放出亮光。","py":"hūn lǐ qián ， tā xiǎng ràng quán chéng kàn jiàn zì jǐ de shén qí ， biàn mǎi le xǔ duō yān huǒ ， zuò fēi xiāng shēng kōng fàng chū liàng guāng 。","paragraph":2},{"zh":"人們望着夜空，紛紛誇大所見，他聽了十分得意，又到街上打聽大家的評價。","py":"rén men wàng zhe yè kōng ， fēn fēn kuā dà suǒ jiàn ， tā tīng le shí fēn dé yì ， yòu dào jiē shàng dǎ tīng dà jiā de píng jià 。","paragraph":2},{"zh":"可是回到森林時，飛箱已被殘留的火星燒成灰。","py":"kě shì huí dào sēn lín shí ， fēi xiāng yǐ bèi cán liú de huǒ xīng shāo chéng huī 。","paragraph":3},{"zh":"他再也不能飛到公主身邊，只能四處講故事謀生。","py":"tā zài yě bù néng fēi dào gōng zhǔ shēn biān ， zhǐ néng sì chù jiǎng gù shì móu shēng 。","paragraph":3},{"zh":"公主仍在高處等待，華麗的表演卻讓他失去了真正的出路。","py":"gōng zhǔ réng zài gāo chù děng dài ， huá lì de biǎo yǎn què ràng tā shī qù le zhēn zhèng de chū lù 。","paragraph":3}]},{"id":"andersen-li_ida_f","paragraphs":["小意達發現昨天還漂亮的花，今天都垂下頭，便問一位會講故事的大學生。學生說，花昨夜去參加舞會，跳得太累了；意達聽了，十分心疼。","她把洋娃娃蘇菲的小床讓給花朵，替它們拉好被子，讓它們休息。夜裏，她像在夢中聽見音樂，悄悄起身，看見花從床上走出，與其他花一起跳舞。","洋娃娃也加入舞會，房間變得熱鬧。花請蘇菲轉告意達，自己明天會枯萎，可以把它們埋進花園，等到夏天再有美麗的花，意達把這些話記在心裏。","天亮後，花果然更枯了，蘇菲也不開口。意達沒有把花隨手丟掉，而是放進畫着小鳥的紙盒，請表兄弟陪她埋到花園，用一場小小的告別保存了自己的愛惜。"],"questions":[{"q":"大學生怎樣解釋花兒垂頭？","options":["說皇帝借走了花的顏色","說牠們昨夜跳舞太累","說花都討厭陽光","說花想變成錫兵"],"answer":1,"explanation":"他用花朵舞會的想像，回答意達對枯花的疑問。","id":"andersen-li_ida_f:q0"},{"q":"意達讓花朵睡在哪裏？","options":["魚缸底下","洋娃娃蘇菲的小床","院子的雪堆","王宮的銀盤"],"answer":1,"explanation":"她把娃娃的床讓出來，認真照顧這些花。","id":"andersen-li_ida_f:q1"},{"q":"最後，意達怎樣安放枯萎的花？","options":["掛上皇帝的空織機","放進紙盒，埋在花園","全部送進打火匣","拿去交換紅皮鞋"],"answer":1,"explanation":"她用一場告別，表達自己對花的珍惜。","id":"andersen-li_ida_f:q2"}],"title":"小意達的花","author":"安徒生","group":"andersen","sourceTitle":"Little Ida's Flowers","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#li_ida_f","lines":[{"zh":"小意達發現昨天還漂亮的花，今天都垂下頭，便問一位會講故事的大學生。","py":"xiǎo yì dá fā xiàn zuó tiān hái piào liàng de huā ， jīn tiān dōu chuí xià tou ， biàn wèn yī wèi huì jiǎng gù shì de dà xué shēng 。","paragraph":0},{"zh":"學生說，花昨夜去參加舞會，跳得太累了；意達聽了，十分心疼。","py":"xué shēng shuō ， huā zuó yè qù cān jiā wǔ huì ， tiào de tài lèi le ； yì dá tīng le ， shí fēn xīn téng 。","paragraph":0},{"zh":"她把洋娃娃蘇菲的小床讓給花朵，替它們拉好被子，讓它們休息。","py":"tā bǎ yáng wá wá sū fēi de xiǎo chuáng ràng gěi huā duǒ ， tì tā men lā hǎo bèi zi ， ràng tā men xiū xī 。","paragraph":1},{"zh":"夜裏，她像在夢中聽見音樂，悄悄起身，看見花從床上走出，與其他花一起跳舞。","py":"yè lǐ ， tā xiàng zài mèng zhōng tīng jiàn yīn yuè ， qiāo qiāo qǐ shēn ， kàn jiàn huā cóng chuáng shàng zǒu chū ， yǔ qí tā huā yì qǐ tiào wǔ 。","paragraph":1},{"zh":"洋娃娃也加入舞會，房間變得熱鬧。","py":"yáng wá wá yě jiā rù wǔ huì ， fáng jiān biàn de rè nào 。","paragraph":2},{"zh":"花請蘇菲轉告意達，自己明天會枯萎，可以把它們埋進花園，等到夏天再有美麗的花，意達把這些話記在心裏。","py":"huā qǐng sū fēi zhuǎn gào yì dá ， zì jǐ míng tiān huì kū wěi ， kě yǐ bǎ tā men mái jìn huā yuán ， děng dào xià tiān zài yǒu měi lì de huā ， yì dá bǎ zhè xiē huà jì zài xīn lǐ 。","paragraph":2},{"zh":"天亮後，花果然更枯了，蘇菲也不開口。","py":"tiān liàng hòu ， huā guǒ rán gèng kū le ， sū fēi yě bù kāi kǒu 。","paragraph":3},{"zh":"意達沒有把花隨手丟掉，而是放進畫着小鳥的紙盒，請表兄弟陪她埋到花園，用一場小小的告別保存了自己的愛惜。","py":"yì dá méi yǒu bǎ huā suí shǒu diū diào ， ér shì fàng jìn huà zhe xiǎo niǎo de zhǐ hé ， qǐng biǎo xiōng dì péi tā mái dào huā yuán ， yòng yī cháng xiǎo xiǎo de gào bié bǎo cún le zì jǐ de ài xī 。","paragraph":3}]},{"id":"andersen-ole_luk","paragraphs":["夢神夜裏輕輕走到孩子身邊，讓他們閉上眼睛。他帶着兩把傘，一把裏面有圖畫，能展開美夢；另一把沒有圖畫，孩子在下面便安靜睡到天明。","一個星期裏，他每天探望小雅爾瑪。房間的東西在夢中有了生命，書本和寫得不好的字也像在訴苦，夢神帶孩子到奇異的地方，連小老鼠的婚禮都能參加。","夢裏的旅程有時乘船，有時走進畫中，平凡房間變成寬廣世界。孩子也聽到書本、玩具和畫像不同的聲音，發現睡前熟悉的東西能長出許多故事。","到了星期日，夢神介紹自己的兄弟死亡：他只來一次，也會說故事。小雅爾瑪起初陌生，聽後卻不再那麼害怕。七夜的夢結束，想像與對生活的思考仍留在心裏。"],"questions":[{"q":"夢神那把有圖畫的傘有甚麼作用？","options":["讓金幣不斷落下","把海水變成雪","使衣服永遠乾淨","帶來豐富的夢"],"answer":3,"explanation":"有圖畫的傘展開後，孩子能在睡眠中進入夢境。","id":"andersen-ole_luk:q0"},{"q":"小雅爾瑪在夢裏曾參加誰的婚禮？","options":["海底的公主","小老鼠","冰雪女王","七隻烏鴉"],"answer":1,"explanation":"夢神讓很小的動物世界，也成為一場可以參與的故事。","id":"andersen-ole_luk:q1"},{"q":"星期日，夢神介紹的兄弟是誰？","options":["夏天","火爐","時間的國王","死亡"],"answer":3,"explanation":"最後一夜，他用說故事的方式介紹只來一次的兄弟。","id":"andersen-ole_luk:q2"}],"title":"夢神","author":"安徒生","group":"andersen","sourceTitle":"Ole-Luk-Oie, the Dream God","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#ole_luk","lines":[{"zh":"夢神夜裏輕輕走到孩子身邊，讓他們閉上眼睛。","py":"mèng shén yè lǐ qīng qīng zǒu dào hái zi shēn biān ， ràng tā men bì shàng yǎn jīng 。","paragraph":0},{"zh":"他帶着兩把傘，一把裏面有圖畫，能展開美夢；另一把沒有圖畫，孩子在下面便安靜睡到天明。","py":"tā dài zhe liǎng bǎ sǎn ， yī bǎ lǐ miàn yǒu tú huà ， néng zhǎn kāi měi mèng ； lìng yī bǎ méi yǒu tú huà ， hái zi zài xià miàn biàn ān jìng shuì dào tiān míng 。","paragraph":0},{"zh":"一個星期裏，他每天探望小雅爾瑪。","py":"yí gè xīng qī lǐ ， tā měi tiān tàn wàng xiǎo yǎ ěr mǎ 。","paragraph":1},{"zh":"房間的東西在夢中有了生命，書本和寫得不好的字也像在訴苦，夢神帶孩子到奇異的地方，連小老鼠的婚禮都能參加。","py":"fáng jiān de dōng xī zài mèng zhōng yǒu le shēng mìng ， shū běn hé xiě de bù hǎo de zì yě xiàng zài sù kǔ ， mèng shén dài hái zi dào qí yì de dì fāng ， lián xiǎo lǎo shǔ de hūn lǐ dōu néng cān jiā 。","paragraph":1},{"zh":"夢裏的旅程有時乘船，有時走進畫中，平凡房間變成寬廣世界。","py":"mèng lǐ de lǚ chéng yǒu shí chéng chuán ， yǒu shí zǒu jìn huà zhōng ， píng fán fáng jiān biàn chéng kuān guǎng shì jiè 。","paragraph":2},{"zh":"孩子也聽到書本、玩具和畫像不同的聲音，發現睡前熟悉的東西能長出許多故事。","py":"hái zi yě tīng dào shū běn 、 wán jù hé huà xiàng bù tóng de shēng yīn ， fā xiàn shuì qián shú xī de dōng xī néng zhǎng chū xǔ duō gù shì 。","paragraph":2},{"zh":"到了星期日，夢神介紹自己的兄弟死亡：他只來一次，也會說故事。","py":"dào le xīng qī rì ， mèng shén jiè shào zì jǐ de xiōng dì sǐ wáng ： tā zhǐ lái yī cì ， yě huì shuō gù shì 。","paragraph":3},{"zh":"小雅爾瑪起初陌生，聽後卻不再那麼害怕。","py":"xiǎo yǎ ěr mǎ qǐ chū mò shēng ， tīng hòu què bù zài nà me hài pà 。","paragraph":3},{"zh":"七夜的夢結束，想像與對生活的思考仍留在心裏。","py":"qī yè de mèng jié shù ， xiǎng xiàng yǔ duì shēng huó de sī kǎo réng liú zài xīn lǐ 。","paragraph":3}]},{"id":"andersen-last_dre","paragraphs":["海岸高處有一棵活了三百六十五年的老橡樹，水手常用牠辨認方向。夏天，蜉蝣在枝葉間飛舞，雖只活短短一天，仍覺得陽光與空氣使生命十分美好。","老樹起初覺得蜉蝣可憐，牠們卻不因生命短暫而悲傷。四季輪轉，冬天成了老樹休息的時候；聖誕前夜，海風吹起，牠在沉睡中做了一個特別的夢。","夢裏，老樹重新看見生命中遇過的人與動物，枝葉越長越高，彷彿升到雲間。牠又盼森林裏的小花、灌木和其他生命都能同行，大家便一同向明亮的高處上升。","現實中，暴風雨把老樹連根拔倒。第二天，船上的水手看見海岸失去熟悉的標記，為牠惋惜。老樹漫長的一生結束了，最後的夢卻把長短不同的生命連在一起。"],"questions":[{"q":"海上的水手怎樣使用老橡樹？","options":["把牠當作辨認海岸的標記","用牠的葉子作船帆","每天在樹洞買麵包","請牠預測所有風暴"],"answer":0,"explanation":"高處的大樹是航行者熟悉的岸上地標。","id":"andersen-last_dre:q0"},{"q":"蜉蝣對短暫的一天有甚麼感受？","options":["只想變成一個國王","完全不願飛翔","仍覺得生命美好","認為陽光毫無價值"],"answer":2,"explanation":"牠們享受短暫生命中的陽光，與老樹的想法不同。","id":"andersen-last_dre:q1"},{"q":"老橡樹在聖誕前夜的現實遭遇是甚麼？","options":["被水手完整搬上船","變成永不融化的冰","被暴風雨連根拔倒","長出一座銀色王宮"],"answer":2,"explanation":"牠夢見上升時，地上的身體卻在風暴中倒下。","id":"andersen-last_dre:q2"}],"title":"老橡樹的最後一個夢","author":"安徒生","group":"andersen","sourceTitle":"The Last Dream of the Old Oak","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#last_dre","lines":[{"zh":"海岸高處有一棵活了三百六十五年的老橡樹，水手常用牠辨認方向。","py":"hǎi àn gāo chù yǒu yī kē huó le sān bǎi liù shí wǔ nián de lǎo xiàng shù ， shuǐ shǒu cháng yòng tā biàn rèn fāng xiàng 。","paragraph":0},{"zh":"夏天，蜉蝣在枝葉間飛舞，雖只活短短一天，仍覺得陽光與空氣使生命十分美好。","py":"xià tiān ， fú yóu zài zhī yè jiān fēi wǔ ， suī zhǐ huó duǎn duǎn yī tiān ， réng jué de yáng guāng yǔ kōng qì shǐ shēng mìng shí fēn měi hǎo 。","paragraph":0},{"zh":"老樹起初覺得蜉蝣可憐，牠們卻不因生命短暫而悲傷。","py":"lǎo shù qǐ chū jué de fú yóu kě lián ， tā men què bù yīn shēng mìng duǎn zàn ér bēi shāng 。","paragraph":1},{"zh":"四季輪轉，冬天成了老樹休息的時候；聖誕前夜，海風吹起，牠在沉睡中做了一個特別的夢。","py":"sì jì lún zhuàn ， dōng tiān chéng le lǎo shù xiū xī de shí hòu ； shèng dàn qián yè ， hǎi fēng chuī qǐ ， tā zài chén shuì zhōng zuò le yí gè tè bié de mèng 。","paragraph":1},{"zh":"夢裏，老樹重新看見生命中遇過的人與動物，枝葉越長越高，彷彿升到雲間。","py":"mèng lǐ ， lǎo shù chóng xīn kàn jiàn shēng mìng zhòng yù guò de rén yǔ dòng wù ， zhī yè yuè zhǎng yuè gāo ， fǎng fú shēng dào yún jiān 。","paragraph":2},{"zh":"牠又盼森林裏的小花、灌木和其他生命都能同行，大家便一同向明亮的高處上升。","py":"tā yòu pàn sēn lín lǐ de xiǎo huā 、 guàn mù hé qí tā shēng mìng dōu néng tóng háng ， dà jiā biàn yī tóng xiàng míng liàng de gāo chù shàng shēng 。","paragraph":2},{"zh":"現實中，暴風雨把老樹連根拔倒。","py":"xiàn shí zhōng ， bào fēng yǔ bǎ lǎo shù lián gēn bá dǎo 。","paragraph":3},{"zh":"第二天，船上的水手看見海岸失去熟悉的標記，為牠惋惜。","py":"dì èr tiān ， chuán shàng de shuǐ shǒu kàn jiàn hǎi àn shī qù shú xī de biāo jì ， wèi tā wǎn xī 。","paragraph":3},{"zh":"老樹漫長的一生結束了，最後的夢卻把長短不同的生命連在一起。","py":"lǎo shù màn cháng de yī shēng jié shù le ， zuì hòu de mèng què bǎ cháng duǎn bù tóng de shēng mìng lián zài yì qǐ 。","paragraph":3}]},{"id":"andersen-travelng","paragraphs":["約翰的父親去世後，他獨自出外旅行。在教堂借宿時，他看見有人因死者欠債，想把遺體拖出去，便拿出自己的錢，讓死者可以安心留在棺木裏。","第二天，他遇見一位願意同行的旅伴。旅伴沿途收集看似普通的物件，後來兩人來到一座城，公主要求求婚者猜中自己的心思，猜不中便要遭遇危險。","旅伴暗中跟隨受魔法控制的公主，發現她與山中魔法師的秘密，幫約翰答對考驗。婚後，他又教約翰解除公主身上的魔法，使她不再受邪惡力量支配。","約翰十分感激，請旅伴永遠留下。旅伴卻說，自己正是教堂中那位受他幫助的死者，現在只是回來還恩。說完便消失了，約翰也帶着善意得到的回報繼續生活。"],"questions":[{"q":"約翰在教堂用自己的錢幫忙做甚麼？","options":["讓欠債死者的遺體不被拖走","買下公主的金王冠","請人替自己建一座塔","買一條會飛的船"],"answer":0,"explanation":"他出錢阻止別人侮辱死者，沒有期待回報。","id":"andersen-travelng:q0"},{"q":"旅伴怎樣幫約翰應付公主的考驗？","options":["叫公主取消所有問題","把全城人變成樹","暗中查明公主與魔法師的秘密","拿走國王所有金錢"],"answer":2,"explanation":"旅伴掌握真相，讓約翰能答對危險的猜心考驗。","id":"andersen-travelng:q1"},{"q":"旅伴最後揭示自己是誰？","options":["國王失散的弟弟","一位喬裝的裁縫","藏在箱子裏的商人","約翰曾在教堂幫助的死者"],"answer":3,"explanation":"他說自己前來是為了報答約翰的善行，然後消失。","id":"andersen-travelng:q2"}],"title":"旅伴","author":"安徒生","group":"andersen","sourceTitle":"The Travelling Companion","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#travelng","lines":[{"zh":"約翰的父親去世後，他獨自出外旅行。","py":"yuē hàn de fù qīn qù shì hòu ， tā dú zì chū wài lǚ xíng 。","paragraph":0},{"zh":"在教堂借宿時，他看見有人因死者欠債，想把遺體拖出去，便拿出自己的錢，讓死者可以安心留在棺木裏。","py":"zài jiào táng jiè sù shí ， tā kàn jiàn yǒu rén yīn sǐ zhě qiàn zhài ， xiǎng bǎ yí tǐ tuō chū qù ， biàn ná chū zì jǐ de qián ， ràng sǐ zhě kě yǐ ān xīn liú zài guān mù lǐ 。","paragraph":0},{"zh":"第二天，他遇見一位願意同行的旅伴。","py":"dì èr tiān ， tā yù jiàn yī wèi yuàn yì tóng háng de lǚ bàn 。","paragraph":1},{"zh":"旅伴沿途收集看似普通的物件，後來兩人來到一座城，公主要求求婚者猜中自己的心思，猜不中便要遭遇危險。","py":"lǚ bàn yán tú shōu jí kàn shì pǔ tōng de wù jiàn ， hòu lái liǎng rén lái dào yī zuò chéng ， gōng zhǔ yào qiú qiú hūn zhě cāi zhōng zì jǐ de xīn sī ， cāi bù zhōng biàn yào zāo yù wēi xiǎn 。","paragraph":1},{"zh":"旅伴暗中跟隨受魔法控制的公主，發現她與山中魔法師的秘密，幫約翰答對考驗。","py":"lǚ bàn àn zhōng gēn suí shòu mó fǎ kòng zhì de gōng zhǔ ， fā xiàn tā yǔ shān zhōng mó fǎ shī de mì mì ， bāng yuē hàn dá duì kǎo yàn 。","paragraph":2},{"zh":"婚後，他又教約翰解除公主身上的魔法，使她不再受邪惡力量支配。","py":"hūn hòu ， tā yòu jiāo yuē hàn jiě chú gōng zhǔ shēn shàng de mó fǎ ， shǐ tā bù zài shòu xié è lì liàng zhī pèi 。","paragraph":2},{"zh":"約翰十分感激，請旅伴永遠留下。","py":"yuē hàn shí fēn gǎn jī ， qǐng lǚ bàn yǒng yuǎn liú xià 。","paragraph":3},{"zh":"旅伴卻說，自己正是教堂中那位受他幫助的死者，現在只是回來還恩。","py":"lǚ bàn què shuō ， zì jǐ zhèng shì jiào táng zhōng nà wèi shòu tā bāng zhù de sǐ zhě ， xiàn zài zhǐ shì huí lái huán ēn 。","paragraph":3},{"zh":"說完便消失了，約翰也帶着善意得到的回報繼續生活。","py":"shuō wán biàn xiāo shī le ， yuē hàn yě dài zhe shàn yì dé dào de huí bào jì xù shēng huó 。","paragraph":3}]},{"id":"andersen-shadow","paragraphs":["一位學者到炎熱的地方旅行，常在夜裏坐在陽台。他看見對面房屋十分神秘，便開玩笑叫自己的影子進去看看。影子真的離開了，再也沒有跟着他回房。","多年後，影子以富人的模樣回來，說自己已學會世間的秘密。學者仍過得清貧，影子卻有財富和人脈，邀他同行，條件是讓學者反過來充當自己的影子。","旅行途中，影子認識一位公主，用從學者那裏得來的知識取得信任，準備與她成婚。學者受不了身份顛倒，打算向大家說出真相，不願繼續接受虛假的安排。","影子搶先告訴公主，自己的影子發瘋，以為是真人。學者因此被囚，最後被處死，影子卻舉行盛大婚禮。這個沉重結局，讓人看見謊言借權勢壓過真話的危險。"],"questions":[{"q":"影子最初怎樣離開學者？","options":["被紅鞋帶到森林","搭上去海底的船","應玩笑之言走進對面的神秘房屋","掉進一口枯井"],"answer":2,"explanation":"學者叫影子去探看，沒想到它真的離開。","id":"andersen-shadow:q0"},{"q":"影子後來要求學者以甚麼身份同行？","options":["森林的國王","公主的弟弟","影子的影子","王宮的醫生"],"answer":2,"explanation":"兩者身份被顛倒，真人反而要跟在影子身旁。","id":"andersen-shadow:q1"},{"q":"學者準備說出真相後，影子怎樣阻止他？","options":["誣稱他是發瘋的影子","把所有書都送給他","承認自己沒有知識","請他立即回到故鄉"],"answer":0,"explanation":"影子利用先取得的信任，使學者失去替自己辯解的機會。","id":"andersen-shadow:q2"}],"title":"影子","author":"安徒生","group":"andersen","sourceTitle":"The Shadow","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#shadow","lines":[{"zh":"一位學者到炎熱的地方旅行，常在夜裏坐在陽台。","py":"yī wèi xué zhě dào yán rè de dì fāng lǚ xíng ， cháng zài yè lǐ zuò zài yáng tái 。","paragraph":0},{"zh":"他看見對面房屋十分神秘，便開玩笑叫自己的影子進去看看。","py":"tā kàn jiàn duì miàn fáng wū shí fēn shén mì ， biàn kāi wán xiào jiào zì jǐ de yǐng zi jìn qù kàn kàn 。","paragraph":0},{"zh":"影子真的離開了，再也沒有跟着他回房。","py":"yǐng zi zhēn de lí kāi le ， zài yě méi yǒu gēn zhe tā huí fáng 。","paragraph":0},{"zh":"多年後，影子以富人的模樣回來，說自己已學會世間的秘密。","py":"duō nián hòu ， yǐng zi yǐ fù rén de mú yàng huí lái ， shuō zì jǐ yǐ xué huì shì jiān de mì mì 。","paragraph":1},{"zh":"學者仍過得清貧，影子卻有財富和人脈，邀他同行，條件是讓學者反過來充當自己的影子。","py":"xué zhě réng guò de qīng pín ， yǐng zi què yǒu cái fù hé rén mài ， yāo tā tóng háng ， tiáo jiàn shì ràng xué zhě fǎn guò lái chōng dāng zì jǐ de yǐng zi 。","paragraph":1},{"zh":"旅行途中，影子認識一位公主，用從學者那裏得來的知識取得信任，準備與她成婚。","py":"lǚ xíng tú zhōng ， yǐng zi rèn shí yī wèi gōng zhǔ ， yòng cóng xué zhě nà lǐ dé lái de zhī shí qǔ dé xìn rèn ， zhǔn bèi yǔ tā chéng hūn 。","paragraph":2},{"zh":"學者受不了身份顛倒，打算向大家說出真相，不願繼續接受虛假的安排。","py":"xué zhě shòu bù liǎo shēn fèn diān dǎo ， dǎ suàn xiàng dà jiā shuō chū zhēn xiàng ， bù yuàn jì xù jiē shòu xū jiǎ de ān pái 。","paragraph":2},{"zh":"影子搶先告訴公主，自己的影子發瘋，以為是真人。","py":"yǐng zi qiǎng xiān gào sù gōng zhǔ ， zì jǐ de yǐng zi fā fēng ， yǐ wéi shì zhēn rén 。","paragraph":3},{"zh":"學者因此被囚，最後被處死，影子卻舉行盛大婚禮。","py":"xué zhě yīn cǐ bèi qiú ， zuì hòu bèi chǔ sǐ ， yǐng zi què jǔ xíng shèng dà hūn lǐ 。","paragraph":3},{"zh":"這個沉重結局，讓人看見謊言借權勢壓過真話的危險。","py":"zhè ge chén zhòng jié jú ， ràng rén kàn jiàn huǎng yán jiè quán shì yā guò zhēn huà de wēi xiǎn 。","paragraph":3}]},{"id":"andersen-darning","paragraphs":["一根縫衣針總覺得自己細緻高貴，不該做粗活。手指拿牠去縫舊拖鞋，牠不斷抱怨，還警告別太用力，最後果然折斷，被丟到一旁。","有人用封蠟把斷針固定在衣服上，牠又覺得自己成了胸針，更加得意。可是牠掉進水溝，遇見一塊發亮的玻璃，兩者互相稱讚，都把自己想得非常珍貴。","水流把玻璃帶走，針卻留在泥裏。孩子到水溝尋找小東西，被牠扎到，才把牠撿起。牠雖然已經變黑，仍認為黑色讓自己看起來更纖細，更有氣派。","孩子把牠插在蛋殼上，當成一條小船。車輪壓過，蛋殼碎了，針仍留在地上。牠一路改變處境，卻從未改變自以為高貴的想法，也沒有真正看清自己。"],"questions":[{"q":"縫衣針最初在甚麼工作中折斷？","options":["替皇帝織新衣","修理一艘金船","替天鵝編羽毛","縫補舊拖鞋"],"answer":3,"explanation":"牠抱怨工作太粗重，最後在縫拖鞋時折斷。","id":"andersen-darning:q0"},{"q":"縫衣針在水溝把誰當成珍貴同伴？","options":["一枚真正的鑽石","一位失蹤公主","一根金色頭髮","一塊發亮的玻璃"],"answer":3,"explanation":"牠與玻璃互相奉承，沒有認清彼此的實際處境。","id":"andersen-darning:q1"},{"q":"孩子最後把縫衣針插在哪裏？","options":["一朵玫瑰心","蛋殼上","王冠中央","銀色馬車裏"],"answer":1,"explanation":"蛋殼被當成小船，後來在車輪下碎裂。","id":"andersen-darning:q2"}],"title":"縫衣針","author":"安徒生","group":"andersen","sourceTitle":"The Darning-Needle","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#darning","lines":[{"zh":"一根縫衣針總覺得自己細緻高貴，不該做粗活。","py":"yī gēn féng yī zhēn zǒng jué de zì jǐ xì zhì gāo guì ， bù gāi zuò cū huó 。","paragraph":0},{"zh":"手指拿牠去縫舊拖鞋，牠不斷抱怨，還警告別太用力，最後果然折斷，被丟到一旁。","py":"shǒu zhǐ ná tā qù féng jiù tuō xié ， tā bù duàn bào yuàn ， hái jǐng gào bié tài yòng lì ， zuì hòu guǒ rán zhé duàn ， bèi diū dào yī páng 。","paragraph":0},{"zh":"有人用封蠟把斷針固定在衣服上，牠又覺得自己成了胸針，更加得意。","py":"yǒu rén yòng fēng là bǎ duàn zhēn gù dìng zài yī fú shàng ， tā yòu jué de zì jǐ chéng le xiōng zhēn ， gèng jiā dé yì 。","paragraph":1},{"zh":"可是牠掉進水溝，遇見一塊發亮的玻璃，兩者互相稱讚，都把自己想得非常珍貴。","py":"kě shì tā diào jìn shuǐ gōu ， yù jiàn yī kuài fā liàng de bō lí ， liǎng zhě hù xiāng chēng zàn ， dōu bǎ zì jǐ xiǎng de fēi cháng zhēn guì 。","paragraph":1},{"zh":"水流把玻璃帶走，針卻留在泥裏。","py":"shuǐ liú bǎ bō lí dài zǒu ， zhēn què liú zài ní lǐ 。","paragraph":2},{"zh":"孩子到水溝尋找小東西，被牠扎到，才把牠撿起。","py":"hái zi dào shuǐ gōu xún zhǎo xiǎo dōng xī ， bèi tā zhā dào ， cái bǎ tā jiǎn qǐ 。","paragraph":2},{"zh":"牠雖然已經變黑，仍認為黑色讓自己看起來更纖細，更有氣派。","py":"tā suī rán yǐ jīng biàn hēi ， réng rèn wéi hēi sè ràng zì jǐ kàn qǐ lái gèng xiān xì ， gèng yǒu qì pài 。","paragraph":2},{"zh":"孩子把牠插在蛋殼上，當成一條小船。","py":"hái zi bǎ tā chā zài dàn ké shàng ， dàng chéng yī tiáo xiǎo chuán 。","paragraph":3},{"zh":"車輪壓過，蛋殼碎了，針仍留在地上。","py":"chē lún yā guò ， dàn ké suì le ， zhēn réng liú zài dì shàng 。","paragraph":3},{"zh":"牠一路改變處境，卻從未改變自以為高貴的想法，也沒有真正看清自己。","py":"tā yī lù gǎi biàn chǔ jìng ， què cóng wèi gǎi biàn zì yǐ wéi gāo guì de xiǎng fǎ ， yě méi yǒu zhēn zhèng kàn qīng zì jǐ 。","paragraph":3}]},{"id":"andersen-flax","paragraphs":["田裏的亞麻開着細小藍花，在陽光和雨水中生長，覺得自己十分幸福。人們說牠能做成漂亮的布，牠便期待將來，不相信生命只能在花落時結束。","收割時，亞麻被拔起、浸泡、敲打，再紡成線。過程並不舒服，牠卻變成了潔白的布，又被裁成衣物，才發現先前的痛苦帶來另一種用處。","衣物穿舊後，又被撕成碎片做成紙。紙上寫進知識與故事，送去印成書。亞麻覺得，自己不只遮護身體，現在還能讓更多人讀到有價值的思想。","最後，舊紙被投入火中，文字化成亮光，細小火星向上飛。孩子以為一切已完，故事卻讓看不見的小生命說，還有新的美好；亞麻每次以為終結，都曾遇上新的開始。"],"questions":[{"q":"亞麻最初開的是甚麼顏色的花？","options":["金色","橙色","藍色","黑色"],"answer":2,"explanation":"故事從田裏細小的藍花開始，之後才經歷加工。","id":"andersen-flax:q0"},{"q":"穿舊的亞麻衣物後來變成甚麼？","options":["永不融化的雪","一群會說話的魚","一面金色鏡子","可以寫字的紙"],"answer":3,"explanation":"碎布被加工成紙，讓亞麻有了傳遞思想的新用途。","id":"andersen-flax:q1"},{"q":"紙上的知識與故事後來怎樣傳給更多人？","options":["寫在每片雪花上","印成書本","埋進海底","藏在空織機裏"],"answer":1,"explanation":"紙上的內容被印刷，能讓更多讀者接觸。","id":"andersen-flax:q2"}],"title":"亞麻","author":"安徒生","group":"andersen","sourceTitle":"The Flax","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#flax","lines":[{"zh":"田裏的亞麻開着細小藍花，在陽光和雨水中生長，覺得自己十分幸福。","py":"tián lǐ de yà má kāi zhe xì xiǎo lán huā ， zài yáng guāng hé yǔ shuǐ zhōng shēng zhǎng ， jué de zì jǐ shí fēn xìng fú 。","paragraph":0},{"zh":"人們說牠能做成漂亮的布，牠便期待將來，不相信生命只能在花落時結束。","py":"rén men shuō tā néng zuò chéng piào liàng de bù ， tā biàn qī dài jiāng lái ， bù xiāng xìn shēng mìng zhǐ néng zài huā luò shí jié shù 。","paragraph":0},{"zh":"收割時，亞麻被拔起、浸泡、敲打，再紡成線。","py":"shōu gē shí ， yà má bèi bá qǐ 、 jìn pào 、 qiāo dǎ ， zài fǎng chéng xiàn 。","paragraph":1},{"zh":"過程並不舒服，牠卻變成了潔白的布，又被裁成衣物，才發現先前的痛苦帶來另一種用處。","py":"guò chéng bìng bù shū fú ， tā què biàn chéng le jié bái de bù ， yòu bèi cái chéng yī wù ， cái fā xiàn xiān qián de tòng kǔ dài lái lìng yī zhǒng yòng chù 。","paragraph":1},{"zh":"衣物穿舊後，又被撕成碎片做成紙。","py":"yī wù chuān jiù hòu ， yòu bèi sī chéng suì piàn zuò chéng zhǐ 。","paragraph":2},{"zh":"紙上寫進知識與故事，送去印成書。","py":"zhǐ shàng xiě jìn zhī shí yǔ gù shì ， sòng qù yìn chéng shū 。","paragraph":2},{"zh":"亞麻覺得，自己不只遮護身體，現在還能讓更多人讀到有價值的思想。","py":"yà má jué de ， zì jǐ bù zhǐ zhē hù shēn tǐ ， xiàn zài hái néng ràng gèng duō rén dú dào yǒu jià zhí de sī xiǎng 。","paragraph":2},{"zh":"最後，舊紙被投入火中，文字化成亮光，細小火星向上飛。","py":"zuì hòu ， jiù zhǐ bèi tóu rù huǒ zhōng ， wén zì huà chéng liàng guāng ， xì xiǎo huǒ xīng xiàng shàng fēi 。","paragraph":3},{"zh":"孩子以為一切已完，故事卻讓看不見的小生命說，還有新的美好；亞麻每次以為終結，都曾遇上新的開始。","py":"hái zi yǐ wéi yī qiè yǐ wán ， gù shì què ràng kàn bú jiàn de xiǎo shēng mìng shuō ， hái yǒu xīn de měi hǎo ； yà má měi cì yǐ wéi zhōng jié ， dōu céng yù shàng xīn de kāi shǐ 。","paragraph":3}]},{"id":"andersen-shepherd","paragraphs":["桌上站着一個瓷牧羊女和一個瓷掃煙囪人，兩人彼此喜歡。旁邊的老瓷人自稱是她的祖父，卻點頭同意，讓她嫁給櫥櫃上模樣古怪的木雕人物。","牧羊女不願接受安排，請掃煙囪人帶她逃走。他們爬下桌子，躲進抽屜，再沿煙囪向上。狹窄的黑暗使她害怕，可是對方一直陪在身旁，終於爬到屋頂。","屋外的天空太廣闊，星星太多，牧羊女又不習慣，哭着想回原來的地方。掃煙囪人沒有把她留下，陪她重新爬回屋裏，卻發現老瓷人追趕時已摔破。","家人把老瓷人修好，在頸後加了一枚鉚釘，他卻不能再點頭。木雕人物得不到新的同意，婚事便停下了。牧羊女和掃煙囪人仍並肩站着，在熟悉的桌上相伴。"],"questions":[{"q":"老瓷人原本同意牧羊女嫁給誰？","options":["掃煙囪人","櫥櫃上的木雕人物","海上的王子","房裏的小男孩"],"answer":1,"explanation":"他答應的是木雕人物的求婚，與牧羊女的心意不同。","id":"andersen-shepherd:q0"},{"q":"牧羊女到了屋頂後為甚麼想回去？","options":["想回去學打鐵","覺得外面太廣闊而害怕","找不到自己的金幣","被天鵝趕離煙囪"],"answer":1,"explanation":"她本想離開，到了陌生大世界又覺得不安。","id":"andersen-shepherd:q1"},{"q":"修好的老瓷人為甚麼無法再點頭？","options":["脖子變成了一朵花","頸後加了固定用的鉚釘","被夢神收走了帽子","忘記怎樣說話"],"answer":1,"explanation":"修補使他的頸部不能活動，木雕人物也等不到同意。","id":"andersen-shepherd:q2"}],"title":"牧羊女和掃煙囪的人","author":"安徒生","group":"andersen","sourceTitle":"The Shepherdess and the Sheep","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#shepherd","lines":[{"zh":"桌上站着一個瓷牧羊女和一個瓷掃煙囪人，兩人彼此喜歡。","py":"zhuō shàng zhàn zhe yí gè cí mù yáng nǚ hé yí gè cí sǎo yān cōng rén ， liǎng rén bǐ cǐ xǐ huān 。","paragraph":0},{"zh":"旁邊的老瓷人自稱是她的祖父，卻點頭同意，讓她嫁給櫥櫃上模樣古怪的木雕人物。","py":"páng biān de lǎo cí rén zì chēng shì tā de zǔ fù ， què diǎn tóu tóng yì ， ràng tā jià gěi chú guì shàng mú yàng gǔ guài de mù diāo rén wù 。","paragraph":0},{"zh":"牧羊女不願接受安排，請掃煙囪人帶她逃走。","py":"mù yáng nǚ bù yuàn jiē shòu ān pái ， qǐng sǎo yān cōng rén dài tā táo zǒu 。","paragraph":1},{"zh":"他們爬下桌子，躲進抽屜，再沿煙囪向上。","py":"tā men pá xià zhuō zi ， duǒ jìn chōu tì ， zài yán yān cōng xiàng shàng 。","paragraph":1},{"zh":"狹窄的黑暗使她害怕，可是對方一直陪在身旁，終於爬到屋頂。","py":"xiá zhǎi de hēi àn shǐ tā hài pà ， kě shì duì fāng yì zhí péi zài shēn páng ， zhōng yú pá dào wū dǐng 。","paragraph":1},{"zh":"屋外的天空太廣闊，星星太多，牧羊女又不習慣，哭着想回原來的地方。","py":"wū wài de tiān kōng tài guǎng kuò ， xīng xīng tài duō ， mù yáng nǚ yòu bù xí guàn ， kū zhe xiǎng huí yuán lái de dì fāng 。","paragraph":2},{"zh":"掃煙囪人沒有把她留下，陪她重新爬回屋裏，卻發現老瓷人追趕時已摔破。","py":"sǎo yān cōng rén méi yǒu bǎ tā liú xià ， péi tā chóng xīn pá huí wū lǐ ， què fā xiàn lǎo cí rén zhuī gǎn shí yǐ shuāi pò 。","paragraph":2},{"zh":"家人把老瓷人修好，在頸後加了一枚鉚釘，他卻不能再點頭。","py":"jiā rén bǎ lǎo cí rén xiū hǎo ， zài jǐng hòu jiā le yī méi mǎo dīng ， tā què bù néng zài diǎn tóu 。","paragraph":3},{"zh":"木雕人物得不到新的同意，婚事便停下了。","py":"mù diāo rén wù de bú dào xīn de tóng yì ， hūn shì biàn tíng xià le 。","paragraph":3},{"zh":"牧羊女和掃煙囪人仍並肩站着，在熟悉的桌上相伴。","py":"mù yáng nǚ hé sǎo yān cōng rén réng bìng jiān zhàn zhe ， zài shú xī de zhuō shàng xiàng bàn 。","paragraph":3}]},{"id":"andersen-butterfl","paragraphs":["一隻蝴蝶想找一朵最合心意的花作伴，卻不願花太多心思。他先請雛菊替自己占卜，雛菊沒有回答，他只好飛到花叢，逐一挑選，心裏不停比較。","春花在他眼裏太年輕，另一些花又太莊重或太平常。他總能找出新的不滿，遲遲不作決定，等想再回頭看看時，先前盛開的花已過了花期。","夏天過去，秋天也到了。他最後向薄荷表示心意，薄荷卻說，彼此年紀已大，做朋友就好。蝴蝶仍想要陽光、自由和一朵花，卻不明白季節不會等待自己。","天冷後，他飛進溫暖房間，被人抓住，釘進收藏盒。他安慰自己，現在像花一樣固定在枝上，旁邊的盆栽卻覺得這安慰太勉強。長久的挑剔，最後沒有帶來他想要的生活。"],"questions":[{"q":"蝴蝶最先請哪種花替自己占卜？","options":["雛菊","樅樹的花","蕎麥花","雪中的梅花"],"answer":0,"explanation":"他想讓雛菊幫忙決定，卻沒有得到回答。","id":"andersen-butterfl:q0"},{"q":"蝴蝶一直選不到伴侶，主要因為甚麼？","options":["不停挑剔，遲遲不決定","所有花都搬到海底","他從來不能飛行","房裏沒有一扇窗"],"answer":0,"explanation":"他對每朵花都有不滿，時間便在比較中流走。","id":"andersen-butterfl:q1"},{"q":"蝴蝶最後被放到甚麼地方？","options":["裝滿金子的樹洞","用針固定的收藏盒","開滿鮮花的山谷","一頂魔法雨傘裏"],"answer":1,"explanation":"他得到溫暖，卻在收藏盒裏失去了想要的自由。","id":"andersen-butterfl:q2"}],"title":"蝴蝶","author":"安徒生","group":"andersen","sourceTitle":"The Butterfly","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#butterfl","lines":[{"zh":"一隻蝴蝶想找一朵最合心意的花作伴，卻不願花太多心思。","py":"yī zhī hú dié xiǎng zhǎo yī duǒ zuì hé xīn yì de huā zuò bàn ， què bù yuàn huā tài duō xīn sī 。","paragraph":0},{"zh":"他先請雛菊替自己占卜，雛菊沒有回答，他只好飛到花叢，逐一挑選，心裏不停比較。","py":"tā xiān qǐng chú jú tì zì jǐ zhān bǔ ， chú jú méi yǒu huí dá ， tā zhǐ hǎo fēi dào huā cóng ， zhú yī tiāo xuǎn ， xīn lǐ bù tíng bǐ jiào 。","paragraph":0},{"zh":"春花在他眼裏太年輕，另一些花又太莊重或太平常。","py":"chūn huā zài tā yǎn lǐ tài nián qīng ， lìng yī xiē huā yòu tài zhuāng zhòng huò tài píng cháng 。","paragraph":1},{"zh":"他總能找出新的不滿，遲遲不作決定，等想再回頭看看時，先前盛開的花已過了花期。","py":"tā zǒng néng zhǎo chū xīn de bù mǎn ， chí chí bù zuò jué dìng ， děng xiǎng zài huí tóu kàn kàn shí ， xiān qián shèng kāi de huā yǐ guò le huā qī 。","paragraph":1},{"zh":"夏天過去，秋天也到了。","py":"xià tiān guò qù ， qiū tiān yě dào le 。","paragraph":2},{"zh":"他最後向薄荷表示心意，薄荷卻說，彼此年紀已大，做朋友就好。","py":"tā zuì hòu xiàng bò hé biǎo shì xīn yì ， bò hé què shuō ， bǐ cǐ nián jì yǐ dà ， zuò péng yǒu jiù hǎo 。","paragraph":2},{"zh":"蝴蝶仍想要陽光、自由和一朵花，卻不明白季節不會等待自己。","py":"hú dié réng xiǎng yào yáng guāng 、 zì yóu hé yī duǒ huā ， què bù míng bái jì jié bú huì děng dài zì jǐ 。","paragraph":2},{"zh":"天冷後，他飛進溫暖房間，被人抓住，釘進收藏盒。","py":"tiān lěng hòu ， tā fēi jìn wēn nuǎn fáng jiān ， bèi rén zhuā zhù ， dīng jìn shōu cáng hé 。","paragraph":3},{"zh":"他安慰自己，現在像花一樣固定在枝上，旁邊的盆栽卻覺得這安慰太勉強。","py":"tā ān wèi zì jǐ ， xiàn zài xiàng huā yī yàng gù dìng zài zhī shàng ， páng biān de pén zāi què jué de zhè ān wèi tài miǎn qiǎng 。","paragraph":3},{"zh":"長久的挑剔，最後沒有帶來他想要的生活。","py":"cháng jiǔ de tiāo tī ， zuì hòu méi yǒu dài lái tā xiǎng yào de shēng huó 。","paragraph":3}]},{"id":"andersen-pea_blos","paragraphs":["五粒豌豆住在同一個豆莢，因為四周都是綠色，便以為整個世界也是綠的。成熟後，豆莢變黃，牠們又以為世界換了顏色，還盼望能到外面看看。","一個男孩摘開豆莢，把豆子當作小彈丸射出去。有的想飛向遠方，有的想直上太陽，最後一粒只說，事情會怎樣就怎樣，結果落進閣樓窗邊的裂縫裏。","屋裏住着一個貧窮母親和生病的女兒。小豆在泥土和青苔間發芽，姑娘從床上看見它長高，每天有了盼望；母親也替嫩芽搭起小棍，讓它繼續攀爬。","豌豆開花時，姑娘已能坐起來，後來走到窗前。其他豆子有的被鴿子吃掉，有的在污水裏發脹，自以為了不起。最不起眼的那一粒，卻把希望帶進了一間小屋。"],"questions":[{"q":"豆莢裏的豌豆起初為甚麼以為世界全是綠色？","options":["被冰雪女王下了命令","只看見自己周圍的綠色","聽見國王這樣宣布","讀過一張世界地圖"],"answer":1,"explanation":"牠們把狹小環境中的觀察，當成了整個世界的樣子。","id":"andersen-pea_blos:q0"},{"q":"最後一粒豌豆落在甚麼地方？","options":["大海中央的船上","閣樓窗邊的裂縫","皇宮的金碗","森林的鳥巢"],"answer":1,"explanation":"那裏的泥土和青苔，讓豆子有機會發芽。","id":"andersen-pea_blos:q1"},{"q":"窗邊豆苗對生病女孩有甚麼影響？","options":["替她趕走所有季節","使她每天有新的盼望","讓她立刻變成公主","使她永遠不用吃飯"],"answer":1,"explanation":"看着嫩芽成長，女孩漸漸對生活恢復期待。","id":"andersen-pea_blos:q2"}],"title":"豌豆上的五粒豆","author":"安徒生","group":"andersen","sourceTitle":"The Pea Blossom","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#pea_blos","lines":[{"zh":"五粒豌豆住在同一個豆莢，因為四周都是綠色，便以為整個世界也是綠的。","py":"wǔ lì wān dòu zhù zài tóng yī gè dòu jiá ， yīn wèi sì zhōu dōu shì lǜ sè ， biàn yǐ wéi zhěng gè shì jiè yě shì lǜ de 。","paragraph":0},{"zh":"成熟後，豆莢變黃，牠們又以為世界換了顏色，還盼望能到外面看看。","py":"chéng shú hòu ， dòu jiá biàn huáng ， tā men yòu yǐ wéi shì jiè huàn le yán sè ， hái pàn wàng néng dào wài miàn kàn kàn 。","paragraph":0},{"zh":"一個男孩摘開豆莢，把豆子當作小彈丸射出去。","py":"yí gè nán hái zhāi kāi dòu jiá ， bǎ dòu zi dàng zuò xiǎo dàn wán shè chū qù 。","paragraph":1},{"zh":"有的想飛向遠方，有的想直上太陽，最後一粒只說，事情會怎樣就怎樣，結果落進閣樓窗邊的裂縫裏。","py":"yǒu de xiǎng fēi xiàng yuǎn fāng ， yǒu de xiǎng zhí shàng tài yáng ， zuì hòu yī lì zhǐ shuō ， shì qíng huì zěn yàng jiù zěn yàng ， jié guǒ luò jìn gé lóu chuāng biān de liè fèng lǐ 。","paragraph":1},{"zh":"屋裏住着一個貧窮母親和生病的女兒。","py":"wū lǐ zhù zhe yí gè pín qióng mǔ qīn hé shēng bìng de nǚ ér 。","paragraph":2},{"zh":"小豆在泥土和青苔間發芽，姑娘從床上看見它長高，每天有了盼望；母親也替嫩芽搭起小棍，讓它繼續攀爬。","py":"xiǎo dòu zài ní tǔ hé qīng tái jiān fā yá ， gū niang cóng chuáng shàng kàn jiàn tā zhǎng gāo ， měi tiān yǒu le pàn wàng ； mǔ qīn yě tì nèn yá dā qǐ xiǎo gùn ， ràng tā jì xù pān pá 。","paragraph":2},{"zh":"豌豆開花時，姑娘已能坐起來，後來走到窗前。","py":"wān dòu kāi huā shí ， gū niang yǐ néng zuò qǐ lái ， hòu lái zǒu dào chuāng qián 。","paragraph":3},{"zh":"其他豆子有的被鴿子吃掉，有的在污水裏發脹，自以為了不起。","py":"qí tā dòu zi yǒu de bèi gē zi chī diào ， yǒu de zài wū shuǐ lǐ fā zhàng ， zì yǐ wéi liǎo bù qǐ 。","paragraph":3},{"zh":"最不起眼的那一粒，卻把希望帶進了一間小屋。","py":"zuì bù qǐ yǎn de nà yī lì ， què bǎ xī wàng dài jìn le yī jiān xiǎo wū 。","paragraph":3}]},{"id":"andersen-saucy_bo","paragraphs":["暴風雨的夜晚，一位老詩人坐在爐邊，聽見門外有小孩哭着求助。他打開門，看見一個渾身濕透的男孩，便把他請進來，替他暖身，還拿出食物和飲料。","男孩的頭髮捲曲，眼睛明亮，手裏帶着弓箭。詩人擔心雨水弄壞他的弓，男孩卻說可以試試，隨即拉開弓弦，竟把一支箭射向好心收留自己的老人。","老人心裏疼痛，男孩卻笑着說，弓並沒有壞，接着跑出了門。他不是普通孩子，而是掌管愛情的丘比特；那支箭帶來的，也不只是外表看得見的傷。","詩人把這個淘氣男孩的事告訴別人，勸大家小心。可是丘比特仍會扮成學生，藏在人群和花園裏，讓許多人在毫無準備時，忽然遇上心動與思念。"],"questions":[{"q":"老詩人聽見求助聲後怎樣做？","options":["把火爐全部熄滅","要求男孩先交金子","讓男孩留在雨中等天亮","開門讓濕透的男孩進來取暖"],"answer":3,"explanation":"他先想到門外孩子的寒冷，主動提供幫助。","id":"andersen-saucy_bo:q0"},{"q":"男孩說要試弓，結果做了甚麼？","options":["把弓放進火爐燒掉","把箭射向老詩人","射下一根金色頭髮","替詩人修好窗戶"],"answer":1,"explanation":"詩人的關心，反而讓淘氣男孩找到試箭的機會。","id":"andersen-saucy_bo:q1"},{"q":"男孩的真正身份是甚麼？","options":["一位迷路的鐵匠","丘比特","夜鶯變成的國王","瓶子裏的精靈"],"answer":1,"explanation":"故事用丘比特的箭，描寫人突然產生的愛情感受。","id":"andersen-saucy_bo:q2"}],"title":"淘氣的小男孩","author":"安徒生","group":"andersen","sourceTitle":"The Saucy Boy","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#saucy_bo","lines":[{"zh":"暴風雨的夜晚，一位老詩人坐在爐邊，聽見門外有小孩哭着求助。","py":"bào fēng yǔ de yè wǎn ， yī wèi lǎo shī rén zuò zài lú biān ， tīng jiàn mén wài yǒu xiǎo hái kū zhe qiú zhù 。","paragraph":0},{"zh":"他打開門，看見一個渾身濕透的男孩，便把他請進來，替他暖身，還拿出食物和飲料。","py":"tā dǎ kāi mén ， kàn jiàn yí gè hún shēn shī tòu de nán hái ， biàn bǎ tā qǐng jìn lái ， tì tā nuǎn shēn ， hái ná chū shí wù hé yǐn liào 。","paragraph":0},{"zh":"男孩的頭髮捲曲，眼睛明亮，手裏帶着弓箭。","py":"nán hái de tóu fà juǎn qū ， yǎn jīng míng liàng ， shǒu lǐ dài zhe gōng jiàn 。","paragraph":1},{"zh":"詩人擔心雨水弄壞他的弓，男孩卻說可以試試，隨即拉開弓弦，竟把一支箭射向好心收留自己的老人。","py":"shī rén dān xīn yǔ shuǐ nòng huài tā de gōng ， nán hái què shuō kě yǐ shì shì ， suí jí lā kāi gōng xián ， jìng bǎ yī zhī jiàn shè xiàng hǎo xīn shōu liú zì jǐ de lǎo rén 。","paragraph":1},{"zh":"老人心裏疼痛，男孩卻笑着說，弓並沒有壞，接着跑出了門。","py":"lǎo rén xīn lǐ téng tòng ， nán hái què xiào zhe shuō ， gōng bìng méi yǒu huài ， jiē zhe pǎo chū le mén 。","paragraph":2},{"zh":"他不是普通孩子，而是掌管愛情的丘比特；那支箭帶來的，也不只是外表看得見的傷。","py":"tā bú shì pǔ tōng hái zi ， ér shì zhǎng guǎn ài qíng de qiū bǐ tè ； nà zhī jiàn dài lái de ， yě bù zhǐ shì wài biǎo kàn de jiàn de shāng 。","paragraph":2},{"zh":"詩人把這個淘氣男孩的事告訴別人，勸大家小心。","py":"shī rén bǎ zhè ge táo qì nán hái de shì gào sù bié rén ， quàn dà jiā xiǎo xīn 。","paragraph":3},{"zh":"可是丘比特仍會扮成學生，藏在人群和花園裏，讓許多人在毫無準備時，忽然遇上心動與思念。","py":"kě shì qiū bǐ tè réng huì bàn chéng xué shēng ， cáng zài rén qún hé huā yuán lǐ ， ràng xǔ duō rén zài háo wú zhǔn bèi shí ， hū rán yù shàng xīn dòng yǔ sī niàn 。","paragraph":3}]},{"id":"andersen-storks","paragraphs":["村屋頂上有一個鸛鳥巢，母鳥照顧四隻小鳥，父鳥則在附近守望。街上的孩子唱歌取笑牠們，歌裏還有可怕的話，小鸛鳥聽了，又生氣又害怕。","母鳥安慰孩子，告訴牠們先專心長大，練好飛行。父鳥介紹南方的河流與食物，準備季節轉冷時帶全家遠行；小鳥於是張開翅膀，認真學習起飛。","孩子群中有個叫彼得的男孩，說不應該取笑動物。小鸛鳥記住了他，也記住其他孩子的態度。等到牠們能飛，母鳥便談起鸛鳥把嬰兒送到人家的古老傳說。","故事按照這個想像，讓友善的彼得得到弟弟和妹妹，也讓取笑者面對不同結果。鸛鳥一家最後飛走，小鳥們還以彼得為名字，把那個善待牠們的孩子留在家族的記憶中。"],"questions":[{"q":"小鸛鳥起初為甚麼害怕？","options":["父鳥拿走牠們的翅膀","所有河流都已結金子","孩子唱的嘲笑歌裏有可怕內容","屋頂突然變成海底"],"answer":2,"explanation":"街上的歌使小鳥擔心自己會受傷害。","id":"andersen-storks:q0"},{"q":"母鳥讓小鸛鳥先專心做甚麼？","options":["長大並練習飛行","建一座金色王宮","每天與孩子爭吵","到火爐旁學唱歌"],"answer":0,"explanation":"牠們需要飛行能力，才能跟家人一起往南方。","id":"andersen-storks:q1"},{"q":"鸛鳥為甚麼特別記住彼得？","options":["他能把雪人搬上屋頂","他反對取笑動物","他送了全村最多金幣","他替國王織新衣"],"answer":1,"explanation":"彼得是孩子中願意出聲維護鸛鳥的人。","id":"andersen-storks:q2"}],"title":"鸛鳥","author":"安徒生","group":"andersen","sourceTitle":"The Storks","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#storks","lines":[{"zh":"村屋頂上有一個鸛鳥巢，母鳥照顧四隻小鳥，父鳥則在附近守望。","py":"cūn wū dǐng shàng yǒu yí gè guàn niǎo cháo ， mǔ niǎo zhào gù sì zhǐ xiǎo niǎo ， fù niǎo zé zài fù jìn shǒu wàng 。","paragraph":0},{"zh":"街上的孩子唱歌取笑牠們，歌裏還有可怕的話，小鸛鳥聽了，又生氣又害怕。","py":"jiē shàng de hái zi chàng gē qǔ xiào tā men ， gē lǐ hái yǒu kě pà de huà ， xiǎo guàn niǎo tīng le ， yòu shēng qì yòu hài pà 。","paragraph":0},{"zh":"母鳥安慰孩子，告訴牠們先專心長大，練好飛行。","py":"mǔ niǎo ān wèi hái zi ， gào sù tā men xiān zhuān xīn zhǎng dà ， liàn hǎo fēi xíng 。","paragraph":1},{"zh":"父鳥介紹南方的河流與食物，準備季節轉冷時帶全家遠行；小鳥於是張開翅膀，認真學習起飛。","py":"fù niǎo jiè shào nán fāng de hé liú yǔ shí wù ， zhǔn bèi jì jié zhuǎn lěng shí dài quán jiā yuǎn xíng ； xiǎo niǎo yú shì zhāng kāi chì bǎng ， rèn zhēn xué xí qǐ fēi 。","paragraph":1},{"zh":"孩子群中有個叫彼得的男孩，說不應該取笑動物。","py":"hái zi qún zhōng yǒu gè jiào bǐ dé de nán hái ， shuō bù yīng gāi qǔ xiào dòng wù 。","paragraph":2},{"zh":"小鸛鳥記住了他，也記住其他孩子的態度。","py":"xiǎo guàn niǎo jì zhù le tā ， yě jì zhù qí tā hái zi de tài dù 。","paragraph":2},{"zh":"等到牠們能飛，母鳥便談起鸛鳥把嬰兒送到人家的古老傳說。","py":"děng dào tā men néng fēi ， mǔ niǎo biàn tán qǐ guàn niǎo bǎ yīng ér sòng dào rén jiā de gǔ lǎo chuán shuō 。","paragraph":2},{"zh":"故事按照這個想像，讓友善的彼得得到弟弟和妹妹，也讓取笑者面對不同結果。","py":"gù shì àn zhào zhè ge xiǎng xiàng ， ràng yǒu shàn de bǐ dé dé dào dì di hé mèi mèi ， yě ràng qǔ xiào zhě miàn duì bù tóng jié guǒ 。","paragraph":3},{"zh":"鸛鳥一家最後飛走，小鳥們還以彼得為名字，把那個善待牠們的孩子留在家族的記憶中。","py":"guàn niǎo yī jiā zuì hòu fēi zǒu ， xiǎo niǎo men hái yǐ bǐ dé wéi míng zì ， bǎ nà ge shàn dài tā men de hái zi liú zài jiā zú de jì yì zhōng 。","paragraph":3}]},{"id":"andersen-happy_fa","paragraphs":["一片長滿牛蒡的大葉叢，對兩隻老白蝸牛來說，就是全世界最好的森林。牠們聽祖先說，自己一族很高貴，從前還會被送上大宅的銀盤，卻不懂那其實代表甚麼。","老蝸牛沒有親生孩子，便收養一隻小蝸牛，細心照顧。孩子長大後，牠們又請螞蟻和蚊子幫忙找伴侶，想選一個同樣有好家世、又不用遠行的對象。","蚊子找到另一隻小白蝸牛，兩個年輕蝸牛就在葉子下面成婚。螢火蟲帶來微光，婚禮安靜而簡單，老夫妻還把整片牛蒡林當成家產交給牠們。","新一代生了許多小蝸牛，卻始終沒被送去銀盤，便猜大宅已經不存在。沒有人反駁，牠們就深信自己的說法，在雨聲與陽光中過日子，幸福卻也一直局限在小小世界裏。"],"questions":[{"q":"老白蝸牛把甚麼地方當成整個世界？","options":["一個海底洞穴","牛蒡的大葉叢","皇宮的屋頂","冰雪女王的花園"],"answer":1,"explanation":"對行動緩慢的蝸牛，牛蒡林就是生活的全部範圍。","id":"andersen-happy_fa:q0"},{"q":"老夫妻怎樣有了孩子？","options":["向女巫買來木偶","在深井撈到一條魚","收養一隻小蝸牛","從金蛋孵出小鳥"],"answer":2,"explanation":"牠們收養孩子，後來還替牠尋找伴侶。","id":"andersen-happy_fa:q1"},{"q":"新一代為甚麼以為大宅不存在了？","options":["一直沒有蝸牛再被送到銀盤","親眼看見大宅沉入海底","聽國王宣布拆掉所有房屋","收到大宅主人寫來的信"],"answer":0,"explanation":"牠們只從自身經歷推測，沒有得到外界的證實。","id":"andersen-happy_fa:q2"}],"title":"幸福的一家","author":"安徒生","group":"andersen","sourceTitle":"The Happy Family","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#happy_fa","lines":[{"zh":"一片長滿牛蒡的大葉叢，對兩隻老白蝸牛來說，就是全世界最好的森林。","py":"yī piàn zhǎng mǎn niú bàng de dà yè cóng ， duì liǎng zhǐ lǎo bái wō niú lái shuō ， jiù shì quán shì jiè zuì hǎo de sēn lín 。","paragraph":0},{"zh":"牠們聽祖先說，自己一族很高貴，從前還會被送上大宅的銀盤，卻不懂那其實代表甚麼。","py":"tā men tīng zǔ xiān shuō ， zì jǐ yī zú hěn gāo guì ， cóng qián hái huì bèi sòng shàng dà zhái de yín pán ， què bù dǒng nà qí shí dài biǎo shén me 。","paragraph":0},{"zh":"老蝸牛沒有親生孩子，便收養一隻小蝸牛，細心照顧。","py":"lǎo wō niú méi yǒu qīn shēng hái zi ， biàn shōu yǎng yī zhī xiǎo wō niú ， xì xīn zhào gù 。","paragraph":1},{"zh":"孩子長大後，牠們又請螞蟻和蚊子幫忙找伴侶，想選一個同樣有好家世、又不用遠行的對象。","py":"hái zi zhǎng dà hòu ， tā men yòu qǐng mǎ yǐ hé wén zi bāng máng zhǎo bàn lǚ ， xiǎng xuǎn yí gè tóng yàng yǒu hǎo jiā shì 、 yòu bù yòng yuǎn xíng de duì xiàng 。","paragraph":1},{"zh":"蚊子找到另一隻小白蝸牛，兩個年輕蝸牛就在葉子下面成婚。","py":"wén zi zhǎo dào lìng yī zhī xiǎo bái wō niú ， liǎng gè nián qīng wō niú jiù zài yè zi xià miàn chéng hūn 。","paragraph":2},{"zh":"螢火蟲帶來微光，婚禮安靜而簡單，老夫妻還把整片牛蒡林當成家產交給牠們。","py":"yíng huǒ chóng dài lái wēi guāng ， hūn lǐ ān jìng ér jiǎn dān ， lǎo fū qī hái bǎ zhěng piàn niú bàng lín dàng chéng jiā chǎn jiāo gěi tā men 。","paragraph":2},{"zh":"新一代生了許多小蝸牛，卻始終沒被送去銀盤，便猜大宅已經不存在。","py":"xīn yí dài shēng le xǔ duō xiǎo wō niú ， què shǐ zhōng méi bèi sòng qù yín pán ， biàn cāi dà zhái yǐ jīng bù cún zài 。","paragraph":3},{"zh":"沒有人反駁，牠們就深信自己的說法，在雨聲與陽光中過日子，幸福卻也一直局限在小小世界裏。","py":"méi yǒu rén fǎn bó ， tā men jiù shēn xìn zì jǐ de shuō fǎ ， zài yǔ shēng yǔ yáng guāng zhōng guò rì zi ， xìng fú què yě yì zhí jú xiàn zài xiǎo xiǎo shì jiè lǐ 。","paragraph":3}]},{"id":"andersen-daisy","paragraphs":["路旁草地有一朵小雛菊，並不起眼，卻喜歡陽光，也喜歡聽雲雀唱歌。花園裏的大花看不起牠，雲雀卻飛到牠身邊，用歌聲稱讚這朵普通的小花。","第二天，雲雀被孩子抓進籠裏。孩子想給鳥一塊草地，便連同雛菊一起挖走，放在籠中。小花看見熟悉的鳥近在眼前，卻再也聽不到從前自由的歡唱。","孩子忘了送水，雲雀口渴得很難受。雛菊想安慰牠，也想把自己的水分送給牠，卻只能靜靜散出香氣。到了晚上，小鳥因缺水與痛苦死去，花也垂下了頭。","孩子隔天才發現，哭着替雲雀安排漂亮的葬禮，卻把帶着雛菊的草皮扔到路邊。花園外的小花曾真心關心小鳥，華麗的告別卻不能補回活着時被忽略的照料。"],"questions":[{"q":"哪隻鳥曾主動稱讚小雛菊？","options":["貓頭鷹","雲雀","鸛鳥","烏鴉"],"answer":1,"explanation":"雲雀沒有像大花一樣嫌棄牠，反而唱歌相伴。","id":"andersen-daisy:q0"},{"q":"雛菊怎樣被放進鳥籠？","options":["被國王用金夾搬入","隨暴風雨吹進窗戶","孩子挖起一塊帶着牠的草皮","自己長出翅膀飛入"],"answer":2,"explanation":"孩子為了給雲雀一塊草地，把花與草皮一同帶走。","id":"andersen-daisy:q1"},{"q":"雲雀在籠裏最急需、卻沒得到的是甚麼？","options":["一雙新鞋","一面銀鏡","飲水","金色王冠"],"answer":2,"explanation":"孩子忘記送水，造成了無法挽回的結果。","id":"andersen-daisy:q2"}],"title":"雛菊","author":"安徒生","group":"andersen","sourceTitle":"The Daisy","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#daisy","lines":[{"zh":"路旁草地有一朵小雛菊，並不起眼，卻喜歡陽光，也喜歡聽雲雀唱歌。","py":"lù páng cǎo dì yǒu yī duǒ xiǎo chú jú ， bìng bù qǐ yǎn ， què xǐ huān yáng guāng ， yě xǐ huān tīng yún què chàng gē 。","paragraph":0},{"zh":"花園裏的大花看不起牠，雲雀卻飛到牠身邊，用歌聲稱讚這朵普通的小花。","py":"huā yuán lǐ de dà huā kàn bù qǐ tā ， yún què què fēi dào tā shēn biān ， yòng gē shēng chēng zàn zhè duǒ pǔ tōng de xiǎo huā 。","paragraph":0},{"zh":"第二天，雲雀被孩子抓進籠裏。","py":"dì èr tiān ， yún què bèi hái zi zhuā jìn lóng lǐ 。","paragraph":1},{"zh":"孩子想給鳥一塊草地，便連同雛菊一起挖走，放在籠中。","py":"hái zi xiǎng gěi niǎo yī kuài cǎo dì ， biàn lián tóng chú jú yì qǐ wā zǒu ， fàng zài lóng zhōng 。","paragraph":1},{"zh":"小花看見熟悉的鳥近在眼前，卻再也聽不到從前自由的歡唱。","py":"xiǎo huā kàn jiàn shú xī de niǎo jìn zài yǎn qián ， què zài yě tīng bú dào cóng qián zì yóu de huān chàng 。","paragraph":1},{"zh":"孩子忘了送水，雲雀口渴得很難受。","py":"hái zi wàng le sòng shuǐ ， yún què kǒu kě de hěn nán shòu 。","paragraph":2},{"zh":"雛菊想安慰牠，也想把自己的水分送給牠，卻只能靜靜散出香氣。","py":"chú jú xiǎng ān wèi tā ， yě xiǎng bǎ zì jǐ de shuǐ fèn sòng gěi tā ， què zhǐ néng jìng jìng sàn chū xiāng qì 。","paragraph":2},{"zh":"到了晚上，小鳥因缺水與痛苦死去，花也垂下了頭。","py":"dào le wǎn shàng ， xiǎo niǎo yīn quē shuǐ yǔ tòng kǔ sǐ qù ， huā yě chuí xià le tóu 。","paragraph":2},{"zh":"孩子隔天才發現，哭着替雲雀安排漂亮的葬禮，卻把帶着雛菊的草皮扔到路邊。","py":"hái zi gé tiān cái fā xiàn ， kū zhe tì yún què ān pái piào liàng de zàng lǐ ， què bǎ dài zhe chú jú de cǎo pí rēng dào lù biān 。","paragraph":3},{"zh":"花園外的小花曾真心關心小鳥，華麗的告別卻不能補回活着時被忽略的照料。","py":"huā yuán wài de xiǎo huā céng zhēn xīn guān xīn xiǎo niǎo ， huá lì de gào bié què bù néng bǔ huí huó zhe shí bèi hū lüè de zhào liào 。","paragraph":3}]},{"id":"andersen-top_ball","paragraphs":["陀螺和皮球住在同一個玩具盒，陀螺想與皮球作伴。皮球覺得自己用精緻皮革縫成，身體裏還有特別的軟木，比普通陀螺高貴，不願認真回答他的心意。","皮球被拋向空中，每次都彈得很高。一次，她跳得太遠，再也沒回玩具盒。陀螺以為她已和屋頂的燕子在一起，雖然難過，仍保留着對她漂亮模樣的記憶。","多年後，陀螺被重新鍍金，玩耍時也掉進垃圾桶。他在裏面遇上一個浸過髒水、已變形的圓東西，聽她說起皮革、軟木和燕子，才認出原來就是從前的皮球。","僕人清理垃圾時，看見鍍金陀螺，便把他撿走，沒有留下皮球。陀螺也沒有說出兩人的舊事。從前因外表而生的迷戀，在再次相遇後消散，結局也留下冷淡的反問。"],"questions":[{"q":"皮球起初憑甚麼覺得自己高貴？","options":["曾住過海底宮殿","能唱出三千首歌","握有整個森林的鑰匙","精緻皮革與特別軟木的身體"],"answer":3,"explanation":"她把製作材料當成高人一等的理由。","id":"andersen-top_ball:q0"},{"q":"陀螺多年後在哪裏再遇皮球？","options":["垃圾桶裏","公主的舞會","海岸的橡樹上","一間空織布房"],"answer":0,"explanation":"兩件玩具都落到垃圾桶，才出現第二次相遇。","id":"andersen-top_ball:q1"},{"q":"僕人為甚麼把陀螺撿走？","options":["知道他是國王的兒子","聽見皮球替他求情","想請他修理馬車","注意到他鍍金的外表"],"answer":3,"explanation":"亮眼的鍍金使陀螺被發現，皮球卻被留下。","id":"andersen-top_ball:q2"}],"title":"陀螺和皮球","author":"安徒生","group":"andersen","sourceTitle":"The Top and Ball","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#top_ball","lines":[{"zh":"陀螺和皮球住在同一個玩具盒，陀螺想與皮球作伴。","py":"tuó luó hé pí qiú zhù zài tóng yī gè wán jù hé ， tuó luó xiǎng yǔ pí qiú zuò bàn 。","paragraph":0},{"zh":"皮球覺得自己用精緻皮革縫成，身體裏還有特別的軟木，比普通陀螺高貴，不願認真回答他的心意。","py":"pí qiú jué de zì jǐ yòng jīng zhì pí gé féng chéng ， shēn tǐ lǐ hái yǒu tè bié de ruǎn mù ， bǐ pǔ tōng tuó luó gāo guì ， bù yuàn rèn zhēn huí dá tā de xīn yì 。","paragraph":0},{"zh":"皮球被拋向空中，每次都彈得很高。","py":"pí qiú bèi pāo xiàng kōng zhōng ， měi cì dōu tán de hěn gāo 。","paragraph":1},{"zh":"一次，她跳得太遠，再也沒回玩具盒。","py":"yī cì ， tā tiào de tài yuǎn ， zài yě méi huí wán jù hé 。","paragraph":1},{"zh":"陀螺以為她已和屋頂的燕子在一起，雖然難過，仍保留着對她漂亮模樣的記憶。","py":"tuó luó yǐ wéi tā yǐ hé wū dǐng de yàn zi zài yì qǐ ， suī rán nán guò ， réng bǎo liú zhe duì tā piào liàng mú yàng de jì yì 。","paragraph":1},{"zh":"多年後，陀螺被重新鍍金，玩耍時也掉進垃圾桶。","py":"duō nián hòu ， tuó luó bèi chóng xīn dù jīn ， wán shuǎ shí yě diào jìn lā jī tǒng 。","paragraph":2},{"zh":"他在裏面遇上一個浸過髒水、已變形的圓東西，聽她說起皮革、軟木和燕子，才認出原來就是從前的皮球。","py":"tā zài lǐ miàn yù shàng yí gè jìn guò zàng shuǐ 、 yǐ biàn xíng de yuán dōng xī ， tīng tā shuō qǐ pí gé 、 ruǎn mù hé yàn zi ， cái rèn chū yuán lái jiù shì cóng qián de pí qiú 。","paragraph":2},{"zh":"僕人清理垃圾時，看見鍍金陀螺，便把他撿走，沒有留下皮球。","py":"pú rén qīng lǐ lā jī shí ， kàn jiàn dù jīn tuó luó ， biàn bǎ tā jiǎn zǒu ， méi yǒu liú xià pí qiú 。","paragraph":3},{"zh":"陀螺也沒有說出兩人的舊事。","py":"tuó luó yě méi yǒu shuō chū liǎng rén de jiù shì 。","paragraph":3},{"zh":"從前因外表而生的迷戀，在再次相遇後消散，結局也留下冷淡的反問。","py":"cóng qián yīn wài biǎo ér shēng de mí liàn ， zài zài cì xiāng yù hòu xiāo sàn ， jié jú yě liú xià lěng dàn de fǎn wèn 。","paragraph":3}]},{"id":"andersen-snowdrop","paragraphs":["雪還蓋着大地，一顆花球在土裏休息。雨水和陽光來探望，告訴它外面有明亮世界。小花受了鼓舞，頂着泥土與殘雪，提早伸出細嫩的莖和白色花朵。","冷風笑牠太早出來，冬天還沒有離開。雪滴花有時被冰霜壓低，仍相信陽光。人們發現牠，覺得牠帶來春天的消息，便把花摘進溫暖房間。","花後來放進一封帶着心意的信，輾轉來到一位姑娘手裏。日子久了，信失去原來的分量，花卻被夾進一本詩集，乾燥的身體保存着那段曾被重視的時光。","再有人翻書時，看見花，也讀起詩人的遭遇：他才華出現得太早，曾不被時代理解。雪滴花因此得到新的意義，像那位在寒意未退時先開口歌唱的詩人。"],"questions":[{"q":"雪滴花在甚麼時候伸出地面？","options":["盛夏最炎熱時","秋天所有果實落下後","海水全部結冰後一百年","雪仍覆地、冬寒未退時"],"answer":3,"explanation":"牠出得很早，所以冷風才嘲笑牠着急。","id":"andersen-snowdrop:q0"},{"q":"花被摘下後，曾被放進甚麼傳遞心意？","options":["一隻木鞋","一口金臼","一封信","一個鐵鎖"],"answer":2,"explanation":"花隨信而去，之後才被保存進詩集。","id":"andersen-snowdrop:q1"},{"q":"讀者把雪滴花與詩人聯繫起來，因為兩者有甚麼相似？","options":["都能修理斷裂的船","都只喜歡炎熱夏天","都像提早到來而未被理解","都曾住在同一個鳥巢"],"answer":2,"explanation":"早開的花與先於時代的詩人，承受了相似的寒意。","id":"andersen-snowdrop:q2"}],"title":"雪滴花","author":"安徒生","group":"andersen","sourceTitle":"The Snowdrop","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#snowdrop","lines":[{"zh":"雪還蓋着大地，一顆花球在土裏休息。","py":"xuě hái gài zhe dà dì ， yī kē huā qiú zài tǔ lǐ xiū xī 。","paragraph":0},{"zh":"雨水和陽光來探望，告訴它外面有明亮世界。","py":"yǔ shuǐ hé yáng guāng lái tàn wàng ， gào sù tā wài miàn yǒu míng liàng shì jiè 。","paragraph":0},{"zh":"小花受了鼓舞，頂着泥土與殘雪，提早伸出細嫩的莖和白色花朵。","py":"xiǎo huā shòu le gǔ wǔ ， dǐng zhe ní tǔ yǔ cán xuě ， tí zǎo shēn chū xì nèn de jīng hé bái sè huā duǒ 。","paragraph":0},{"zh":"冷風笑牠太早出來，冬天還沒有離開。","py":"lěng fēng xiào tā tài zǎo chū lái ， dōng tiān hái méi yǒu lí kāi 。","paragraph":1},{"zh":"雪滴花有時被冰霜壓低，仍相信陽光。","py":"xuě dī huā yǒu shí bèi bīng shuāng yā dī ， réng xiāng xìn yáng guāng 。","paragraph":1},{"zh":"人們發現牠，覺得牠帶來春天的消息，便把花摘進溫暖房間。","py":"rén men fā xiàn tā ， jué de tā dài lái chūn tiān de xiāo xī ， biàn bǎ huā zhāi jìn wēn nuǎn fáng jiān 。","paragraph":1},{"zh":"花後來放進一封帶着心意的信，輾轉來到一位姑娘手裏。","py":"huā hòu lái fàng jìn yī fēng dài zhe xīn yì de xìn ， zhǎn zhuǎn lái dào yī wèi gū niang shǒu lǐ 。","paragraph":2},{"zh":"日子久了，信失去原來的分量，花卻被夾進一本詩集，乾燥的身體保存着那段曾被重視的時光。","py":"rì zi jiǔ le ， xìn shī qù yuán lái de fèn liàng ， huā què bèi jiā jìn yī běn shī jí ， gān zào de shēn tǐ bǎo cún zhe nà duàn céng bèi zhòng shì de shí guāng 。","paragraph":2},{"zh":"再有人翻書時，看見花，也讀起詩人的遭遇：他才華出現得太早，曾不被時代理解。","py":"zài yǒu rén fān shū shí ， kàn jiàn huā ， yě dú qǐ shī rén de zāo yù ： tā cái huá chū xiàn de tài zǎo ， céng bù bèi shí dài lǐ jiě 。","paragraph":3},{"zh":"雪滴花因此得到新的意義，像那位在寒意未退時先開口歌唱的詩人。","py":"xuě dī huā yīn cǐ dé dào xīn de yì yì ， xiàng nà wèi zài hán yì wèi tuì shí xiān kāi kǒu gē chàng de shī rén 。","paragraph":3}]},{"id":"andersen-buckwhet","paragraphs":["田裏長着麥子、花草和蕎麥，旁邊有一棵年老的柳樹。蕎麥看見自己開滿花，便覺得比其他作物都漂亮，連柳樹裂開的樹幹，也成了牠嘲笑的理由。","暴風雨將到，穀物垂下頭，花也合攏，老柳樹勸蕎麥跟着低頭。蕎麥卻認為自己不必學別人，還打算昂着頭直望閃電，向高處證明自己的膽量。","雷聲越來越響，閃電照亮田野。別的植物在雨裏彎身，蕎麥仍不肯退讓。風雨過後，花草重新抬頭，蕎麥卻已被雷電灼黑，先前的漂亮不再存在。","柳葉落下大滴水珠，像在為蕎麥哭泣。麻雀不明白，明明天空已晴，為甚麼柳樹仍難過；柳樹便把事情說給牠們聽，讓這段驕傲與警告的故事傳開。"],"questions":[{"q":"蕎麥起初為甚麼看不起其他植物？","options":["能聽懂所有鳥語","曾經住過三層城堡","覺得自己花多而漂亮","有一袋國王的金子"],"answer":2,"explanation":"牠把外表的繁盛，當成可以輕視別人的理由。","id":"andersen-buckwhet:q0"},{"q":"風雨來前，老柳樹給蕎麥甚麼建議？","options":["立即搬到海底","向雷電大聲唱歌","把所有花都送到王宮","像其他作物一樣低下頭"],"answer":3,"explanation":"柳樹勸牠別在風暴中繼續昂頭逞強。","id":"andersen-buckwhet:q1"},{"q":"麻雀在雨後向柳樹詢問甚麼？","options":["海水為甚麼是綠色","為甚麼天晴了仍像在哭泣","怎樣用稻草紡金","王子藏在哪座冰宮"],"answer":1,"explanation":"柳樹的水珠像淚，麻雀因此聽到蕎麥的遭遇。","id":"andersen-buckwhet:q2"}],"title":"蕎麥","author":"安徒生","group":"andersen","sourceTitle":"The Buckwheat","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#buckwhet","lines":[{"zh":"田裏長着麥子、花草和蕎麥，旁邊有一棵年老的柳樹。","py":"tián lǐ zhǎng zhe mài zi 、 huā cǎo hé qiáo mài ， páng biān yǒu yī kē nián lǎo de liǔ shù 。","paragraph":0},{"zh":"蕎麥看見自己開滿花，便覺得比其他作物都漂亮，連柳樹裂開的樹幹，也成了牠嘲笑的理由。","py":"qiáo mài kàn jiàn zì jǐ kāi mǎn huā ， biàn jué de bǐ qí tā zuò wù dōu piào liàng ， lián liǔ shù liè kāi de shù gàn ， yě chéng le tā cháo xiào de lǐ yóu 。","paragraph":0},{"zh":"暴風雨將到，穀物垂下頭，花也合攏，老柳樹勸蕎麥跟着低頭。","py":"bào fēng yǔ jiāng dào ， gǔ wù chuí xià tou ， huā yě hé lǒng ， lǎo liǔ shù quàn qiáo mài gēn zhe dī tóu 。","paragraph":1},{"zh":"蕎麥卻認為自己不必學別人，還打算昂着頭直望閃電，向高處證明自己的膽量。","py":"qiáo mài què rèn wéi zì jǐ bù bì xué bié rén ， hái dǎ suàn áng zhe tóu zhí wàng shǎn diàn ， xiàng gāo chù zhèng míng zì jǐ de dǎn liàng 。","paragraph":1},{"zh":"雷聲越來越響，閃電照亮田野。","py":"léi shēng yuè lái yuè xiǎng ， shǎn diàn zhào liàng tián yě 。","paragraph":2},{"zh":"別的植物在雨裏彎身，蕎麥仍不肯退讓。","py":"bié de zhí wù zài yǔ lǐ wān shēn ， qiáo mài réng bù kěn tuì ràng 。","paragraph":2},{"zh":"風雨過後，花草重新抬頭，蕎麥卻已被雷電灼黑，先前的漂亮不再存在。","py":"fēng yǔ guò hòu ， huā cǎo chóng xīn tái tóu ， qiáo mài què yǐ bèi léi diàn zhuó hēi ， xiān qián de piào liàng bù zài cún zài 。","paragraph":2},{"zh":"柳葉落下大滴水珠，像在為蕎麥哭泣。","py":"liǔ yè là xià dà dī shuǐ zhū ， xiàng zài wèi qiáo mài kū qì 。","paragraph":3},{"zh":"麻雀不明白，明明天空已晴，為甚麼柳樹仍難過；柳樹便把事情說給牠們聽，讓這段驕傲與警告的故事傳開。","py":"má què bù míng bái ， míng míng tiān kōng yǐ qíng ， wèi shén me liǔ shù réng nán guò ； liǔ shù biàn bǎ shì qíng shuō gěi tā men tīng ， ràng zhè duàn jiāo ào yǔ jǐng gào de gù shì chuán kāi 。","paragraph":3}]},{"id":"andersen-bell","paragraphs":["城市的人在傍晚偶爾聽到遠方鐘聲，聲音像從森林深處傳來，卻常被街上的吵鬧蓋過。許多人走出去尋找，有的停在路旁吃喝，有的看見小鐘便以為找到了。","一群孩子也想找出真正的聲音，大部分走到半途就回頭。只有一位王子和一個穿木鞋的窮孩子仍願前進，兩人雖出身不同，都不想用方便的答案代替親自尋找。","到了岔路，他們選擇不同方向，各自穿過樹木、藤蔓與崎嶇路面。王子爬到高處，看見大海、落日和廣闊天空，心裏感到自然本身就像一座莊嚴的教堂。","這時，窮孩子也從另一條路抵達。兩人跑向對方，握住手，一起聽見看不見的鐘聲。尋找的終點沒有華麗鐘樓，卻有共同面對世界時，那份不分貧富的驚奇。"],"questions":[{"q":"城裏的人為甚麼難以聽清鐘聲？","options":["所有人都住在地底","鐘只在皇帝睡着時響","夜鶯從不停止唱歌","街上的吵鬧常把聲音蓋過"],"answer":3,"explanation":"遠方的聲音短暫，容易被城市的雜音掩蓋。","id":"andersen-bell:q0"},{"q":"最後仍繼續深入尋找的是哪兩人？","options":["老柳樹與一隻熊","王子和穿木鞋的窮孩子","國王和賣花姑娘","兩個修理機械鳥的人"],"answer":1,"explanation":"兩人有不同背景，卻同樣沒有在半途放棄。","id":"andersen-bell:q1"},{"q":"兩人最後在哪種景象中會合？","options":["海天與森林構成的廣大自然","堆滿金幣的地下財庫","只有空織機的屋子","沒有窗的黑色高塔"],"answer":0,"explanation":"終點呈現自然的莊嚴，而不是一座可拿走的小鐘。","id":"andersen-bell:q2"}],"title":"鐘聲","author":"安徒生","group":"andersen","sourceTitle":"The Bell","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#bell","lines":[{"zh":"城市的人在傍晚偶爾聽到遠方鐘聲，聲音像從森林深處傳來，卻常被街上的吵鬧蓋過。","py":"chéng shì de rén zài bàng wǎn ǒu ěr tīng dào yuǎn fāng zhōng shēng ， shēng yīn xiàng cóng sēn lín shēn chù chuán lái ， què cháng bèi jiē shàng de chǎo nào gài guò 。","paragraph":0},{"zh":"許多人走出去尋找，有的停在路旁吃喝，有的看見小鐘便以為找到了。","py":"xǔ duō rén zǒu chū qù xún zhǎo ， yǒu de tíng zài lù páng chī hē ， yǒu de kàn jiàn xiǎo zhōng biàn yǐ wéi zhǎo dào le 。","paragraph":0},{"zh":"一群孩子也想找出真正的聲音，大部分走到半途就回頭。","py":"yī qún hái zi yě xiǎng zhǎo chū zhēn zhèng de shēng yīn ， dà bù fèn zǒu dào bàn tú jiù huí tóu 。","paragraph":1},{"zh":"只有一位王子和一個穿木鞋的窮孩子仍願前進，兩人雖出身不同，都不想用方便的答案代替親自尋找。","py":"zhǐ yǒu yī wèi wáng zǐ hé yí gè chuān mù xié de qióng hái zi réng yuàn qián jìn ， liǎng rén suī chū shēn bù tóng ， dōu bù xiǎng yòng fāng biàn de dá àn dài tì qīn zì xún zhǎo 。","paragraph":1},{"zh":"到了岔路，他們選擇不同方向，各自穿過樹木、藤蔓與崎嶇路面。","py":"dào le chà lù ， tā men xuǎn zé bù tóng fāng xiàng ， gè zì chuān guò shù mù 、 téng wàn yǔ qí qū lù miàn 。","paragraph":2},{"zh":"王子爬到高處，看見大海、落日和廣闊天空，心裏感到自然本身就像一座莊嚴的教堂。","py":"wáng zǐ pá dào gāo chù ， kàn jiàn dà hǎi 、 luò rì hé guǎng kuò tiān kōng ， xīn lǐ gǎn dào zì rán běn shēn jiù xiàng yī zuò zhuāng yán de jiào táng 。","paragraph":2},{"zh":"這時，窮孩子也從另一條路抵達。","py":"zhè shí ， qióng hái zi yě cóng lìng yī tiáo lù dǐ dá 。","paragraph":3},{"zh":"兩人跑向對方，握住手，一起聽見看不見的鐘聲。","py":"liǎng rén pǎo xiàng duì fāng ， wò zhù shǒu ， yì qǐ tīng jiàn kàn bú jiàn de zhōng shēng 。","paragraph":3},{"zh":"尋找的終點沒有華麗鐘樓，卻有共同面對世界時，那份不分貧富的驚奇。","py":"xún zhǎo de zhōng diǎn méi yǒu huá lì zhōng lóu ， què yǒu gòng tóng miàn duì shì jiè shí ， nà fèn bù fēn pín fù de jīng qí 。","paragraph":3}]},{"id":"andersen-old_stre","paragraphs":["一盞老街燈服務多年，今晚是最後一次在街頭照明。牠不知道明天會被留下，還是投入熔爐，想起曾照過的行人、信件和哭泣的人，心裏充滿不捨。","夜裏，風送牠更清楚的記憶，星光也給牠特別的能力：若有蠟燭點在裏面，就能讓別人看見牠記着的畫面。老燈很感激，卻還不知道自己將住在哪裏。","照料街燈的老夫妻把牠帶回家，擦得乾淨，繼續加油使用。牠想把往事分享給他們，可他們總用油，沒有點上所需的蠟燭，神奇畫面便一直藏在心中。","有一次，牠夢見自己被熔成詩人桌上的燭台，照出許多想像。醒來後，牠仍願留在老夫妻身旁，因為他們愛的是現在這盞舊燈，不需要牠先變成甚麼新東西。"],"questions":[{"q":"老街燈最後一晚最擔心甚麼？","options":["不知道退休後會否被熔掉","怕明天沒有足夠的新衣","怕所有魚都游進燈裏","忘記怎樣數到三"],"answer":0,"explanation":"牠珍惜服務多年的生活，也不確定自己的去向。","id":"andersen-old_stre:q0"},{"q":"要讓別人看見燈的記憶，還需要甚麼？","options":["掛上三枚金戒指","念出公主的名字","在燈裏點蠟燭","把燈沉進海底"],"answer":2,"explanation":"星光給的能力有條件，單加燈油並不能啟動。","id":"andersen-old_stre:q1"},{"q":"老燈最後為甚麼願意留在老夫妻家？","options":["牠討厭所有會寫字的人","感受到他們對原本自己的珍愛","老夫妻答應送牠一座城","牠已經完全忘掉街道"],"answer":1,"explanation":"被珍惜的日常，使牠不再一定要追求夢中的新身份。","id":"andersen-old_stre:q2"}],"title":"老街燈","author":"安徒生","group":"andersen","sourceTitle":"The Old Street Lamp","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#old_stre","lines":[{"zh":"一盞老街燈服務多年，今晚是最後一次在街頭照明。","py":"yī zhǎn lǎo jiē dēng fú wù duō nián ， jīn wǎn shì zuì hòu yī cì zài jiē tóu zhào míng 。","paragraph":0},{"zh":"牠不知道明天會被留下，還是投入熔爐，想起曾照過的行人、信件和哭泣的人，心裏充滿不捨。","py":"tā bù zhī dào míng tiān huì bèi liú xià ， hái shì tóu rù róng lú ， xiǎng qǐ céng zhào guò de xíng rén 、 xìn jiàn hé kū qì de rén ， xīn lǐ chōng mǎn bù shě 。","paragraph":0},{"zh":"夜裏，風送牠更清楚的記憶，星光也給牠特別的能力：若有蠟燭點在裏面，就能讓別人看見牠記着的畫面。","py":"yè lǐ ， fēng sòng tā gèng qīng chǔ de jì yì ， xīng guāng yě gěi tā tè bié de néng lì ： ruò yǒu là zhú diǎn zài lǐ miàn ， jiù néng ràng bié rén kàn jiàn tā jì zhe de huà miàn 。","paragraph":1},{"zh":"老燈很感激，卻還不知道自己將住在哪裏。","py":"lǎo dēng hěn gǎn jī ， què hái bù zhī dào zì jǐ jiāng zhù zài nǎ lǐ 。","paragraph":1},{"zh":"照料街燈的老夫妻把牠帶回家，擦得乾淨，繼續加油使用。","py":"zhào liào jiē dēng de lǎo fū qī bǎ tā dài huí jiā ， cā de gān jìng ， jì xù jiā yóu shǐ yòng 。","paragraph":2},{"zh":"牠想把往事分享給他們，可他們總用油，沒有點上所需的蠟燭，神奇畫面便一直藏在心中。","py":"tā xiǎng bǎ wǎng shì fēn xiǎng gěi tā men ， kě tā men zǒng yòng yóu ， méi yǒu diǎn shàng suǒ xū de là zhú ， shén qí huà miàn biàn yì zhí cáng zài xīn zhōng 。","paragraph":2},{"zh":"有一次，牠夢見自己被熔成詩人桌上的燭台，照出許多想像。","py":"yǒu yī cì ， tā mèng jiàn zì jǐ bèi róng chéng shī rén zhuō shàng de zhú tái ， zhào chū xǔ duō xiǎng xiàng 。","paragraph":3},{"zh":"醒來後，牠仍願留在老夫妻身旁，因為他們愛的是現在這盞舊燈，不需要牠先變成甚麼新東西。","py":"xǐng lái hòu ， tā réng yuàn liú zài lǎo fū qī shēn páng ， yīn wèi tā men ài de shì xiàn zài zhè zhǎn jiù dēng ， bù xū yào tā xiān biàn chéng shén me xīn dōng xī 。","paragraph":3}]},{"id":"andersen-princess","paragraphs":["王子想娶一位真正的公主，走過許多地方，總覺得不能確定，最後只好回家。一天晚上，雷雨交加，城門有人敲響，一個渾身濕透的姑娘站在外面，自稱公主。","老國王讓她進來，王后卻想暗中試一試。她拿走床上的鋪蓋，在床板放下一粒豌豆，再疊上二十層床墊和二十層羽絨褥，請姑娘在高高的床上睡一夜。","第二天，大家問她睡得好不好。姑娘說幾乎整夜沒睡，床上不知有甚麼硬東西，硌得身上疼痛。王后便認定，只有真正的公主，才會隔着這麼厚的鋪蓋仍感覺得到。","王子於是與她成婚，小豌豆也被放進收藏的地方。故事故意用誇張的敏感來判斷身份，讓讀者一邊聽童話，一邊想想：一粒小豆，怎會成為那麼重大的證明？"],"questions":[{"q":"姑娘敲城門時，天氣怎樣？","options":["炎熱得沒有一絲風","雷雨交加","風和日麗","只下細小花瓣"],"answer":1,"explanation":"她在暴風雨中到來，所以衣服與頭髮都濕透了。","id":"andersen-princess:q0"},{"q":"王后把豌豆放在甚麼位置？","options":["窗外的花盆上","床板上、厚厚鋪蓋的最下方","姑娘的茶杯裏","城門的鑰匙孔中"],"answer":1,"explanation":"豌豆被二十層床墊和二十層羽絨褥蓋住。","id":"andersen-princess:q1"},{"q":"王后憑甚麼認定姑娘是真公主？","options":["她能聽懂狗和鳥的語言","她認得所有王宮的廚師","隔着厚鋪蓋仍感到豌豆硌身","姑娘帶來最多金幣"],"answer":2,"explanation":"童話以極端敏感的身體感覺，作為誇張的身份判準。","id":"andersen-princess:q2"}],"title":"豌豆公主","author":"安徒生","group":"andersen","sourceTitle":"The Princess and the Pea","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#princess","lines":[{"zh":"王子想娶一位真正的公主，走過許多地方，總覺得不能確定，最後只好回家。","py":"wáng zǐ xiǎng qǔ yī wèi zhēn zhèng de gōng zhǔ ， zǒu guò xǔ duō dì fāng ， zǒng jué de bù néng què dìng ， zuì hòu zhǐ hǎo huí jiā 。","paragraph":0},{"zh":"一天晚上，雷雨交加，城門有人敲響，一個渾身濕透的姑娘站在外面，自稱公主。","py":"yī tiān wǎn shàng ， léi yǔ jiāo jiā ， chéng mén yǒu rén qiāo xiǎng ， yí gè hún shēn shī tòu de gū niang zhàn zài wài miàn ， zì chēng gōng zhǔ 。","paragraph":0},{"zh":"老國王讓她進來，王后卻想暗中試一試。","py":"lǎo guó wáng ràng tā jìn lái ， wáng hòu què xiǎng àn zhōng shì yī shì 。","paragraph":1},{"zh":"她拿走床上的鋪蓋，在床板放下一粒豌豆，再疊上二十層床墊和二十層羽絨褥，請姑娘在高高的床上睡一夜。","py":"tā ná zǒu chuáng shàng de pū gài ， zài chuáng bǎn fàng xià yī lì wān dòu ， zài dié shàng èr shí céng chuáng diàn hé èr shí céng yǔ róng rù ， qǐng gū niang zài gāo gāo de chuáng shàng shuì yī yè 。","paragraph":1},{"zh":"第二天，大家問她睡得好不好。","py":"dì èr tiān ， dà jiā wèn tā shuì de hǎo bù hǎo 。","paragraph":2},{"zh":"姑娘說幾乎整夜沒睡，床上不知有甚麼硬東西，硌得身上疼痛。","py":"gū niang shuō jī hū zhěng yè méi shuì ， chuáng shàng bù zhī yǒu shén me yìng dōng xī ， gè de shēn shàng téng tòng 。","paragraph":2},{"zh":"王后便認定，只有真正的公主，才會隔着這麼厚的鋪蓋仍感覺得到。","py":"wáng hòu biàn rèn dìng ， zhǐ yǒu zhēn zhèng de gōng zhǔ ， cái huì gé zhe zhè me hòu de pū gài réng gǎn jué de dào 。","paragraph":2},{"zh":"王子於是與她成婚，小豌豆也被放進收藏的地方。","py":"wáng zǐ yú shì yǔ tā chéng hūn ， xiǎo wān dòu yě bèi fàng jìn shōu cáng de dì fāng 。","paragraph":3},{"zh":"故事故意用誇張的敏感來判斷身份，讓讀者一邊聽童話，一邊想想：一粒小豆，怎會成為那麼重大的證明？","py":"gù shì gù yì yòng kuā zhāng de mǐn gǎn lái pàn duàn shēn fèn ， ràng dú zhě yī biān tīng tóng huà ， yī biān xiǎng xiǎng ： yī lì xiǎo dòu ， zěn huì chéng wéi nà me zhòng dà de zhèng míng ？","paragraph":3}]},{"id":"andersen-pen_ink","paragraphs":["詩人的桌上放着鋼筆和墨水瓶。有人讚嘆，小小墨水瓶竟能生出許多文章，墨水瓶聽見後十分得意，認為紙上的文字與思想，全都應該算作自己的功勞。","鋼筆不服，說真正落在紙上寫字的是自己，墨水瓶只不過供應材料。兩者你一言、我一語，都把創作說成自己的本領，誰也不肯承認還有別人的作用。","詩人聽完音樂會，想到人們讚美小提琴時，也不能忘記演奏者與更深的靈感。他回家寫下關於主人和工具的寓言，提醒自己不要把得到的能力全當作個人榮耀。","筆和墨水瓶聽了，卻各自以為寓言只在批評對方，吵完便滿意地睡去。詩人仍醒着，心中有新的思想流動。文章已經寫出，兩件工具卻沒有真正讀懂自己的問題。"],"questions":[{"q":"墨水瓶為甚麼突然很得意？","options":["發現瓶底有三片蛇葉","聽見別人讚嘆文章能從墨水中產生","被皇帝裝滿金子","看到自己變成一把琴"],"answer":1,"explanation":"旁人的稱讚，使牠把文章的功勞全攬到自己身上。","id":"andersen-pen_ink:q0"},{"q":"鋼筆反駁墨水瓶時，強調甚麼？","options":["每滴墨都來自星星","真正接觸紙張寫字的是自己","自己比王冠更重","自己會在海底游泳"],"answer":1,"explanation":"牠以直接書寫的動作，作為爭奪功勞的理由。","id":"andersen-pen_ink:q1"},{"q":"兩件工具聽完寓言後，有沒有真正反省？","options":["有，請詩人把牠們送走","沒有，各以為只在批評對方","有，立刻向彼此道歉","有，一起停止所有爭論"],"answer":1,"explanation":"牠們仍把話套在別人身上，沒有看見自己的自滿。","id":"andersen-pen_ink:q2"}],"title":"鋼筆和墨水瓶","author":"安徒生","group":"andersen","sourceTitle":"The Pen and the Inkstand","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#pen_ink","lines":[{"zh":"詩人的桌上放着鋼筆和墨水瓶。","py":"shī rén de zhuō shàng fàng zhe gāng bǐ hé mò shuǐ píng 。","paragraph":0},{"zh":"有人讚嘆，小小墨水瓶竟能生出許多文章，墨水瓶聽見後十分得意，認為紙上的文字與思想，全都應該算作自己的功勞。","py":"yǒu rén zàn tàn ， xiǎo xiǎo mò shuǐ píng jìng néng shēng chū xǔ duō wén zhāng ， mò shuǐ píng tīng jiàn hòu shí fēn dé yì ， rèn wéi zhǐ shàng de wén zì yǔ sī xiǎng ， quán dōu yīng gāi suàn zuò zì jǐ de gōng láo 。","paragraph":0},{"zh":"鋼筆不服，說真正落在紙上寫字的是自己，墨水瓶只不過供應材料。","py":"gāng bǐ bù fú ， shuō zhēn zhèng luò zài zhǐ shàng xiě zì de shì zì jǐ ， mò shuǐ píng zhǐ bù guò gōng yìng cái liào 。","paragraph":1},{"zh":"兩者你一言、我一語，都把創作說成自己的本領，誰也不肯承認還有別人的作用。","py":"liǎng zhě nǐ yī yán 、 wǒ yī yǔ ， dōu bǎ chuàng zuò shuō chéng zì jǐ de běn lǐng ， shuí yě bù kěn chéng rèn hái yǒu bié rén de zuò yòng 。","paragraph":1},{"zh":"詩人聽完音樂會，想到人們讚美小提琴時，也不能忘記演奏者與更深的靈感。","py":"shī rén tīng wán yīn yuè huì ， xiǎng dào rén men zàn měi xiǎo tí qín shí ， yě bù néng wàng jì yǎn zòu zhě yǔ gēng shēn de líng gǎn 。","paragraph":2},{"zh":"他回家寫下關於主人和工具的寓言，提醒自己不要把得到的能力全當作個人榮耀。","py":"tā huí jiā xiě xià guān yú zhǔ rén hé gōng jù de yù yán ， tí xǐng zì jǐ bú yào bǎ dé dào de néng lì quán dàng zuò gè rén róng yào 。","paragraph":2},{"zh":"筆和墨水瓶聽了，卻各自以為寓言只在批評對方，吵完便滿意地睡去。","py":"bǐ hé mò shuǐ píng tīng le ， què gè zì yǐ wéi yù yán zhǐ zài pī píng duì fāng ， chǎo wán biàn mǎn yì dì shuì qù 。","paragraph":3},{"zh":"詩人仍醒着，心中有新的思想流動。","py":"shī rén réng xǐng zhe ， xīn zhōng yǒu xīn de sī xiǎng liú dòng 。","paragraph":3},{"zh":"文章已經寫出，兩件工具卻沒有真正讀懂自己的問題。","py":"wén zhāng yǐ jīng xiě chū ， liǎng jiàn gōng jù què méi yǒu zhēn zhèng dú dǒng zì jǐ de wèn tí 。","paragraph":3}]},{"id":"perrault-Cinderilla_or_The_Little_Glass_Slipper","paragraphs":["灰姑娘被繼母和兩個姐姐使喚，做完家務，常坐在爐灰旁。王子舉辦舞會，姐姐們盛裝出門，她卻沒有合適衣服。仙女教母出現，用魔法替她準備車馬和禮服。","南瓜變成馬車，小動物成了隨從，灰姑娘還得到一雙玻璃鞋。教母提醒，魔法只能維持到午夜。她在舞會與王子跳舞，第一次記得及時回家，第二次卻幾乎忘了時間。","鐘敲十二下時，她急忙跑走，落下一隻玻璃鞋。馬車和衣服恢復原樣，留下的鞋卻仍然晶亮。王子派人四處尋找，說要請每位姑娘試穿，找到那位舞伴。","姐姐們怎樣也穿不合，灰姑娘一試卻正好，還拿出另一隻作證。大家終於認出她，她後來與王子成婚，也原諒了姐姐們，讓從前被爐灰遮住的生活迎來新的開始。"],"questions":[{"q":"仙女把甚麼變成灰姑娘的馬車？","options":["南瓜","金蘋果","銀色鳥籠","一片大牛蒡葉"],"answer":0,"explanation":"教母用身邊的南瓜和小動物，變出赴舞會的車馬。","id":"perrault-Cinderilla_or_The_Little_Glass_Slipper:q0"},{"q":"灰姑娘第二次離開舞會時，為甚麼特別匆忙？","options":["王子要把宮殿拆掉","姐姐們已找到仙女","所有花朵突然枯萎","午夜將到，魔法快失效"],"answer":3,"explanation":"她記起教母的時間限制，才急着在鐘聲中離開。","id":"perrault-Cinderilla_or_The_Little_Glass_Slipper:q1"},{"q":"除了試穿成功，灰姑娘還拿出甚麼證明身份？","options":["王子的金杵","姐姐的一封信","教母的一根羽毛","另一隻玻璃鞋"],"answer":3,"explanation":"成對的另一隻鞋，使舞伴的身份更加明確。","id":"perrault-Cinderilla_or_The_Little_Glass_Slipper:q2"}],"title":"灰姑娘","author":"夏爾・佩羅","group":"perrault","sourceTitle":"CINDERILLA; OR, THE LITTLE GLASS SLIPPER","sourceUrl":"https://www.gutenberg.org/cache/epub/29021/pg29021-images.html#Cinderilla_or_The_Little_Glass_Slipper","lines":[{"zh":"灰姑娘被繼母和兩個姐姐使喚，做完家務，常坐在爐灰旁。","py":"huī gū niang bèi jì mǔ hé liǎng gè jiě jiě shǐ huàn ， zuò wán jiā wù ， cháng zuò zài lú huī páng 。","paragraph":0},{"zh":"王子舉辦舞會，姐姐們盛裝出門，她卻沒有合適衣服。","py":"wáng zǐ jǔ bàn wǔ huì ， jiě jiě men shèng zhuāng chū mén ， tā què méi yǒu hé shì yī fú 。","paragraph":0},{"zh":"仙女教母出現，用魔法替她準備車馬和禮服。","py":"xiān nǚ jiào mǔ chū xiàn ， yòng mó fǎ tì tā zhǔn bèi chē mǎ hé lǐ fú 。","paragraph":0},{"zh":"南瓜變成馬車，小動物成了隨從，灰姑娘還得到一雙玻璃鞋。","py":"nán guā biàn chéng mǎ chē ， xiǎo dòng wù chéng le suí cóng ， huī gū niang hái děi dào yī shuāng bō lí xié 。","paragraph":1},{"zh":"教母提醒，魔法只能維持到午夜。","py":"jiào mǔ tí xǐng ， mó fǎ zhǐ néng wéi chí dào wǔ yè 。","paragraph":1},{"zh":"她在舞會與王子跳舞，第一次記得及時回家，第二次卻幾乎忘了時間。","py":"tā zài wǔ huì yǔ wáng zǐ tiào wǔ ， dì yī cì jì de jí shí huí jiā ， dì èr cì què jī hū wàng le shí jiān 。","paragraph":1},{"zh":"鐘敲十二下時，她急忙跑走，落下一隻玻璃鞋。","py":"zhōng qiāo shí èr xià shí ， tā jí máng pǎo zǒu ， là xià yī zhī bō lí xié 。","paragraph":2},{"zh":"馬車和衣服恢復原樣，留下的鞋卻仍然晶亮。","py":"mǎ chē hé yī fú huī fù yuán yàng ， liú xià de xié què réng rán jīng liàng 。","paragraph":2},{"zh":"王子派人四處尋找，說要請每位姑娘試穿，找到那位舞伴。","py":"wáng zǐ pài rén sì chù xún zhǎo ， shuō yào qǐng měi wèi gū niang shì chuān ， zhǎo dào nà wèi wǔ bàn 。","paragraph":2},{"zh":"姐姐們怎樣也穿不合，灰姑娘一試卻正好，還拿出另一隻作證。","py":"jiě jiě men zěn yàng yě chuān bù hé ， huī gū niang yī shì què zhèng hǎo ， hái ná chū lìng yī zhī zuò zhèng 。","paragraph":3},{"zh":"大家終於認出她，她後來與王子成婚，也原諒了姐姐們，讓從前被爐灰遮住的生活迎來新的開始。","py":"dà jiā zhōng yú rèn chū tā ， tā hòu lái yǔ wáng zǐ chéng hūn ， yě yuán liàng le jiě jiě men ， ràng cóng qián bèi lú huī zhē zhù de shēng huó yíng lái xīn de kāi shǐ 。","paragraph":3}]},{"id":"perrault-The_Master_Cat_or_Puss_in_Boots","paragraphs":["磨坊主去世後，最小兒子只分到一隻貓，覺得日子沒有希望。貓卻要他準備靴子和袋子，說自己有辦法幫忙，接着捕來獵物，以主人的名義送給國王。","貓替主人取了卡拉巴侯爵的稱號，又在國王乘車經過河邊時，假稱主人的衣服被偷。國王給青年衣服，請他上車，公主也因此認識了這位年輕人。","貓跑到前面，讓沿途的人把田地說成侯爵所有，再進入一個會變形的食人魔城堡。牠先稱讚對方能變成獅子，再故意問，這麼厲害的人能不能變成小老鼠。","食人魔立刻示範，貓便一口捉住牠。國王到來時，城堡也被說成侯爵的家。青年最後與公主成婚，貓不再為生計捉老鼠，這段靠機智與假象改命的故事也留給讀者思考。"],"questions":[{"q":"貓最初向主人要求哪兩樣東西？","options":["鏡子和金梳","靴子和袋子","王冠和銀劍","船帆和魚網"],"answer":1,"explanation":"靴子讓牠便於行動，袋子則用來捕捉送禮的獵物。","id":"perrault-The_Master_Cat_or_Puss_in_Boots:q0"},{"q":"貓替主人編造了甚麼稱號？","options":["冰雪國王","萬事通博士","熊皮將軍","卡拉巴侯爵"],"answer":3,"explanation":"貓反覆用這個名號，建立主人在國王心中的形象。","id":"perrault-The_Master_Cat_or_Puss_in_Boots:q1"},{"q":"貓怎樣制服會變形的食人魔？","options":["把城堡搬進海裏","叫他連續沉默七年","引他變成老鼠後捉住","請他穿上玻璃鞋"],"answer":2,"explanation":"貓利用對方想展示本領的心理，讓大敵變得容易對付。","id":"perrault-The_Master_Cat_or_Puss_in_Boots:q2"}],"title":"穿靴子的貓","author":"夏爾・佩羅","group":"perrault","sourceTitle":"THE MASTER CAT; OR, PUSS IN BOOTS","sourceUrl":"https://www.gutenberg.org/cache/epub/29021/pg29021-images.html#The_Master_Cat_or_Puss_in_Boots","lines":[{"zh":"磨坊主去世後，最小兒子只分到一隻貓，覺得日子沒有希望。","py":"mò fáng zhǔ qù shì hòu ， zuì xiǎo ér zi zhǐ fēn dào yī zhī māo ， jué de rì zi méi yǒu xī wàng 。","paragraph":0},{"zh":"貓卻要他準備靴子和袋子，說自己有辦法幫忙，接着捕來獵物，以主人的名義送給國王。","py":"māo què yào tā zhǔn bèi xuē zi hé dài zi ， shuō zì jǐ yǒu bàn fǎ bāng máng ， jiē zhe bǔ lái liè wù ， yǐ zhǔ rén de míng yì sòng gěi guó wáng 。","paragraph":0},{"zh":"貓替主人取了卡拉巴侯爵的稱號，又在國王乘車經過河邊時，假稱主人的衣服被偷。","py":"māo tì zhǔ rén qǔ le kǎ lā bā hóu jué de chēng hào ， yòu zài guó wáng chéng chē jīng guò hé biān shí ， jiǎ chēng zhǔ rén de yī fú bèi tōu 。","paragraph":1},{"zh":"國王給青年衣服，請他上車，公主也因此認識了這位年輕人。","py":"guó wáng gěi qīng nián yī fú ， qǐng tā shàng chē ， gōng zhǔ yě yīn cǐ rèn shí le zhè wèi nián qīng rén 。","paragraph":1},{"zh":"貓跑到前面，讓沿途的人把田地說成侯爵所有，再進入一個會變形的食人魔城堡。","py":"māo pǎo dào qián miàn ， ràng yán tú de rén bǎ tián dì shuō chéng hóu jué suǒ yǒu ， zài jìn rù yí gè huì biàn xíng de shí rén mó chéng bǎo 。","paragraph":2},{"zh":"牠先稱讚對方能變成獅子，再故意問，這麼厲害的人能不能變成小老鼠。","py":"tā xiān chēng zàn duì fāng néng biàn chéng shī zi ， zài gù yì wèn ， zhè me lì hài de rén néng bù néng biàn chéng xiǎo lǎo shǔ 。","paragraph":2},{"zh":"食人魔立刻示範，貓便一口捉住牠。","py":"shí rén mó lì kè shì fàn ， māo biàn yī kǒu zhuō zhù tā 。","paragraph":3},{"zh":"國王到來時，城堡也被說成侯爵的家。","py":"guó wáng dào lái shí ， chéng bǎo yě bèi shuō chéng hóu jué de jiā 。","paragraph":3},{"zh":"青年最後與公主成婚，貓不再為生計捉老鼠，這段靠機智與假象改命的故事也留給讀者思考。","py":"qīng nián zuì hòu yǔ gōng zhǔ chéng hūn ， māo bù zài wéi shēng jì zhuō lǎo shǔ ， zhè duàn kào jī zhì yǔ jiǎ xiàng gǎi mìng de gù shì yě liú gěi dú zhě sī kǎo 。","paragraph":3}]},{"id":"perrault-The_Sleeping_Beauty_in_the_Wood","paragraphs":["國王為小公主舉行慶典，卻得罪了一位沒有受邀的老仙女。她詛咒公主被紡錘刺傷便會死，另一位仙女及時減輕咒語，改成沉睡一百年，等待甦醒。","公主長大後，仍在高塔遇見紡紗的老人，碰到紡錘倒下。城堡跟着沉睡，樹木封住入口。一百年後，王子穿過森林，來到床邊，正逢公主醒來，兩人相識並成婚。","婚後，他們有了兩個孩子。王子的母親卻是食人女妖，趁兒子離開，想傷害王后和孩子。善良的廚官不肯照辦，用別的食物代替，把三人藏在安全的地方。","母親後來發現真相，準備再次下手，國王恰好趕回，阻止了災禍。母親的陰謀終結，王后和孩子重新與家人相聚。這篇原著的故事，因此不只停在百年沉睡的甦醒。"],"questions":[{"q":"好仙女怎樣減輕老仙女的詛咒？","options":["把死亡改成沉睡一百年","把紡錘改成金蘋果","讓公主永遠不能走路","把所有城民變成小鳥"],"answer":0,"explanation":"原本的致命詛咒，被改成仍有醒來機會的長眠。","id":"perrault-The_Sleeping_Beauty_in_the_Wood:q0"},{"q":"婚後誰暗中保護了王后和兩個孩子？","options":["不肯害人的廚官","國王的食人女妖母親","穿靴子的貓","躲在瓶中的精靈"],"answer":0,"explanation":"廚官沒有執行傷害命令，而是把三人藏好。","id":"perrault-The_Sleeping_Beauty_in_the_Wood:q1"},{"q":"最後是甚麼使母親的陰謀無法得逞？","options":["王后交出自己的玻璃鞋","國王及時趕回","百年時間再次開始","所有人都忘記語言"],"answer":1,"explanation":"國王回到現場，王后和孩子才平安與家人重聚。","id":"perrault-The_Sleeping_Beauty_in_the_Wood:q2"}],"title":"睡美人","author":"夏爾・佩羅","group":"perrault","sourceTitle":"THE SLEEPING BEAUTY IN THE WOOD","sourceUrl":"https://www.gutenberg.org/cache/epub/29021/pg29021-images.html#The_Sleeping_Beauty_in_the_Wood","lines":[{"zh":"國王為小公主舉行慶典，卻得罪了一位沒有受邀的老仙女。","py":"guó wáng wèi xiǎo gōng zhǔ jǔ xíng qìng diǎn ， què dé zuì le yī wèi méi yǒu shòu yāo de lǎo xiān nǚ 。","paragraph":0},{"zh":"她詛咒公主被紡錘刺傷便會死，另一位仙女及時減輕咒語，改成沉睡一百年，等待甦醒。","py":"tā zǔ zhòu gōng zhǔ bèi fǎng chuí cì shāng biàn huì sǐ ， lìng yī wèi xiān nǚ jí shí jiǎn qīng zhòu yǔ ， gǎi chéng chén shuì yì bǎi nián ， děng dài sū xǐng 。","paragraph":0},{"zh":"公主長大後，仍在高塔遇見紡紗的老人，碰到紡錘倒下。","py":"gōng zhǔ zhǎng dà hòu ， réng zài gāo tǎ yù jiàn fǎng shā de lǎo rén ， pèng dào fǎng chuí dǎo xià 。","paragraph":1},{"zh":"城堡跟着沉睡，樹木封住入口。","py":"chéng bǎo gēn zhe chén shuì ， shù mù fēng zhù rù kǒu 。","paragraph":1},{"zh":"一百年後，王子穿過森林，來到床邊，正逢公主醒來，兩人相識並成婚。","py":"yì bǎi nián hòu ， wáng zǐ chuān guò sēn lín ， lái dào chuáng biān ， zhèng féng gōng zhǔ xǐng lái ， liǎng rén xiāng shí bìng chéng hūn 。","paragraph":1},{"zh":"婚後，他們有了兩個孩子。","py":"hūn hòu ， tā men yǒu le liǎng gè hái zi 。","paragraph":2},{"zh":"王子的母親卻是食人女妖，趁兒子離開，想傷害王后和孩子。","py":"wáng zǐ de mǔ qīn què shì shí rén nǚ yāo ， chèn ér zi lí kāi ， xiǎng shāng hài wáng hòu hé hái zi 。","paragraph":2},{"zh":"善良的廚官不肯照辦，用別的食物代替，把三人藏在安全的地方。","py":"shàn liáng de chú guān bù kěn zhào bàn ， yòng bié de shí wù dài tì ， bǎ sān rén cáng zài ān quán de dì fāng 。","paragraph":2},{"zh":"母親後來發現真相，準備再次下手，國王恰好趕回，阻止了災禍。","py":"mǔ qīn hòu lái fā xiàn zhēn xiàng ， zhǔn bèi zài cì xià shǒu ， guó wáng qià hǎo gǎn huí ， zǔ zhǐ le zāi huò 。","paragraph":3},{"zh":"母親的陰謀終結，王后和孩子重新與家人相聚。","py":"mǔ qīn de yīn móu zhōng jié ， wáng hòu hé hái zi chóng xīn yǔ jiā rén xiāng jù 。","paragraph":3},{"zh":"這篇原著的故事，因此不只停在百年沉睡的甦醒。","py":"zhè piān yuán zhù de gù shì ， yīn cǐ bù zhǐ tíng zài bǎi nián chén shuì de sū xǐng 。","paragraph":3}]},{"id":"perrault-The_Fairy","paragraphs":["一位母親偏愛傲慢的大女兒，卻把家務全推給溫柔的小女兒。妹妹每天到遠處泉邊取水，一次遇到衣着普通的老婦人求飲，便仔細洗好水罐，捧水給她。","老婦人原來是仙女，為答謝她的善意，送她一個禮物：每次說話，嘴裏都會落下花朵或寶石。妹妹回家解釋，母親看見珍珠和鑽石，立刻叫姐姐也到泉邊去。","姐姐只想得到同樣財物，遇到打扮華麗的女子求水，卻不肯幫忙，還說出粗魯的話。仙女於是給她相反的結果，她一開口，落下的竟是蛇和蟾蜍。","母親把怒氣發在妹妹身上，妹妹逃進森林，被王子遇見。王子聽完經過，把她接到王宮。姐姐卻因惡劣脾氣失去身邊人的接納，兩份禮物映出了兩種對人的態度。"],"questions":[{"q":"妹妹在泉邊遇到求水的老婦人時怎樣做？","options":["要求先給一顆鑽石","把水罐藏進森林","假裝聽不見就離開","洗好水罐，捧水給她"],"answer":3,"explanation":"她在不知道對方是仙女時，已經願意幫助。","id":"perrault-The_Fairy:q0"},{"q":"母親為甚麼叫姐姐也去泉邊？","options":["想請她把泉水變成雪","想讓她得到相同的寶石禮物","希望她修好一座城堡","要她替王子尋找長髮"],"answer":1,"explanation":"母親看見妹妹說話掉出寶石，便急着複製好處。","id":"perrault-The_Fairy:q1"},{"q":"姐姐開口後，落下的是甚麼？","options":["小麥與藍花","蛇和蟾蜍","玫瑰與珍珠","銀針和金線"],"answer":1,"explanation":"她粗魯拒絕求助，得到與妹妹相反的魔法結果。","id":"perrault-The_Fairy:q2"}],"title":"仙女的禮物","author":"夏爾・佩羅","group":"perrault","sourceTitle":"THE FAIRY","sourceUrl":"https://www.gutenberg.org/cache/epub/29021/pg29021-images.html#The_Fairy","lines":[{"zh":"一位母親偏愛傲慢的大女兒，卻把家務全推給溫柔的小女兒。","py":"yī wèi mǔ qīn piān ài ào màn de dà nǚ ér ， què bǎ jiā wù quán tuī gěi wēn róu de xiǎo nǚ ér 。","paragraph":0},{"zh":"妹妹每天到遠處泉邊取水，一次遇到衣着普通的老婦人求飲，便仔細洗好水罐，捧水給她。","py":"mèi mèi měi tiān dào yuǎn chù quán biān qǔ shuǐ ， yī cì yù dào yī zhuó pǔ tōng de lǎo fù rén qiú yǐn ， biàn zǐ xì xǐ hǎo shuǐ guàn ， pěng shuǐ gěi tā 。","paragraph":0},{"zh":"老婦人原來是仙女，為答謝她的善意，送她一個禮物：每次說話，嘴裏都會落下花朵或寶石。","py":"lǎo fù rén yuán lái shì xiān nǚ ， wèi dá xiè tā de shàn yì ， sòng tā yí gè lǐ wù ： měi cì shuō huà ， zuǐ lǐ dū huì là xià huā duǒ huò bǎo shí 。","paragraph":1},{"zh":"妹妹回家解釋，母親看見珍珠和鑽石，立刻叫姐姐也到泉邊去。","py":"mèi mèi huí jiā jiě shì ， mǔ qīn kàn jiàn zhēn zhū hé zuàn shí ， lì kè jiào jiě jiě yě dào quán biān qù 。","paragraph":1},{"zh":"姐姐只想得到同樣財物，遇到打扮華麗的女子求水，卻不肯幫忙，還說出粗魯的話。","py":"jiě jiě zhǐ xiǎng dé dào tóng yàng cái wù ， yù dào dǎ bàn huá lì de nǚ zǐ qiú shuǐ ， què bù kěn bāng máng ， hái shuō chū cū lǔ de huà 。","paragraph":2},{"zh":"仙女於是給她相反的結果，她一開口，落下的竟是蛇和蟾蜍。","py":"xiān nǚ yú shì gěi tā xiāng fǎn de jié guǒ ， tā yī kāi kǒu ， là xià de jìng shì shé hé chán chú 。","paragraph":2},{"zh":"母親把怒氣發在妹妹身上，妹妹逃進森林，被王子遇見。","py":"mǔ qīn bǎ nù qì fā zài mèi mèi shēn shàng ， mèi mèi táo jìn sēn lín ， bèi wáng zǐ yù jiàn 。","paragraph":3},{"zh":"王子聽完經過，把她接到王宮。","py":"wáng zǐ tīng wán jīng guò ， bǎ tā jiē dào wáng gōng 。","paragraph":3},{"zh":"姐姐卻因惡劣脾氣失去身邊人的接納，兩份禮物映出了兩種對人的態度。","py":"jiě jiě què yīn è liè pí qì shī qù shēn biān rén de jiē nà ， liǎng fèn lǐ wù yìng chū le liǎng zhǒng duì rén de tài dù 。","paragraph":3}]},{"id":"perrault-Little_Thumb","paragraphs":["樵夫家有七個兒子，最小的小拇指身材細小，卻最會留心。家裏缺糧，父母把孩子留在森林；他事先拾了白石子，一路撒下，靠石子的亮光把哥哥們帶回家。","第二次，他只能撒麵包屑，卻被鳥吃掉，大家真的迷路了。兄弟到食人魔家求宿，小拇指發現危險，趁夜交換帽子與小王冠，混淆對方，爭取時間帶哥哥們逃走。","食人魔穿着七里靴追趕，一步能走很遠，最後累得在岩邊睡着。小拇指躲在附近，悄悄脫走他的靴子。魔靴能隨腳的大小改變，正好讓最小的孩子也穿得合。","他利用靴子迅速往返遠方，替國王和人們傳遞消息，靠工作賺到財物，再回家幫助父母與兄弟。原先最不受重視的小孩子，最後成了帶大家離開困境的人。"],"questions":[{"q":"小拇指第一次靠甚麼帶哥哥們回家？","options":["一隻金色老鼠","國王的號角聲","沿路撒下的白石子","大樹上的紅花"],"answer":2,"explanation":"白石子留在地上，成為可以跟隨的路標。","id":"perrault-Little_Thumb:q0"},{"q":"第二次的麵包屑路標為甚麼失效？","options":["被鳥吃掉","全部變成金子","被公主裝進木盒","食人魔把森林搬走"],"answer":0,"explanation":"麵包屑不像石子，成了鳥的食物，無法再指路。","id":"perrault-Little_Thumb:q1"},{"q":"取得七里靴後，小拇指怎樣賺取收入？","options":["替人迅速傳遞消息","只靠在爐邊睡覺","要求哥哥交出所有衣服","把靴子拆成七條船"],"answer":0,"explanation":"他把快速行走的本領用在送信工作，改善了全家生活。","id":"perrault-Little_Thumb:q2"}],"title":"小拇指與七里靴","author":"夏爾・佩羅","group":"perrault","sourceTitle":"LITTLE THUMB","sourceUrl":"https://www.gutenberg.org/cache/epub/29021/pg29021-images.html#Little_Thumb","lines":[{"zh":"樵夫家有七個兒子，最小的小拇指身材細小，卻最會留心。","py":"qiáo fū jiā yǒu qī gè ér zi ， zuì xiǎo de xiǎo mǔ zhǐ shēn cái xì xiǎo ， què zuì huì liú xīn 。","paragraph":0},{"zh":"家裏缺糧，父母把孩子留在森林；他事先拾了白石子，一路撒下，靠石子的亮光把哥哥們帶回家。","py":"jiā lǐ quē liáng ， fù mǔ bǎ hái zi liú zài sēn lín ； tā shì xiān shí le bái s 對里凱變美的原因保留了哪兩種理解？","options":["魔法改變外貌，或愛改變眼光","鞋子變大，或帽子變小","國王施咒，或森林結冰","吃了金蘋果，或睡了一百年"],"answer":0,"explanation":"故事既提仙女的能力，也讓讀者想到愛對看法的影響。","id":"perrault-Riquet_with_the_Tuft:q2"}],"title":"卷毛里凱","author":"夏爾・佩羅","group":"perrault","sourceTitle":"RIQUET WITH THE TUFT","sourceUrl":"https://www.gutenberg.org/cache/epub/29021/pg29021-images.html#Riquet_with_the_Tuft","lines":[{"zh":"里凱王子出生時外貌不出眾，仙女卻給他聰明才智，還能把智慧送給自己愛的人。","py":"lǐ kǎi wáng zǐ chū shēng shí wài mào bù chū zhòng ， xiān nǚ què gěi tā cōng míng cái zhì ， hái néng bǎ zhì huì sòng gěi zì jǐ ài de rén 。","paragraph":0},{"zh":"另一國的大公主十分漂亮，卻常因說不出合適的話而難過，羨慕聰慧的妹妹。","py":"lìng yī guó de dà gōng zhǔ shí fēn piào liàng ， què cháng yīn shuō bù chū hé shì de huà ér nán guò ， xiàn mù cōng huì de mèi mèi 。","paragraph":0},{"zh":"她在森林遇見里凱，說出自己的煩惱。","py":"tā zài sēn lín yù jiàn lǐ kǎi ， shuō chū zì jǐ de fán nǎo 。","paragraph":1},{"zh":"里凱答應給她智慧，條件是一年後與他成婚。","py":"lǐ kǎi dā ying gěi tā zhì huì ， tiáo jiàn shì yī nián hòu yǔ tā chéng hūn 。","paragraph":1},{"zh":"公主接受後，立刻能思考和交談，回宮受到重視，身邊也多了許多求婚者。","py":"gōng zhǔ jiē shòu hòu ， lì kè néng sī kǎo hé jiāo tán ， huí gōng shòu dào zhòng shì ， shēn biān yě duō le xǔ duō qiú hūn zhě 。","paragraph":1},{"zh":"一年過去，她幾乎忘了約定，再到森林時，看見地下的人正在準備婚宴。","py":"yī nián guò qù ， tā jī hū wàng le yuē dìng ， zài dào sēn lín shí ， kàn jiàn dì xià de rén zhèng zài zhǔn bèi hūn yàn 。","paragraph":2},{"zh":"里凱前來相迎，她卻猶豫了。","py":"lǐ kǎi qián lái xiāng yíng ， tā què yóu yù le 。","paragraph":2},{"zh":"里凱於是提醒，仙女也給了她本領，可以使所愛的人變得美麗。","py":"lǐ kǎi yú shì tí xǐng ， xiān nǚ yě gěi le tā běn lǐng ， kě yǐ shǐ suǒ ài de rén biàn de měi lì 。","paragraph":2},{"zh":"公主認真想起他的善意與才智，願意愛他，眼前的里凱便不再難看。","py":"gōng zhǔ rèn zhēn xiǎng qǐ tā de shàn yì yǔ cái zhì ， yuàn yì ài tā ， yǎn qián de lǐ kǎi biàn bù zài nán kàn 。","paragraph":3},{"zh":"究竟是魔法改變外貌，還是愛改變了眼光，故事沒有硬要分清；兩人在父王同意後舉行婚禮。","py":"jiū jìng shì mó fǎ gǎi biàn wài mào ， hái shì ài gǎi biàn le yǎn guāng ， gù shì méi yǒu yìng yào fēn qīng ； liǎng rén zài fù wáng tóng yì hòu jǔ xíng hūn lǐ 。","paragraph":3}]},{"id":"perrault-Donkey-skin","paragraphs":["王后去世後，國王提出一樁不合理、令女兒害怕的婚事。公主向仙女求助，依指示要求三件像天氣、月亮和太陽的衣裙，希望藉不可能的條件阻止父王。","可是衣裙都做好了，她再要求那頭能帶來財富的驢子的皮，國王也答應。仙女便勸她離開，公主披着驢皮遮住身份，帶着可藏衣物的神奇箱子，到遠方農場做粗活。","休息日，她換上漂亮衣裙，在小房裏短暫恢復原來的模樣。一位王子偶然看見，後來請驢皮姑娘做糕點。公主把一枚戒指放進糕裏，王子便讓人尋找能戴上的主人。","許多人都戴不上，公主卻正好合適，換上禮服後，身份終於揭開。她與王子成婚，父王也已另娶他人，出席婚禮。離開危險、守住自己選擇的姑娘，終於有了新的家。"],"questions":[{"q":"公主起初為甚麼提出難得的衣裙要求？","options":["準備參加海底舞會","要把衣裙送給食人魔","想阻止令她害怕的不合理婚事","想替全國裁縫開店"],"answer":2,"explanation":"她希望難以完成的條件，能使父王放棄原來的念頭。","id":"perrault-Donkey-skin:q0"},{"q":"逃離後，公主用甚麼遮住身份？","options":["驢皮","金色王冠","十一件蕁麻衣","一雙玻璃鞋"],"answer":0,"explanation":"她披着驢皮，在農場做工，別人因此不認識她。","id":"perrault-Donkey-skin:q1"},{"q":"王子用甚麼物件尋找糕點中的姑娘？","options":["戒指","藍燈","長髮","七里靴"],"answer":0,"explanation":"糕點裏的戒指，成為讓眾人試戴的身份線索。","id":"perrault-Donkey-skin:q2"}],"title":"驢皮公主","author":"夏爾・佩羅","group":"perrault","sourceTitle":"DONKEY-SKIN","sourceUrl":"https://www.gutenberg.org/cache/epub/29021/pg29021-images.html#Donkey-skin","lines":[{"zh":"王后去世後，國王提出一樁不合理、令女兒害怕的婚事。","py":"wáng hòu qù shì hòu ， guó wáng tí chū yī zhuāng bù hé lǐ 、 lìng nǚ ér hài pà de hūn shì 。","paragraph":0},{"zh":"公主向仙女求助，依指示要求三件像天氣、月亮和太陽的衣裙，希望藉不可能的條件阻止父王。","py":"gōng zhǔ xiàng xiān nǚ qiú zhù ， yī zhǐ shì yāo qiú sān jiàn xiàng tiān qì 、 yuè liàng hé tài yáng de yī qún ， xī wàng jí bù kě néng de tiáo jiàn zǔ zhǐ fù wáng 。","paragraph":0},{"zh":"可是衣裙都做好了，她再要求那頭能帶來財富的驢子的皮，國王也答應。","py":"kě shì yī qún dōu zuò hǎo le ， tā zài yāo qiú nà tóu néng dài lái cái fù de lǘ zi de pí ， guó wáng yě dā ying 。","paragraph":1},{"zh":"仙女便勸她離開，公主披着驢皮遮住身份，帶着可藏衣物的神奇箱子，到遠方農場做粗活。","py":"xiān nǚ biàn quàn tā lí kāi ， gōng zhǔ pī zhe lǘ pí zhē zhù shēn fèn ， dài zhe kě cáng yī wù de shén qí xiāng zi ， dào yuǎn fāng nóng chǎng zuò cū huó 。","paragraph":1},{"zh":"休息日，她換上漂亮衣裙，在小房裏短暫恢復原來的模樣。","py":"xiū xī rì ， tā huàn shàng piào liàng yī qún ， zài xiǎo fáng lǐ duǎn zàn huī fù yuán lái de mú yàng 。","paragraph":2},{"zh":"一位王子偶然看見，後來請驢皮姑娘做糕點。","py":"yī wè
