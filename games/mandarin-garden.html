function localAudio(text){
  var s=String(text||'').replace(/\s+/g,' ').trim();
  if(!s)return '';
  if(typeof AUDIO_MAP!=='undefined' && AUDIO_MAP[s])return AUDIO_MAP[s];
  return '';
}
function egIsXiaomi(){
  try{return /MiuiBrowser|XiaoMi|MiBrowser|HMBrowser|Mobile\/.*XiaoMi/i.test(navigator.userAgent||'');}catch(e){return false;}
}
function ttsUrls(text){
  var s=String(text||'').replace(/\s+/g,' ').trim().slice(0,180);
  if(!s)return [];
  var urls=[];
  var loc=localAudio(s);
  if(loc)urls.push(loc);
  var q=encodeURIComponent(s);
  // Google gtx zh-CN first (VPN-friendly); then Baidu, Youdao
  urls.push('https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=zh-CN&q='+q);
  urls.push('https://fanyi.baidu.com/gettts?lan=zh&text='+q+'&spd=5&source=web');
  urls.push('https://dict.youdao.com/dictvoice?audio='+q+'&le=zh');
  return urls;
}

function speak(text,rate){
  if(egPracticeBusy){toast('請先停止練習再播放示範');return;}
  try{
    if(!text)return;
    var s=String(text).replace(/\s+/g,' ').trim();
    if(!s)return;
    var now=Date.now();
    if(s===_egLastSpeakText && (now-_egLastSpeakAt)<400)return;
    _egLastSpeakAt=now;_egLastSpeakText=s;
    var gen=egStopSpeech();
    var xiaomi=egIsXiaomi();
    var slot=document.getElementById('tts-player');
    if(slot)fillTtsPlayer(s,{gen:gen,fromSpeak:true});
    var loc=localAudio(s);
    var remotes=ttsUrls(s).filter(function(u){return u&&u!==loc;});
    var au=document.getElementById('tts-audio');
    function playOnTts(url){
      return new Promise(function(resolve,reject){
        if(gen!==_egSpeakGen){reject(new Error('stale'));return;}
        if(!au||!url){reject(new Error('no audio'));return;}
        try{if(window._egAudio){window._egAudio.pause();}}catch(e){}
        var settled=false,hang=null;
        function win(){if(settled)return;settled=true;try{clearTimeout(hang);}catch(e){}try{au.onerror=null;au.onplaying=null;}catch(e){}resolve(true);}
        function lose(){if(settled)return;settled=true;try{clearTimeout(hang);}catch(e){}try{au.onerror=null;au.onplaying=null;au.pause();}catch(e){}reject(new Error('play fail'));}
        try{
          au.onplaying=function(){win();};
          au.onerror=function(){lose();};
          if(au.getAttribute('src')!==url){au.src=url;}
          hang=setTimeout(function(){
            try{if(!settled && au.currentTime>0.05){win();return;}}catch(e){}
            lose();
          },1500);
          var pr=au.play();
          if(pr&&pr.then){pr.then(function(){win();}).catch(function(){try{if(au.currentTime>0.05){win();return;}}catch(e){}lose();});}
        }catch(e){lose();}
      });
    }
    function tryRemote(i){
      if(gen!==_egSpeakGen)return;
      if(i>=remotes.length){speakSynth(s,rate,gen,{sync:false});return;}
      playOnTts(remotes[i]).catch(function(){if(gen===_egSpeakGen)tryRemote(i+1);});
    }
    if(loc){
      toast('🔊 朗讀中');
      playOnTts(loc).catch(function(){if(gen===_egSpeakGen)tryRemote(0);});
      return;
    }
    if(xiaomi){
      toast('🔊 朗讀中');
      speakSynth(s,rate,gen,{sync:true});
      if(remotes.length && au){try{au.src=remotes[0];}catch(e){}}
      return;
    }
    if(remotes.length){
      toast('🔊 朗讀中');
      tryRemote(0);
    }else{
      speakSynth(s,rate,gen,{sync:true});
      toast('🔊 朗讀中');
    }
  }catch(e){speakSynth(String(text),rate,null,{sync:true});}
}
function egChooseMandarinVoice(voices){
  var patterns=[/^zh[-_]CN$/i,/^(?:cmn|zh[-_]Hans)/i,/^zh[-_](?:TW|SG)$/i];
  for(var p=0;p<patterns.length;p++)for(var i=0;i<voices.length;i++)if(patterns[p].test(voices[i].lang||''))return voices[i];
  for(var j=0;j<voices.length;j++)if(/普通[話话]|國語|国语|Mandarin/i.test(voices[j].name||'')&&!/yue|zh[-_]HK/i.test(voices[j].lang||''))return voices[j];
  return null;
}
function speakSynth(text,rate,keepGen,opts){
  if(egPracticeBusy)return;
  try{
    opts=opts||{};
    if(!window.speechSynthesis){toast('呢部機無系統朗讀');return;}
    var gen=(keepGen!=null)?keepGen:egStopSpeech();
    try{if(window._egAudio)window._egAudio.pause();}catch(e){}
    try{var au=document.getElementById('tts-audio');if(au)au.pause();}catch(e){}
    if(!opts.sync){try{speechSynthesis.cancel();}catch(e){}}
    else{try{if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();}catch(e){}}
    var s=String(text||'');
    var parts=s.match(/[^.!?。！？]+[.!?。！？]?/g)||[s];
    var idx=0;
    function next(){
      if(gen!==_egSpeakGen)return;
      if(idx>=parts.length)return;
      var chunk=parts[idx++].trim();
      if(!chunk){next();return;}
      var u=new SpeechSynthesisUtterance(chunk);
      u.lang='zh-CN';u.rate=rate||0.92;u.volume=1;
      var vs=[];try{vs=speechSynthesis.getVoices()||[];}catch(e){}
      var mandarinVoice=egChooseMandarinVoice(vs);if(mandarinVoice)u.voice=mandarinVoice;
      u.onend=function(){if(gen===_egSpeakGen)next();};
      u.onerror=function(){if(gen===_egSpeakGen)toast('系統朗讀失敗；請檢查手機中文語音，或撳音訊播放器重試');};
      try{speechSynthesis.speak(u);}catch(e){}
    }
    var speechStarted=false;
    function startSpeaking(){
      if(gen!==_egSpeakGen||speechStarted)return;
      speechStarted=true;
      next();
      var t1=setTimeout(function(){if(gen!==_egSpeakGen)return;try{if(speechSynthesis.paused)speechSynthesis.resume();}catch(e){}},80);
      _egSpeakTimers.push(t1);
    }
    egClearSpeakTimers();
    function kickoff(){
      if(gen!==_egSpeakGen)return;
      var vs=[];try{vs=speechSynthesis.getVoices()||[];}catch(e){}
      if(!vs.length){
        var fired=false;
        function onVoices(){if(fired)return;fired=true;try{speechSynthesis.removeEventListener('voiceschanged',onVoices);}catch(e){}if(gen===_egSpeakGen)startSpeaking();}
        try{speechSynthesis.addEventListener('voiceschanged',onVoices);}catch(e){}
        startSpeaking();
        var t2=setTimeout(function(){if(fired)return;fired=true;try{speechSynthesis.removeEventListener('voiceschanged',onVoices);}catch(e){}},500);
        _egSpeakTimers.push(t2);
      }else startSpeaking();
    }
    if(opts.sync)kickoff();
    else{var t0=setTimeout(kickoff,30);_egSpeakTimers.push(t0);}
  }catch(e){toast('系統朗讀失敗');}
}

        if(!current(rec))return;
        var code=ev.error||'error';egRecog.lastError=code;
        if(code==='no-speech')return;
        if(code==='aborted'&&!egRecog.want)return;
        fail(code);
      };
      rec.onend=function(){
        if(!current(rec))return;clearTimeout(startTimer);

        if(egRecog.want){
          if(++restarts>2){fail('no-speech');return;}

        }
      };
      startTimer=setTimeout(function(){if(current(rec)&&egRecog.want)fail('start-timeout');},12000);
      rec.start();
    }catch(e){clearTimeout(startTimer);fail(e.name||'start-failed');}

function bindTap(el,fn){
  if(!el)return;
  el.style.cursor='pointer';
  var last=0;
  el.onclick=function(ev){
    try{if(ev){ev.preventDefault();ev.stopPropagation();}}catch(e){}
    var now=Date.now();
    if(now-last<400)return;
    last=now;
    try{fn.call(el,ev);}catch(err){console.error('操作未完成',err);toast('操作未完成，請再試');}
  };
}
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  clearTimeout(toast._tm);toast._tm=setTimeout(function(){t.classList.remove('on');},1700);
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0;var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function todayKey(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function loadState(){
  try{return JSON.parse(localStorage.getItem('mg-progress-v1')||'{}')||{};}catch(e){return {};}
}
function saveState(st){try{localStorage.setItem('mg-progress-v1',JSON.stringify(st));}catch(e){}}
function bumpProgress(n){
  n=n||1;
  var st=loadState();
  var tk=todayKey();
  if(st.lastDay!==tk){
    if(st.lastDay){
      var prev=new Date(st.lastDay+'T12:00:00');
      var cur=new Date(tk+'T12:00:00');
      var diff=Math.round((cur-prev)/86400000);
      st.streak=(diff===1)?((st.streak|0)+1):1;
    }else st.streak=1;
    st.lastDay=tk;st.today=0;
  }
  st.today=(st.today|0)+n;
  st.total=(st.total|0)+n;
  saveState(st);refreshStats();
}
function refreshStats(){
  var st=loadState();
  var el=document.getElementById('st-streak');if(el)el.textContent=st.streak|0;
  el=document.getElementById('st-today');if(el)el.textContent=st.today|0;
  el=document.getElementById('st-done');if(el)el.textContent=st.total|0;
}

var SCENARIOS=[{"id":1,"cat":"food","catLabel":"飲食","region":"全國","title":"餐廳入座","scene":"你走進一家普通餐廳，服務員帶位並請你看菜單。","lines":[{"who":"店員","zh":"您好，请问几位？","py":"nín hǎo, qǐng wèn jǐ wèi?"},{"who":"你","zh":"两位。","py":"liǎng wèi."},{"who":"店員","zh":"这边请，请看菜单。","py":"zhè biān qǐng, qǐng kàn cài dān."},{"who":"你","zh":"谢谢。","py":"xiè xie."}],"practice":["请问几位？","两位。","请看菜单。"],"notes":"內地餐廳常先問人數再帶位，菜單有時分紙本與電子二維碼。"},{"id":2,"cat":"food","catLabel":"飲食","region":"全國","title":"點主食","scene":"點菜時店員問你要什麼主食。","lines":[{"who":"店員","zh":"主食要米饭还是面？","py":"zhǔ shí yào mǐ fàn hái shì miàn?"},{"who":"你","zh":"两碗米饭，谢谢。","py":"liǎng wǎn mǐ fàn, xiè xie."},{"who":"店員","zh":"好的，马上为您安排。","py":"hǎo de, mǎ shàng wèi nín ān pái."}],"practice":["主食要米饭还是面？","两碗米饭，谢谢。"],"notes":"華北、西北常配麵與饅頭；華南、華東更常配米飯。"},{"id":3,"cat":"food","catLabel":"飲食","region":"全國","title":"忌口與辣度","scene":"點菜時說明忌口與能否吃辣。","lines":[{"who":"店員","zh":"您能吃辣吗？","py":"nín néng chī là ma?"},{"who":"你","zh":"不能太辣，请少放辣椒。","py":"bù néng tài là, qǐng shǎo fàng là jiāo."},{"who":"店員","zh":"有海鲜过敏吗？","py":"yǒu hǎi xiān guò mǐn ma?"},{"who":"你","zh":"没有，谢谢。","py":"méi yǒu, xiè xie."}],"practice":["您能吃辣吗？","请少放辣椒。"],"notes":"點菜時主動說忌口可減少換菜麻煩；「微辣／中辣／特辣」各地標準不同。"},{"id":4,"cat":"food","catLabel":"飲食","region":"全國","title":"結帳埋單","scene":"用餐結束，你準備結帳。","lines":[{"who":"你","zh":"买单，谢谢。","py":"mǎi dān, xiè xie."},{"who":"店員","zh":"一共八十五元。","py":"yī gòng bā shí wǔ yuán."},{"who":"你","zh":"可以扫码支付吗？","py":"kě yǐ sǎo mǎ zhī fù ma?"},{"who":"店員","zh":"可以，微信或支付宝都行。","py":"kě yǐ, Wēi xìn huò Zhī fù bǎo dōu xíng."}],"practice":["买单，谢谢。","可以扫码支付吗？"],"notes":"內地日常多用微信／支付寶掃碼；現金仍可用但部分店較少備零錢。"},{"id":5,"cat":"food","catLabel":"飲食","region":"全國","title":"外賣打包","scene":"吃不完想打包帶走。","lines":[{"who":"你","zh":"剩下的请打包。","py":"shèng xià de qǐng dǎ bāo."},{"who":"店員","zh":"好的，稍等。","py":"hǎo de, shāo děng."},{"who":"店員","zh":"给您，请拿好。","py":"gěi nín, qǐng ná hǎo."}],"practice":["剩下的请打包。","请拿好。"],"notes":"「打包」即 takeaway；部分城市鼓勵自備餐盒減塑。"},{"id":6,"cat":"food","catLabel":"飲食","region":"全國","title":"茶位與茶水","scene":"茶餐廳或中餐廳問你喝什麼茶。","lines":[{"who":"店員","zh":"喝点什么茶？","py":"hē diǎn shén me chá?"},{"who":"你","zh":"请来一壶茉莉花茶。","py":"qǐng lái yī hú mò lì huā chá."},{"who":"店員","zh":"好的，茶马上到。","py":"hǎo de, chá mǎ shàng dào."}],"practice":["喝点什么茶？","请来一壶茉莉花茶。"],"notes":"華北常見花茶、綠茶；華南、福建更常烏龍、普洱；「茶位」在粵式早茶另計。"},{"id":7,"cat":"food","catLabel":"飲食","region":"全國","title":"早餐包子油條","scene":"早上在街邊早餐攤點吃。","lines":[{"who":"店員","zh":"要几个包子？","py":"yào jǐ gè bāo zi?"},{"who":"你","zh":"两个猪肉包，一根油条。","py":"liǎng gè zhū ròu bāo, yī gēn yóu tiáo."},{"who":"店員","zh":"豆浆要甜的还是咸的？","py":"dòu jiāng yào tián de hái shì xián de?"},{"who":"你","zh":"甜豆浆，谢谢。","py":"tián dòu jiāng, xiè xie."}],"practice":["两个猪肉包，一根油条。","甜豆浆，谢谢。"],"notes":"北方早餐常見豆漿配油條；南方亦有腸粉、粥品等。"},{"id":8,"cat":"food","catLabel":"飲食","region":"全國","title":"火鍋桌邊禮儀","scene":"第一次吃火鍋，朋友教你注意事項。","lines":[{"who":"朋友","zh":"先煮蔬菜，再下肉片。","py":"xiān zhǔ shū cài, zài xià ròu piàn."},{"who":"你","zh":"肉要煮多久？","py":"ròu yào zhǔ duō jiǔ?"},{"who":"朋友","zh":"薄肉片变色就可以夹起来。","py":"báo ròu piàn biàn sè jiù kě yǐ jiā qǐ lái."},{"who":"朋友","zh":"公用筷子和自己的筷子要分开。","py":"gōng yòng kuài zi hé zì jǐ de kuài zi yào fēn kāi."}],"practice":["先煮蔬菜，再下肉片。","公用筷子和自己的筷子要分开。"],"notes":"公筷／公勺在內地餐桌上日益普遍，尤其多人同鍋時。"},{"id":9,"cat":"food","catLabel":"飲食","region":"全國","title":"超市買水果","scene":"在超市生鮮區選水果並問價錢。","lines":[{"who":"你","zh":"这些苹果怎么卖？","py":"zhè xiē píng guǒ zěn me mài?"},{"who":"店員","zh":"八块钱一斤。","py":"bā kuài qián yī jīn."},{"who":"你","zh":"请帮我称两斤。","py":"qǐng bāng wǒ chēng liǎng jīn."}],"practice":["这些苹果怎么卖？","请帮我称两斤。"],"notes":"市斤約 500 克；不少超市已改用公斤標價，問清楚單位較穩妥。"},{"id":10,"cat":"food","catLabel":"飲食","region":"全國","title":"夜市小吃","scene":"晚上逛夜市，想點幾樣小吃。","lines":[{"who":"你","zh":"这个烤串多少钱？","py":"zhè ge kǎo chuàn duō shǎo qián?"},{"who":"店員","zh":"羊肉串三块一串。","py":"yáng ròu chuàn sān kuài yī chuàn."},{"who":"你","zh":"来五串，微辣。","py":"lái wǔ chuàn, wēi là."}],"practice":["这个烤串多少钱？","来五串，微辣。"],"notes":"夜市攤位現金與掃碼都常見；注意衛生與現烤現賣時段。"},{"id":11,"cat":"food","catLabel":"飲食","region":"北京","title":"北京烤鴨點餐","scene":"在北京特色餐廳點烤鴨。","lines":[{"who":"店員","zh":"烤鸭要一只还是半只？","py":"kǎo yā yào yī zhī hái shì bàn zhī?"},{"who":"你","zh":"半只就够了。","py":"bàn zhī jiù gòu le."},{"who":"店員","zh":"饼和甜面酱要吗？","py":"bǐng hé tián miàn jiàng yào ma?"},{"who":"你","zh":"都要，谢谢。","py":"dōu yào, xiè xie."}],"practice":["烤鸭要一只还是半只？","半只就够了。"],"notes":"北京烤鴨傳統配荷葉餅、蔥絲與甜麵醬；片皮與鴨架可另做湯。"},{"id":12,"cat":"food","catLabel":"飲食","region":"北京","title":"涮羊肉","scene":"冬天在京味店吃銅鍋涮肉。","lines":[{"who":"朋友","zh":"这是鲜切羊肉片。","py":"zhè shì xiān qiē yáng ròu piàn."},{"who":"你","zh":"怎么蘸料最好？","py":"zěn me zhàn liào zuì hǎo?"},{"who":"朋友","zh":"芝麻酱加点香菜和葱花。","py":"zhī ma jiàng jiā diǎn xiāng cài hé cōng huā."}],"practice":["这是鲜切羊肉片。","芝麻酱加点香菜和葱花。"],"notes":"京式涮羊肉以清湯為主，重在肉質與麻醬調料，與川渝麻辣鍋不同。"},{"id":13,"cat":"culture","catLabel":"文化","region":"北京","title":"天安門廣場問路","scene":"遊客在北京市中心問路去故宮方向。","lines":[{"who":"旅客","zh":"请问故宫怎么走？","py":"qǐng wèn Gù gōng zěn me zǒu?"},{"who":"路人","zh":"往北走就是午门。","py":"wǎng běi zǒu jiù shì Wǔ mén."},{"who":"旅客","zh":"需要预约吗？","py":"xū yào yù yuē ma?"},{"who":"路人","zh":"一般要提前网上预约。","py":"yī bān yào tí qián wǎng shàng yù yuē."}],"practice":["请问故宫怎么走？","一般要提前网上预约。"],"notes":"故宮等熱門景點多需網上預約限流，出行前查開放時間較穩妥。"},{"id":14,"cat":"food","catLabel":"飲食","region":"天津","title":"天津狗不理包子","scene":"在天津點著名包子作早餐。","lines":[{"who":"店員","zh":"要几屉包子？","py":"yào jǐ tì bāo zi?"},{"who":"你","zh":"一屉猪肉的。","py":"yī tì zhū ròu de."},{"who":"店員","zh":"配碗豆腐脑吗？","py":"pèi wǎn dòu fu nǎo ma?"},{"who":"你","zh":"要一碗咸的。","py":"yào yī wǎn xián de."}],"practice":["一屉猪肉的。","要一碗咸的。"],"notes":"天津早餐以包子、煎餅果子、豆腐腦聞名；豆腐腦口味分鹹甜。"},{"id":15,"cat":"food","catLabel":"飲食","region":"天津","title":"煎餅果子","scene":"街邊攤點一份煎餅果子。","lines":[{"who":"你","zh":"来一个煎饼果子。","py":"lái yī gè jiān bǐng guǒ zi."},{"who":"店員","zh":"加蛋吗？要不要脆饼？","py":"jiā dàn ma? yào bu yào cuì bǐng?"},{"who":"你","zh":"加蛋，多放点酱。","py":"jiā dàn, duō fàng diǎn jiàng."}],"practice":["来一个煎饼果子。","加蛋，多放点酱。"],"notes":"煎餅果子是天津街頭快餐代表，常加雞蛋、脆薄餅與甜麵醬。"},{"id":16,"cat":"food","catLabel":"飲食","region":"河北","title":"驢肉火燒","scene":"在河北或京津冀交界品嚐驢肉火燒。","lines":[{"who":"店員","zh":"火烧要热的还是温的？","py":"huǒ shāo yào rè de hái shì wēn de?"},{"who":"你","zh":"热的，多放点肉。","py":"rè de, duō fàng diǎn ròu."},{"who":"店員","zh":"配碗粉汤吗？","py":"pèi wǎn fěn tāng ma?"}],"practice":["热的，多放点肉。","配碗粉汤吗？"],"notes":"保定、河間等地以驢肉火燒聞名，常配高湯或粉湯。"},{"id":17,"cat":"food","catLabel":"飲食","region":"山西","title":"刀削麵","scene":"在山西麵館看師傅削麵入鍋。","lines":[{"who":"店員","zh":"刀削面要什么浇头？","py":"dāo xiāo miàn yào shén me jiāo tou?"},{"who":"你","zh":"番茄鸡蛋浇头。","py":"fān qié jī dàn jiāo tou."},{"who":"店員","zh":"汤要清汤还是炸酱？","py":"tāng yào qīng tāng hái shì zhá jiàng?"},{"who":"你","zh":"清汤就可以。","py":"qīng tāng jiù kě yǐ."}],"practice":["刀削面要什么浇头？","番茄鸡蛋浇头。"],"notes":"刀削麵是山西代表麵食，麵片中厚邊薄，配各種澆頭。"},{"id":18,"cat":"culture","catLabel":"文化","region":"山西","title":"平遙古城參觀","scene":"在平遙古城門口了解門票與開放時間。","lines":[{"who":"旅客","zh":"门票包含哪些景点？","py":"mén piào bāo hán nǎ xiē jǐng diǎn?"},{"who":"店員","zh":"古城通票含几处博物馆。","py":"gǔ chéng tōng piào hán jǐ chù bó wù guǎn."},{"who":"旅客","zh":"可以骑自行车吗？","py":"kě yǐ qí zì xíng chē ma?"}],"practice":["门票包含哪些景点？","可以骑自行车吗？"],"notes":"平遙是保存較完整的明清古城，遊覽時注意古城牆與商號建築保護。"},{"id":19,"cat":"food","catLabel":"飲食","region":"山東","title":"魯菜蔥燒海參","scene":"在山東餐廳瞭解魯菜特點。","lines":[{"who":"店員","zh":"推荐葱烧海参。","py":"tuī jiàn cōng shāo hǎi shēn."},{"who":"你","zh":"味道会很咸吗？","py":"wèi dào huì hěn xián ma?"},{"who":"店員","zh":"偏鲜香，葱香很重。","py":"piān xiān xiāng, cōng xiāng hěn zhòng."}],"practice":["推荐葱烧海参。","偏鲜香，葱香很重。"],"notes":"魯菜注重火候與鮮香，蔥、蒜運用多，是傳統四大菜系之一。"},{"id":20,"cat":"food","catLabel":"飲食","region":"山東","title":"煎餅捲大蔥","scene":"在濟南或泰安吃地方小吃。","lines":[{"who":"朋友","zh":"山东煎饼可以卷大葱。","py":"Shān dōng jiān bǐng kě yǐ juǎn dà cōng."},{"who":"你","zh":"甜面酱也要吗？","py":"tián miàn jiàng yě yào ma?"},{"who":"朋友","zh":"加点酱更香。","py":"jiā diǎn jiàng gèng xiāng."}],"practice":["山东煎饼可以卷大葱。","加点酱更香。"],"notes":"山東煎餅多為雜糧製成，可卷大蔥、醬菜，與天津煎餅果子不同。"},{"id":21,"cat":"food","catLabel":"飲食","region":"遼寧","title":"瀋陽烤冷麵","scene":"在瀋陽夜市點烤冷麵。","lines":[{"who":"你","zh":"来一份烤冷面。","py":"lái yī fèn kǎo lěng miàn."},{"who":"店員","zh":"加蛋和火腿吗？","py":"jiā dàn hé huǒ tuǐ ma?"},{"who":"你","zh":"都加，酱多一点。","py":"dōu jiā, jiàng duō yī diǎn."}],"practice":["来一份烤冷面。","都加，酱多一点。"],"notes":"烤冷麵是東北街頭小吃，把冷麵皮煎香後加醬與配料。"},{"id":22,"cat":"food","catLabel":"飲食","region":"吉林","title":"延邊冷麵","scene":"在延邊或吉林市品嚐朝鮮族冷麵。","lines":[{"who":"店員","zh":"冷面要牛肉汤底吗？","py":"lěng miàn yào niú ròu tāng dǐ ma?"},{"who":"你","zh":"要，再加一个鸡蛋。","py":"yào, zài jiā yī gè jī dàn."},{"who":"店員","zh":"辣白菜要多吗？","py":"là bái cài yào duō ma?"}],"practice":["冷面要牛肉汤底吗？","要，再加一个鸡蛋。"],"notes":"延邊冷麵受朝鮮族飲食影響，湯清爽，常配牛肉、雞蛋與泡菜。"},{"id":23,"cat":"food","catLabel":"飲食","region":"黑龍江","title":"鍋包肉","scene":"在哈爾濱點東北經典菜。","lines":[{"who":"店員","zh":"锅包肉要酸甜口。","py":"guō bāo ròu yào suān tián kǒu."},{"who":"你","zh":"一份锅包肉，再来个地三鲜。","py":"yī fèn guō bāo ròu, zài lái gè dì sān xiān."},{"who":"店員","zh":"主食要米饭吗？","py":"zhǔ shí yào mǐ fàn ma?"}],"practice":["一份锅包肉，再来个地三鲜。","主食要米饭吗？"],"notes":"鍋包肉外酥裏嫩、酸甜適口，是黑龍江代表性菜式之一。"},{"id":24,"cat":"culture","catLabel":"文化","region":"黑龍江","title":"冰雪大世界","scene":"冬天在哈爾濱了解冰雪活動入場。","lines":[{"who":"旅客","zh":"门票几点开始入场？","py":"mén piào jǐ diǎn kāi shǐ rù chǎng?"},{"who":"店員","zh":"下午开门，晚上灯光最漂亮。","py":"xià wǔ kāi mén, wǎn shàng dēng guāng zuì piào liang."},{"who":"旅客","zh":"里面很冷，要多穿。","py":"lǐ miàn hěn lěng, yào duō chuān."}],"practice":["门票几点开始入场？","晚上灯光最漂亮。"],"notes":"哈爾濱冰雪季活動豐富，戶外停留需注意保暖與防滑。"},{"id":25,"cat":"culture","catLabel":"文化","region":"內蒙古","title":"草原奶茶","scene":"在內蒙古品嚐鹹味奶茶與奶食。","lines":[{"who":"主人","zh":"这是蒙古族奶茶，偏咸。","py":"zhè shì Měng gǔ zú nǎi chá, piān xián."},{"who":"你","zh":"可以加奶皮子吗？","py":"kě yǐ jiā nǎi pí zi ma?"},{"who":"主人","zh":"可以，再配一点奶豆腐。","py":"kě yǐ, zài pèi yī diǎn nǎi dòu fu."}],"practice":["这是蒙古族奶茶，偏咸。","可以加奶皮子吗？"],"notes":"草原奶茶常為鹹口，與甜奶茶不同；奶食是日常待客常見搭配。"},{"id":26,"cat":"food","catLabel":"飲食","region":"上海","title":"生煎包","scene":"在上海早餐店點生煎。","lines":[{"who":"你","zh":"来四个生煎包。","py":"lái sì gè shēng jiān bāo."},{"who":"店員","zh":"要猪肉还是虾仁的？","py":"yào zhū ròu hái shì xiā rén de?"},{"who":"你","zh":"猪肉的，再来一碗豆浆。","py":"zhū ròu de, zài lái yī wǎn dòu jiāng."}],"practice":["来四个生煎包。","猪肉的，再来一碗豆浆。"],"notes":"生煎包底部煎至金黃，湯汁較多，小心燙口。"},{"id":27,"cat":"food","catLabel":"飲食","region":"上海","title":"小籠包蘸醋","scene":"學吃小籠包的正確方式。","lines":[{"who":"朋友","zh":"先咬小口，吸一口汤。","py":"xiān yǎo xiǎo kǒu, xī yī kǒu tāng."},{"who":"你","zh":"要蘸醋和姜丝吗？","py":"yào zhàn cù hé jiāng sī ma?"},{"who":"朋友","zh":"可以，别一下咬破。","py":"kě yǐ, bié yī xià yǎo pò."}],"practice":["先咬小口，吸一口汤。","要蘸醋和姜丝吗？"],"notes":"小籠包特色是皮薄湯多；南翔等地最為人熟知。"},{"id":28,"cat":"culture","catLabel":"文化","region":"上海","title":"外灘夜景","scene":"晚上在外灘看對岸陸家嘴。","lines":[{"who":"朋友","zh":"对岸是陆家嘴的高楼。","py":"duì àn shì Lù jiā zuǐ de gāo lóu."},{"who":"你","zh":"可以坐轮渡过去吗？","py":"kě yǐ zuò dù lún guò qù ma?"},{"who":"朋友","zh":"可以，地铁也很方便。","py":"kě yǐ, dì tiě yě hěn fāng biàn."}],"practice":["对岸是陆家嘴的高楼。","地铁也很方便。"],"notes":"外灘與陸家嘴隔黃浦江相望，夜景是上海經典遊覽路線。"},{"id":29,"cat":"food","catLabel":"飲食","region":"江蘇","title":"南京鴨血粉絲湯","scene":"在南京點鴨血粉絲湯。","lines":[{"who":"你","zh":"来一碗鸭血粉丝汤。","py":"lái yī wǎn yā xuè fěn sī tāng."},{"who":"店員","zh":"要不要加鸭肝？","py":"yào bu yào jiā yā gān?"},{"who":"你","zh":"加，辣椒油少一点。","py":"jiā, là jiāo yóu shǎo yī diǎn."}],"practice":["来一碗鸭血粉丝汤。","辣椒油少一点。"],"notes":"南京鴨製品豐富，鴨血粉絲湯是常見小吃與早餐選擇。"},{"id":30,"cat":"food","catLabel":"飲食","region":"江蘇","title":"蘇州麵湯分開","scene":"在蘇州麵店體驗「麵湯分開」。","lines":[{"who":"店員","zh":"面条和汤是分开的。","py":"miàn tiáo hé tāng shì fēn kāi de."},{"who":"你","zh":"为什么要分开？","py":"wèi shén me yào fēn kāi?"},{"who":"店員","zh":"这样面条更劲道。","py":"zhè yàng miàn tiáo gèng jìn dao."}],"practice":["面条和汤是分开的。","这样面条更劲道。"],"notes":"蘇式麵常「麵湯分開」或寬湯窄麵，強調麵的口感與澆頭。"},{"id":31,"cat":"food","catLabel":"飲食","region":"浙江","title":"西湖醋魚","scene":"在杭州點杭幫菜。","lines":[{"who":"店員","zh":"西湖醋鱼是酸甜口。","py":"Xī hú cù yú shì suān tián kǒu."},{"who":"你","zh":"再来一份龙井虾仁。","py":"zài lái yī fèn Lóng jǐng xiā rén."},{"who":"店員","zh":"主食要米饭吗？","py":"zhǔ shí yào mǐ fàn ma?"}],"practice":["西湖醋鱼是酸甜口。","再来一份龙井虾仁。"],"notes":"杭幫菜口味偏清淡鮮嫩；龍井蝦仁用茶葉提香是地方特色。"},{"id":32,"cat":"culture","catLabel":"文化","region":"浙江","title":"西湖遊船","scene":"在杭州問西湖遊船班次。","lines":[{"who":"旅客","zh":"游船多久一班？","py":"yóu chuán duō jiǔ yī bān?"},{"who":"店員","zh":"大约二十分钟一班。","py":"dà yuē èr shí fēn zhōng yī bān."},{"who":"旅客","zh":"可以看三潭印月吗？","py":"kě yǐ kàn Sān tán yìn yuè ma?"}],"practice":["游船多久一班？","可以看三潭印月吗？"],"notes":"西湖是杭州核心景區，遊船可近距離看湖心島嶼與堤岸景色。"},{"id":33,"cat":"food","catLabel":"飲食","region":"浙江","title":"寧波湯圓","scene":"冬至或平時吃寧波風味湯圓。","lines":[{"who":"朋友","zh":"宁波汤圆是黑芝麻馅。","py":"Níng bō tāng yuán shì hēi zhī ma xiàn."},{"who":"你","zh":"要煮多久？","py":"yào zhǔ duō jiǔ?"},{"who":"朋友","zh":"浮起来再煮一两分钟。","py":"fú qǐ lái zài zhǔ yī liǎng fēn zhōng."}],"practice":["宁波汤圆是黑芝麻馅。","浮起来再煮一两分钟。"],"notes":"寧波湯圓以豬油黑芝麻餡聞名，冬至吃湯圓是常見習俗。"},{"id":34,"cat":"food","catLabel":"飲食","region":"安徽","title":"徽州臭鱖魚","scene":"在安徽餐廳瞭解徽菜代表菜。","lines":[{"who":"店員","zh":"臭鳜鱼闻着臭，吃着香。","py":"chòu guì yú wén zhe chòu, chī zhe xiāng."},{"who":"你","zh":"味道会很重吗？","py":"wèi dào huì hěn zhòng ma?"},{"who":"店員","zh":"咸鲜为主，可以先尝一小块。","py":"xián xiān wéi zhǔ, kě yǐ xiān cháng yī xiǎo kuài."}],"practice":["臭鳜鱼闻着臭，吃着香。","可以先尝一小块。"],"notes":"徽菜重火功與醃鮮；臭鱖魚經發酵工藝，是黃山一帶名菜。"},{"id":35,"cat":"culture","catLabel":"文化","region":"安徽","title":"黃山登山提示","scene":"登黃山前了解天氣與索道。","lines":[{"who":"旅客","zh":"今天山上有云海吗？","py":"jīn tiān shān shàng yǒu yún hǎi ma?"},{"who":"工作人員","zh":"看天气，早上更常见。","py":"kàn tiān qì, zǎo shang gèng cháng jiàn."},{"who":"旅客","zh":"索道还在运行吗？","py":"suǒ dào hái zài yùn xíng ma?"}],"practice":["今天山上有云海吗？","索道还在运行吗？"],"notes":"黃山雲海、奇松聞名；登山請查即時天氣、索道與安全提示。"},{"id":36,"cat":"food","catLabel":"飲食","region":"福建","title":"佛跳牆介紹","scene":"在福州餐廳聽店員介紹名菜。","lines":[{"who":"店員","zh":"佛跳墙是多种海鲜炖的。","py":"Fó tiào qiáng shì duō zhǒng hǎi xiān dùn de."},{"who":"你","zh":"分量适合几个人？","py":"fèn liàng shì hé jǐ gè rén?"},{"who":"店員","zh":"一小盅适合两到三位。","py":"yī xiǎo zhōng shì hé liǎng dào sān wèi."}],"practice":["佛跳墙是多种海鲜炖的。","一小盅适合两到三位。"],"notes":"佛跳牆是閩菜高端代表，用多種山珍海味長期煨製。"},{"id":37,"cat":"food","catLabel":"飲食","region":"福建","title":"廈門沙茶麵","scene":"在廈門點一碗沙茶麵。","lines":[{"who":"你","zh":"来一碗沙茶面。","py":"lái yī wǎn shā chá miàn."},{"who":"店員","zh":"要加什么料？","py":"yào jiā shén me liào?"},{"who":"你","zh":"加豆腐和瘦肉。","py":"jiā dòu fu hé shòu ròu."}],"practice":["来一碗沙茶面。","加豆腐和瘦肉。"],"notes":"沙茶醬帶花生與香料風味，是閩南、廈門常見麵湯底。"},{"id":38,"cat":"culture","catLabel":"文化","region":"福建","title":"土樓參觀","scene":"在福建土樓景區了解建築特點。","lines":[{"who":"導遊","zh":"土楼是客家人的传统民居。","py":"tǔ lóu shì Kè jiā rén de chuán tǒng mín jū."},{"who":"旅客","zh":"里面可以住人吗？","py":"lǐ miàn kě yǐ zhù rén ma?"},{"who":"導遊","zh":"部分楼栋仍有居民生活。","py":"bù fèn lóu dòng réng yǒu jū mín shēng huó."}],"practice":["土楼是客家人的传统民居。","部分楼栋仍有居民生活。"],"notes":"福建土樓以圓樓、方樓聞名，體現客家聚居與防禦需求，參觀時尊重居民隱私。"},{"id":39,"cat":"food","catLabel":"飲食","region":"江西","title":"瓦罐湯","scene":"在南昌喝瓦罐湯。","lines":[{"who":"店員","zh":"瓦罐汤要排骨还是鸡汤？","py":"wǎ guàn tāng yào pái gǔ hái shì jī tāng?"},{"who":"你","zh":"排骨汤，再来一份拌粉。","py":"pái gǔ tāng, zài lái yī fèn bàn fěn."},{"who":"店員","zh":"粉要辣一点吗？","py":"fěn yào là yī diǎn ma?"}],"practice":["排骨汤，再来一份拌粉。","粉要辣一点吗？"],"notes":"南昌瓦罐湯以小瓦罐慢燉，常配拌粉或米粉，是地方早餐特色。"},{"id":40,"cat":"culture","catLabel":"文化","region":"江西","title":"景德鎮瓷器","scene":"在景德鎮了解瓷器購買與包裝。","lines":[{"who":"旅客","zh":"这个杯子可以托运吗？","py":"zhè ge bēi zi kě yǐ tuō yùn ma?"},{"who":"店員","zh":"可以，我们会加固包装。","py":"kě yǐ, wǒ men huì jiā gù bāo zhuāng."},{"who":"旅客","zh":"是手工还是机器做的？","py":"shì shǒu gōng hái shì jī qì zuò de?"}],"practice":["这个杯子可以托运吗？","我们会加固包装。"],"notes":"景德鎮有「瓷都」之稱；購買易碎品請確認包裝與運輸方式。"},{"id":41,"cat":"food","catLabel":"飲食","region":"河南","title":"胡辣湯配包子","scene":"在河南早餐店點胡辣湯。","lines":[{"who":"你","zh":"来一碗胡辣汤。","py":"lái yī wǎn hú là tāng."},{"who":"店員","zh":"要不要配包子？","py":"yào bu yào pèi bāo zi?"},{"who":"你","zh":"配两个素包。","py":"pèi liǎng gè sù bāo."}],"practice":["来一碗胡辣汤。","配两个素包。"],"notes":"胡辣湯是河南經典早餐，胡椒與香料味突出，常配油條或包子。"},{"id":42,"cat":"culture","catLabel":"文化","region":"河南","title":"龍門石窟","scene":"在洛陽參觀龍門石窟。","lines":[{"who":"旅客","zh":"参观大约需要多久？","py":"cān guān dà yuē xū yào duō jiǔ?"},{"who":"工作人員","zh":"走主要洞窟大概两小时。","py":"zǒu zhǔ yào dòng kū dà gài liǎng xiǎo shí."},{"who":"旅客","zh":"可以拍照吗？","py":"kě yǐ pāi zhào ma?"}],"practice":["参观大约需要多久？","走主要洞窟大概两小时。"],"notes":"龍門石窟是中國重要石刻藝術遺產，部分區域對閃光燈有限制。"},{"id":43,"cat":"food","catLabel":"飲食","region":"湖北","title":"熱乾麵","scene":"在武漢早餐點熱乾麵。","lines":[{"who":"你","zh":"来一碗热干面。","py":"lái yī wǎn rè gān miàn."},{"who":"店員","zh":"酸豆角要多吗？","py":"suān dòu jiǎo yào duō ma?"},{"who":"你","zh":"多一点，辣椒少一点。","py":"duō yī diǎn, là jiāo shǎo yī diǎn."}],"practice":["来一碗热干面。","辣椒少一点。"],"notes":"熱乾麵以芝麻醬拌麵、無湯，是武漢最具代表性的過早（早餐）麵食。"},{"id":44,"cat":"food","catLabel":"飲食","region":"湖北","title":"小龍蝦季節","scene":"夏天在湖北點小龍蝦。","lines":[{"who":"店員","zh":"小龙虾要什么味道？","py":"xiǎo lóng xiā yào shén me wèi dào?"},{"who":"你","zh":"蒜蓉微辣。","py":"suàn róng wēi là."},{"who":"店員","zh":"要几斤？","py":"yào jǐ jīn?"},{"who":"你","zh":"两斤，谢谢。","py":"liǎng jīn, xiè xie."}],"practice":["蒜蓉微辣。","两斤，谢谢。"],"notes":"潛江等地小龍蝦產業知名；口味有香辣、蒜蓉、十三香等。"},{"id":45,"cat":"food","catLabel":"飲食","region":"湖南","title":"湘菜剁椒魚頭","scene":"在長沙點湘菜，先確認辣度。","lines":[{"who":"店員","zh":"剁椒鱼头很下饭。","py":"duò jiāo yú tóu hěn xià fàn."},{"who":"你","zh":"可以做成微辣吗？","py":"kě yǐ zuò chéng wēi là ma?"},{"who":"店員","zh":"可以，我们少放辣椒。","py":"kě yǐ, wǒ men shǎo fàng là jiāo."}],"practice":["可以做成微辣吗？","我们少放辣椒。"],"notes":"湘菜重辣重油香；點菜時可明確「微辣／免辣」以便廚房調整。"},{"id":46,"cat":"culture","catLabel":"文化","region":"湖南","title":"張家界景區","scene":"在張家界了解百龍天梯與行程。","lines":[{"who":"旅客","zh":"百龙电梯还开放吗？","py":"Bǎi lóng diàn tī hái kāi fàng ma?"},{"who":"工作人員","zh":"开放，但可能排队。","py":"kāi fàng, dàn kě néng pái duì."},{"who":"旅客","zh":"景区车票怎么买？","py":"jǐng qū chē piào zěn me mǎi?"}],"practice":["百龙电梯还开放吗？","景区车票怎么买？"],"notes":"張家界砂岩峰林地貌獨特；旺季建議預留排隊與交通接駁時間。"},{"id":47,"cat":"food","catLabel":"飲食","region":"廣東","title":"早茶點心","scene":"在廣州茶樓食早茶。","lines":[{"who":"店員","zh":"请问要什么茶？","py":"qǐng wèn yào shén me chá?"},{"  zhí zǒu jiù dào."},{"who":"旅客","zh":"附近有公交吗？","py":"fù jìn yǒu gōng jiāo ma?"}],"practice":["中山桥怎么走？","沿河边一直走就到。"],"notes":"中山橋是蘭州黃河上的歷史橋梁，夜景與河邊步道適合散步。"},{"id":85,"cat":"daily","catLabel":"日常","region":"陝西","title":"回民街購物禮貌","scene":"在西安回民街買點心注意禮貌用語。","lines":[{"who":"你","zh":"老板，这个怎么卖？","py":"lǎo bǎn, zhè ge zěn me mài?"},{"who":"店員","zh":"二十元一斤。","py":"èr shí yuán yī jīn."},{"who":"你","zh":"请给我装一点。","py":"qǐng gěi wǒ zhuāng yī diǎn."}],"practice":["老板，这个怎么卖？","请给我装一点。"],"notes":"回民街商販眾多；購買清真食品時可禮貌詢問成分與新鮮程度。"},{"id":86,"cat":"culture","catLabel":"文化","region":"全國","title":"春節拜年問候","scene":"春節期間用普通話拜年。","lines":[{"who":"你","zh":"过年好！祝您新年快乐。","py":"guò nián hǎo! zhù nín xīn nián kuài lè."},{"who":"親戚","zh":"恭喜发财，万事如意。","py":"gōng xǐ fā cái, wàn shì rú yì."},{"who":"你","zh":"谢谢，也祝您身体健康。","py":"xiè xie, yě zhù nín shēn tǐ jiàn kāng."}],"practice":["过年好！祝您新年快乐。","也祝您身体健康。"],"notes":"春節是中國最重要傳統節日之一，拜年用語各地略有差異但祝福相通。"},{"id":87,"cat":"food","catLabel":"飲食","region":"全國","title":"年夜飯餃子","scene":"北方家庭年夜飯常包餃子。","lines":[{"who":"家人","zh":"过年要吃饺子。","py":"guò nián yào chī jiǎo zi."},{"who":"你","zh":"我来帮忙包。","py":"wǒ lái bāng máng bāo."},{"who":"家人","zh":"馅里有白菜和猪肉。","py":"xiàn lǐ yǒu bái cài hé zhū ròu."}],"practice":["过年要吃饺子。","我来帮忙包。"],"notes":"許多北方家庭除夕吃餃子；南方年夜飯菜式更豐富多樣。"},{"id":88,"cat":"culture","catLabel":"文化","region":"全國","title":"中秋月餅分享","scene":"中秋節與同事分享月餅。","lines":[{"who":"同事","zh":"中秋快乐，吃块月饼。","py":"Zhōng qiū kuài lè, chī kuài yuè bǐng."},{"who":"你","zh":"谢谢，这是什么馅？","py":"xiè xie, zhè shì shén me xiàn?"},{"who":"同事","zh":"莲蓉蛋黄的。","py":"lián róng dàn huáng de."}],"practice":["中秋快乐，吃块月饼。","这是什么馅？"],"notes":"中秋賞月、食月餅象徵團圓；餡料有蓮蓉、五仁、鮮肉等。"},{"id":89,"cat":"food","catLabel":"飲食","region":"廣東","title":"冬至湯圓或餃子","scene":"冬至在南方吃湯圓的對話。","lines":[{"who":"朋友","zh":"冬至吃汤圆，圆圆满满。","py":"dōng zhì chī tāng yuán, yuán yuán mǎn mǎn."},{"who":"你","zh":"北方是不是吃饺子？","py":"běi fāng shì bu shì chī jiǎo zi?"},{"who":"朋友","zh":"很多地方会吃饺子。","py":"hěn duō dì fāng huì chī jiǎo zi."}],"practice":["冬至吃汤圆，圆圆满满。","很多地方会吃饺子。"],"notes":"冬至飲食南北有別：南方常食湯圓，北方多食餃子。"},{"id":90,"cat":"food","catLabel":"飲食","region":"上海","title":"本幫紅燒肉","scene":"在上海本幫菜館點紅燒肉。","lines":[{"who":"店員","zh":"推荐本帮红烧肉。","py":"tuī jiàn běn bāng hóng shāo ròu."},{"who":"你","zh":"会不会很甜？","py":"huì bu huì hěn tián?"},{"who":"店員","zh":"偏甜咸，配米饭很合适。","py":"piān tián xián, pèi mǐ fàn hěn hé shì."}],"practice":["推荐本帮红烧肉。","会不会很甜？"],"notes":"本幫菜常用糖提鮮，紅燒肉色澤紅亮、甜鹹平衡。"},{"id":91,"cat":"food","catLabel":"飲食","region":"湖南","title":"臭豆腐街頭","scene":"在長沙街頭嘗試臭豆腐。","lines":[{"who":"店員","zh":"臭豆腐要炸得脆吗？","py":"chòu dòu fu yào zhá de cuì ma?"},{"who":"你","zh":"要脆的，酱汁少一点。","py":"yào cuì de, jiàng zhī shǎo yī diǎn."},{"who":"店員","zh":"加香菜和辣椒吗？","py":"jiā xiāng cài hé là jiāo ma?"}],"practice":["要脆的，酱汁少一点。","加香菜和辣椒吗？"],"notes":"長沙臭豆腐外酥內嫩，氣味發酵獨特；可自選醬料與辣度。"},{"id":92,"cat":"culture","catLabel":"文化","region":"北京","title":"胡同騎行","scene":"在北京胡同租自行車遊覽。","lines":[{"who":"旅客","zh":"可以在胡同骑车吗？","py":"kě yǐ zài hú tòng qí chē ma?"},{"who":"店員","zh":"可以，请慢行注意行人。","py":"kě yǐ, qǐng màn xíng zhù yì xíng rén."},{"who":"旅客","zh":"附近有四合院参观吗？","py":"fù jìn yǒu sì hé yuàn cān guān ma?"}],"practice":["可以在胡同骑车吗？","请慢行注意行人。"],"notes":"胡同與四合院是北京傳統居住形態；遊覽時請尊重居民生活。"},{"id":93,"cat":"food","catLabel":"飲食","region":"貴州","title":"腸旺麵","scene":"在貴陽早餐點腸旺麵。","lines":[{"who":"你","zh":"来一碗肠旺面。","py":"lái yī wǎn cháng wàng miàn."},{"who":"店員","zh":"血旺和肥肠都要吗？","py":"xuè wàng hé féi cháng dōu yào ma?"},{"who":"你","zh":"都要，辣度中等。","py":"dōu yào, là dù zhōng děng."}],"practice":["来一碗肠旺面。","辣度中等。"],"notes":"腸旺麵是貴陽代表性早餐麵，以豬血旺、肥腸與酸辣湯底為特色。"},{"id":94,"cat":"culture","catLabel":"文化","region":"內蒙古","title":"那達慕介紹","scene":"夏天瞭解草原那達慕活動內容。","lines":[{"who":"導遊","zh":"那达慕有摔跤、赛马和射箭。","py":"Nà dá mù yǒu shuāi jiāo, sài mǎ hé shè jiàn."},{"who":"旅客","zh":"一般在哪个季节？","py":"yī bān zài nǎ ge jì jié?"},{"who":"導遊","zh":"多在夏季举行。","py":"duō zài xià jì jǔ xíng."}],"practice":["那达慕有摔跤、赛马和射箭。","多在夏季举行。"],"notes":"那達慕是蒙古族傳統盛會，以「男兒三藝」等競技與歌舞為核心。"},{"id":95,"cat":"food","catLabel":"飲食","re   egCancelPractice();

/* 拼音花園：聲母／韻母解析 + 例字例句（唔讀單字） */
function mgToneStripPy(py){
  return String(py||'').toLowerCase()
    .replace(/[āáǎà]/g,'a').replace(/[ēéěè]/g,'e').replace(/[īíǐì]/g,'i')
    .replace(/[ōóǒò]/g,'o').replace(/[ūúǔù]/g,'u').replace(/[ǖǘǚǜ]/g,'ü')
    .replace(/v/g,'ü').replace(/[ńňǹṅ]/g,'n').replace(/[0-5]/g,'').trim();
}
function mgSplitPinyin(py){
  var base=mgToneStripPy(py), initials=['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s'], i, ini, fin;
  if(!base)return {initial:'ø',final:''};
  if(base.charAt(0)==='y'){
    fin=base.slice(1);
    if(fin.charAt(0)==='u')fin='ü'+fin.slice(1);
    else if(fin.charAt(0)!=='i')fin='i'+fin;
    if(fin==='iou')fin='iu';
    if(fin==='uei')fin='ui';
    if(fin==='uen')fin='un';
    return {initial:'ø',final:fin};
  }
  if(base.charAt(0)==='w'){
    fin=base.slice(1);
    if(fin.charAt(0)!=='u')fin='u'+fin;
    if(fin==='iou')fin='iu';
    if(fin==='uei')fin='ui';
    if(fin==='uen')fin='un';
    return {initial:'ø',final:fin};
  }
  for(i=0;i<initials.length;i++){
    ini=initials[i];
    if(base.indexOf(ini)===0){
      fin=base.slice(ini.length);
      if((ini==='j'||ini==='q'||ini==='x')&&fin.charAt(0)==='u')fin='ü'+fin.slice(1);
      if(fin==='iou')fin='iu';
      if(fin==='uei')fin='ui';
      if(fin==='uen')fin='un';
      return {initial:ini,final:fin||''};
    }
  }
  fin=base;
  if(fin==='iou')fin='iu';
  if(fin==='uei')fin='ui';
  if(fin==='uen')fin='un';
  return {initial:'ø',final:fin};
}
function mgCharSentence(c){
  if(!c)return '';
  if(c.sentence&&String(c.sentence).trim())return String(c.sentence).trim();
  var zh=c.zh||c.speak||'';
  return zh?('请跟我一起读「'+zh+'」这个字。'):'';
}
function mgPinyinSamplesFromBank(){
  if(typeof CHAR_BANK==='undefined'||!CHAR_BANK.length){
    return (PINYIN.samples||[]).map(function(s){
      return {zh:s.zh,py:s.py,speak:s.speak||s.zh,sentence:s.sentence||('请跟我一起读「'+(s.zh||'')+'」这个字。'),initial:mgSplitPinyin(s.py).initial,final:mgSplitPinyin(s.py).final};
    });
  }
  return CHAR_BANK.map(function(c){
    var sp=mgSplitPinyin(c.py);
    return {zh:c.zh,py:c.py,speak:c.speak||c.zh,sentence:mgCharSentence(c),initial:sp.initial,final:sp.final,tone:c.tone};
  });
}

    var it=curList[curIdx%curList.length];

      label:'拼音跟讀 · '+it.zh+'（'+(curIdx%curList.length+1)+'/'+curList.length+'）· 目標例句',

        curIdx=(curIdx+1)%curList.length;

        mountCur();
      }

    var total=list.length, pages=Math.max(1, Math.ceil(Math.max(total,1)/pageSize));

    for(var ix=start;ix<end;ix++){

    if(total>pageSize){
      var pager=document.createElement('div');pager.className='chips';pager.style.marginTop='8px';
      var prev=document.createElement('button');prev.type='button';prev.className='chip';prev.textContent='← 上一頁';
      var next=document.createElement('button');next.type='button';next.className='chip';next.textContent='下一頁 →';
      var info=document.createElement('span');info.className='muted';info.textContent='第 '+(page+1)+'/'+pages+' 頁';
      bindTap(prev,function(){page=(page-1+pages)%pages;draw();});
      bindTap(next,function(){page=(page+1)%pages;draw();});
      pager.appendChild(prev);pager.appendChild(info);pager.appendChild(next);
      container.appendChild(pager);
    }
    mountCur();
  }
  tabs.forEach(function(t,i){
    var b=document.createElement('button');b.type='button';b.className='chip'+(i===0?' on':'');b.textContent=t.lab;b.dataset.id=t.id;
    bindTap(b,function(){
      box.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on');});
      b.classList.add('on');
      page=0;filterKind='';filterVal='';
      if(t.id==='samples'){curList=samples.slice();curIdx=0;}
      draw();
    });
    box.appendChild(b);
  });
  function draw(){
    var id=(box.querySelector('.chip.on')||{}).dataset.id||'samples';
    var p=document.getElementById('py-panel');
    p.innerHTML='';
    if(id==='samples'){
      curList=samples.slice();
      paintGrid(p, curList, '<p class="muted">例字庫 '+samples.length+' 字 · 全部用<strong>例句</strong>示範／跟讀</p>');
      return;
    }
    if(id==='init'){
      var initials=(PINYIN.initials||[]).slice();
      if(initials.indexOf('ø')<0)initials=initials.concat(['ø']);
      var tip=document.createElement('p');tip.className='muted';tip.innerHTML='聲母（Initials）· 撳可列出用呢個聲母嘅字（ø＝零聲母）';
      p.appendChild(tip);
      var chips=document.createElement('div');chips.className='chips';p.appendChild(chips);
      initials.forEach(function(x){
        var b=document.createElement('button');b.type='button';b.className='chip'+(filterKind==='init'&&filterVal===x?' on':'');b.textContent=x;
        bindTap(b,function(){
          filterKind='init';filterVal=x;page=0;draw();
        });
        chips.appendChild(b);
      });
      if(filterKind==='init'&&filterVal){
        var list=samples.filter(function(it){return it.initial===filterVal;});
        curList=list; if(curIdx>=list.length)curIdx=0;
        var zone=document.createElement('div');p.appendChild(zone);
        paintGrid(zone, list, '<p class="muted">聲母 <b>'+esc(filterVal)+'</b> · '+list.length+' 字 · 撳字聽／跟讀<strong>例句</strong></p>');
      }else{
        document.getElementById('py-speak').innerHTML='<p class="muted">請先揀一個聲母，再撳字卡跟讀例句。</p>';
      }
      return;
    }
    var finals=(PINYIN.finals||[]).slice();
    var tip2=document.createElement('p');tip2.className='muted';tip2.textContent='韻母（Finals）· 撳可列出用呢個韻母嘅字';
    p.appendChild(tip2);
    var chips2=document.createElement('div');chips2.className='chips';p.appendChild(chips2);
    finals.forEach(function(x){
      var b=document.createElement('button');b.type='button';b.className='chip'+(filterKind==='fin'&&filterVal===x?' on':'');b.textContent=x;
      bindTap(b,function(){
        filterKind='fin';filterVal=x;page=0;draw();
      });
      chips2.appendChild(b);
    });
    if(filterKind==='fin'&&filterVal){
      var list2=samples.filter(function(it){return it.final===filterVal;});
      curList=list2; if(curIdx>=list2.length)curIdx=0;
      var zone2=document.createElement('div');p.appendChild(zone2);
      paintGrid(zone2, list2, '<p class="muted">韻母 <b>'+esc(filterVal)+'</b> · '+list2.length+' 字 · 撳字聽／跟讀<strong>例句</strong></p>');
    }else{
      document.getElementById('py-speak').innerHTML='<p class="muted">請先揀一個韻母，再撳字卡跟讀例句。</p>';
    }
  }
  draw();
}

function egDialogTotal(){
  if(typeof SCENARIOS!=='undefined' && SCENARIOS && SCENARIOS.length)return SCENARIOS.length;
  var n=0,cats=Object.keys(DIALOGS);for(var i=0;i<cats.length;i++)n+=DIALOGS[cats[i]].length;return n;
}
function egScenariosByCat(catLabel){
  if(typeof SCENARIOS==='undefined'||!SCENARIOS)return DIALOGS[catLabel]||[];
  return SCENARIOS.filter(function(s){return s.catLabel===catLabel;});
}
function egDialogGlobalIndex(cat,idx){
  if(typeof SCENARIOS!=='undefined' && SCENARIOS && SCENARIOS.length){
    var list=egScenariosByCat(cat);var s=list[idx];if(!s)return idx;
    for(var i=0;i<SCENARIOS.length;i++){if(SCENARIOS[i].id===s.id)return i;}
    return idx;
  }
  var n=0,cats=Object.keys(DIALOGS);
  for(var i=0;i<cats.length;i++){
    if(cats[i]===cat)return n+idx;
    n+=DIALOGS[cats[i]].length;
  }
  return n+idx;
}
function renderDialog(body){
  var cats=Object.keys(DIALOGS);
  var cat=cats[0];
  var scIdx=0;
  var pracIdx=0;
  var total=egDialogTotal();
  body.innerHTML='<p class="hint">飲食／地方文化為主，共 <b>'+total+'</b> 關情景。揀分類 → 睇對白 → AI 跟讀練習句。</p>'+
    '<div class="chips" id="dlg-tabs"></div>'+
    '<label class="muted" style="display:flex;align-items:center;gap:8px;margin:8px 0">'+
    '<input type="checkbox" id="dlg-py" '+(showPinyin?'checked':'')+'> 顯示拼音</label>'+
    '<div id="dlg-prog" class="muted" style="margin:4px 0 8px;font-weight:700;color:var(--rose)"></div>'+
    '<div id="dlg-scene" class="dialog-line" style="background:#fff8fb"></div>'+
    '<div id="dlg-speak" class="speak-dock-anchor"></div>'+
    '<button class="btn sm" type="button" id="dlg-next" style="margin-bottom:8px;background:linear-gradient(180deg,#ffb4c8,#f07a9a)">下一關 →</button>'+
    '<div id="dlg-list"></div>';
  var tabs=document.getElementById('dlg-tabs');
  cats.forEach(function(c,i){
    var n=egScenariosByCat(c).length;
    var b=document.createElement('button');b.type='button';b.className='chip'+(i===0?' on':'');b.textContent=c+' · '+n;
    bindTap(b,function(){tabs.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on');});b.classList.add('on');cat=c;scIdx=0;pracIdx=0;draw();});
    tabs.appendChild(b);
  });
  document.getElementById('dlg-py').onchange=function(){showPinyin=!!this.checked;draw();};
  function curList(){return egScenariosByCat(cat);}
  function curSc(){var L=curList();return L[scIdx%Math.max(1,L.length)];}
  function practiceList(sc){
    if(!sc)return [];
    if(sc.practice && sc.practice.length)return sc.practice.slice();
    if(sc.lines && sc.lines.length){
      return sc.lines.filter(function(l){return l.who==='你';}).map(function(l){return l.zh;});
    }
    return sc.zh?[sc.zh]:[];
  }
  function setProg(){
    var sc=curSc();if(!sc)return;
    var g=(typeof sc.id==='number'?sc.id:egDialogGlobalIndex(cat,scIdx)+1);
    var el=document.getElementById('dlg-prog');
    var ps=practiceList(sc);
    if(el)el.textContent='第 '+g+' / '+total+' 關 · '+cat+' · '+(sc.region||'')+'（練習 '+(pracIdx+1)+'/'+Math.max(1,ps.length)+'）';
  }
  function mountPractice(){
    var sc=curSc();if(!sc)return;
    var ps=practiceList(sc);
    if(!ps.length)ps=[''];
    pracIdx=pracIdx%ps.length;
    var zh=ps[pracIdx];
    setProg();
    fillTtsPlayer(zh);
    mountSpeakPractice(document.getElementById('dlg-speak'),zh,{
      label:'第 '+(sc.id||egDialogGlobalIndex(cat,scIdx)+1)+' 關 · '+(sc.title||sc.who||'')+' · 練習',
      onNext:function(){
        if(pracIdx+1<ps.length){pracIdx++;speak(ps[pracIdx]);mountPractice();}
        else {scIdx=(scIdx+1)%curList().length;pracIdx=0;var nps=practiceList(curSc());speak(nps[0]||'');draw();}
      }
    });
  }
  function draw(){
    var list=document.getElementById('dlg-list');list.innerHTML='';
    var sc=curSc();
    var sceneEl=document.getElementById('dlg-scene');
    if(sc && sceneEl){
      sceneEl.innerHTML='<div class="who">'+esc(sc.title||sc.who||'')+' · '+esc(sc.region||'')+'</div>'+
        '<div style="margin:4px 0">'+esc(sc.scene||'')+'</div>'+
        (sc.notes?'<div class="muted" style="font-size:.78rem;margin-top:4px">'+esc(sc.notes)+'</div>':'');
    }
    var lines=(sc && sc.lines)?sc.lines:[(sc||{})];
    lines.forEach(function(line,i){
      var div=document.createElement('div');div.className='dialog-line';
      div.innerHTML='<div class="who">'+esc(line.who||'')+'</div><div>'+esc(line.zh||'')+'</div>'+
        (showPinyin && line.py?'<div class="pinyin">'+esc(line.py)+'</div>':'')+
        '<div class="btn-row" style="margin-top:6px">'+
        '<button class="btn ghost sm" type="button" data-a="listen">🔊 聽</button>'+
        '<button class="btn ghost sm" type="button" data-a="practice">🎤 AI 練習</button></div>';
      bindTap(div.querySelector('[data-a=listen]'),function(){speak(line.zh);fillTtsPlayer(line.zh);});
      bindTap(div.querySelector('[data-a=practice]'),function(){
        var ps=practiceList(sc);var hit=ps.indexOf(line.zh);pracIdx=hit>=0?hit:0;
        if(hit<0){/* allow practicing any line */}
        var target=hit>=0?ps[pracIdx]:line.zh;
        fillTtsPlayer(target);
        mountSpeakPractice(document.getElementById('dlg-speak'),target,{
          label:'第 '+(sc.id||'')+' 關 · AI 練習',
          onNext:function(){pracIdx=(pracIdx+1)%Math.max(1,ps.length);mountPractice();}
        });
        try{document.getElementById('dlg-speak').scrollIntoView({behavior:'smooth',block:'start'});}catch(e){}
      });
      list.appendChild(div);
    });
    /* scenario picker chips */
    var picker=document.createElement('div');picker.className='chips';picker.style.marginTop='10px';
    curList().forEach(function(s,i){
      var b=document.createElement('button');b.type='button';b.className='chip'+(i===scIdx?' on':'');
      b.textContent=(s.id|| (i+1))+'. '+(s.title||s.who||'');
      bindTap(b,function(){scIdx=i;pracIdx=0;draw();});
      picker.appendChild(b);
    });
    list.appendChild(picker);
    mountPractice();
  }
  bindTap(document.getElementById('dlg-next'),function(){
    scIdx=(scIdx+1)%Math.max(1,curList().length);pracIdx=0;
    var ps=practiceList(curSc());speak(ps[0]||'');draw();
  });
  draw();
}

function renderDaily(body){
  var st=loadState();
  var tk=todayKey();
  if(!st.daily || st.daily.day!==tk){
    var qs=[];
    shuffle(LISTEN_BANK).slice(0,2).forEach(function(x){qs.push({type:'listen',item:x});});
    shuffle(BAIHUA).slice(0,2).forEach(function(x){qs.push({type:'baihua',item:x});});
    var set=TONE_SETS[(Math.random()*TONE_SETS.length)|0].items;
    var correct=set[(Math.random()*4)|0];
    qs.push({type:'tone',item:{speak:correct.speak,ans:correct.py+' '+correct.zh,opts:shuffle(set.map(function(it){return it.py+' '+it.zh;}))}});
    st.daily={day:tk,qs:qs,i:0,score:0,done:false};
    saveState(st);
  }
  body.innerHTML='<p class="hint">今日 5 題 · 「下一題」可隨時跳過</p>'+
    '<div class="progress"><i id="day-bar"></i></div><div id="day-q"></div>'+
    '<button class="btn sm" type="button" id="day-next" style="margin-top:10px;background:linear-gradient(180deg,#ffb4c8,#f07a9a)">下一題 →</button>';
  function paint(){
    st=loadState();
    var d=st.daily;if(!d)return;
    var bar=document.getElementById('day-bar');
    bar.style.width=((d.i/5)*100)+'%';
    var box=document.getElementById('day-q');
    var nextBtn=document.getElementById('day-next');
    if(d.i>=5 || d.done){
      d.done=true;saveState(st);
      box.innerHTML='<p class="q-big">今日完成！得分 '+d.score+'/5</p>'+
        '<button class="btn" type="button" id="day-again">再練一組（唔計入每日）</button>';
      if(nextBtn)nextBtn.style.display='none';
      bindTap(document.getElementById('day-again'),function(){
        st.daily=null;saveState(st);renderDaily(body);
      });
      return;
    }
    if(nextBtn)nextBtn.style.display='inline-block';
    var q=d.qs[d.i];
    if(q.type==='listen'){
      var item=q.item;
      box.innerHTML='<span class="tag">聽力</span><p class="q-big">'+esc(item.q)+'</p>'+
        '<button class="btn sm" type="button" id="d-play">🔊 聽</button><div id="d-opts" style="margin-top:10px"></div>';
      bindTap(document.getElementById('d-play'),function(){speak(item.speak);});
      var opts=shuffle(item.opts.map(function(t,idx){return {t:t,idx:idx};}));
      var ob=document.getElementById('d-opts');
      opts.forEach(function(o){
        var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=o.t;
        bindTap(b,function(){answer(o.idx===item.ans);});
        ob.appendChild(b);
      });
    }else if(q.type==='baihua'){
      var it=q.item;
      box.innerHTML='<span class="tag blue">轉換</span><span class="tag">'+esc(it.dir)+'</span>'+
        '<p class="q-big">'+esc(it.src)+'</p><div id="d-opts"></div>';
      var choices=shuffle([it.ans].concat(it.distractors||[]).slice(0,4));
      var ob2=document.getElementById('d-opts');
      choices.forEach(function(c){
        var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=c;
        bindTap(b,function(){answer(c===it.ans);});
        ob2.appendChild(b);
      });
    }else{
      var it2=q.item;
      box.innerHTML='<span class="tag green">聲調</span><p class="q-big">聽完揀正確讀音</p>'+
        '<button class="btn sm" type="button" id="d-play">🔊 聽</button><div id="d-opts" style="margin-top:10px"></div>';
      bindTap(document.getElementById('d-play'),function(){speak(it2.speak);});
      var ob3=document.getElementById('d-opts');
      it2.opts.forEach(function(c){
        var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=c;
        bindTap(b,function(){answer(c===it2.ans);});
        ob3.appendChild(b);
      });
    }
    function answer(ok){
      if(ok){d.score++;toast('✅ 正確');bumpProgress(1);}
      else toast('❌ 唔啱');
      d.i++;saveState(st);paint();
    }
  }
  bindTap(document.getElementById('day-next'),function(){
    st=loadState();var d=st.daily;if(!d||d.done)return;
    d.i++;saveState(st);paint();
  });
  paint();
}

  '北京':{title:'從胡同早餐到烤鴨餐桌',paragraphs:[
    '北京的飲食，既有熱鬧的街頭小吃，也有講究工序的宴席菜。豆汁、焦圈和豌豆黃，是認識老北京風味的幾扇窗；豆汁帶有發酵的酸香，並不是每位本地人都愛喝。',
    '烤鴨常配薄餅、蔥絲和甜麵醬，食客可以自己捲起來吃。涮羊肉則重視肉片和湯底，芝麻醬蘸料十分常見。不同吃法，呈現了聚餐時邊吃邊聊的氣氛。',
    '到北京旅行，可以把早餐店、市場和老字號放進同一天的行程。看菜單時留意份量，也不妨問問店家怎樣搭配；城市的味道，往往藏在日常的一餐之中。'
  ],practice:'烤鴨可以配薄餅和蔥絲一起吃。'},
  '天津':{title:'一套煎餅果子裡的市井生活',paragraphs:[
    '天津人談早餐，常會提到煎餅果子。攤主把麵糊攤在鏊子上，加上雞蛋，再裹入果子或薄脆的馃篦兒，抹醬、撒蔥，一套熱騰騰的早餐便做好了。',
    '天津的麵食和點心同樣豐富，包子、鍋巴菜、耳朵眼炸糕都是常見例子。鍋巴菜以切好的綠豆煎餅配滷汁，名字裡雖然有「菜」，樣子卻與一般炒菜很不一樣。',
    '海河沿岸的生活與碼頭、商業往來密切相關，形成了實在又有變化的飲食風格。買早餐時，問清楚配料和口味，比只追著名店走，更容易找到合意的一餐。'
  ],practice:'天津的早餐有煎餅果子和鍋巴菜。'},
  '河北':{title:'從火燒到山海之間的家常味',paragraphs:[
    '河北環繞北京、天津，地形從平原延伸到山區和海岸，飲食並不是同一種樣子。麵食在許多地方很常見，蒸、烙、煮的做法，讓日常主食有了不同口感。',
    '驢肉火燒是保定、河間等地有代表性的食物，餅皮做法和搭配各有特色。來到承德，可以留意與山地物產、歷史交流有關的菜式；到沿海地區，海鮮又成了餐桌上的重點。',
    '認識河北，不妨先選一個城市，再比較當地的早餐與家常菜。同樣叫火燒，外形、酥脆程度和餡料都可能不同，這些細節正是地方飲食有趣的地方。'
  ],practice:'河北不同城市的火燒各有特色。'},
  '山西':{title:'一碗麵的手藝與醋香',paragraphs:[
    '山西的麵食種類很多，刀削麵、剔尖、貓耳朵和莜麵，展示了麵糰在不同手法下的變化。製作者會配合麵粉和水分，決定麵條的厚薄、形狀及口感。',
    '吃麵時，番茄雞蛋、肉臊子或蔬菜都可以成為搭配，並不是每碗麵都一樣。山西老陳醋常被用來調味，少量加入可以添香，也可以按個人口味再調整。',
    '從平原到高寒地區，穀物和吃法都有差異。旅行時看師傅削麵、試一碗當地小米粥，再留意桌上的醋罐，便能從主食讀到生活與氣候的關係。'
  ],practice:'山西的麵食種類很多，口感也不同。'},
  '內蒙古':{title:'奶茶與手把肉之間的草原餐桌',paragraphs:[
    '內蒙古幅員遼闊，牧區與城市的餐桌各有面貌。部分蒙古族飲食傳統重視奶食和肉食，奶豆腐、奶皮子以及奶茶，都是認識這些生活方式的例子。',
    '蒙古奶茶常見鹹口做法，與許多人熟悉的甜奶茶不同。手把肉通常讓食客直接感受肉的滋味，宴客時的分食和敬茶，也體現了重視來客的心意。',
    '今天的內蒙古城市，同樣有麵食、蔬菜和各地菜館，不能只用幾道草原名菜概括。拜訪家庭或牧區時，先請教主人怎樣吃、怎樣接茶，會比照搬印象中的規矩更合適。'
  ],practice:'蒙古奶茶常見鹹口的做法。'},
  '遼寧':{title:'海鮮與燉菜相遇的東北風味',paragraphs:[
    '遼寧既有海岸，也有平原和山地。大連等沿海城市容易見到各種海鮮；走進內陸城市，麵食、燉菜和家常小炒，又是另一種熟悉的日常。',
    '酸菜白肉、餃子和各種燉菜，常讓人聯想到東北的冬季餐桌。酸菜來自蔬菜的發酵保存，既提供酸香，也反映了過去配合寒冷季節儲存食物的經驗。',
    '比較遼寧不同城市，可以從一頓早餐開始：吃包子、喝粥，或到市場看看當季海產。地方飲食並不是固定的菜單，而是物產、季節和家庭習慣的組合。'
  ],practice:'遼寧沿海的海鮮與內陸燉菜各有風味。'},
  '吉林':{title:'米飯、冷麵與山地物產',paragraphs:[
    '吉林的飲食與稻米、玉米等作物，以及山地、森林的物產有關。家常菜裡可以見到燉煮的蔬菜、肉類和菌菇，主食則有米飯，也有不同的麵食。',
    '在延邊，朝鮮族飲食文化十分鮮明，冷麵、打糕和辣白菜都很有代表性。冷麵重視湯、麵和配菜的搭配，不同店家在酸甜度和麵條口感上各有習慣。',
    '吉林省內各地的飲食並不完全相同，也不能把延邊的特色當作每個家庭的日常。點菜時問問當地時令食材，再搭配一份主食，往往比只選名菜更能認識地方。'
  ],practice:'延邊的冷麵重視湯和配菜的搭配。'},
  '黑龍江':{title:'冬日熱菜與城市交流的味道',paragraphs:[
    '黑龍江的冬天漫長，熱湯、燉菜和有飽足感的主食，在許多家庭的餐桌上十分常見。餃子、黏豆包和酸菜等食物，也與節慶和季節保存的經驗相連。',
    '哈爾濱的紅腸和大列巴，則讓人看到城市歷史中跨地域交流留下的痕跡。這些食物與東北家常菜並存，形成了街頭小店、麵包店和餐館各有風味的景象。',
    '旅行時不妨把市場、早餐店和家庭式餐館放在一起觀察。冬天吃一碗熱湯，夏天試試當季蔬菜，便會發現同一座城市也有截然不同的季節味道。'
  ],practice:'哈爾濱的紅腸和大列巴很有特色。'},
  '上海':{title:'本幫菜與弄堂早餐',paragraphs:[
    '上海的本幫菜常以醬香、燒煮和濃淡有致的調味見長，紅燒肉是容易認識的例子。不過，上海菜並不只有甜味，清蒸、白斬和時令蔬菜也佔有重要位置。',
    '早餐時，生煎、餛飩、粢飯糰和豆漿常出現在街坊小店。生煎的底部煎得香脆，上部麵皮則保留柔軟，吃的時候可以先小口咬開，感受湯汁和肉餡。',
    '上海長期匯聚不同地區的人口與飲食，海派風格也在交流中形成。從一份弄堂早餐到一桌家常本幫菜，都是理解這座城市日常節奏的入口。'
  ],practice:'上海生煎的底部香脆，麵皮柔軟。'},
  '江蘇':{title:'淮揚刀工與江南點心',paragraphs:[
    '江蘇南北的飲食有明顯差異。淮揚菜常重視刀工、火候與食材本味，文思豆腐細緻的切絲、清鮮的湯品，便能展示廚房裡耐心而精細的工夫。',
    '揚州、淮安等地的早茶可以見到包子和燙乾絲；南京的鹽水鴨、蘇州的糕團與麵食，又呈現不同風格。只用一道名菜，很難說完江蘇餐桌的豐富。',
    '到不同城市旅行，可以比較同一種主食的湯頭與配菜，再留意節令點心。春夏秋冬更換的食材，讓江南飲食與季節之間保持緊密的聯繫。'
  ],practice:'淮揚菜重視刀工、火候與食材本味。'},
  '浙江':{title:'從茶香蝦仁到海邊家常菜',paragraphs:[
    '浙江的飲食與江河、湖泊和海洋密切相關。杭州菜裡可以看到茶葉入菜、清鮮湯品和細緻燒煮，龍井蝦仁就是把地方茶香帶到餐桌上的例子。',
    '到了寧波、舟山等地，海鮮與不同保存、調味方法更加突出；紹興的黃酒和糟香菜式，又有自己的性格。山區的筍、菌菇和家常醃製食物，同樣值得留意。',
    '閱讀浙江的飲食文化，不妨把一杯茶、一碗麵和一份時令小菜放在一起。各地的水土與生活方式，常常比一張名菜排行榜更能說明味道的來歷。'
  ],practice:'龍井蝦仁把地方茶香帶到餐桌上。'},
  '安徽':{title:'山間食材與慢火工夫',paragraphs:[
    '安徽各地的飲食並不相同，皖北麵食、沿江風味與徽州菜各有特色。談到徽菜，山區物產、燉燒火候，以及利用醃製、發酵增添風味，是常見的觀察方向。',
    '臭鱖魚和毛豆腐都有鮮明的發酵氣味，經過烹調後呈現獨特口感；筍、菌菇和家常燉菜，則讓人看到山地食材的另一面。並非每一道徽菜都氣味濃烈。',
    '旅行時可以請店家介紹今天的時令菜，搭配一份清淡蔬菜和主食，再慢慢試有特色的菜式。認識地方風味，不必一次點遍所有名菜，也可以從一餐平常飯開始。'
  ],practice:'徽州菜常用山間食材，講究燉燒火候。'},
  '福建':{title:'湯、海味與閩南街頭小吃',paragraphs:[
    '福建山海相接，飲食隨地區呈現不同樣子。福州的魚丸與肉燕、泉州的麵線糊、廈門的沙茶麵，各有自己的口感和搭配，不能只用「海鮮」兩字概括。',
    '許多福建菜重視湯的鮮味，也擅長運用海產和地方調味。沙茶麵的湯底帶有醬香，配料可按喜好選擇；麵線糊則以細軟口感，融入不少人的早餐或宵夜。',
    '喝茶與小吃也連著社交生活。到街坊店試一碗湯、一份主食，留意老闆推薦的吃法，便能從簡單的一餐，看見不同城市之間細緻而鮮明的差別。'
  ],practice:'福建不同城市的小吃各有特色。'},
  '江西':{title:'米粉、瓦罐湯與家常鮮辣',paragraphs:[
    '江西的早餐常能見到米粉，南昌拌粉配瓦罐湯便是廣為人知的組合。米粉拌入醬料和配菜，湯則以不同食材慢慢煨煮，一乾一湯，形成有層次的一餐。',
    '江西不少家常菜調味鮮辣，也常利用醃菜、豆製品和當季蔬菜。鄱陽湖及各地水域提供魚鮮，山區則有筍、菌菇等物產，讓省內各地的菜式充滿變化。',
    '點菜時可以先問清辣度，再按人數安排主食和湯品。除了名店，市場附近的粉店與家常小館，也很適合觀察當地人如何把食材配成一頓日常飯。'
  ],practice:'南昌拌粉常搭配一盅瓦罐湯。'},
  '山東':{title:'麥香、海味與魯菜火候',paragraphs:[
    '山東的飲食，能從麥食、沿海物產和魯菜技法三方面認識。饅頭、煎餅、餃子在不少地方十分常見，不同地區在麵皮、餡料和吃法上又有差異。',
    '魯菜重視火候、湯與蔥香、醬香的運用，菜式既有濃郁的一面，也有清鮮細緻的做法。沿海城市的魚、蝦、貝類，則可以用蒸、煮等方式表現食材本味。',
    '走進市場看麵食和當季海產，再到家常餐館點一湯一菜，往往比只記住幾道宴席名菜更有收穫。山東的味道，也藏在一隻剛出鍋的熱饅頭裡。'
  ],practice:'山東的麥食與沿海海鮮各有風味。'},
  '河南':{title:'胡辣湯與燴麵的日常',paragraphs:[
    '河南是重要的麥作地區，麵食在許多人的日常飲食裡佔有位置。饅頭、烙餅、麵條各有做法，從早餐攤到家庭餐桌，都能看到小麥帶來的多樣口感。',
    '胡辣湯常見於早餐，帶有胡椒和香料的滋味，配料隨地方、店家而變。燴麵則把麵、湯和配菜放在同一碗中，有些做法以羊肉湯見長，吃起來溫暖而飽足。',
    '河南各城市還有不同的小吃和地方菜，不能把一種早餐當作全省的唯一風味。到訪時問問附近人平常去哪裡吃麵，往往就能找到一條貼近日常生活的美食路線。'
  ],practice:'河南的胡辣湯和燴麵都很有代表性。'},
  '湖北':{title:'從武漢過早到魚米餐桌',paragraphs:[
    '在武漢，「過早」就是吃早餐，熱乾麵、豆皮、麵窩等食物，讓一頓早餐有了豐富選擇。熱乾麵常拌芝麻醬，重點是麵條與醬料均勻融合的口感。',
    '湖北江河湖泊眾多，魚、蓮藕等食材常走進家常菜。蓮藕排骨湯以慢煨呈現湯香，魚菜則依地區有蒸、煮、燒等不同做法，展示魚米之鄉的物產。',
    '旅行時可以早起試一份過早，再在正餐點一道當地湯菜。早餐與家常湯並排來看，便會發現湖北飲食既有街頭的爽快，也有慢火燉煮的耐心。'
  ],practice:'在武漢，吃早餐也叫做過早。'},
  '湖南':{title:'米粉、剁椒與煙火家常',paragraphs:[
    '湖南的飲食常讓人聯想到鮮辣和香氣，但各地口味與家庭習慣不盡相同。長沙、常德等地的米粉，在麵條形態、湯頭與配碼上都有自己的講究。',
    '剁椒魚頭把發酵辣椒的鹹鮮帶入蒸菜，臘味則呈現保存食材與煙燻香氣的經驗。家常小炒常重視鍋氣和新鮮配料，配一碗米飯，便是一頓有滋味的飯。',
    '第一次嘗試湘菜，可以主動說明能接受的辣度，搭配蒸蛋、蔬菜或湯品。認識一地飲食，不只是挑戰辣味，也可以留意米香、發酵香和季節食材。'
  ],practice:'湖南米粉的湯頭與配碼各有講究。'},
  '廣東':{title:'一盅兩件之外的粵味',paragraphs:[
    '廣東飲食十分多樣，廣府、潮汕、客家等風味各有特色。廣府早茶以茶和點心串起相聚時光，蝦餃、燒賣、腸粉只是其中幾種，並不是每一餐都要點齊。',
    '廣府菜常重視食材鮮味與火候；潮汕的粿品、滷味和牛肉料理，呈現另一套細緻手藝；客家釀豆腐、梅菜配肉等菜式，則讓人看到家常烹調的豐富變化。',
    '喝茶時可按需要添水、分享點心，餐桌習慣也會因家庭而異。與其把粵菜簡化成「清淡」，不如留意蒸、煲、燒、滷如何在同一地區並存。'
  ],practice:'廣東的廣府、潮汕和客家風味各有特色。'},
  '廣西':{title:'一碗米粉與多樣的節慶食物',paragraphs:[
    '廣西的米粉種類豐富，桂林米粉、柳州螺螄粉和南寧老友粉，各有自己的滷水、湯底和配菜。即使都叫米粉，拌著吃、帶湯吃，入口感受也很不一樣。',
    '螺螄粉的風味來自湯底與酸筍等配料，成品不一定看得到螺肉。糯米飯、粽子和各地節慶食物，則連著壯族等不同群體的生活，做法與場合因地而異。',
    '逛市場時，可以看看米粉之外的時令蔬菜和糯米小食。選一碗喜歡的粉，再聽店家介紹怎樣加料，常能從小小的餐桌認識一座城市的性格。'
  ],practice:'桂林、柳州和南寧的米粉各有風味。'},
  '海南':{title:'雞飯、椰香與島嶼日常',paragraphs:[
    '海南的飲食與熱帶物產、海洋和移民交流有關。文昌雞重視雞肉口感與蘸料，雞湯也可以用來做飯，讓主食帶上香氣，呈現看似簡單卻講究細節的吃法。',
    '海南粉有自己的醬料和配料，清補涼則以不同豆類、果乾或椰奶等組合，成為常見甜品。沿海的海鮮、不同地區的糟粕醋料理，又為島嶼味道添上變化。',
    '到海南不妨把海邊餐廳與街坊粉店排在不同餐次，留意地方之間的差異。一份雞飯、一碗粉，再加當季水果，便能認識旅遊印象之外的日常生活。'
  ],practice:'文昌雞講究雞肉口感和蘸料的搭配。'},
  '重慶':{title:'火鍋之外，還有一碗小麵',paragraphs:[
    '重慶火鍋以麻辣風味聞名，食材在滾燙的鍋裡分次下鍋，蘸料則按店家和食客習慣調配。聚在同一口鍋前，邊煮邊聊，也是這種吃法吸引人的地方。',
    '早餐或簡單的一餐，小麵同樣重要。麵條配上調料、蔬菜和不同澆頭，看起來樸實，卻講究麵的軟硬與作料比例；酸辣粉等街頭小吃，也有自己的愛好者。',
    '並不是每道重慶菜都必須很辣，餐館也有清湯、家常菜等選擇。點餐前先說明口味，再選一碗麵或一桌火鍋，更容易體會當地飲食親切而熱鬧的節奏。'
  ],practice:'重慶小麵講究麵條口感和調料比例。'},
  '四川':{title:'一菜一格，不只麻辣',paragraphs:[
    '川菜以多樣的調味見長，麻辣只是其中一種風格。魚香、宮保、怪味等名稱，說明不同調料比例能創造各有層次的味道，並不是所有川菜都同一個辣法。',
    '麻婆豆腐展現麻、辣、燙、香的組合，開水白菜則以清澈湯色和細緻工夫見長。擔擔麵、抄手、甜水麵等小吃，讓正餐之外也有豐富的味覺選擇。',
    '到四川可以試著比較一份辣菜與一份清鮮菜，再到茶館坐一坐。喝茶、聊天和慢慢吃點心的日常，也同樣是理解地方飲食文化的重要部分。'
  ],practice:'川菜有不同味型，並不只有麻辣。'},
  '貴州':{title:'酸湯、米粉與山地風味',paragraphs:[
    '貴州飲食常見酸香與辣味的搭配，酸味可以來自不同食材與發酵方法。凱里酸湯魚是有代表性的例子，湯底、蘸水和配菜一起，構成完整的用餐體驗。',
    '米粉在不少地方也是日常主食，牛肉粉、羊肉粉等各有做法。折耳根常作為配料或涼拌食材，氣味鮮明，喜歡與否因人而異，並不是每道菜都一定加入。',
    '貴州不同地區與群體的飲食相當多樣，山地物產也帶來季節變化。到市場看看醃製品、蔬菜和香草，再吃一碗粉，便能感受到名菜之外的生活細節。'
  ],practice:'貴州酸湯常把酸香和辣味搭配起來。'},
  '雲南':{title:'米線與山野物產的多樣餐桌',paragraphs:[
    '雲南地形與氣候差異很大，也有多樣的族群和地方傳統，飲食很難用單一口味概括。米線在許多地方常見，湯米線、拌米線與過橋米線，各有不同的配料和吃法。',
    '過橋米線讓食客把米線、肉片和蔬菜配入熱湯，重視湯與配料的安排。不同地區還有豆製品、乳扇、香草和時令菌菇等特色，呈現山地物產帶來的豐富選擇。',
    '認識雲南，可以把城市小吃與當地家庭菜分開嘗試，留意同一種食材如何被不同方式烹調。問清楚一道菜的地方名稱，也常會聽到很有趣的生活故事。'
  ],practice:'雲南不同地區的米線和配料各有特色。'},
  '西藏':{title:'糌粑、酥油茶與高原待客',paragraphs:[
    '西藏各地的飲食隨地形、物產與家庭習慣而變。青稞製成的糌粑，是認識部分藏族傳統飲食的代表，配合茶或其他材料，可以成為方便而有飽足感的食物。',
    '酥油茶與甜茶各有風味，並不是同一種飲品。茶館除了提供飲食，也是聊天與休息的地方；麵食、牛羊肉、奶製品和蔬菜，則依地區與季節出現在餐桌。',
    '拜訪家庭時，可以先請教主人如何接茶與搭配食物，不必把某一套禮節當作全區通用。慢慢品嘗、尊重個人飲食選擇，會讓認識高原生活的過程更自在。'
  ],practice:'酥油茶和甜茶是不同風味的飲品。'},
  '陝西':{title:'泡饃、麵食與三秦風味',paragraphs:[
    '陝西的關中、陝北與陝南，在主食和調味上各有面貌。談到西安及關中，肉夾饃、羊肉泡饃和不同麵食常被提起，展示了麵粉與肉湯搭配的多種可能。',
    '羊肉泡饃重視饃、湯和配料的融合，有些店讓食客自己掰饃。油潑麵以熱油激出調料香氣，寬麵條提供厚實口感；涼皮則以另一種清爽方式出現在街頭。',
    '到陝西旅行，可以比較城市小吃與各地家常主食。吃泡饃時問問店家的掰法、吃麵時留意湯汁和辣油，便能從一碗食物看到當地重視的細節。'
  ],practice:'羊肉泡饃講究饃、湯和配料的融合。'},
  '甘肅':{title:'一碗牛肉麵與走廊上的交流',paragraphs:[
    '甘肅地域狹長，河西走廊、隴中、隴南等地的物產和飲食各有差異。麥食在不少地方很重要，麵條、餅與不同做法的肉菜，構成了多樣的日常餐桌。',
    '蘭州牛肉麵以湯、麵和配料的搭配著稱，麵條可以選不同粗細。蘿蔔、香菜、蒜苗與辣油等，讓一碗麵有了顏色和層次；是否加辣，可以按自己的口味決定。',
    '絲路沿線的歷史交流，也反映在甘肅不同地方的市場和餐館中。到訪時留意地方小吃與季節蔬果，並尊重店家的飲食習慣，就能在名麵之外發現更多風味。'
  ],practice:'蘭州牛肉麵可以選擇不同粗細的麵條。'},
  '青海':{title:'高原上的麵食、奶香與待客菜',paragraphs:[
    '青海的餐桌與高原環境、多樣族群及地方交流有關。麵食、牛羊肉、奶製品和穀物都是認識地方飲食的入口，但城市與牧區、不同家庭的日常並不完全相同。',
    '手抓羊肉、釀皮和酸奶，是旅行時常能見到的例子。釀皮有自己的切法和調料，酸奶的口感與甜度也會因製作方式而變；簡單的食物，同樣有值得比較的細節。',
    '用餐時可以先詢問食材和份量，再依需要搭配蔬菜與主食。拜訪不同家庭或餐館，尊重主人及店家的具體飲食習慣，比用單一印象理解整個地區更合適。'
  ],practice:'青海的釀皮和酸奶各有地方做法。'},
  '寧夏':{title:'羊肉、麵食與河套物產',paragraphs:[
    '寧夏的飲食與農耕、牧養和區域交流相連。牛羊肉及麵食常見於餐館，黃河沿岸的農業，也讓米、蔬菜和瓜果在地方生活中佔有重要位置。',
    '手抓羊肉重視肉本身的口感，燴小吃、麵食等則有不同組合。枸杞是寧夏著名物產之一，可以出現在飲品、湯品或其他食物中，但當地飲食並不只圍繞一種特產。',
    '寧夏有不少清真餐館，也有不同群體和家庭的飲食習慣。選店和拜訪時，按店家標示及主人的實際安排來理解餐桌規矩，既方便點餐，也能更細緻地認識地方。'
  ],practice:'寧夏的飲食有羊肉、麵食和河套物產。'},
  '新疆':{title:'馕、拌麵與集市的多種滋味',paragraphs:[
    '新疆地域廣闊，不同城市、族群與家庭的飲食各有特色。馕、抓飯、拌麵和烤肉，是容易認識的幾種食物，但不能用同一張菜單概括整個地區的生活。',
    '馕在厚薄、形狀和配料上有很多變化，適合搭配湯、茶或其他菜式。拌麵常把麵條與蔬菜、肉類組合，抓飯則重視米、胡蘿蔔及不同配料在烹調中的融合。',
    '集市裡的瓜果、乾果和麵包攤，同樣值得慢慢觀察。點餐前先問份量與食材，尊重餐館及家庭的具體飲食習慣，便能在熟悉的名菜之外，認識更多日常風味。'
  ],practice:'新疆的馕在形狀和配料上有很多變化。'}
};

function egMountCultureArticle(card,c,onPractice){
  var article=CULTURE_ARTICLES[c.region];if(!article)return;
  var details=document.createElement('details');details.className='culture-article';
  var summary=document.createElement('summary');summary.textContent='📖 閱讀飲食文化文章';details.appendChild(summary);
  var title=document.createElement('h3');title.textContent=article.title;details.appendChild(title);
  var note=document.createElement('p');note.className='muted';note.textContent='約 1 分鐘閱讀 · 地方及家庭習慣各有差異';details.appendChild(note);
  article.paragraphs.forEach(function(paragraph,i){
    var p=document.createElement('p');p.className='article-paragraph';p.textContent=paragraph;details.appendChild(p);
    var listen=document.createElement('button');listen.type='button';listen.className='btn ghost sm';listen.textContent='🔊 聽第 '+(i+1)+' 段';
    bindTap(listen,function(){speak(paragraph);});details.appendChild(listen);
  });
  egAddCultureQuiz(details,c.region);
  var practice=document.createElement('div');practice.className='article-practice';
  var line=document.createElement('p');line.textContent='跟讀句：'+article.practice;practice.appendChild(line);
  var button=document.createElement('button');button.type='button';button.className='btn sm';button.textContent='🎤 用呢句練習';
  bindTap(button,function(){onPractice(article.practice);});practice.appendChild(button);details.appendChild(practice);card.appendChild(details);
}

function egAddCultureQuiz(host,region){
  var questions=EG_CULTURE_QUESTIONS[region];if(!questions)return;
  var box=document.createElement('section');box.className='article-comprehension';box.setAttribute('aria-label',region+'閱讀理解練習');
  var heading=document.createElement('h3');heading.textContent='閱讀練習 · 2 題';box.appendChild(heading);
  var guide=document.createElement('p');guide.className='muted';guide.textContent='讀完文章揀答案；答錯有提示，可以再試。';box.appendChild(guide);
  questions.forEach(function(q,index){
    var field=document.createElement('fieldset');field.className='article-question';field.dataset.articleQuestion=String(index);
    var legend=document.createElement('legend');legend.textContent=(index+1)+'. '+q.q;field.appendChild(legend);
    var feedback=document.createElement('p');feedback.setAttribute('role','status');feedback.textContent='請揀一個答案。';
    var locked=false,awarded=false;
    shuffle(q.o.map(function(t,i){return {text:t,correct:i===0};})).forEach(function(option){
      var button=document.createElement('button');button.type='button';button.className='opt';button.textContent=option.text;
      bindTap(button,function(){
        if(locked)return;
        field.querySelectorAll('.opt').forEach(function(b){b.classList.remove('wrong');});
        if(option.correct){locked=true;button.classList.add('correct');feedback.textContent='✅ 正確。'+q.e;if(!awarded){awarded=true;bumpProgress(1);}field.querySelectorAll('.opt').forEach(function(b){b.disabled=true;});}
        else{button.classList.add('wrong');feedback.textContent='再試一次。提示：'+q.e;}
      });field.appendChild(button);
    });
    field.appendChild(feedback);box.appendChild(field);
  });
  host.appendChild(box);
}

function renderCulture(body){
  body.innerHTML='<p class="hint">中國大陸 31 省級：重點飲食同地方文化；問候各有特色（唔係全部「你好」）。頂部可跟讀關鍵句。</p>'+
    '<div class="chips" id="cul-filter" style="margin-bottom:8px"></div>'+
    '<div id="cul-speak" class="speak-dock-anchor"></div>'+
    '<button class="btn sm" type="button" id="cul-next" style="margin-bottom:8px;background:linear-gradient(180deg,#ffb4c8,#f07a9a)">下一題 →</button>'+
    '<div id="cul-list"></div>';
  var filter=document.getElementById('cul-filter');
  var regions=['全部'].concat(CULTURE.map(function(c){return c.region;}));
  var cur='全部';
  var itemIdx=0;
  regions.forEach(function(r,i){
    var b=document.createElement('button');b.type='button';b.className='chip'+(i===0?' on':'');b.textContent=r;
    bindTap(b,function(){
      filter.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');cur=r;itemIdx=0;paint();
    });
    filter.appendChild(b);
  });
  function items(){return CULTURE.filter(function(c){return cur==='全部'||c.region===cur;});}
  function mountCur(){
    var list=items();if(!list.length)return;
    var c=list[itemIdx%list.length];
    fillTtsPlayer(c.phrase);
    mountSpeakPractice(document.getElementById('cul-speak'),c.phrase,{
      label:c.region+' · 關鍵句跟讀',
      onNext:function(){itemIdx=(itemIdx+1)%list.length;speak(list[itemIdx%list.length].phrase);mountCur();}
    });
  }
  function paint(){
    var listEl=document.getElementById('cul-list');listEl.innerHTML='';
    var list=items();
    list.forEach(function(c,ix){
      var div=document.createElement('div');div.className='panel culture-card';div.style.padding='12px';
      var seasonLine=c.seasonPhraseTrad?('<p style="margin:4px 0"><span class="tag">節慶句</span> '+esc(c.seasonPhraseTrad)+'</p>'):'';
      div.innerHTML='<h3>'+c.emoji+' '+esc(c.region)+'</h3>'+
        '<div><span class="tag">問候</span> <b>'+esc(c.greet)+'</b> <span class="muted">'+esc(c.greetNote)+'</span></div>'+
        '<ul>'+
        '<li><b>飲食：</b>'+esc(c.food)+'</li>'+
        '<li><b>節慶／景點：</b>'+esc(c.fest)+'</li>'+
        '<li><b>習俗提示：</b>'+esc(c.custom)+'</li>'+
        '</ul>'+
        '<p style="margin:8px 0 4px"><span class="tag green">關鍵句</span> '+esc(c.phraseTrad)+'</p>'+seasonLine+
        '<div class="btn-row">'+
        '<button class="btn ghost sm" type="button" data-act="phrase">🔊 關鍵句</button>'+
        '<button class="btn ghost sm" type="button" data-act="greet">🔊 問候</button>'+
        (c.seasonPhrase?'<button class="btn ghost sm" type="button" data-act="season">🔊 節慶句</button>':'')+
        '<button class="btn sm" type="button" data-act="practice">🎤 練習＋AI</button>'+
        '</div>';
      bindTap(div.querySelector('[data-act=phrase]'),function(){speak(c.phrase);fillTtsPlayer(c.phrase);});
      bindTap(div.querySelector('[data-act=greet]'),function(){speak(c.greet);fillTtsPlayer(c.greet);});
      var sb=div.querySelector('[data-act=season]');
      if(sb)bindTap(sb,function(){speak(c.seasonPhrase);fillTtsPlayer(c.seasonPhrase);});
      bindTap(div.querySelector('[data-act=practice]'),function(){
        itemIdx=ix;mountCur();
        try{document.getElementById('cul-speak').scrollIntoView({behavior:'instant',block:'start'});}catch(e){}
      });
      egMountCultureArticle(div,c,function(sentence){
        mountSpeakPractice(document.getElementById('cul-speak'),sentence,{label:c.region+' · 文章跟讀',onNext:function(){itemIdx=(ix+1)%list.length;mountCur();}});
        fillTtsPlayer(sentence);
        document.getElementById('cul-speak').scrollIntoView({behavior:'instant',block:'start'});
      });
      listEl.appendChild(div);
    });
    if(list.length)mountCur();
  }
  bindTap(document.getElementById('cul-next'),function(){
    var list=items();if(!list.length)return;
    itemIdx=(itemIdx+1)%list.length;speak(list[itemIdx].phrase);mountCur();
  });
  paint();
}

function renderBaihua(body){
  var bank=shuffle(BAIHUA.slice());
  var i=0, mode='quiz';
  body.innerHTML='<p class="hint">粵語白話 ↔ 普通話書面語雙向練習；「下一題」永遠可見。</p>'+
    '<div class="chips"><button type="button" class="chip on" id="bh-quiz">選擇題</button>'+
    '<button type="button" class="chip" id="bh-reveal">點撃揭曉</button>'+
    '<button type="button" class="chip" id="bh-speakmode">朗讀 AI</button></div>'+
    '<div id="bh-speak" class="speak-dock-anchor"></div>'+
    '<button class="btn sm" type="button" id="bh-next-top" style="margin:6px 0 8px;background:linear-gradient(180deg,#ffb4c8,#f07a9a)">下一題 →</button>'+
    '<div id="bh-q"></div>'+
    '<p class="review-flag">🏷 BAIHUA 題庫 · Trad. Chinese · 雙向</p>';
  function setMode(m,btn){
    mode=m;
    ['bh-quiz','bh-reveal','bh-speakmode'].forEach(function(id){document.getElementById(id).classList.remove('on');});
    btn.classList.add('on');paint();
  }
  bindTap(document.getElementById('bh-quiz'),function(){setMode('quiz',this);});
  bindTap(document.getElementById('bh-reveal'),function(){setMode('reveal',this);});
  bindTap(document.getElementById('bh-speakmode'),function(){setMode('speak',this);});
  function speakTarget(it){
    if(it.speak)return it.speak;
    if(it.dir.indexOf('白話→')===0)return it.ans;
    return it.src;
  }
  function goNext(){i++;document.getElementById('bh-speak').innerHTML='';paint();}
  bindTap(document.getElementById('bh-next-top'),goNext);
  function paint(){
    var it=bank[i%bank.length];
    var q=document.getElementById('bh-q');
    var st=speakTarget(it);
    if(mode==='quiz'){
      q.innerHTML='<span class="tag">'+esc(it.dir)+'</span>'+
        '<p class="q-big">'+esc(it.src)+'</p>'+
        '<p class="muted">揀正確轉換</p><div id="bh-opts"></div>'+
        '<button class="btn sm" type="button" id="bh-next" style="margin-top:8px;background:linear-gradient(180deg,#ffb4c8,#f07a9a)">下一題 →</button>';
      var choices=shuffle([it.ans].concat(it.distractors||[]).slice(0,4));
      var box=document.getElementById('bh-opts');var locked=false;
      choices.forEach(function(c){
        var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=c;
        bindTap(b,function(){
          if(locked)return;locked=true;
          var ok=c===it.ans;
          b.classList.add(ok?'correct':'wrong');
          Array.prototype.forEach.call(box.children,function(el){if(el.textContent===it.ans)el.classList.add('correct');});
          toast(ok?'✅ 正確':'❌ 參考：'+it.note);
          if(ok){bumpProgress(1);mountSpeakPractice(document.getElementById('bh-speak'),st,{label:'朗讀目標句（普通話）',onNext:goNext});}
        });
        box.appendChild(b);
      });
      bindTap(document.getElementById('bh-next'),goNext);
    }else if(mode==='reveal'){
      q.innerHTML='<span class="tag">'+esc(it.dir)+'</span>'+
        '<p class="q-big">'+esc(it.src)+'</p>'+
        '<button class="btn sm" type="button" id="bh-show">顯示答案</button>'+
        '<div class="reveal" id="bh-ans"><b>'+esc(it.ans)+'</b><div class="muted" style="margin-top:4px">'+esc(it.note)+'</div></div>'+
        '<button class="btn sm" type="button" id="bh-next" style="margin-top:8px;background:linear-gradient(180deg,#ffb4c8,#f07a9a)">下一題 →</button>';
      bindTap(document.getElementById('bh-show'),function(){
        document.getElementById('bh-ans').classList.add('on');
        mountSpeakPractice(document.getElementById('bh-speak'),st,{label:'朗讀目標句（普通話）',onNext:goNext});
      });
      bindTap(document.getElementById('bh-next'),goNext);
    }else{
      q.innerHTML='<span class="tag">'+esc(it.dir)+'</span><span class="tag green">朗讀 AI</span>'+
        '<p class="q-big">'+esc(it.src)+'</p>'+
        '<p class="muted">目標普通話句：<b>'+esc(st)+'</b></p>'+
        '<p class="muted">'+esc(it.note)+'</p>'+
        '<button class="btn sm" type="button" id="bh-next" style="background:linear-gradient(180deg,#ffb4c8,#f07a9a)">下一題 →</button>';
      mountSpeakPractice(document.getElementById('bh-speak'),st,{label:'白話轉換 · 朗讀核對',onNext:goNext});
      bindTap(document.getElementById('bh-next'),goNext);
    }
  }
  paint();
}

/* ===== BOOT ===== */
function buildHome(){
  var g=document.getElementById('mod-grid');g.innerHTML='';
  MODULES.forEach(function(m){
    var c=document.createElement('div');c.className='card';c.dataset.id=m.id;
    c.innerHTML='<div class="ico">'+m.ico+'</div><b>'+esc(m.title)+'</b><span>'+esc(m.desc)+'</span>';
    bindTap(c,function(){openMod(m.id);});
    g.appendChild(c);
  });
}
bindTap(document.getElementById('btn-back'),function(){egStopSpeech();showScreen('home');refreshStats();});
bindTap(document.getElementById('btn-quick'),function(){openMod('tones');});
bindTap(document.getElementById('btn-daily-jump'),function(){openMod('daily');});
buildHome();
refreshStats();
</script>
