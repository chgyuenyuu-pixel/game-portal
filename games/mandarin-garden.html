"約林格恢復自由，卻救不出心愛的人，只好在附近工作，等待機會。有一晚，他夢見一朵紅花，花心有一顆晶亮的水珠，碰到它的東西就能解除魔法。","他醒來後四處尋找，直到第九天，才找到夢裏的花。他拿着花走進城堡，這次魔法不能使他停住，緊閉的大門也在花的觸碰下打開。","屋裏有許多鳥籠，他一時認不出約琳德。女巫卻偷偷提起其中一個，想把它帶走。約林格立刻上前，用花碰到鳥籠和女巫，終於救回約琳德，也解放了其他姑娘。"],"questions":[{"q":"約琳德被女巫變成甚麼？","options":["金魚","小鹿","白蛇","夜鶯"],"answer":3,"explanation":"女巫把她變成夜鶯，關在城堡的鳥籠裏。","id":"grimm-69:q0"},{"q":"約林格找了多久才發現夢裏的紅花？","options":["只花一刻鐘","整整七年","等到一百年後","直到第九天"],"answer":3,"explanation":"他持續尋找，在第九天找到花心帶水珠的紅花。","id":"grimm-69:q1"},{"q":"約林格怎樣認出要救的鳥籠？","options":["聽見國王敲鐘","跟着金髮找到它","看見女巫想偷偷帶走它","讀到籠上的名字"],"answer":2,"explanation":"女巫的動作暴露了她特別想藏起的鳥籠。","id":"grimm-69:q2"}],"title":"約琳德和約林格","author":"格林兄弟","group":"grimm","sourceTitle":"69 Jorinde and Joringel (Jorinde und Joringel)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap69","lines":[{"zh":"約琳德和約林格在森林散步，不小心走近女巫的城堡。","py":"yuē lín dé hé yuē lín gé zài sēn lín sàn bù ， bù xiǎo xīn zǒu jìn nǚ wū de chéng bǎo 。","paragraph":0},{"zh":"踏進魔法範圍後，約林格不能動彈，約琳德則變成夜鶯，被女巫裝進鳥籠帶走了。","py":"tà jìn mó fǎ fàn wéi hòu ， yuē lín gé bù néng dòng tán ， yuē lín dé zé biàn chéng yè yīng ， bèi nǚ wū zhuāng jìn niǎo lóng dài zǒu le 。","paragraph":0},{"zh":"約林格恢復自由，卻救不出心愛的人，只好在附近工作，等待機會。","py":"yuē lín gé huī fù zì yóu ， què jiù bù chū xīn ài de rén ， zhǐ hǎo zài fù jìn gōng zuò ， děng dài jī huì 。","paragraph":1},{"zh":"有一晚，他夢見一朵紅花，花心有一顆晶亮的水珠，碰到它的東西就能解除魔法。","py":"yǒu yī wǎn ， tā mèng jiàn yī duǒ hóng huā ， huā xīn yǒu yī kē jīng liàng de shuǐ zhū ， pèng dào tā de dōng xī jiù néng jiě chú mó fǎ 。","paragraph":1},{"zh":"他醒來後四處尋找，直到第九天，才找到夢裏的花。","py":"tā xǐng lái hòu sì chù xún zhǎo ， zhí dào dì jiǔ tiān ， cái zhǎo dào mèng lǐ de huā 。","paragraph":2},{"zh":"他拿着花走進城堡，這次魔法不能使他停住，緊閉的大門也在花的觸碰下打開。","py":"tā ná zhe huā zǒu jìn chéng bǎo ， zhè cì mó fǎ bù néng shǐ tā tíng zhù ， jǐn bì de dà mén yě zài huā de chù pèng xià dǎ kāi 。","paragraph":2},{"zh":"屋裏有許多鳥籠，他一時認不出約琳德。","py":"wū lǐ yǒu xǔ duō niǎo lóng ， tā yī shí rèn bù chū yuē lín dé 。","paragraph":3},{"zh":"女巫卻偷偷提起其中一個，想把它帶走。","py":"nǚ wū què tōu tōu tí qǐ qí zhōng yí gè ， xiǎng bǎ tā dài zǒu 。","paragraph":3},{"zh":"約林格立刻上前，用花碰到鳥籠和女巫，終於救回約琳德，也解放了其他姑娘。","py":"yuē lín gé lì kè shàng qián ， yòng huā pèng dào niǎo lóng hé nǚ wū ， zhōng yú jiù huí yuē lín dé ， yě jiě fàng le qí tā gū niang 。","paragraph":3}]},{"id":"grimm-70","paragraphs":["一位父親沒有金錢留給三個兒子，只分別給他們一隻公雞、一把鐮刀和一隻貓。他提醒孩子，到沒見過這些東西的地方，平常的本領也可能很有價值。","大兒子帶公雞來到一座島，居民不懂在夜裏判斷時間。公雞會按時啼叫，大家十分驚奇，願意出錢買下牠；大兒子因此帶着財物回家。","二兒子走到另一個地方，當地人還用很費力的方法收割。他示範鐮刀怎樣割穀物，讓人們看見工具的便利，也得到了一筆可觀的報酬。","三兒子的貓則在鼠患嚴重的王宮大顯身手。可是居民沒聽過貓叫，誤以為牠是怪物，反而害怕起來。三兄弟雖都得到財物，故事也留下了不懂便誤判的笑話。"],"questions":[{"q":"父親給大兒子的東西是甚麼？","options":["一把鐵梳","一雙紅鞋","一隻公雞","一面魔鏡"],"answer":2,"explanation":"三份禮物依次是公雞、鐮刀和貓。","id":"grimm-70:q0"},{"q":"鐮刀為甚麼在第二個地方受到重視？","options":["可以預測明天的天氣","會在夜裏唱歌","能讓收割變得省力","能把石頭變成麵包"],"answer":2,"explanation":"二兒子示範了工具的實際用途，改善原來費力的收割方法。","id":"grimm-70:q1"},{"q":"王宮居民後來為甚麼害怕貓？","options":["牠偷走所有王冠","牠把公雞變成石頭","牠要求居民停止種田","不懂貓叫而把牠當怪物"],"answer":3,"explanation":"陌生的叫聲引起誤解，反而蓋過了貓捉老鼠的功勞。","id":"grimm-70:q2"}],"title":"三個幸運兒","author":"格林兄弟","group":"grimm","sourceTitle":"70 The Three Children of Fortune (Die drei Glückskinder)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap70","lines":[{"zh":"一位父親沒有金錢留給三個兒子，只分別給他們一隻公雞、一把鐮刀和一隻貓。","py":"yī wèi fù qīn méi yǒu jīn qián liú gěi sān gè ér zi ， zhǐ fēn bié gěi tā men yī zhī gōng jī 、 yī bǎ lián dāo hé yī zhī māo 。","paragraph":0},{"zh":"他提醒孩子，到沒見過這些東西的地方，平常的本領也可能很有價值。","py":"tā tí xǐng hái zi ， dào méi jiàn guò zhè xiē dōng xī de dì fāng ， píng cháng de běn lǐng yě kě néng hěn yǒu jià zhí 。","paragraph":0},{"zh":"大兒子帶公雞來到一座島，居民不懂在夜裏判斷時間。","py":"dà ér zi dài gōng jī lái dào yī zuò dǎo ， jū mín bù dǒng zài yè lǐ pàn duàn shí jiān 。","paragraph":1},{"zh":"公雞會按時啼叫，大家十分驚奇，願意出錢買下牠；大兒子因此帶着財物回家。","py":"gōng jī huì àn shí tí jiào ， dà jiā shí fēn jīng qí ， yuàn yì chū qián mǎi xià tā ； dà ér zi yīn cǐ dài zhe cái wù huí jiā 。","paragraph":1},{"zh":"二兒子走到另一個地方，當地人還用很費力的方法收割。","py":"èr ér zi zǒu dào lìng yí gè dì fāng ， dāng dì rén hái yòng hěn fèi lì de fāng fǎ shōu gē 。","paragraph":2},{"zh":"他示範鐮刀怎樣割穀物，讓人們看見工具的便利，也得到了一筆可觀的報酬。","py":"tā shì fàn lián dāo zěn yàng gē gǔ wù ， ràng rén men kàn jiàn gōng jù de biàn lì ， yě dé dào le yī bǐ kě guān de bào chóu 。","paragraph":2},{"zh":"三兒子的貓則在鼠患嚴重的王宮大顯身手。","py":"sān ér zi de māo zé zài shǔ huàn yán zhòng de wáng gōng dà xiǎn shēn shǒu 。","paragraph":3},{"zh":"可是居民沒聽過貓叫，誤以為牠是怪物，反而害怕起來。","py":"kě shì jū mín méi tīng guò māo jiào ， wù yǐ wéi tā shì guài wù ， fǎn ér hài pà qǐ lái 。","paragraph":3},{"zh":"三兄弟雖都得到財物，故事也留下了不懂便誤判的笑話。","py":"sān xiōng dì suī dōu dé dào cái wù ， gù shì yě liú xià le bù dǒng biàn wù pàn de xiào huà 。","paragraph":3}]},{"id":"grimm-71","paragraphs":["一個退伍的人沒有得到應有的酬勞，便出外尋找能一起做事的夥伴。他陸續遇到大力士、神射手、能用鼻子吹強風的人，還有快腿人和能帶來嚴寒的人。","六人來到一個王國，答應參加與公主的賽跑。快腿人跑得很快，卻在回程睡着；神射手及時射中他頭下的東西，把他驚醒，使他趕回終點。","國王不願守約，把他們關進燒熱的鐵屋。能帶來嚴寒的夥伴調整帽子，屋裏便冷了下來，大家安然無恙。國王只好答應，用一人能搬走的金子了結此事。","大力士背起巨大的袋子，裝走國王的財寶。追兵趕來時，強風吹得他們無法靠近。六個人靠不同本領互相補足，最後平安離開，一起分享所得。"],"questions":[{"q":"誰叫醒了途中睡着的快腿人？","options":["河上的渡船人","公主的侍女","神射手","國王的廚師"],"answer":2,"explanation":"神射手射中他頭下的東西，及時把他驚醒。","id":"grimm-71:q0"},{"q":"六人在燒熱的鐵屋裏怎樣脫險？","options":["讓公主拆掉王宮","一位夥伴用本領使屋內變冷","把屋子搬到海底","用金子堵住所有窗"],"answer":1,"explanation":"能帶來嚴寒的人出手，抵消了鐵屋中的高溫。","id":"grimm-71:q1"},{"q":"誰負責背走那一大袋財寶？","options":["神射手","吹風的人","大力士","快腿人"],"answer":2,"explanation":"國王低估了大力士能夠搬走的重量。","id":"grimm-71:q2"}],"title":"六個能人","author":"格林兄弟","group":"grimm","sourceTitle":"71 How Six Men Got On in the World (Sechse kommen durch die ganze Welt)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap71","lines":[{"zh":"一個退伍的人沒有得到應有的酬勞，便出外尋找能一起做事的夥伴。","py":"yí gè tuì wǔ de rén méi yǒu dé dào yīng yǒu de chóu láo ， biàn chū wài xún zhǎo néng yì qǐ zuò shì de huǒ bàn 。","paragraph":0},{"zh":"他陸續遇到大力士、神射手、能用鼻子吹強風的人，還有快腿人和能帶來嚴寒的人。","py":"tā lù xù yù dào dà lì shì 、 shén shè shǒu 、 néng yòng bí zi chuī qiáng fēng de rén ， hái yǒu kuài tuǐ rén hé néng dài lái yán hán de rén 。","paragraph":0},{"zh":"六人來到一個王國，答應參加與公主的賽跑。","py":"liù rén lái dào yí gè wáng guó ， dā ying cān jiā yǔ gōng zhǔ de sài pǎo 。","paragraph":1},{"zh":"快腿人跑得很快，卻在回程睡着；神射手及時射中他頭下的東西，把他驚醒，使他趕回終點。","py":"kuài tuǐ rén pǎo de hěn kuài ， què zài huí chéng shuì zháo ； shén shè shǒu jí shí shè zhōng tā tóu xià de dōng xī ， bǎ tā jīng xǐng ， shǐ tā gǎn huí zhōng diǎn 。","paragraph":1},{"zh":"國王不願守約，把他們關進燒熱的鐵屋。","py":"guó wáng bù yuàn shǒu yuē ， bǎ tā men guān jìn shāo rè de tiě wū 。","paragraph":2},{"zh":"能帶來嚴寒的夥伴調整帽子，屋裏便冷了下來，大家安然無恙。","py":"néng dài lái yán hán de huǒ bàn tiáo zhěng mào zi ， wū lǐ biàn lěng le xià lái ， dà jiā ān rán wú yàng 。","paragraph":2},{"zh":"國王只好答應，用一人能搬走的金子了結此事。","py":"guó wáng zhǐ hǎo dā ying ， yòng yī rén néng bān zǒu de jīn zi liǎo jié cǐ shì 。","paragraph":2},{"zh":"大力士背起巨大的袋子，裝走國王的財寶。","py":"dà lì shì bēi qǐ jù dà de dài zi ， zhuāng zǒu guó wáng de cái bǎo 。","paragraph":3},{"zh":"追兵趕來時，強風吹得他們無法靠近。","py":"zhuī bīng gǎn lái shí ， qiáng fēng chuī de tā men wú fǎ kào jìn 。","paragraph":3},{"zh":"六個人靠不同本領互相補足，最後平安離開，一起分享所得。","py":"liù gè rén kào bù tóng běn lǐng hù xiāng bǔ zú ， zuì hòu píng ān lí kāi ， yì qǐ fēn xiǎng suǒ dé 。","paragraph":3}]},{"id":"grimm-75","paragraphs":["貓在森林遇見狐狸，客氣地向他問好。狐狸自認見識豐富，很看不起只會捉老鼠的貓，還問她究竟懂多少本領，語氣裏滿是驕傲，連回答都懶洋洋的。","貓沒有誇口，只說自己會一樣：獵狗追來時，能迅速爬上樹躲避。狐狸聽了，更覺得可笑，說自己有一百種辦法，還有滿滿一袋計謀可以使用。","正在這時，一個獵人帶着四隻狗走近。貓不再說話，立刻跳上樹，藏進枝葉茂密的地方。狐狸還沒把那一百種辦法使出來，就已被獵狗圍住。","貓坐在高處，喊他快把袋子裏的計謀拿出來，可是那些誇口救不了他。森林又安靜下來，貓靠着一項真正會做的本領，保住了自己的安全。"],"questions":[{"q":"貓說自己最有把握的本領是甚麼？","options":["用尾巴打開城門","把老鼠變成金子","在河底找到王冠","爬上樹躲避獵狗"],"answer":3,"explanation":"她只說一樣，卻是遇險時確實能用的能力。","id":"grimm-75:q0"},{"q":"狐狸說自己有多少種辦法？","options":["一種","三種","十二種","一百種"],"answer":3,"explanation":"狐狸用一百種辦法和一袋計謀來誇耀自己。","id":"grimm-75:q1"},{"q":"獵狗出現後，貓先採取了甚麼行動？","options":["立刻跳上樹藏好","向狐狸借袋子","回家拿一把鐮刀","坐着等待獵人離開"],"answer":0,"explanation":"她沒有繼續爭辯，而是馬上運用爬樹的本領。","id":"grimm-75:q2"}],"title":"狐狸和貓","author":"格林兄弟","group":"grimm","sourceTitle":"75 The Fox and the Cat (Der Fuchs und die Katze)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap75","lines":[{"zh":"貓在森林遇見狐狸，客氣地向他問好。","py":"māo zài sēn lín yù jiàn hú lí ， kè qì dì xiàng tā wèn hǎo 。","paragraph":0},{"zh":"狐狸自認見識豐富，很看不起只會捉老鼠的貓，還問她究竟懂多少本領，語氣裏滿是驕傲，連回答都懶洋洋的。","py":"hú lí zì rèn jiàn shí fēng fù ， hěn kàn bù qǐ zhǐ huì zhuō lǎo shǔ de māo ， hái wèn tā jiū jìng dǒng duō shǎo běn lǐng ， yǔ qì lǐ mǎn shì jiāo ào ， lián huí dá dōu lǎn yáng yáng de 。","paragraph":0},{"zh":"貓沒有誇口，只說自己會一樣：獵狗追來時，能迅速爬上樹躲避。","py":"māo méi yǒu kuā kǒu ， zhǐ shuō zì jǐ huì yī yàng ： liè gǒu zhuī lái shí ， néng xùn sù pá shàng shù duǒ bì 。","paragraph":1},{"zh":"狐狸聽了，更覺得可笑，說自己有一百種辦法，還有滿滿一袋計謀可以使用。","py":"hú lí tīng le ， gèng jué de kě xiào ， shuō zì jǐ yǒu yì bǎi zhǒng bàn fǎ ， hái yǒu mǎn mǎn yī dài jì móu kě yǐ shǐ yòng 。","paragraph":1},{"zh":"正在這時，一個獵人帶着四隻狗走近。","py":"zhèng zài zhè shí ， yí gè liè rén dài zhe sì zhǐ gǒu zǒu jìn 。","paragraph":2},{"zh":"貓不再說話，立刻跳上樹，藏進枝葉茂密的地方。","py":"māo bù zài shuō huà ， lì kè tiào shàng shù ， cáng jìn zhī yè mào mì de dì fāng 。","paragraph":2},{"zh":"狐狸還沒把那一百種辦法使出來，就已被獵狗圍住。","py":"hú lí hái méi bǎ nà yì bǎi zhǒng bàn fǎ shǐ chū lái ， jiù yǐ bèi liè gǒu wéi zhù 。","paragraph":2},{"zh":"貓坐在高處，喊他快把袋子裏的計謀拿出來，可是那些誇口救不了他。","py":"māo zuò zài gāo chù ， hǎn tā kuài bǎ dài zi lǐ de jì móu ná chū lái ， kě shì nà xiē kuā kǒu jiù bù liǎo tā 。","paragraph":3},{"zh":"森林又安靜下來，貓靠着一項真正會做的本領，保住了自己的安全。","py":"sēn lín yòu ān jìng xià lái ， māo kào zhe yī xiàng zhēn zhèng huì zuò de běn lǐng ， bǎo zhù le zì jǐ de ān quán 。","paragraph":3}]},{"id":"grimm-87","paragraphs":["一位普通打扮的旅人夜裏求宿，先敲富人的門，卻被嫌棄沒有錢。對面的窮夫妻願意接待他，拿出簡單的飯食，還把較好的睡處讓給客人。","旅人其實有神奇的力量，臨走前答應給窮人三個願望。夫妻沒有爭求天下的財寶，只盼心地端正、生活有着落，最後連破舊的小屋也變成了新房。","富人得知後，急忙追上旅人，也要來三個願望。他騎馬回家，心裏只顧盤算，卻在生氣時隨口希望馬摔死，第一個機會就這樣白白用掉。","他背着馬鞍走路，又抱怨妻子舒服，結果妻子被困在馬鞍上。最後一個願望，只好用來讓她離開。富人甚麼也沒增加，窮夫妻卻安穩地過着日子。"],"questions":[{"q":"窮夫妻怎樣接待夜裏來的旅人？","options":["分享飯食並讓出較好的睡處","要求先付一袋金幣","把他趕到河邊","只讓他與馬住在一起"],"answer":0,"explanation":"他們雖然不富有，仍願意讓客人吃飯和休息。","id":"grimm-87:q0"},{"q":"富人的第一個願望為甚麼浪費了？","options":["忘記旅人的名字","被風吹走了願望紙","生氣時隨口詛咒自己的馬","拿去替鄰居修房子"],"answer":2,"explanation":"他的氣話立刻成真，並不是經過思考的選擇。","id":"grimm-87:q1"},{"q":"富人最後一個願望用來做甚麼？","options":["把井水變成酒","買回公主的披風","讓妻子離開馬鞍","替自己建金宮"],"answer":2,"explanation":"他必須用最後的機會，解除第二個願望造成的麻煩。","id":"grimm-87:q2"}],"title":"窮人和富人","author":"格林兄弟","group":"grimm","sourceTitle":"87 The Poor Man and the Rich Man (Der Arme und der Reiche)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap87","lines":[{"zh":"一位普通打扮的旅人夜裏求宿，先敲富人的門，卻被嫌棄沒有錢。","py":"yī wèi pǔ tōng dǎ bàn de lǚ rén yè lǐ qiú sù ， xiān qiāo fù rén de mén ， què bèi xián qì méi yǒu qián 。","paragraph":0},{"zh":"對面的窮夫妻願意接待他，拿出簡單的飯食，還把較好的睡處讓給客人。","py":"duì miàn de qióng fū qī yuàn yì jiē dài tā ， ná chū jiǎn dān de fàn shí ， hái bǎ jiào hǎo de shuì chù ràng gěi kè rén 。","paragraph":0},{"zh":"旅人其實有神奇的力量，臨走前答應給窮人三個願望。","py":"lǚ rén qí shí yǒu shén qí de lì liàng ， lín zǒu qián dā ying gěi qióng rén sān gè yuàn wàng 。","paragraph":1},{"zh":"夫妻沒有爭求天下的財寶，只盼心地端正、生活有着落，最後連破舊的小屋也變成了新房。","py":"fū qī méi yǒu zhēng qiú tiān xià de cái bǎo ， zhǐ pàn xīn dì duān zhèng 、 shēng huó yǒu zhuó luò ， zuì hòu lián pò jiù de xiǎo wū yě biàn chéng le xīn fáng 。","paragraph":1},{"zh":"富人得知後，急忙追上旅人，也要來三個願望。","py":"fù rén dé zhī hòu ， jí máng zhuī shàng lǚ rén ， yě yào lái sān gè yuàn wàng 。","paragraph":2},{"zh":"他騎馬回家，心裏只顧盤算，卻在生氣時隨口希望馬摔死，第一個機會就這樣白白用掉。","py":"tā qí mǎ huí jiā ， xīn lǐ zhǐ gù pán suàn ， què zài shēng qì shí suí kǒu xī wàng mǎ shuāi sǐ ， dì yí gè jī huì jiù zhè yàng bái bái yòng diào 。","paragraph":2},{"zh":"他背着馬鞍走路，又抱怨妻子舒服，結果妻子被困在馬鞍上。","py":"tā bēi zhe mǎ ān zǒu lù ， yòu bào yuàn qī zǐ shū fú ， jié guǒ qī zǐ bèi kùn zài mǎ ān shàng 。","paragraph":3},{"zh":"最後一個願望，只好用來讓她離開。","py":"zuì hòu yí gè yuàn wàng ， zhǐ hǎo yòng lái ràng tā lí kāi 。","paragraph":3},{"zh":"富人甚麼也沒增加，窮夫妻卻安穩地過着日子。","py":"fù rén shén me yě méi zēng jiā ， qióng fū qī què ān wěn dì guò zhe rì zi 。","paragraph":3}]},{"id":"grimm-94","paragraphs":["農夫在國王送的土地裏挖到一個金臼，想拿去謝恩。女兒提醒他，只有臼沒有杵，可能惹來麻煩；父親沒有聽，果然被懷疑藏起金杵，關進牢裏。","國王聽說女兒很聰明，便叫她前來，條件是既不能穿衣也不能全裸，既不能乘車也不能步行。姑娘裹着漁網，讓驢子拖着自己，巧妙解開難題。","國王娶了她。後來，她幫一個受冤的人想辦法，卻惹國王生氣，被要求離開王宮，只准帶走最心愛的東西。她答應了，請國王先喝一杯告別酒。","國王喝後熟睡，姑娘把他帶回父親的小屋。醒來的國王十分驚訝，她便解釋，最心愛的就是他本人。國王明白了她的心意，兩人一起回到王宮。"],"questions":[{"q":"女兒為甚麼勸父親別急着送出金臼？","options":["怕驢子不肯拉車","怕國王追問沒有找到的金杵","怕土地長不出莊稼","怕金臼會變成白鴿"],"answer":1,"explanation":"缺少配套的杵，可能使國王懷疑農夫私藏了東西。","id":"grimm-94:q0"},{"q":"姑娘用甚麼裹住身體來解題？","options":["漁網","金箔","樹皮","盔甲"],"answer":0,"explanation":"漁網讓她既不是通常的穿衣，也不是完全裸身。","id":"grimm-94:q1"},{"q":"姑娘離宮時帶走的最心愛之物是甚麼？","options":["熟睡的國王","一屋子的金臼","國王的全部馬匹","一袋沒有種過的種子"],"answer":0,"explanation":"她用行動說明，自己最珍惜的是丈夫。","id":"grimm-94:q2"}],"title":"聰明的農家女","author":"格林兄弟","group":"grimm","sourceTitle":"94 The Peasant’s Clever Daughter (Die kluge Bauerntochter)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap94","lines":[{"zh":"農夫在國王送的土地裏挖到一個金臼，想拿去謝恩。","py":"nóng fū zài guó wáng sòng de tǔ dì lǐ wā dào yí gè jīn jiù ， xiǎng ná qù xiè ēn 。","paragraph":0},{"zh":"女兒提醒他，只有臼沒有杵，可能惹來麻煩；父親沒有聽，果然被懷疑藏起金杵，關進牢裏。","py":"nǚ ér tí xǐng tā ， zhǐ yǒu jiù méi yǒu chǔ ， kě néng rě lái má fán ； fù qīn méi yǒu tīng ， guǒ rán bèi huái yí cáng qǐ jīn chǔ ， guān jìn láo lǐ 。","paragraph":0},{"zh":"國王聽說女兒很聰明，便叫她前來，條件是既不能穿衣也不能全裸，既不能乘車也不能步行。","py":"guó wáng tīng shuō nǚ ér hěn cōng míng ， biàn jiào tā qián lái ， tiáo jiàn shì jì bù néng chuān yī yě bù néng quán luǒ ， jì bù néng chéng chē yě bù néng bù xíng 。","paragraph":1},{"zh":"姑娘裹着漁網，讓驢子拖着自己，巧妙解開難題。","py":"gū niang guǒ zhe yú wǎng ， ràng lǘ zi tuō zhe zì jǐ ， qiǎo miào jiě kāi nán tí 。","paragraph":1},{"zh":"國王娶了她。","py":"guó wáng qǔ le tā 。","paragraph":2},{"zh":"後來，她幫一個受冤的人想辦法，卻惹國王生氣，被要求離開王宮，只准帶走最心愛的東西。","py":"hòu lái ， tā bāng yí gè shòu yuān de rén xiǎng bàn fǎ ， què rě guó wáng shēng qì ， bèi yāo qiú lí kāi wáng gōng ， zhǐ zhǔn dài zǒu zuì xīn ài de dōng xī 。","paragraph":2},{"zh":"她答應了，請國王先喝一杯告別酒。","py":"tā dā ying le ， qǐng guó wáng xiān hē yī bēi gào bié jiǔ 。","paragraph":2},{"zh":"國王喝後熟睡，姑娘把他帶回父親的小屋。","py":"guó wáng hē hòu shú shuì ， gū niang bǎ tā dài huí fù qīn de xiǎo wū 。","paragraph":3},{"zh":"醒來的國王十分驚訝，她便解釋，最心愛的就是他本人。","py":"xǐng lái de guó wáng shí fēn jīng yà ， tā biàn jiě shì ， zuì xīn ài de jiù shì tā běn rén 。","paragraph":3},{"zh":"國王明白了她的心意，兩人一起回到王宮。","py":"guó wáng míng bái le tā de xīn yì ， liǎng rén yì qǐ huí dào wáng gōng 。","paragraph":3}]},{"id":"grimm-98","paragraphs":["農夫克拉布看見醫生過得舒適，也想成為博士。他買來一本識字書，換了衣服，在門口掛上萬事通博士的招牌，卻沒有真正學到診治或查案的本領。","一位財主丟了錢，請他去找。他帶着妻子赴宴，第一個僕人上菜時，便對妻子說這是第一個。偷錢的僕人聽見，以為博士已經認出了自己。","接着幾個上菜的僕人，也把他數菜的話當成了指認。財主拿出一盤蓋好的螃蟹考他，他嘆了一聲可憐的克拉布，沒想到自己的姓也讓人聯想到盤裏的螃蟹。","僕人們越來越怕，私下承認偷錢，帶他找到藏錢的地方。克拉布靠一連串誤會出了名，讀者卻知道，巧合並不代表他真的甚麼都懂，招牌也不能代替學問。"],"questions":[{"q":"萬事通博士原來從事甚麼工作？","options":["海上船長","農夫","神射手","王宮廚師"],"answer":1,"explanation":"克拉布原本是農夫，看見醫生的生活才想改行。","id":"grimm-98:q0"},{"q":"僕人為甚麼害怕博士數第一個、第二個？","options":["以為他正在指出偷錢的人","怕他把飯菜全吃光","聽說數字會變成蛇","不想替客人拿椅子"],"answer":0,"explanation":"博士在數上菜次序，僕人卻因心虛誤解了他的話。","id":"grimm-98:q1"},{"q":"克拉布最後怎樣找到失款？","options":["讓螃蟹指出地點","從國王的金杯裏找到","僕人主動招認並帶他去找","靠識字書中的地圖"],"answer":2,"explanation":"偷錢的人被巧合嚇住，自己說出了藏錢的地方。","id":"grimm-98:q2"}],"title":"萬事通博士","author":"格林兄弟","group":"grimm","sourceTitle":"98 Dr. Know-All (Doktor Allwissend)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap98","lines":[{"zh":"農夫克拉布看見醫生過得舒適，也想成為博士。","py":"nóng fū kè lā bù kàn jiàn yī shēng guò de shū shì ， yě xiǎng chéng wéi bó shì 。","paragraph":0},{"zh":"他買來一本識字書，換了衣服，在門口掛上萬事通博士的招牌，卻沒有真正學到診治或查案的本領。","py":"tā mǎi lái yī běn shí zì shū ， huàn le yī fú ， zài mén kǒu guà shàng wàn shì tōng bó shì de zhāo pái ， què méi yǒu zhēn zhèng xué dào zhěn zhì huò chá àn de běn lǐng 。","paragraph":0},{"zh":"一位財主丟了錢，請他去找。","py":"yī wèi cái zhǔ diū le qián ， qǐng tā qù zhǎo 。","paragraph":1},{"zh":"他帶着妻子赴宴，第一個僕人上菜時，便對妻子說這是第一個。","py":"tā dài zhe qī zǐ fù yàn ， dì yí gè pú rén shàng cài shí ， biàn duì qī zǐ shuō zhè shì dì yí gè 。","paragraph":1},{"zh":"偷錢的僕人聽見，以為博士已經認出了自己。","py":"tōu qián de pú rén tīng jiàn ， yǐ wéi bó shì yǐ jīng rèn chū le zì jǐ 。","paragraph":1},{"zh":"接着幾個上菜的僕人，也把他數菜的話當成了指認。","py":"jiē zhe jǐ gè shàng cài de pú rén ， yě bǎ tā shǔ cài de huà dàng chéng le zhǐ rèn 。","paragraph":2},{"zh":"財主拿出一盤蓋好的螃蟹考他，他嘆了一聲可憐的克拉布，沒想到自己的姓也讓人聯想到盤裏的螃蟹。","py":"cái zhǔ ná chū yī pán gài hǎo de páng xiè kǎo tā ， tā tàn le yī shēng kě lián de kè lā bù ， méi xiǎng dào zì jǐ de xìng yě ràng rén lián xiǎng dào pán lǐ de páng xiè 。","paragraph":2},{"zh":"僕人們越來越怕，私下承認偷錢，帶他找到藏錢的地方。","py":"pú rén men yuè lái yuè pà ， sī xià chéng rèn tōu qián ， dài tā zhǎo dào cáng qián de dì fāng 。","paragraph":3},{"zh":"克拉布靠一連串誤會出了名，讀者卻知道，巧合並不代表他真的甚麼都懂，招牌也不能代替學問。","py":"kè lā bù kào yī lián chuàn wù huì chū le míng ， dú zhě què zhī dào ， qiǎo hé bìng bù dài biǎo tā zhēn de shén me dōu dǒng ， zhāo pái yě bù néng dài tì xué wèn 。","paragraph":3}]},{"id":"grimm-99","paragraphs":["樵夫辛苦存錢，讓兒子到學校讀書。錢用完後，青年只好回家幫忙砍柴。有一天，他在大樹附近聽見呼救，翻找樹根，發現一個被塞住的瓶子。","他拔開瓶塞，裏面的精靈越變越大，反而威脅要傷害救他的人。青年沒有慌，假裝不相信這麼大的身體原來能住在小瓶裏，請精靈再示範一次。","精靈鑽回瓶子，青年立刻塞緊瓶口。這回精靈求他放行，還答應給他一塊神奇的布：一面能治傷，另一面能把金屬變成銀子，青年試過才放他離開。","青年拿斧頭試驗，斧頭果然變成銀的。他賣掉銀斧，先賠還借斧的鄰居，再讓父親過上安穩的生活，自己則回學校繼續求學，將來用本領幫助病人。"],"questions":[{"q":"精靈原來被困在哪裏？","options":["海上的玻璃鞋裏","樹根附近的瓶子裏","王宮的金臼裏","井底的木箱裏"],"answer":1,"explanation":"青年循着呼救聲，在樹根找到塞着瓶口的瓶子。","id":"grimm-99:q0"},{"q":"青年怎樣讓精靈再次進入瓶子？","options":["用金子鋪滿地面","假裝不信牠能住進小瓶","用一百個士兵推牠","把瓶子放進火爐"],"answer":1,"explanation":"他利用精靈想證明自己的心理，重新掌握局面。","id":"grimm-99:q1"},{"q":"得到銀斧賣出的錢後，青年先處理甚麼責任？","options":["買一座沒有門的塔","雇人替他停止讀書","賠還借來的斧頭","替女巫買新城堡"],"answer":2,"explanation":"斧頭是借來的，他沒有忘記先補償鄰居。","id":"grimm-99:q2"}],"title":"瓶子裏的精靈","author":"格林兄弟","group":"grimm","sourceTitle":"99 The Spirit in the Bottle (Der Geist im Glas)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap99","lines":[{"zh":"樵夫辛苦存錢，讓兒子到學校讀書。","py":"qiáo fū xīn kǔ cún qián ， ràng ér zi dào xué xiào dú shū 。","paragraph":0},{"zh":"錢用完後，青年只好回家幫忙砍柴。","py":"qián yòng wán hòu ， qīng nián zhǐ hǎo huí jiā bāng máng kǎn chái 。","paragraph":0},{"zh":"有一天，他在大樹附近聽見呼救，翻找樹根，發現一個被塞住的瓶子。","py":"yǒu yī tiān ， tā zài dà shù fù jìn tīng jiàn hū jiù ， fān zhǎo shù gēn ， fā xiàn yí gè bèi sāi zhù de píng zi 。","paragraph":0},{"zh":"他拔開瓶塞，裏面的精靈越變越大，反而威脅要傷害救他的人。","py":"tā bá kāi píng sāi ， lǐ miàn de jīng líng yuè biàn yuè dà ， fǎn ér wēi xié yào shāng hài jiù tā de rén 。","paragraph":1},{"zh":"青年沒有慌，假裝不相信這麼大的身體原來能住在小瓶裏，請精靈再示範一次。","py":"qīng nián méi yǒu huāng ， jiǎ zhuāng bù xiāng xìn zhè me dà de shēn tǐ yuán lái néng zhù zài xiǎo píng lǐ ， qǐng jīng líng zài shì fàn yī cì 。","paragraph":1},{"zh":"精靈鑽回瓶子，青年立刻塞緊瓶口。","py":"jīng líng zuān huí píng zi ， qīng nián lì kè sāi jǐn píng kǒu 。","paragraph":2},{"zh":"這回精靈求他放行，還答應給他一塊神奇的布：一面能治傷，另一面能把金屬變成銀子，青年試過才放他離開。","py":"zhè huí jīng líng qiú tā fàng xíng ， hái dā ying gěi tā yī kuài shén qí de bù ： yí miàn néng zhì shāng ， lìng yí miàn néng bǎ jīn shǔ biàn chéng yín zi ， qīng nián shì guò cái fàng tā lí kāi 。","paragraph":2},{"zh":"青年拿斧頭試驗，斧頭果然變成銀的。","py":"qīng nián ná fǔ tóu shì yàn ， fǔ tóu guǒ rán biàn chéng yín de 。","paragraph":3},{"zh":"他賣掉銀斧，先賠還借斧的鄰居，再讓父親過上安穩的生活，自己則回學校繼續求學，將來用本領幫助病人。","py":"tā mài diào yín fǔ ， xiān péi huán jiè fǔ de lín jū ， zài ràng fù qīn guò shàng ān wěn de shēng huó ， zì jǐ zé huí xué xiào jì xù qiú xué ， jiāng lái yòng běn lǐng bāng zhù bìng rén 。","paragraph":3}]},{"id":"grimm-101","paragraphs":["退伍士兵失去工作，也沒有家人願意收留。他遇見一個神秘人，對方給他能取出金錢的外衣，卻要他披着熊皮，七年不能清洗、理髮或修剪指甲。","士兵答應考驗。日子久了，他的模樣使人害怕，很難找到住宿的地方；可是他仍拿錢幫助窮人，也救了一個因欠債而走投無路的老人。","老人最小的女兒願意與他訂婚，兩人把一枚戒指分成兩半，作為重逢的憑證。姑娘的兩個姐姐只看見他的外表，不相信這段約定會有好結果。","七年期滿，士兵恢復整潔的模樣，回到姑娘家。他把半枚戒指放進酒杯，姑娘拿出自己保存的另一半，兩片正好合在一起，終於認出了守約歸來的人。"],"questions":[{"q":"熊皮人的考驗要持續多久？","options":["七年","三天","十二個月","一百夜"],"answer":0,"explanation":"七年不清洗和修整外表，是他答應的特殊條件。","id":"grimm-101:q0"},{"q":"外表令人害怕時，士兵仍做了甚麼？","options":["拿錢幫助窮人和欠債老人","只向富人出售熊皮","逼所有村民離開","把錢全埋進河底"],"answer":0,"explanation":"他的善意並沒有因外貌的變化而消失。","id":"grimm-101:q1"},{"q":"姑娘最後靠甚麼確認士兵身份？","options":["能合在一起的兩半戒指","熊皮上的一根羽毛","會唱歌的酒杯","公主送來的金杵"],"answer":0,"explanation":"兩人各留一半的戒指，成為重新相認的憑證。","id":"grimm-101:q2"}],"title":"熊皮人","author":"格林兄弟","group":"grimm","sourceTitle":"101 Bearskin (Der Bärenhäuter)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap101","lines":[{"zh":"退伍士兵失去工作，也沒有家人願意收留。","py":"tuì wǔ shì bīng shī qù gōng zuò ， yě méi yǒu jiā rén yuàn yì shōu liú 。","paragraph":0},{"zh":"他遇見一個神秘人，對方給他能取出金錢的外衣，卻要他披着熊皮，七年不能清洗、理髮或修剪指甲。","py":"tā yù jiàn yí gè shén mì rén ， duì fāng gěi tā néng qǔ chū jīn qián de wài yī ， què yào tā pī zhe xióng pí ， qī nián bù néng qīng xǐ 、 lǐ fà huò xiū jiǎn zhǐ jiǎ 。","paragraph":0},{"zh":"士兵答應考驗。","py":"shì bīng dā ying kǎo yàn 。","paragraph":1},{"zh":"日子久了，他的模樣使人害怕，很難找到住宿的地方；可是他仍拿錢幫助窮人，也救了一個因欠債而走投無路的老人。","py":"rì zi jiǔ le ， tā de mú yàng shǐ rén hài pà ， hěn nán zhǎo dào zhù sù de dì fāng ； kě shì tā réng ná qián bāng zhù qióng rén ， yě jiù le yí gè yīn qiàn zhài ér zǒu tóu wú lù de lǎo rén 。","paragraph":1},{"zh":"老人最小的女兒願意與他訂婚，兩人把一枚戒指分成兩半，作為重逢的憑證。","py":"lǎo rén zuì xiǎo de nǚ ér yuàn yì yǔ tā dìng hūn ， liǎng rén bǎ yī méi jiè zhǐ fēn chéng liǎng bàn ， zuò wéi chóng féng de píng zhèng 。","paragraph":2},{"zh":"姑娘的兩個姐姐只看見他的外表，不相信這段約定會有好結果。","py":"gū niang de liǎng gè jiě jiě zhǐ kàn jiàn tā de wài biǎo ， bù xiāng xìn zhè duàn yuē dìng huì yǒu hǎo jié guǒ 。","paragraph":2},{"zh":"七年期滿，士兵恢復整潔的模樣，回到姑娘家。","py":"qī nián qī mǎn ， shì bīng huī fù zhěng jié de mú yàng ， huí dào gū niang jiā 。","paragraph":3},{"zh":"他把半枚戒指放進酒杯，姑娘拿出自己保存的另一半，兩片正好合在一起，終於認出了守約歸來的人。","py":"tā bǎ bàn méi jiè zhǐ fàng jìn jiǔ bēi ， gū niang ná chū zì jǐ bǎo cún de lìng yí bàn ， liǎng piàn zhèng hǎo hé zài yì qǐ ， zhōng yú rèn chū le shǒu yuē guī lái de rén 。","paragraph":3}]},{"id":"grimm-102","paragraphs":["熊聽見鷦鷯唱歌，跟着狼去看鳥巢，卻嘲笑巢裏的小鳥。小鳥們覺得受到侮辱，不肯吃東西，父母便決定向熊討回公道，森林因而分成兩邊。","熊聯合會走的獸，鷦鷯則請會飛的鳥和昆蟲幫忙。狐狸擔任走獸的指揮，約定尾巴高舉表示前進，尾巴垂下就表示應該撤退。","鷦鷯派蚊子偷聽計劃，再派大黃蜂飛到狐狸尾巴下。狐狸被螫得受不了，終於把尾巴夾住。其他走獸以為敗局已定，紛紛逃回自己的洞裏。","鳥兒雖然贏了，小鷦鷯仍不肯吃飯，因為牠們真正需要的是道歉。熊只好來到鳥巢前，收回先前的侮辱。等到尊重得到恢復，小鳥才重新安心吃飯。"],"questions":[{"q":"森林爭端最初因甚麼而起？","options":["蚊子弄丟王冠","熊嘲笑巢裏的小鳥","狐狸偷走所有蜂蜜","鷦鷯拆掉狼的洞"],"answer":1,"explanation":"熊對小鳥的侮辱，引起了鳥類與走獸之間的衝突。","id":"grimm-102:q0"},{"q":"狐狸尾巴垂下，原本約定代表甚麼？","options":["開飯","求雨","換巢","撤退"],"answer":3,"explanation":"走獸看見尾巴垂下，便誤以為應該立即撤退。","id":"grimm-102:q1"},{"q":"小鳥在勝利後仍等待甚麼才肯吃飯？","options":["七桶河水","國王送來鐮刀","熊親自道歉","一座金色鳥巢"],"answer":2,"explanation":"牠們要的是收回侮辱，而不只是贏過對方。","id":"grimm-102:q2"}],"title":"鷦鷯和熊","author":"格林兄弟","group":"grimm","sourceTitle":"102 The Willow-Wren and the Bear (Der Zaunkönig und der Bär)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap102","lines":[{"zh":"熊聽見鷦鷯唱歌，跟着狼去看鳥巢，卻嘲笑巢裏的小鳥。","py":"xióng tīng jiàn jiāo liáo chàng gē ， gēn zhe láng qù kàn niǎo cháo ， què cháo xiào cháo lǐ de xiǎo niǎo 。","paragraph":0},{"zh":"小鳥們覺得受到侮辱，不肯吃東西，父母便決定向熊討回公道，森林因而分成兩邊。","py":"xiǎo niǎo men jué de shòu dào wǔ rǔ ， bù kěn chī dōng xī ， fù mǔ biàn jué dìng xiàng xióng tǎo huí gōng dào ， sēn lín yīn ér fēn chéng liǎng biān 。","paragraph":0},{"zh":"熊聯合會走的獸，鷦鷯則請會飛的鳥和昆蟲幫忙。","py":"xióng lián hé huì zǒu de shòu ， jiāo liáo zé qǐng huì fēi de niǎo hé kūn chóng bāng máng 。","paragraph":1},{"zh":"狐狸擔任走獸的指揮，約定尾巴高舉表示前進，尾巴垂下就表示應該撤退。","py":"hú lí dān rèn zǒu shòu de zhǐ huī ， yuē dìng wěi ba gāo jǔ biǎo shì qián jìn ， wěi ba chuí xià jiù biǎo shì yīng gāi chè tuì 。","paragraph":1},{"zh":"鷦鷯派蚊子偷聽計劃，再派大黃蜂飛到狐狸尾巴下。","py":"jiāo liáo pài wén zi tōu tīng jì huà ， zài pài dà huáng fēng fēi dào hú lí wěi bā xià 。","paragraph":2},{"zh":"狐狸被螫得受不了，終於把尾巴夾住。","py":"hú lí bèi shì de shòu bù liǎo ， zhōng yú bǎ wěi ba jiā zhù 。","paragraph":2},{"zh":"其他走獸以為敗局已定，紛紛逃回自己的洞裏。","py":"qí tā zǒu shòu yǐ wéi bài jú yǐ dìng ， fēn fēn táo huí zì jǐ de dòng lǐ 。","paragraph":2},{"zh":"鳥兒雖然贏了，小鷦鷯仍不肯吃飯，因為牠們真正需要的是道歉。","py":"niǎo ér suī rán yíng le ， xiǎo jiāo liáo réng bù kěn chī fàn ， yīn wèi tā men zhēn zhèng xū yào de shì dào qiàn 。","paragraph":3},{"zh":"熊只好來到鳥巢前，收回先前的侮辱。","py":"xióng zhǐ hǎo lái dào niǎo cháo qián ， shōu huí xiān qián de wǔ rǔ 。","paragraph":3},{"zh":"等到尊重得到恢復，小鳥才重新安心吃飯。","py":"děng dào zūn zhòng dé dào huī fù ， xiǎo niǎo cái chóng xīn ān xīn chī fàn 。","paragraph":3}]},{"id":"grimm-106","paragraphs":["老磨坊主想退休，叫三個學徒出外尋馬，誰帶回最好的馬，就能繼承磨坊。另兩人看不起漢斯，把他留在路上，自己先去尋找好馬。","漢斯遇見一隻會說話的小貓。小貓答應，只要他留下工作七年，就送他一匹好馬。漢斯接受了，照料小貓，也依她的要求，用銀工具建了一座小屋。","七年過去，小貓讓他先回磨坊，說好馬隨後就到。漢斯仍穿得破舊，別人不讓他住進屋內。這時，一位公主乘車到來，帶着一匹最出色的馬尋找他。","原來小貓是受魔法影響的公主，漢斯的工作幫她解除了魔法。她帶漢斯回到那座小屋，屋子也已成為華麗的城堡；他不再需要靠磨坊主的比較來證明自己。"],"questions":[{"q":"磨坊主用甚麼方法決定繼承人？","options":["比較學徒帶回的馬","看誰擁有最多戒指","比誰能爬最高的樹","猜出三個鳥名"],"answer":0,"explanation":"他答應把磨坊交給帶回最好馬匹的學徒。","id":"grimm-106:q0"},{"q":"漢斯替小貓工作了幾年？","options":["一年","三年","一百年","七年"],"answer":3,"explanation":"他遵守了七年的約定，沒有因工作平凡而離開。","id":"grimm-106:q1"},{"q":"後來來接漢斯的公主，原本是誰？","options":["磨坊主的女兒","賣火柴的女孩","森林裏的女巫","那隻會說話的小貓"],"answer":3,"explanation":"小貓的魔法解除後，恢復了公主的身份。","id":"grimm-106:q2"}],"title":"磨坊學徒和小貓","author":"格林兄弟","group":"grimm","sourceTitle":"106 The Poor Miller’s Boy and the Cat (Der arme Müllerbursch und das Kätzchen)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap106","lines":[{"zh":"老磨坊主想退休，叫三個學徒出外尋馬，誰帶回最好的馬，就能繼承磨坊。","py":"lǎo mò fáng zhǔ xiǎng tuì xiū ， jiào sān gè xué tú chū wài xún mǎ ， shuí dài huí zuì hǎo de mǎ ， jiù néng jì chéng mò fáng 。","paragraph":0},{"zh":"另兩人看不起漢斯，把他留在路上，自己先去尋找好馬。","py":"lìng liǎng rén kàn bù qǐ hàn sī ， bǎ tā liú zài lù shàng ， zì jǐ xiān qù xún zhǎo hǎo mǎ 。","paragraph":0},{"zh":"漢斯遇見一隻會說話的小貓。","py":"hàn sī yù jiàn yī zhī huì shuō huà de xiǎo māo 。","paragraph":1},{"zh":"小貓答應，只要他留下工作七年，就送他一匹好馬。","py":"xiǎo māo dā ying ， zhǐ yào tā liú xià gōng zuò qī nián ， jiù sòng tā yì pǐ hǎo mǎ 。","paragraph":1},{"zh":"漢斯接受了，照料小貓，也依她的要求，用銀工具建了一座小屋。","py":"hàn sī jiē shòu le ， zhào liào xiǎo māo ， yě yī tā de yāo qiú ， yòng yín gōng jù jiàn le yī zuò xiǎo wū 。","paragraph":1},{"zh":"七年過去，小貓讓他先回磨坊，說好馬隨後就到。","py":"qī nián guò qù ， xiǎo māo ràng tā xiān huí mò fáng ， shuō hǎo mǎ suí hòu jiù dào 。","paragraph":2},{"zh":"漢斯仍穿得破舊，別人不讓他住進屋內。","py":"hàn sī réng chuān de pò jiù ， bié rén bù ràng tā zhù jìn wū nèi 。","paragraph":2},{"zh":"這時，一位公主乘車到來，帶着一匹最出色的馬尋找他。","py":"zhè shí ， yī wèi gōng zhǔ chéng chē dào lái ， dài zhe yì pǐ zuì chū sè de mǎ xún zhǎo tā 。","paragraph":2},{"zh":"原來小貓是受魔法影響的公主，漢斯的工作幫她解除了魔法。","py":"yuán lái xiǎo māo shì shòu mó fǎ yǐng xiǎng de gōng zhǔ ， hàn sī de gōng zuò bāng tā jiě chú le mó fǎ 。","paragraph":3},{"zh":"她帶漢斯回到那座小屋，屋子也已成為華麗的城堡；他不再需要靠磨坊主的比較來證明自己。","py":"tā dài hàn sī huí dào nà zuò xiǎo wū ， wū zi yě yǐ chéng wéi huá lì de chéng bǎo ； tā bù zài xū yào kào mò fáng zhǔ de bǐ jiào lái zhèng míng zì jǐ 。","paragraph":3}]},{"id":"grimm-114","paragraphs":["一位公主用謎語考求婚者，三個裁縫也前來試試。她問自己的頭髮有哪兩種顏色，前兩人都猜錯，最年輕的裁縫卻答對了金色與銀色。","公主仍不願守約，又叫他在有熊的屋子過夜。裁縫拿出核桃來吃，卻給熊石頭，讓牠怎樣咬也咬不開。熊以為他的牙齒特別厲害，不敢輕易傷他。","接着，他拉起琴。熊想跟着學，裁縫便說必須先修好指甲，趁機把熊的爪子夾在工具裏。他平安度過一夜，公主這才不得不準備婚禮。","另兩個裁縫心生妒忌，把熊放出來追趕馬車。年輕裁縫立刻伸出雙腿，嚇唬熊說又要把牠夾住。熊想起昨夜的事，轉身跑掉，他也終於完成婚禮。"],"questions":[{"q":"裁縫猜中公主頭髮是哪兩種顏色？","options":["藍色與黑色","紫色與橙色","金色與銀色","紅色與綠色"],"answer":2,"explanation":"公主的謎底是金色和銀色，不是普通的單一髮色。","id":"grimm-114:q0"},{"q":"裁縫給熊甚麼，讓牠以為自己咬不開核桃？","options":["棉花","麵包","雪花","石頭"],"answer":3,"explanation":"裁縫自己吃核桃，卻把難以咬動的石頭交給熊。","id":"grimm-114:q1"},{"q":"熊最後為甚麼停止追趕馬車？","options":["突然想回家紡線","害怕再次被夾住爪子","聽見森林響起鐘聲","發現馬車裏沒有公主"],"answer":1,"explanation":"裁縫利用熊對前一晚經歷的記憶，嚇退了牠。","id":"grimm-114:q2"}],"title":"聰明的小裁縫","author":"格林兄弟","group":"grimm","sourceTitle":"114 The Cunning Little Tailor (Vom klugen Schneiderlein)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap114","lines":[{"zh":"一位公主用謎語考求婚者，三個裁縫也前來試試。","py":"yī wèi gōng zhǔ yòng mí yǔ kǎo qiú hūn zhě ， sān gè cái féng yě qián lái shì shì 。","paragraph":0},{"zh":"她問自己的頭髮有哪兩種顏色，前兩人都猜錯，最年輕的裁縫卻答對了金色與銀色。","py":"tā wèn zì jǐ de tóu fà yǒu nǎ liǎng zhǒng yán sè ， qián liǎng rén dōu cāi cuò ， zuì nián qīng de cái féng què dá duì le jīn sè yǔ yín sè 。","paragraph":0},{"zh":"公主仍不願守約，又叫他在有熊的屋子過夜。","py":"gōng zhǔ réng bù yuàn shǒu yuē ， yòu jiào tā zài yǒu xióng de wū zi guò yè 。","paragraph":1},{"zh":"裁縫拿出核桃來吃，卻給熊石頭，讓牠怎樣咬也咬不開。","py":"cái féng ná chū hé táo lái chī ， què gěi xióng shí tou ， ràng tā zěn yàng yǎo yě yǎo bù kāi 。","paragraph":1},{"zh":"熊以為他的牙齒特別厲害，不敢輕易傷他。","py":"xióng yǐ wéi tā de yá chǐ tè bié lì hài ， bù gǎn qīng yì shāng tā 。","paragraph":1},{"zh":"接着，他拉起琴。","py":"jiē zhe ， tā lā qǐ qín 。","paragraph":2},{"zh":"熊想跟着學，裁縫便說必須先修好指甲，趁機把熊的爪子夾在工具裏。","py":"xióng xiǎng gēn zhe xué ， cái féng biàn shuō bì xū xiān xiū hǎo zhǐ jiǎ ， chèn jī bǎ xióng de zhuǎ zi jiā zài gōng jù lǐ 。","paragraph":2},{"zh":"他平安度過一夜，公主這才不得不準備婚禮。","py":"tā píng ān dù guò yī yè ， gōng zhǔ zhè cái bù dé bù zhǔn bèi hūn lǐ 。","paragraph":2},{"zh":"另兩個裁縫心生妒忌，把熊放出來追趕馬車。","py":"lìng liǎng gè cái féng xīn shēng dù jì ， bǎ xióng fàng chū lái zhuī gǎn mǎ chē 。","paragraph":3},{"zh":"年輕裁縫立刻伸出雙腿，嚇唬熊說又要把牠夾住。","py":"nián qīng cái féng lì kè shēn chū shuāng tuǐ ， xià hǔ xióng shuō yòu yào bǎ tā jiā zhù 。","paragraph":3},{"zh":"熊想起昨夜的事，轉身跑掉，他也終於完成婚禮。","py":"xióng xiǎng qǐ zuó yè de shì ， zhuǎn shēn pǎo diào ， tā yě zhōng yú wán chéng hūn lǐ 。","paragraph":3}]},{"id":"grimm-116","paragraphs":["受傷的士兵退伍後，被國王停止發給酬勞。他在森林向女巫求宿，替她做了許多工作，最後還被放進一口枯井，替她取一盞發着藍光的燈。","女巫要他先交燈，才拉他上來。士兵不肯，便被留在井底。他借藍光點燃煙斗，一個小精靈忽然出現，答應聽他吩咐，先把他從井裏救出去。","士兵回到城裏，想向國王討回公道，卻在與王宮的衝突中被捕。失去藍燈後，他請人把遺留的包裹取來，才重新拿回最重要的東西。","受審之後，他提出最後想再抽一次煙斗。煙從藍光上升起，精靈又出現了，阻止了國王的懲罰。國王終於屈服，士兵也不再是只能任人趕走的無助者。"],"questions":[{"q":"女巫要士兵到枯井裏拿甚麼？","options":["一盞藍燈","一把金鑰匙","一件熊皮","一根銀針"],"answer":0,"explanation":"藍燈藏在井底，也是後來召出精靈的關鍵。","id":"grimm-116:q0"},{"q":"士兵怎樣第一次召出小精靈？","options":["唱完三首歌","敲打城門七下","用藍光點燃煙斗","把金幣丟進河裏"],"answer":2,"explanation":"煙斗在藍燈上點燃後，小精靈便現身。","id":"grimm-116:q1"},{"q":"士兵被捕後，為甚麼要取回遺留包裹？","options":["裏面有能幫他的藍燈","裏面放着公主的頭髮","需要把所有衣服賣掉","想把包裹還給女巫"],"answer":0,"explanation":"重新拿到藍燈，他才有機會再次召喚精靈。","id":"grimm-116:q2"}],"title":"藍燈","author":"格林兄弟","group":"grimm","sourceTitle":"116 The Blue Light (Das blaue Licht)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap116","lines":[{"zh":"受傷的士兵退伍後，被國王停止發給酬勞。","py":"shòu shāng dī shì bīng tuì wǔ hòu ， bèi guó wáng tíng zhǐ fā gěi chóu láo 。","paragraph":0},{"zh":"他在森林向女巫求宿，替她做了許多工作，最後還被放進一口枯井，替她取一盞發着藍光的燈。","py":"tā zài sēn lín xiàng nǚ wū qiú sù ， tì tā zuò le xǔ duō gōng zuò ， zuì hòu hái bèi fàng jìn yī kǒu kū jǐng ， tì tā qǔ yī zhǎn fā zhe lán guāng de dēng 。","paragraph":0},{"zh":"女巫要他先交燈，才拉他上來。","py":"nǚ wū yào tā xiān jiāo dēng ， cái lā tā shàng lái 。","paragraph":1},{"zh":"士兵不肯，便被留在井底。","py":"shì bīng bù kěn ， biàn bèi liú zài jǐng dǐ 。","paragraph":1},{"zh":"他借藍光點燃煙斗，一個小精靈忽然出現，答應聽他吩咐，先把他從井裏救出去。","py":"tā jiè lán guāng diǎn rán yān dǒu ， yí gè xiǎo jīng líng hū rán chū xiàn ， dā ying tīng tā fēn fù ， xiān bǎ tā cóng jǐng lǐ jiù chū qù 。","paragraph":1},{"zh":"士兵回到城裏，想向國王討回公道，卻在與王宮的衝突中被捕。","py":"shì bīng huí dào chéng lǐ ， xiǎng xiàng guó wáng tǎo huí gōng dào ， què zài yǔ wáng gōng de chōng tū zhōng bèi bǔ 。","paragraph":2},{"zh":"失去藍燈後，他請人把遺留的包裹取來，才重新拿回最重要的東西。","py":"shī qù lán dēng hòu ， tā qǐng rén bǎ yí liú de bāo guǒ qǔ lái ， cái chóng xīn ná huí zuì zhòng yào de dōng xī 。","paragraph":2},{"zh":"受審之後，他提出最後想再抽一次煙斗。","py":"shòu shěn zhī hòu ， tā tí chū zuì hòu xiǎng zài chōu yī cì yān dǒu 。","paragraph":3},{"zh":"煙從藍光上升起，精靈又出現了，阻止了國王的懲罰。","py":"yān cóng lán guāng shàng shēng qǐ ， jīng líng yòu chū xiàn le ， zǔ zhǐ le guó wáng de chéng fá 。","paragraph":3},{"zh":"國王終於屈服，士兵也不再是只能任人趕走的無助者。","py":"guó wáng zhōng yú qū fú ， shì bīng yě bù zài shì zhǐ néng rèn rén gǎn zǒu de wú zhù zhě 。","paragraph":3}]},{"id":"grimm-121","paragraphs":["一位不怕危險的王子離家遠行，先遇見巨人，又經過花園和高山的考驗。他雖然有時受人欺騙，仍不願因挫折停下腳步，最後來到一座受到魔法控制的城堡。","城裏的公主告訴他，要解除魔法，必須在三個夜晚保持沉默，忍受妖怪的折磨。王子願意留下，即使第一夜非常難熬，也沒有開口叫喊，更沒有逃走。","每天天亮，公主都用生命之水替他治傷，她身上的魔法也隨考驗逐漸消退。第三夜最為艱難，王子幾乎失去氣力，仍然守住了約定，直到妖怪離開。","公主再次用水使他恢復，並請他在樓梯上方揮劍三次。最後一道魔法終於解除，城堡的僕人也重獲自由。這段遠行以眾人團聚和一場喜慶的婚禮作結。"],"questions":[{"q":"公主請王子在三夜考驗中遵守甚麼？","options":["保持沉默","不停地唱歌","每夜搬走一座山","把劍丟進海裏"],"answer":0,"explanation":"王子必須忍受考驗而不出聲，才能逐步解除魔法。","id":"grimm-121:q0"},{"q":"公主每天用甚麼替王子治傷？","options":["金色沙子","三片蛇皮","一杯熱湯","生命之水"],"answer":3,"explanation":"天亮後，她用生命之水讓受傷的王子恢復。","id":"grimm-121:q1"},{"q":"最後解除城堡魔法的動作是甚麼？","options":["向巨人借一根羽毛","在樓梯上方揮劍三次","敲碎王冠十二次","把帽子掛在樹上"],"answer":1,"explanation":"三夜之後，王子依公主指示揮劍，完成最後一步。","id":"grimm-121:q2"}],"title":"無所畏懼的王子","author":"格林兄弟","group":"grimm","sourceTitle":"121 The King’s Son Who Feared Nothing (Der Königssohn, der sich vor nichts fürchtet)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap121","lines":[{"zh":"一位不怕危險的王子離家遠行，先遇見巨人，又經過花園和高山的考驗。","py":"yī wèi bù pà wēi xiǎn de wáng zǐ lí jiā yuǎn xíng ， xiān yù jiàn jù rén ， yòu jīng guò huā yuán hé gāo shān de kǎo yàn 。","paragraph":0},{"zh":"他雖然有時受人欺騙，仍不願因挫折停下腳步，最後來到一座受到魔法控制的城堡。","py":"tā suī rán yǒu shí shòu rén qī piàn ， réng bù yuàn yīn cuò zhé tíng xià jiǎo bù ， zuì hòu lái dào yī zuò shòu dào mó fǎ kòng zhì de chéng bǎo 。","paragraph":0},{"zh":"城裏的公主告訴他，要解除魔法，必須在三個夜晚保持沉默，忍受妖怪的折磨。","py":"chéng lǐ de gōng zhǔ gào sù tā ， yào jiě chú mó fǎ ， bì xū zài sān gè yè wǎn bǎo chí chén mò ， rěn shòu yāo guài de zhé mó 。","paragraph":1},{"zh":"王子願意留下，即使第一夜非常難熬，也沒有開口叫喊，更沒有逃走。","py":"wáng zǐ yuàn yì liú xià ， jí shǐ dì yī yè fēi cháng nán áo ， yě méi yǒu kāi kǒu jiào hǎn ， gèng méi yǒu táo zǒu 。","paragraph":1},{"zh":"每天天亮，公主都用生命之水替他治傷，她身上的魔法也隨考驗逐漸消退。","py":"měi tiān tiān liàng ， gōng zhǔ dōu yòng shēng mìng zhī shuǐ tì tā zhì shāng ， tā shēn shàng de mó fǎ yě suí kǎo yàn zhú jiàn xiāo tuì 。","paragraph":2},{"zh":"第三夜最為艱難，王子幾乎失去氣力，仍然守住了約定，直到妖怪離開。","py":"dì sān yè zuì wèi jiān nán ， wáng zǐ jī hū shī qù qì lì ， réng rán shǒu zhù le yuē dìng ， zhí dào yāo guài lí kāi 。","paragraph":2},{"zh":"公主再次用水使他恢復，並請他在樓梯上方揮劍三次。","py":"gōng zhǔ zài cì yòng shuǐ shǐ tā huī fù ， bìng qǐng tā zài lóu tī shàng fāng huī jiàn sān cì 。","paragraph":3},{"zh":"最後一道魔法終於解除，城堡的僕人也重獲自由。","py":"zuì hòu yī dào mó fǎ zhōng yú jiě chú ， chéng bǎo de pú rén yě chóng huò zì yóu 。","paragraph":3},{"zh":"這段遠行以眾人團聚和一場喜慶的婚禮作結。","py":"zhè duàn yuǎn xíng yǐ zhòng rén tuán jù hé yī cháng xǐ qìng de hūn lǐ zuò jié 。","paragraph":3}]},{"id":"grimm-123","paragraphs":["一個女僕跟主人穿越森林時遇上強盜，躲過危險後，卻獨自迷路。天漸漸黑了，她坐在樹下哭泣，一隻白鴿飛來，給她一把能打開樹門的小鑰匙。","樹裏有食物，另一棵樹裏有床，白鴿還替她找到衣服。姑娘靠這些幫助安定下來。過了些日子，白鴿請她到一間小屋，替自己拿回一枚不起眼的戒指。","屋裏有許多漂亮的戒指，姑娘卻記住只找那枚樸素的。她看見老婦人想帶走一個鳥籠，籠中小鳥的嘴裏，正好銜着她要找的戒指，便取了回來。","她在樹下等白鴿，樹枝忽然變成手臂，樹也恢復成王子。原來老婦人是女巫，戒指維持着魔法；如今王子與僕人都獲得自由，姑娘也終於走出了森林。"],"questions":[{"q":"白鴿先給迷路姑娘甚麼幫助？","options":["一袋可怕的石頭","一張王宮的罰單","打開藏有食物的樹的小鑰匙","一匹能飛的馬"],"answer":2,"explanation":"鑰匙讓姑娘得到食物，之後還找到床和衣服。","id":"grimm-123:q0"},{"q":"姑娘被託付尋找哪一枚戒指？","options":["最大顆的鑽石戒指","國王剛戴上的戒指","嵌着十二片羽毛的戒指","不起眼的樸素戒指"],"answer":3,"explanation":"白鴿要的不是最華麗的，而是維持魔法的那枚。","id":"grimm-123:q1"},{"q":"姑娘等待時，身邊的大樹發生了甚麼變化？","options":["飛到月亮上","恢復成一位王子","長出一千顆珍珠","變成一座冰山"],"answer":1,"explanation":"戒指取回後，原本被變成樹的王子重獲人形。","id":"grimm-123:q2"}],"title":"森林裏的老婦人","author":"格林兄弟","group":"grimm","sourceTitle":"123 The Old Woman in the Wood (Die Alte im Wald)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap123","lines":[{"zh":"一個女僕跟主人穿越森林時遇上強盜，躲過危險後，卻獨自迷路。","py":"yí gè nǚ pú gēn zhǔ rén chuān yuè sēn lín shí yù shàng qiáng dào ， duǒ guò wēi xiǎn hòu ， què dú zì mí lù 。","paragraph":0},{"zh":"天漸漸黑了，她坐在樹下哭泣，一隻白鴿飛來，給她一把能打開樹門的小鑰匙。","py":"tiān jiàn jiàn hēi le ， tā zuò zài shù xià kū qì ， yī zhī bái gē fēi lái ， gěi tā yī bǎ néng dǎ kāi shù mén de xiǎo yào shi 。","paragraph":0},{"zh":"樹裏有食物，另一棵樹裏有床，白鴿還替她找到衣服。","py":"shù lǐ yǒu shí wù ， lìng yī kē shù lǐ yǒu chuáng ， bái gē hái tì tā zhǎo dào yī fú 。","paragraph":1},{"zh":"姑娘靠這些幫助安定下來。","py":"gū niang kào zhè xiē bāng zhù ān dìng xià lái 。","paragraph":1},{"zh":"過了些日子，白鴿請她到一間小屋，替自己拿回一枚不起眼的戒指。","py":"guò le xiē rì zi ， bái gē qǐng tā dào yī jiān xiǎo wū ， tì zì jǐ ná huí yī méi bù qǐ yǎn de jiè zhǐ 。","paragraph":1},{"zh":"屋裏有許多漂亮的戒指，姑娘卻記住只找那枚樸素的。","py":"wū lǐ yǒu xǔ duō piào liàng de jiè zhǐ ， gū niang què jì zhù zhǐ zhǎo nà méi pǔ sù de 。","paragraph":2},{"zh":"她看見老婦人想帶走一個鳥籠，籠中小鳥的嘴裏，正好銜着她要找的戒指，便取了回來。","py":"tā kàn jiàn lǎo fù rén xiǎng dài zǒu yí gè niǎo lóng ， lóng zhōng xiǎo niǎo de zuǐ lǐ ， zhèng hǎo xián zhe tā yào zhǎo de jiè zhǐ ， biàn qǔ le huí lái 。","paragraph":2},{"zh":"她在樹下等白鴿，樹枝忽然變成手臂，樹也恢復成王子。","py":"tā zài shù xià děng bái gē ， shù zhī hū rán biàn chéng shǒu bì ， shù yě huī fù chéng wáng zǐ 。","paragraph":3},{"zh":"原來老婦人是女巫，戒指維持着魔法；如今王子與僕人都獲得自由，姑娘也終於走出了森林。","py":"yuán lái lǎo fù rén shì nǚ wū ， jiè zhǐ wéi chí zhe mó fǎ ； rú jīn wáng zǐ yǔ pú rén dōu huò dé zì yóu ， gū niang yě zhōng yú zǒu chū le sēn lín 。","paragraph":3}]},{"id":"grimm-124","paragraphs":["一位父親只有一所祖傳的房子，不知道該留給三個兒子中的誰。他叫兒子們出外學藝，約好回來各顯本領，誰的表現最出色，就把房子交給誰。","三兄弟分別學打鐵、理髮和劍術。回家時，理髮師先替一隻奔跑的兔子剃毛，手法又快又穩，沒有弄傷牠。父親看了，已覺得很難有人勝過這種技藝。","鐵匠接着追上一輛疾行的馬車，在馬匹不停步的情況下換好蹄鐵。最後，下雨了，學劍的兒子揮劍擋雨，雨越大，他的動作越快，身上竟一滴也沒濕。","父親把房子判給學劍的兒子，另外兩人也接受原來的約定。可是兄弟感情很好，並沒有因此分開，而是一起住在屋裏，靠各自學成的手藝維持生活。"],"questions":[{"q":"父親起初讓兒子們出外做甚麼？","options":["替公主送信","捉回三隻烏鴉","各自學一門手藝","尋找三座金山"],"answer":2,"explanation":"他想透過兒子們學成後的表現，決定房子的歸屬。","id":"grimm-124:q0"},{"q":"學劍的兒子怎樣展示本領？","options":["替兔子編一頂帽子","把鐵變成玻璃","揮劍使雨滴落不到身上","把馬車藏進袋子"],"answer":2,"explanation":"他在雨中快速揮劍，雨越大仍能保持乾爽。","id":"grimm-124:q1"},{"q":"房子有了歸屬後，三兄弟怎樣生活？","options":["立刻各自搬到海島","只准勝出的人工作","把房子拆成三條船","仍住在一起，各做自己的手藝"],"answer":3,"explanation":"他們遵守比賽結果，也保留了共同生活的親情。","id":"grimm-124:q2"}],"title":"三個兄弟","author":"格林兄弟","group":"grimm","sourceTitle":"124 The Three Brothers (Die drei Brüder)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap124","lines":[{"zh":"一位父親只有一所祖傳的房子，不知道該留給三個兒子中的誰。","py":"yī wèi fù qīn zhǐ yǒu yī suǒ zǔ chuán de fáng zi ， bù zhī dào gāi liú gěi sān gè ér zi zhōng de shuí 。","paragraph":0},{"zh":"他叫兒子們出外學藝，約好回來各顯本領，誰的表現最出色，就把房子交給誰。","py":"tā jiào ér zi men chū wài xué yì ， yuē hǎo huí lái gè xiǎn běn lǐng ， shéi de biǎo xiàn zuì chū sè ， jiù bǎ fáng zi jiāo gěi shuí 。","paragraph":0},{"zh":"三兄弟分別學打鐵、理髮和劍術。","py":"sān xiōng dì fēn bié xué dǎ tiě 、 lǐ fà hé jiàn shù 。","paragraph":1},{"zh":"回家時，理髮師先替一隻奔跑的兔子剃毛，手法又快又穩，沒有弄傷牠。","py":"huí jiā shí ， lǐ fà shī xiān tì yī zhī bēn pǎo de tù zi tì máo ， shǒu fǎ yòu kuài yòu wěn ， méi yǒu nòng shāng tā 。","paragraph":1},{"zh":"父親看了，已覺得很難有人勝過這種技藝。","py":"fù qīn kàn le ， yǐ jué de hěn nán yǒu rén shèng guò zhè zhǒng jì yì 。","paragraph":1},{"zh":"鐵匠接着追上一輛疾行的馬車，在馬匹不停步的情況下換好蹄鐵。","py":"tiě jiàng jiē zhe zhuī shàng yī liàng jí xíng de mǎ chē ， zài mǎ pǐ bù tíng bù de qíng kuàng xià huàn hǎo tí tiě 。","paragraph":2},{"zh":"最後，下雨了，學劍的兒子揮劍擋雨，雨越大，他的動作越快，身上竟一滴也沒濕。","py":"zuì hòu ， xià yǔ le ， xué jiàn de ér zi huī jiàn dǎng yǔ ， yǔ yuè dà ， tā de dòng zuò yuè kuài ， shēn shàng jìng yī dī yě méi shī 。","paragraph":2},{"zh":"父親把房子判給學劍的兒子，另外兩人也接受原來的約定。","py":"fù qīn bǎ fáng zi pàn gěi xué jiàn de ér zi ， lìng wài liǎng rén yě jiē shòu yuán lái de yuē dìng 。","paragraph":3},{"zh":"可是兄弟感情很好，並沒有因此分開，而是一起住在屋裏，靠各自學成的手藝維持生活。","py":"kě shì xiōng dì gǎn qíng hěn hǎo ， bìng méi yǒu yīn cǐ fēn kāi ， ér shì yì qǐ zhù zài wū lǐ ， kào gè zì xué chéng de shǒu yì wéi chí shēng huó 。","paragraph":3}]},{"id":"grimm-129","paragraphs":["四兄弟出門學藝，在岔路口約定四年後再見。四年過去，他們各有本領：一人善於看清遠方，一人取物不被察覺，一人精於射擊，一人能巧妙縫合東西。","回家後，他們聽說公主被巨龍帶走。善觀遠方的兄弟用望遠鏡找到海島，四人便乘船出發。擅長取物的兄弟趁巨龍熟睡，悄悄把公主帶回船上。","巨龍醒來追趕，獵人準確射中牠，牠落下時卻壓壞了船。大家就要失去立足之地，裁縫趕緊把破裂的船縫好，才讓所有人一起平安返航。","國王十分感激，四兄弟卻開始爭論誰的功勞最大。國王指出，每個人的本領都不可缺少，改以領地分別酬謝。他們接受了，也不必為同一份獎賞繼續爭執。"],"questions":[{"q":"誰先找到公主所在的海島？","options":["公主的廚師","能看清遠方的兄弟","擅長縫合的兄弟","城門口的士兵"],"answer":1,"explanation":"他利用望遠鏡，讓大家知道應該往哪裏尋找。","id":"grimm-129:q0"},{"q":"巨龍落下壓壞船後，誰解決了危險？","options":["裁縫","天文觀察者","國王","父親"],"answer":0,"explanation":"裁縫把破船縫合，大家才有辦法回到岸上。","id":"grimm-129:q1"},{"q":"國王為甚麼分別給四兄弟獎賞？","options":["公主記不起任何人的名字","國王不喜歡望遠鏡","救援需要四種本領共同完成","他們都帶回同樣的金子"],"answer":2,"explanation":"任何一個環節缺失，救援都可能失敗，因此不能只算一人的功勞。","id":"grimm-129:q2"}],"title":"四個巧兄弟","author":"格林兄弟","group":"grimm","sourceTitle":"129 The Four Skilful Brothers (Die vier kunstreichen Brüder)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap129","lines":[{"zh":"四兄弟出門學藝，在岔路口約定四年後再見。","py":"sì xiōng dì chū mén xué yì ， zài chà lù kǒu yuē dìng sì nián hòu zài jiàn 。","paragraph":0},{"zh":"四年過去，他們各有本領：一人善於看清遠方，一人取物不被察覺，一人精於射擊，一人能巧妙縫合東西。","py":"sì nián guò qù ， tā men gè yǒu běn lǐng ： yī rén shàn yú kàn qīng yuǎn fāng ， yī rén qǔ wù bù bèi chá jué ， yī rén jīng yú shè jī ， yī rén néng qiǎo miào féng hé dōng xī 。","paragraph":0},{"zh":"回家後，他們聽說公主被巨龍帶走。","py":"huí jiā hòu ， tā men tīng shuō gōng zhǔ bèi jù lóng dài zǒu 。","paragraph":1},{"zh":"善觀遠方的兄弟用望遠鏡找到海島，四人便乘船出發。","py":"shàn guān yuǎn fāng de xiōng dì yòng wàng yuǎn jìng zhǎo dào hǎi dǎo ， sì rén biàn chéng chuán chū fā 。","paragraph":1},{"zh":"擅長取物的兄弟趁巨龍熟睡，悄悄把公主帶回船上。","py":"shàn cháng qǔ wù de xiōng dì chèn jù lóng shú shuì ， qiāo qiāo bǎ gōng zhǔ dài huí chuán shàng 。","paragraph":1},{"zh":"巨龍醒來追趕，獵人準確射中牠，牠落下時卻壓壞了船。","py":"jù lóng xǐng lái zhuī gǎn ， liè rén zhǔn què shè zhōng tā ， tā là xià shí què yā huài le chuán 。","paragraph":2},{"zh":"大家就要失去立足之地，裁縫趕緊把破裂的船縫好，才讓所有人一起平安返航。","py":"dà jiā jiù yào shī qù lì zú zhī dì ， cái féng gǎn jǐn bǎ pò liè de chuán féng hǎo ， cái ràng suǒ yǒu rén yì qǐ píng ān fǎn háng 。","paragraph":2},{"zh":"國王十分感激，四兄弟卻開始爭論誰的功勞最大。","py":"guó wáng shí fēn gǎn jī ， sì xiōng dì què kāi shǐ zhēng lùn shéi de gōng láo zuì dà 。","paragraph":3},{"zh":"國王指出，每個人的本領都不可缺少，改以領地分別酬謝。","py":"guó wáng zhǐ chū ， měi gè rén de běn lǐng dōu bù kě quē shǎo ， gǎi yǐ lǐng dì fēn bié chóu xiè 。","paragraph":3},{"zh":"他們接受了，也不必為同一份獎賞繼續爭執。","py":"tā men jiē shòu le ， yě bù bì wèi tóng yī fèn jiǎng shǎng jì xù zhēng zhí 。","paragraph":3}]},{"id":"grimm-130","paragraphs":["一個母親有三個女兒，分別長着一隻、兩隻和三隻眼睛。兩隻眼與普通人一樣，卻因此被家人欺負，吃不飽也穿不暖，每天還得帶山羊出去放牧。","一位善良婦人教她念短句，山羊便會變出飯菜。姐姐來偷看時，她唱歌讓姐姐睡着；妹妹三隻眼來時，她忘了第三隻眼，那隻眼便看見了秘密。","山羊被害後，婦人教她把留下的東西埋好，地上長出一棵結金蘋果的銀葉樹。別人摘不到果子，只有兩隻眼能摘，經過的騎士因而注意到她，把她帶離苦日子。","她後來在城堡生活，神奇的樹也跟了過來。多年後，兩個姐妹窮困求助，她認出她們，仍願意接待照顧。姐妹想起從前的欺負，終於真心感到後悔。"],"questions":[{"q":"三隻眼怎樣發現山羊的秘密？","options":["第三隻眼沒有睡着","山羊寫了一封信","騎士把樹搬走了","母親在城門聽見歌聲"],"answer":0,"explanation":"兩隻眼忘了讓第三隻眼睡着，秘密因此被看見。","id":"grimm-130:q0"},{"q":"神奇樹結的是甚麼果子？","options":["金蘋果","銀草莓","玻璃梨子","冰做的橙子"],"answer":0,"explanation":"山羊留下的東西埋下後，長成銀葉金蘋果的樹。","id":"grimm-130:q1"},{"q":"姐妹後來來求助時，兩隻眼怎樣做？","options":["只給每人一片銀葉","認出她們，仍願意照顧","把她們變成山羊","叫她們睡足一百年"],"answer":1,"explanation":"她沒有用從前的欺負報復，反而給了姐妹悔改的機會。","id":"grimm-130:q2"}],"title":"一隻眼、兩隻眼和三隻眼","author":"格林兄弟","group":"grimm","sourceTitle":"130 One-Eye, Two-Eyes, and Three-Eyes (Einäuglein, Zweiäuglein und Dreiäuglein)","sourceUrl":"https://www.gutenberg.org/cache/epub/5314/pg5314-images.html#chap130","lines":[{"zh":"一個母親有三個女兒，分別長着一隻、兩隻和三隻眼睛。","py":"yí gè mǔ qīn yǒu sān gè nǚ ér ， fēn bié zhǎng zhe yī zhī 、 liǎng zhǐ hé sān zhǐ yǎn jīng 。","paragraph":0},{"zh":"兩隻眼與普通人一樣，卻因此被家人欺負，吃不飽也穿不暖，每天還得帶山羊出去放牧。","py":"liǎng zhǐ yǎn yǔ pǔ tōng rén yī yàng ， què yīn cǐ bèi jiā rén qī fù ， chī bù bǎo yě chuān bù nuǎn ， měi tiān hái děi dài shān yáng chū qù fàng mù 。","paragraph":0},{"zh":"一位善良婦人教她念短句，山羊便會變出飯菜。","py":"yī wèi shàn liáng fù rén jiāo tā niàn duǎn jù ， shān yáng biàn huì biàn chū fàn cài 。","paragraph":1},{"zh":"姐姐來偷看時，她唱歌讓姐姐睡着；妹妹三隻眼來時，她忘了第三隻眼，那隻眼便看見了秘密。","py":"jiě jiě lái tōu kàn shí ， tā chàng gē ràng jiě jiě shuì zháo ； mèi mèi sān zhǐ yǎn lái shí ， tā wàng le dì sān zhǐ yǎn ， nà zhǐ yǎn biàn kàn jiàn le mì mì 。","paragraph":1},{"zh":"山羊被害後，婦人教她把留下的東西埋好，地上長出一棵結金蘋果的銀葉樹。","py":"shān yáng bèi hài hòu ， fù rén jiāo tā bǎ liú xià de dōng xī mái hǎo ， dì shàng zhǎng chū yī kē jiē jīn píng guǒ de yín yè shù 。","paragraph":2},{"zh":"別人摘不到果子，只有兩隻眼能摘，經過的騎士因而注意到她，把她帶離苦日子。","py":"bié rén zhāi bú dào guǒ zi ， zhǐ yǒu liǎng zhǐ yǎn néng zhāi ， jīng guò de qí shì yīn ér zhù yì dào tā ， bǎ tā dài lí kǔ rì zi 。","paragraph":2},{"zh":"她後來在城堡生活，神奇的樹也跟了過來。","py":"tā hòu lái zài chéng bǎo shēng huó ， shén qí de shù yě gēn le guò lái 。","paragraph":3},{"zh":"多年後，兩個姐妹窮困求助，她認出她們，仍願意接待照顧。","py":"duō nián hòu ， liǎng gè jiě mèi qióng kùn qiú zhù ， tā rèn chū tā men ， réng yuàn yì jiē dài zhào gù 。","paragraph":3},{"zh":"姐妹想起從前的欺負，終於真心感到後悔。","py":"jiě mèi xiǎng qǐ cóng qián de qī fù ， zhōng yú zhēn xīn gǎn dào hòu huǐ 。","paragraph":3}]},{"id":"andersen-emperor","paragraphs":["皇帝最愛漂亮衣服，常把心思和金錢花在新裝上。兩個騙子來到城裏，聲稱能織出神奇布料，只有聰明而且稱職的人，才看得見它的花紋。","他們坐在空織機前裝忙，把真正的材料偷偷收起。大臣來看，明明甚麼也看不見，卻怕別人認為自己愚蠢失職，只好大力稱讚，還把假話帶回宮裏。","皇帝親自去看，也同樣看不見。他不願承認，便讓騙子替自己穿上不存在的新衣，走到街上遊行。大人們怕被嘲笑，紛紛說衣服漂亮，連拖着衣尾的侍從也繼續裝樣。","只有一個孩子說出眼前的事實：皇帝甚麼也沒有穿。話傳開後，群眾終於跟着承認。皇帝雖然心裏不安，仍硬着頭皮走完遊行，騙局卻再也藏不住了。"],"questions":[{"q":"騙子說甚麼人才能看見神奇布料？","options":["住在海底的人","有三隻眼的人","聰明而且稱職的人","穿紅鞋的人"],"answer":2,"explanation":"這個說法使看不見的人害怕承認實情。","id":"andersen-emperor:q0"},{"q":"大臣為甚麼稱讚空織機上的布？","options":["孩子要求他這樣說","怕被認為愚蠢或失職","真的摸到了柔軟布料","皇帝先送了他一件新衣"],"answer":1,"explanation":"他的恐懼使他跟着騙子說假話。","id":"andersen-emperor:q1"},{"q":"誰先公開指出皇帝沒穿衣服？","options":["一個孩子","帶頭的大臣","兩個騙子","抬衣尾的侍從"],"answer":0,"explanation":"孩子沒有附和眾人的稱讚，直接說出看見的情況。","id":"andersen-emperor:q2"}],"title":"皇帝的新衣","author":"安徒生","group":"andersen","sourceTitle":"The Emperor's New Suit","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#emperor","lines":[{"zh":"皇帝最愛漂亮衣服，常把心思和金錢花在新裝上。","py":"huáng dì zuì ài piào liàng yī fú ， cháng bǎ xīn sī hé jīn qián huā zài xīn zhuāng shàng 。","paragraph":0},{"zh":"兩個騙子來到城裏，聲稱能織出神奇布料，只有聰明而且稱職的人，才看得見它的花紋。","py":"liǎng gè piàn zi lái dào chéng lǐ ， shēng chēng néng zhī chū shén qí bù liào ， zhǐ yǒu cōng míng ér qiě chèn zhí de rén ， cái kàn de jiàn tā de huā wén 。","paragraph":0},{"zh":"他們坐在空織機前裝忙，把真正的材料偷偷收起。","py":"tā men zuò zài kōng zhī jī qián zhuāng máng ， bǎ zhēn zhèng de cái liào tōu tōu shōu qǐ 。","paragraph":1},{"zh":"大臣來看，明明甚麼也看不見，卻怕別人認為自己愚蠢失職，只好大力稱讚，還把假話帶回宮裏。","py":"dà chén lái kàn ， míng míng shén me yě kàn bú jiàn ， què pà bié rén rèn wéi zì jǐ yú chǔn shī zhí ， zhǐ hǎo dà lì chēng zàn ， hái bǎ jiǎ huà dài huí gōng lǐ 。","paragraph":1},{"zh":"皇帝親自去看，也同樣看不見。","py":"huáng dì qīn zì qù kàn ， yě tóng yàng kàn bú jiàn 。","paragraph":2},{"zh":"他不願承認，便讓騙子替自己穿上不存在的新衣，走到街上遊行。","py":"tā bù yuàn chéng rèn ， biàn ràng piàn zi tì zì jǐ chuān shàng bù cún zài de xīn yī ， zǒu dào jiē shàng yóu xíng 。","paragraph":2},{"zh":"大人們怕被嘲笑，紛紛說衣服漂亮，連拖着衣尾的侍從也繼續裝樣。","py":"dà rén men pà bèi cháo xiào ， fēn fēn shuō yī fú piào liàng ， lián tuō zhe yī wěi de shì cóng yě jì xù zhuāng yàng 。","paragraph":2},{"zh":"只有一個孩子說出眼前的事實：皇帝甚麼也沒有穿。","py":"zhǐ yǒu yí gè hái zi shuō chū yǎn qián de shì shí ： huáng dì shén me yě méi yǒu chuān 。","paragraph":3},{"zh":"話傳開後，群眾終於跟着承認。","py":"huà chuán kāi hòu ， qún zhòng zhōng yú gēn zhe chéng rèn 。","paragraph":3},{"zh":"皇帝雖然心裏不安，仍硬着頭皮走完遊行，騙局卻再也藏不住了。","py":"huáng dì suī rán xīn lǐ bù ān ， réng yìng zhe tóu pí zǒu wán yóu xíng ， piàn jú què zài yě cáng bú zhù le 。","paragraph":3}]},{"id":"andersen-snow_que","paragraphs":["凱伊和格爾達本來是親密的朋友，一起照顧窗邊的玫瑰。邪惡鏡子的碎片進入凱伊的眼睛和心，他開始只看見缺點，心也變得冷漠，最後被冰雪女王帶走。","格爾達沒有忘記朋友，獨自出發尋找。她經過會使人忘記事情的花園，遇見烏鴉、王子公主和小強盜姑娘，得到許多幫助，終於由馴鹿帶往北方。","冰宮裏，凱伊忙着拼排冰塊，幾乎認不出她。格爾達抱着他哭泣，溫暖的眼淚進入他的心，融化冰冷的力量；凱伊也流淚，眼中的鏡片隨之離開。","朋友重新相認，一起離開空蕩的冰宮，踏上回家的路。當他們再次坐在祖母身旁，窗外玫瑰盛開，兩人雖然已經長大，仍珍惜那份沒有被冰雪帶走的童心。"],"questions":[{"q":"凱伊變得冷漠的直接原因是甚麼？","options":["被馴鹿撞倒","忘了替玫瑰澆水","魔鏡碎片進入眼睛和心","吃了太多金蘋果"],"answer":2,"explanation":"碎片改變了他看事物的方式，也使心變冷。","id":"andersen-snow_que:q0"},{"q":"最後帶格爾達前往北方的動物是甚麼？","options":["公雞","山羊","熊","馴鹿"],"answer":3,"explanation":"她在旅途中得到馴鹿幫助，向冰雪女王的地方前進。","id":"andersen-snow_que:q1"},{"q":"甚麼使凱伊冰冷的心恢復？","options":["一件新的毛皮大衣","女王送來的王冠","從城堡搬來的火爐","格爾達溫暖的眼淚"],"answer":3,"explanation":"格爾達的眼淚融化心中的冰，凱伊也因此重新流淚。","id":"andersen-snow_que:q2"}],"title":"冰雪女王","author":"安徒生","group":"andersen","sourceTitle":"The Snow Queen","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#snow_que","lines":[{"zh":"凱伊和格爾達本來是親密的朋友，一起照顧窗邊的玫瑰。","py":"kǎi yī hé gé ěr dá běn lái shì qīn mì de péng yǒu ， yì qǐ zhào gù chuāng biān de méi guī 。","paragraph":0},{"zh":"邪惡鏡子的碎片進入凱伊的眼睛和心，他開始只看見缺點，心也變得冷漠，最後被冰雪女王帶走。","py":"xié è jìng zi de suì piàn jìn rù kǎi yī de yǎn jīng hé xīn ， tā kāi shǐ zhǐ kàn jiàn quē diǎn ， xīn yě biàn de lěng mò ， zuì hòu bèi bīng xuě nǚ wáng dài zǒu 。","paragraph":0},{"zh":"格爾達沒有忘記朋友，獨自出發尋找。","py":"gé ěr dá méi yǒu wàng jì péng yǒu ， dú zì chū fā xún zhǎo 。","paragraph":1},{"zh":"她經過會使人忘記事情的花園，遇見烏鴉、王子公主和小強盜姑娘，得到許多幫助，終於由馴鹿帶往北方。","py":"tā jīng guò huì shǐ rén wàng jì shì qíng de huā yuán ， yù jiàn wū yā 、 wáng zǐ gōng zhǔ hé xiǎo qiáng dào gū niang ， dé dào xǔ duō bāng zhù ， zhōng yú yóu xùn lù dài wǎng běi fāng 。","paragraph":1},{"zh":"冰宮裏，凱伊忙着拼排冰塊，幾乎認不出她。","py":"bīng gōng lǐ ， kǎi yī máng zhe pīn pái bīng kuài ， jī hū rèn bù chū tā 。","paragraph":2},{"zh":"格爾達抱着他哭泣，溫暖的眼淚進入他的心，融化冰冷的力量；凱伊也流淚，眼中的鏡片隨之離開。","py":"gé ěr dá bào zhe tā kū qì ， wēn nuǎn de yǎn lèi jìn rù tā de xīn ， róng huà bīng lěng de lì liàng ； kǎi yī yě liú lèi ， yǎn zhōng de jìng piàn suí zhī lí kāi 。","paragraph":2},{"zh":"朋友重新相認，一起離開空蕩的冰宮，踏上回家的路。","py":"péng yǒu chóng xīn xiāng rèn ， yì qǐ lí kāi kōng dàng de bīng gōng ， tà shàng huí jiā de lù 。","paragraph":3},{"zh":"當他們再次坐在祖母身旁，窗外玫瑰盛開，兩人雖然已經長大，仍珍惜那份沒有被冰雪帶走的童心。","py":"dāng tā men zài cì zuò zài zǔ mǔ shēn páng ， chuāng wài méi guī shèng kāi ， liǎng rén suī rán yǐ jīng zhǎng dà ， réng zhēn xī nà fèn méi yǒu bèi bīng xuě dài zǒu de tóng xīn 。","paragraph":3}]},{"id":"andersen-ugly_duc","paragraphs":["鴨媽媽孵出一群小鴨，最後一個蛋裏的孩子卻又大又灰，和其他小鴨很不一樣。院子裏的動物嘲笑他，連身邊的同伴也排斥他，使他只好獨自離開。","他在沼澤、小屋和水邊流浪，始終找不到安心的地方。有一回，他看見一群美麗的天鵝飛過，心裏十分嚮往，卻不知道自己為甚麼會對牠們有這樣深的感受。","寒冬使水面結冰，他幾乎撐不下去，幸好有人救起他。春天來了，他長出有力的翅膀，再次看見天鵝，決定靠近，即使仍害怕受到拒絕。","他低頭望向水面，才看見自己的倒影已是一隻白天鵝。天鵝們歡迎他，孩子們也稱讚他。他沒有因此驕傲，只為終於找到同伴和真正的自己而感到幸福。"],"questions":[{"q":"醜小鴨為甚麼離開原來的院子？","options":["要把王冠送到海島","受到其他動物嘲笑和排斥","想替國王尋找新衣","被派去學習打鐵"],"answer":1,"explanation":"他在院子裏得不到接納，只能到外面尋找容身之處。","id":"andersen-ugly_duc:q0"},{"q":"流浪時，哪一種鳥讓他特別嚮往？","options":["烏鴉","公雞","麻雀","天鵝"],"answer":3,"explanation":"美麗天鵝飛過的景象，使他產生了深刻的感受。","id":"andersen-ugly_duc:q1"},{"q":"春天水中的倒影讓他明白甚麼？","options":["自己原來是一隻天鵝","湖水都變成了鏡子","每隻鴨都會變白","冬天永遠不會再來"],"answer":0,"explanation":"他的身份並沒有因從前被叫作醜小鴨而改變。","id":"andersen-ugly_duc:q2"}],"title":"醜小鴨","author":"安徒生","group":"andersen","sourceTitle":"The Ugly Duckling","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#ugly_duc","lines":[{"zh":"鴨媽媽孵出一群小鴨，最後一個蛋裏的孩子卻又大又灰，和其他小鴨很不一樣。","py":"yā mā mā fū chū yī qún xiǎo yā ， zuì hòu yí gè dàn lǐ de hái zi què yòu dà yòu huī ， hé qí tā xiǎo yā hěn bù yí yàng 。","paragraph":0},{"zh":"院子裏的動物嘲笑他，連身邊的同伴也排斥他，使他只好獨自離開。","py":"yuàn zi lǐ de dòng wù cháo xiào tā ， lián shēn biān de tóng bàn yě pái chì tā ， shǐ tā zhǐ hǎo dú zì lí kāi 。","paragraph":0},{"zh":"他在沼澤、小屋和水邊流浪，始終找不到安心的地方。","py":"tā zài zhǎo zé 、 xiǎo wū hé shuǐ biān liú làng ， shǐ zhōng zhǎo bú dào ān xīn de dì fāng 。","paragraph":1},{"zh":"有一回，他看見一群美麗的天鵝飛過，心裏十分嚮往，卻不知道自己為甚麼會對牠們有這樣深的感受。","py":"yǒu yī huí ， tā kàn jiàn yī qún měi lì de tiān é fēi guò ， xīn lǐ shí fēn xiàng wǎng ， què bù zhī dào zì jǐ wèi shén me huì duì tā men yǒu zhè yàng shēn de gǎn shòu 。","paragraph":1},{"zh":"寒冬使水面結冰，他幾乎撐不下去，幸好有人救起他。","py":"hán dōng shǐ shuǐ miàn jié bīng ， tā jī hū chēng bù xià qù ， xìng hǎo yǒu rén jiù qǐ tā 。","paragraph":2},{"zh":"春天來了，他長出有力的翅膀，再次看見天鵝，決定靠近，即使仍害怕受到拒絕。","py":"chūn tiān lái le ， tā zhǎng chū yǒu lì de chì bǎng ， zài cì kàn jiàn tiān é ， jué dìng kào jìn ， jí shǐ réng hài pà shòu dào jù jué 。","paragraph":2},{"zh":"他低頭望向水面，才看見自己的倒影已是一隻白天鵝。","py":"tā dī tóu wàng xiàng shuǐ miàn ， cái kàn jiàn zì jǐ de dào yǐng yǐ shì yī zhī bái tiān é 。","paragraph":3},{"zh":"天鵝們歡迎他，孩子們也稱讚他。","py":"tiān é men huān yíng tā ， hái zi men yě chēng zàn tā 。","paragraph":3},{"zh":"他沒有因此驕傲，只為終於找到同伴和真正的自己而感到幸福。","py":"tā méi yǒu yīn cǐ jiāo ào ， zhǐ wèi zhōng yú zhǎo dào tóng bàn hé zhēn zhèng de zì jǐ ér gǎn dào xìng fú 。","paragraph":3}]},{"id":"andersen-li_match","paragraphs":["除夕的街頭又黑又冷，一個小女孩赤着腳賣火柴。整天沒有人向她買，也沒有人給她食物。她不敢空手回家，只好縮在兩所房子之間，想避一避風雪。","她擦亮一根火柴，微小的火光讓她想像眼前有一座溫暖的火爐。火柴熄滅，火爐也消失了；再擦一根，她又看見豐盛的烤鵝，好像食物正向她走來。","接着，她看見明亮的聖誕樹，還有已去世、曾經疼愛她的祖母。她怕祖母也隨火光消失，便急忙點亮剩下的火柴，在想像中被祖母溫柔地抱起。","清晨，人們發現她在寒夜裏離世，身旁留下燒過的火柴。他們只知道她曾想取暖，卻不知道她看見的願望。故事留下悲傷，也提醒讀者看見身邊受凍挨餓的人。"],"questions":[{"q":"女孩起初為甚麼不敢回家？","options":["忘了家中的咒語","想等待王宮的馬車","被白鴿帶錯了方向","沒有賣出火柴，也沒有賺到錢"],"answer":3,"explanation":"她整天空手而歸，害怕回去，因此留在寒冷街頭。","id":"andersen-li_match:q0"},{"q":"第一根火柴的亮光讓她想像看見甚麼？","options":["高塔上的長髮","一隻會跳舞的熊","溫暖的火爐","裝滿金子的船"],"answer":2,"explanation":"最先出現的幻象，回應了她當時最迫切的寒冷。","id":"andersen-li_match:q1"},{"q":"女孩為甚麼把剩下的火柴一起點亮？","options":["答應替商人測試火柴","想讓祖母繼續留在眼前","要替皇帝照亮新衣","想把雪全部融化"],"answer":1,"explanation":"她不願疼愛自己的祖母像先前的幻象一樣消失。","id":"andersen-li_match:q2"}],"title":"賣火柴的小女孩","author":"安徒生","group":"andersen","sourceTitle":"The Little Match-seller","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#li_match","lines":[{"zh":"除夕的街頭又黑又冷，一個小女孩赤着腳賣火柴。","py":"chú xī de jiē tóu yòu hēi yòu lěng ， yí gè xiǎo nǚ hái chì zhe jiǎo mài huǒ chái 。","paragraph":0},{"zh":"整天沒有人向她買，也沒有人給她食物。","py":"zhěng tiān méi yǒu rén xiàng tā mǎi ， yě méi yǒu rén gěi tā shí wù 。","paragraph":0},{"zh":"她不敢空手回家，只好縮在兩所房子之間，想避一避風雪。","py":"tā bù gǎn kōng shǒu huí jiā ， zhǐ hǎo suō zài liǎng suǒ fáng zi zhī jiān ， xiǎng bì yī bì fēng xuě 。","paragraph":0},{"zh":"她擦亮一根火柴，微小的火光讓她想像眼前有一座溫暖的火爐。","py":"tā cā liàng yī gēn huǒ chái ， wēi xiǎo de huǒ guāng ràng tā xiǎng xiàng yǎn qián yǒu yī zuò wēn nuǎn de huǒ lú 。","paragraph":1},{"zh":"火柴熄滅，火爐也消失了；再擦一根，她又看見豐盛的烤鵝，好像食物正向她走來。","py":"huǒ chái xī miè ， huǒ lú yě xiāo shī le ； zài cā yī gēn ， tā yòu kàn jiàn fēng shèng de kǎo é ， hǎo xiàng shí wù zhèng xiàng tā zǒu lái 。","paragraph":1},{"zh":"接着，她看見明亮的聖誕樹，還有已去世、曾經疼愛她的祖母。","py":"jiē zhe ， tā kàn jiàn míng liàng de shèng dàn shù ， hái yǒu yǐ qù shì 、 céng jīng téng ài tā de zǔ mǔ 。","paragraph":2},{"zh":"她怕祖母也隨火光消失，便急忙點亮剩下的火柴，在想像中被祖母溫柔地抱起。","py":"tā pà zǔ mǔ yě suí huǒ guāng xiāo shī ， biàn jí máng diǎn liàng shèng xià de huǒ chái ， zài xiǎng xiàng zhōng bèi zǔ mǔ wēn róu dì bào qǐ 。","paragraph":2},{"zh":"清晨，人們發現她在寒夜裏離世，身旁留下燒過的火柴。","py":"qīng chén ， rén men fā xiàn tā zài hán yè lǐ lí shì ， shēn páng liú xià shāo guò de huǒ chái 。","paragraph":3},{"zh":"他們只知道她曾想取暖，卻不知道她看見的願望。","py":"tā men zhǐ zhī dào tā céng xiǎng qǔ nuǎn ， què bù zhī dào tā kàn jiàn de yuàn wàng 。","paragraph":3},{"zh":"故事留下悲傷，也提醒讀者看見身邊受凍挨餓的人。","py":"gù shì liú xià bēi shāng ， yě tí xǐng dú zhě kàn jiàn shēn biān shòu dòng ái è de rén 。","paragraph":3}]},{"id":"andersen-li_merma","paragraphs":["小人魚住在海底，嚮往海面上的世界。十五歲那年，她游上水面，看見一艘船在暴風雨中遇險，救起落海的王子，卻沒能讓醒來的他知道救命的人是誰。","她向海巫婆求助，以美妙的聲音換來雙腿。每走一步都很疼，她仍來到王子身邊，卻因不能說話，無法解釋海上的經過，也不能讓王子明白自己的心意。","王子後來與另一位公主成婚。姐姐們拿來一把刀，說只要傷害王子，小人魚就能重返大海。她看着熟睡的王子，終究不肯為了自己活下去而傷害他。","天亮前，她把刀拋入海中，自己也躍向波浪，身體化成泡沫。故事接着讓她成為空氣的女兒，走上一條以善行尋求靈魂的道路，留下溫柔而悲傷的結局。"],"questions":[{"q":"小人魚用甚麼交換雙腿？","options":["海王的王冠","姐姐們的戒指","一艘金色小船","自己的聲音"],"answer":3,"explanation":"海巫婆收走她的聲音，使她無法向王子說明往事。","id":"andersen-li_merma:q0"},{"q":"小人魚最初怎樣與王子相遇？","options":["在冰宮裏拼冰塊","暴風雨中救起落海的他","在森林向他借宿","一起參加紡紗比賽"],"answer":1,"explanation":"她先在海難中救了王子，之後才想來到人間。","id":"andersen-li_merma:q1"},{"q":"面對姐姐們帶來的刀，她最後怎樣選擇？","options":["用刀打開一個金蛋","命王子跳進深海","拒絕傷害王子，把刀拋進海裏","把刀交給皇帝換新衣"],"answer":2,"explanation":"她沒有用另一個人的生命交換自己的出路。","id":"andersen-li_merma:q2"}],"title":"海的女兒","author":"安徒生","group":"andersen","sourceTitle":"The Little Mermaid","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#li_merma","lines":[{"zh":"小人魚住在海底，嚮往海面上的世界。","py":"xiǎo rén yú zhù zài hǎi dǐ ， xiàng wǎng hǎi miàn shàng de shì jiè 。","paragraph":0},{"zh":"十五歲那年，她游上水面，看見一艘船在暴風雨中遇險，救起落海的王子，卻沒能讓醒來的他知道救命的人是誰。","py":"shí wǔ suì nà nián ， tā yóu shàng shuǐ miàn ， kàn jiàn yì sōu chuán zài bào fēng yǔ zhōng yù xiǎn ， jiù qǐ luò hǎi de wáng zǐ ， què méi néng ràng xǐng lái de tā zhī dào jiù mìng de rén shì shuí 。","paragraph":0},{"zh":"她向海巫婆求助，以美妙的聲音換來雙腿。","py":"tā xiàng hǎi wū pó qiú zhù ， yǐ měi miào de shēng yīn huàn lái shuāng tuǐ 。","paragraph":1},{"zh":"每走一步都很疼，她仍來到王子身邊，卻因不能說話，無法解釋海上的經過，也不能讓王子明白自己的心意。","py":"měi zǒu yī bù dōu hěn téng ， tā réng lái dào wáng zǐ shēn biān ， què yīn bù néng shuō huà ， wú fǎ jiě shì hǎi shàng de jīng guò ， yě bù néng ràng wáng zǐ míng bái zì jǐ de xīn yì 。","paragraph":1},{"zh":"王子後來與另一位公主成婚。","py":"wáng zǐ hòu lái yǔ lìng yī wèi gōng zhǔ chéng hūn 。","paragraph":2},{"zh":"姐姐們拿來一把刀，說只要傷害王子，小人魚就能重返大海。","py":"jiě jiě men ná lái yī bǎ dāo ， shuō zhǐ yào shāng hài wáng zǐ ， xiǎo rén yú jiù néng chóng fǎn dà hǎi 。","paragraph":2},{"zh":"她看着熟睡的王子，終究不肯為了自己活下去而傷害他。","py":"tā kàn zhe shú shuì de wáng zǐ ， zhōng jiū bù kěn wèi le zì jǐ huó xià qù ér shāng hài tā 。","paragraph":2},{"zh":"天亮前，她把刀拋入海中，自己也躍向波浪，身體化成泡沫。","py":"tiān liàng qián ， tā bǎ dāo pāo rù hǎi zhōng ， zì jǐ yě yuè xiàng bō làng ， shēn tǐ huà chéng pào mò 。","paragraph":3},{"zh":"故事接着讓她成為空氣的女兒，走上一條以善行尋求靈魂的道路，留下溫柔而悲傷的結局。","py":"gù shì jiē zhe ràng tā chéng wéi kōng qì de nǚ ér ， zǒu shàng yī tiáo yǐ shàn xíng xún qiú líng hún de dào lù ， liú xià wēn róu ér bēi shāng de jié jú 。","paragraph":3}]},{"id":"andersen-li_tiny","paragraphs":["一位婦人種下一顆特別的穀粒，花開時，花心坐着一個只有拇指大小的女孩。她用胡桃殼作床，過着小巧的生活，卻被一隻蟾蜍帶走，想讓她嫁給自己的兒子。","小魚咬斷荷葉的莖，幫她逃走。經過夏天的漂流與冬天的寒冷，她借住田鼠家。田鼠替她安排與鼴鼠成婚，可她不願一輩子住在看不見陽光的地底。","在地道裏，她發現一隻被當成死去的燕子，偷偷照料牠，直到牠恢復。婚期將近時，燕子回來，願意帶她離開；她坐上燕子的背，飛向溫暖的地方。","花叢中住着和她一樣小的人，花王子歡迎她，她也終於有了自己願意選擇的家。大家送她一對小翅膀，讓她能在花與花之間自由飛翔，不再只是被別人帶走。"],"questions":[{"q":"拇指姑娘最初從哪裏出現？","options":["一朵花的花心","一枚銀戒指裏","一口枯井底","一塊冰的中央"],"answer":0,"explanation":"婦人種下特別的穀粒，開花後才看見小女孩。","id":"andersen-li_tiny:q0"},{"q":"拇指姑娘在地道裏照顧了哪種鳥？","options":["貓頭鷹","夜鶯","燕子","公雞"],"answer":2,"explanation":"她偷偷救護受傷的燕子，後來也得到燕子的幫助。","id":"andersen-li_tiny:q1"},{"q":"她為甚麼不願嫁給鼴鼠？","options":["不願永遠住在沒有陽光的地底","鼴鼠沒有一座金城堡","她不會替鼴鼠紡金線","田鼠不肯讓她吃飯"],"answer":0,"explanation":"她嚮往花與陽光，地下的生活並非自己的選擇。","id":"andersen-li_tiny:q2"}],"title":"拇指姑娘","author":"安徒生","group":"andersen","sourceTitle":"Little Tiny or Thumbelina","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#li_tiny","lines":[{"zh":"一位婦人種下一顆特別的穀粒，花開時，花心坐着一個只有拇指大小的女孩。","py":"yī wèi fù rén zhòng xià yī kē tè bié de gǔ lì ， huā kāi shí ， huā xīn zuò zhe yí gè zhǐ yǒu mǔ zhǐ dà xiǎo de nǚ hái 。","paragraph":0},{"zh":"她用胡桃殼作床，過着小巧的生活，卻被一隻蟾蜍帶走，想讓她嫁給自己的兒子。","py":"tā yòng hú táo ké zuò chuáng ， guò zhe xiǎo qiǎo de shēng huó ， què bèi yī zhī chán chú dài zǒu ， xiǎng ràng tā jià gěi zì jǐ de ér zi 。","paragraph":0},{"zh":"小魚咬斷荷葉的莖，幫她逃走。","py":"xiǎo yú yǎo duàn hé yè de jīng ， bāng tā táo zǒu 。","paragraph":1},{"zh":"經過夏天的漂流與冬天的寒冷，她借住田鼠家。","py":"jīng guò xià tiān de piāo liú yǔ dōng tiān de hán lěng ， tā jiè zhù tián shǔ jiā 。","paragraph":1},{"zh":"田鼠替她安排與鼴鼠成婚，可她不願一輩子住在看不見陽光的地底。","py":"tián shǔ tì tā ān pái yǔ yǎn shǔ chéng hūn ， kě tā bù yuàn yī bèi zi zhù zài kàn bú jiàn yáng guāng de dì dǐ 。","paragraph":1},{"zh":"在地道裏，她發現一隻被當成死去的燕子，偷偷照料牠，直到牠恢復。","py":"zài dì dào lǐ ， tā fā xiàn yī zhī bèi dàng chéng sǐ qù de yàn zi ， tōu tōu zhào liào tā ， zhí dào tā huī fù 。","paragraph":2},{"zh":"婚期將近時，燕子回來，願意帶她離開；她坐上燕子的背，飛向溫暖的地方。","py":"hūn qī jiāng jìn shí ， yàn zi huí lái ， yuàn yì dài tā lí kāi ； tā zuò shàng yàn zi de bèi ， fēi xiàng wēn nuǎn de dì fāng 。","paragraph":2},{"zh":"花叢中住着和她一樣小的人，花王子歡迎她，她也終於有了自己願意選擇的家。","py":"huā cóng zhōng zhù zhe hé tā yī yàng xiǎo de rén ， huā wáng zǐ huān yíng tā ， tā yě zhōng yú yǒu le zì jǐ yuàn yì xuǎn zé de jiā 。","paragraph":3},{"zh":"大家送她一對小翅膀，讓她能在花與花之間自由飛翔，不再只是被別人帶走。","py":"dà jiā sòng tā yī duì xiǎo chì bǎng ， ràng tā néng zài huā yǔ huā zhī jiān zì yóu fēi xiáng ， bù zài zhǐ shì bèi bié rén dài zǒu 。","paragraph":3}]},{"id":"andersen-tin_sold","paragraphs":["一盒錫兵中，最後鑄成的那個只有一條腿，仍穩穩站着。他看見紙城堡旁的舞者舉起一條腿，便以為她也與自己相同，從此默默喜歡上了她。","錫兵從窗台跌到街上，被孩子放進紙船。雨水推着船穿過溝渠，水越來越急，紙船終於散開，他沉進水裏，又被一條魚吞下，四周一下變得漆黑。","魚被捕到市場，買回家後，廚師剖開魚腹，竟把錫兵帶回原來的房間。他又看見紙舞者，仍像出發前那樣站着，彷彿漫長的漂流只隔着一瞬間。","可是孩子忽然把他丟進火爐，風又把紙舞者吹到他身旁。錫兵漸漸熔化，始終沒有倒下。第二天，灰燼裏留下了一顆錫做的小心，紙舞者的裝飾也被火燒黑。"],"questions":[{"q":"錫兵為甚麼特別注意紙舞者？","options":["她替他修好了槍","她答應帶他去海底","她和他有相同的名字","以為她也只有一條腿"],"answer":3,"explanation":"舞者舉起另一條腿，讓錫兵以為她與自己相似。","id":"andersen-tin_sold:q0"},{"q":"錫兵怎樣從水裏回到原來的房間？","options":["吞下他的魚被買回並剖開","紙船自行飛回窗台","公主用金髮把他拉起","他騎着一隻貓回家"],"answer":0,"explanation":"一連串偶然，使被魚吞下的錫兵重新回到家中。","id":"andersen-tin_sold:q1"},{"q":"火熄後，錫兵留下甚麼形狀？","options":["一枚金色王冠","一把銀色鑰匙","一片玻璃羽毛","一顆小小的錫心"],"answer":3,"explanation":"他的身體熔化後，灰裏留下心形的錫塊。","id":"andersen-tin_sold:q2"}],"title":"堅定的錫兵","author":"安徒生","group":"andersen","sourceTitle":"The Brave Tin Soldier","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#tin_sold","lines":[{"zh":"一盒錫兵中，最後鑄成的那個只有一條腿，仍穩穩站着。","py":"yī hé xī bīng zhōng ， zuì hòu zhù chéng de nà ge zhǐ yǒu yī tiáo tuǐ ， réng wěn wěn zhàn zhe 。","paragraph":0},{"zh":"他看見紙城堡旁的舞者舉起一條腿，便以為她也與自己相同，從此默默喜歡上了她。","py":"tā kàn jiàn zhǐ chéng bǎo páng de wǔ zhě jǔ qǐ yī tiáo tuǐ ， biàn yǐ wéi tā yě yǔ zì jǐ xiāng tóng ， cóng cǐ mò mò xǐ huān shàng le tā 。","paragraph":0},{"zh":"錫兵從窗台跌到街上，被孩子放進紙船。","py":"xī bīng cóng chuāng tái diē dào jiē shàng ， bèi hái zi fàng jìn zhǐ chuán 。","paragraph":1},{"zh":"雨水推着船穿過溝渠，水越來越急，紙船終於散開，他沉進水裏，又被一條魚吞下，四周一下變得漆黑。","py":"yǔ shuǐ tuī zhe chuán chuān guò gōu qú ， shuǐ yuè lái yuè jí ， zhǐ chuán zhōng yú sàn kāi ， tā chén jìn shuǐ lǐ ， yòu bèi yī tiáo yú tūn xià ， sì zhōu yī xià biàn de qī hēi 。","paragraph":1},{"zh":"魚被捕到市場，買回家後，廚師剖開魚腹，竟把錫兵帶回原來的房間。","py":"yú bèi bǔ dào shì chǎng ， mǎi huí jiā hòu ， chú shī pōu kāi yú fù ， jìng bǎ xī bīng dài huí yuán lái de fáng jiān 。","paragraph":2},{"zh":"他又看見紙舞者，仍像出發前那樣站着，彷彿漫長的漂流只隔着一瞬間。","py":"tā yòu kàn jiàn zhǐ wǔ zhě ， réng xiàng chū fā qián nà yàng zhàn zhe ， fǎng fú màn cháng de piāo liú zhǐ gé zhe yī shùn jiān 。","paragraph":2},{"zh":"可是孩子忽然把他丟進火爐，風又把紙舞者吹到他身旁。","py":"kě shì hái zi hū rán bǎ tā diū jìn huǒ lú ， fēng yòu bǎ zhǐ wǔ zhě chuī dào tā shēn páng 。","paragraph":3},{"zh":"錫兵漸漸熔化，始終沒有倒下。","py":"xī bīng jiàn jiàn róng huà ， shǐ zhōng méi yǒu dǎo xià 。","paragraph":3},{"zh":"第二天，灰燼裏留下了一顆錫做的小心，紙舞者的裝飾也被火燒黑。","py":"dì èr tiān ， huī jìn lǐ liú xià le yī kē xī zuò de xiǎo xīn ， zhǐ wǔ zhě de zhuāng shì yě bèi huǒ shāo hēi 。","paragraph":3}]},{"id":"andersen-wild_swa","paragraphs":["艾莉莎有十一個哥哥，卻被繼母用魔法拆散。哥哥們成了白天飛翔、夜裏恢復人形的天鵝。妹妹找到他們，跟着飛過大海，決心想辦法解除魔法。","夢中的指引告訴她，要採集刺人的蕁麻，用它織成十一件衣服。在全部完成之前，她不能說話，否則哥哥會有危險。她忍着雙手的疼痛，默默採集和編織。","一位國王把她接進王宮，卻有人懷疑她夜裏的行動，指控她使用邪術。艾莉莎無法替自己解釋，即使被帶去受罰，雙手仍沒有停止，繼續趕製最後一件衣服。","十一隻天鵝飛來，她立刻把衣服拋到牠們身上，哥哥們恢復了人形。只有最小哥哥的一邊手臂仍是翅膀，因為最後一隻衣袖沒有織完。她終於開口，也洗清了冤屈。"],"questions":[{"q":"艾莉莎用甚麼材料替哥哥們織衣服？","options":["會刺痛雙手的蕁麻","皇帝送來的金布","海底的珍珠","從冰宮取得的冰絲"],"answer":0,"explanation":"蕁麻衣是解除天鵝魔法的關鍵，她必須忍痛製作。","id":"andersen-wild_swa:q0"},{"q":"織衣期間，艾莉莎為甚麼不能解釋自己？","options":["完全忘記人類的語言","國王拿走她的聲音","只有天鵝才准在王宮說話","說話會使哥哥們遇到危險"],"answer":3,"explanation":"保持沉默是救哥哥的條件，卻也使她遭到誤解。","id":"andersen-wild_swa:q1"},{"q":"最小哥哥為甚麼仍留下一隻翅膀？","options":["最後一件衣服少了一隻衣袖","他故意把衣服送給別人","天鵝不願飛過大海","他碰到了皇帝的披風"],"answer":0,"explanation":"沒有完成的衣袖，使相應的手臂未能恢復。","id":"andersen-wild_swa:q2"}],"title":"野天鵝","author":"安徒生","group":"andersen","sourceTitle":"The Wild Swans","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#wild_swa","lines":[{"zh":"艾莉莎有十一個哥哥，卻被繼母用魔法拆散。","py":"ài lì shā yǒu shí yí gè gē gē ， què bèi jì mǔ yòng mó fǎ chāi sàn 。","paragraph":0},{"zh":"哥哥們成了白天飛翔、夜裏恢復人形的天鵝。","py":"gē gē men chéng le bái tiān fēi xiáng 、 yè lǐ huī fù rén xíng de tiān é 。","paragraph":0},{"zh":"妹妹找到他們，跟着飛過大海，決心想辦法解除魔法。","py":"mèi mèi zhǎo dào tā men ， gēn zhe fēi guò dà hǎi ， jué xīn xiǎng bàn fǎ jiě chú mó fǎ 。","paragraph":0},{"zh":"夢中的指引告訴她，要採集刺人的蕁麻，用它織成十一件衣服。","py":"mèng zhōng de zhǐ yǐn gào sù tā ， yào cǎi jí cì rén de qián má ， yòng tā zhī chéng shí yī jiàn yī fú 。","paragraph":1},{"zh":"在全部完成之前，她不能說話，否則哥哥會有危險。","py":"zài quán bù wán chéng zhī qián ， tā bù néng shuō huà ， fǒu zé gē gē huì yǒu wēi xiǎn 。","paragraph":1},{"zh":"她忍着雙手的疼痛，默默採集和編織。","py":"tā rěn zhe shuāng shǒu de téng tòng ， mò mò cǎi jí hé biān zhī 。","paragraph":1},{"zh":"一位國王把她接進王宮，卻有人懷疑她夜裏的行動，指控她使用邪術。","py":"yī wèi guó wáng bǎ tā jiē jìn wáng gōng ， què yǒu rén huái yí tā yè lǐ de xíng dòng ， zhǐ kòng tā shǐ yòng xié shù 。","paragraph":2},{"zh":"艾莉莎無法替自己解釋，即使被帶去受罰，雙手仍沒有停止，繼續趕製最後一件衣服。","py":"ài lì shā wú fǎ tì zì jǐ jiě shì ， jí shǐ bèi dài qù shòu fá ， shuāng shǒu réng méi yǒu tíng zhǐ ， jì xù gǎn zhì zuì hòu yī jiàn yī fú 。","paragraph":2},{"zh":"十一隻天鵝飛來，她立刻把衣服拋到牠們身上，哥哥們恢復了人形。","py":"shí yī zhī tiān é fēi lái ， tā lì kè bǎ yī fú pāo dào tā men shēn shàng ， gē gē men huī fù le rén xíng 。","paragraph":3},{"zh":"只有最小哥哥的一邊手臂仍是翅膀，因為最後一隻衣袖沒有織完。","py":"zhǐ yǒu zuì xiǎo gē gē de yī biān shǒu bì réng shì chì bǎng ， yīn wèi zuì hòu yī zhī yī xiù méi yǒu zhī wán 。","paragraph":3},{"zh":"她終於開口，也洗清了冤屈。","py":"tā zhōng yú kāi kǒu ， yě xǐ qīng le yuān qū 。","paragraph":3}]},{"id":"andersen-nighting","paragraphs":["皇帝住在華麗的宮殿，卻從書上才知道，自己國土裏有一隻歌聲動人的夜鶯。宮人找遍許多地方，最後靠一個常到森林的女孩帶路，才把小鳥請來。","夜鶯在殿前歌唱，皇帝感動得流下眼淚。後來，外國送來鑲滿珠寶的機械鳥，能反覆唱同一支曲子。大家更愛閃亮的新玩意，真正的夜鶯便飛回森林。","日子久了，機械鳥壞了。皇帝生病時，身邊沒有人能使它再唱，連死神也彷彿坐在床邊。夜鶯聽聞消息，重新飛到窗外，用活生生的歌聲陪伴他。","歌聲使黑暗退去，皇帝恢復氣力。他想永遠留下夜鶯，夜鶯卻要保留自由，只答應有空來唱，告訴他宮外人們的喜樂與苦難，讓皇帝聽見城牆外的生活。"],"questions":[{"q":"宮人最後靠誰帶路才找到夜鶯？","options":["皇帝的裁縫","看守冰宮的士兵","常到森林的女孩","修理機械鳥的師傅"],"answer":2,"explanation":"女孩熟悉森林中的小鳥，認得真正的歌聲。","id":"andersen-nighting:q0"},{"q":"機械鳥與夜鶯相比，有甚麼限制？","options":["每天必須到海底睡覺","只能在下雪時飛行","只能反覆唱同一支曲子","完全不會發聲"],"answer":2,"explanation":"機械鳥雖華麗，曲調卻固定，也會損壞。","id":"andersen-nighting:q1"},{"q":"皇帝康復後，夜鶯希望保留甚麼？","options":["一支指揮軍隊的權杖","自由來去的生活","整座宮殿的金子","皇帝所有新衣"],"answer":1,"explanation":"牠願意回來唱歌，卻不願被永久關在宮裏。","id":"andersen-nighting:q2"}],"title":"夜鶯","author":"安徒生","group":"andersen","sourceTitle":"The Nightingale","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#nighting","lines":[{"zh":"皇帝住在華麗的宮殿，卻從書上才知道，自己國土裏有一隻歌聲動人的夜鶯。","py":"huáng dì zhù zài huá lì de gōng diàn ， què cóng shū shàng cái zhī dào ， zì jǐ guó tǔ lǐ yǒu yī zhī gē shēng dòng rén de yè yīng 。","paragraph":0},{"zh":"宮人找遍許多地方，最後靠一個常到森林的女孩帶路，才把小鳥請來。","py":"gōng rén zhǎo biàn xǔ duō dì fāng ， zuì hòu kào yí gè cháng dào sēn lín de nǚ hái dài lù ， cái bǎ xiǎo niǎo qǐng lái 。","paragraph":0},{"zh":"夜鶯在殿前歌唱，皇帝感動得流下眼淚。","py":"yè yīng zài diàn qián gē chàng ， huáng dì gǎn dòng de liú xià yǎn lèi 。","paragraph":1},{"zh":"後來，外國送來鑲滿珠寶的機械鳥，能反覆唱同一支曲子。","py":"hòu lái ， wài guó sòng lái xiāng mǎn zhū bǎo de jī xiè niǎo ， néng fǎn fù chàng tóng yī zhī qǔ zi 。","paragraph":1},{"zh":"大家更愛閃亮的新玩意，真正的夜鶯便飛回森林。","py":"dà jiā gèng ài shǎn liàng de xīn wán yì ， zhēn zhèng de yè yīng biàn fēi huí sēn lín 。","paragraph":1},{"zh":"日子久了，機械鳥壞了。","py":"rì zi jiǔ le ， jī xiè niǎo huài le 。","paragraph":2},{"zh":"皇帝生病時，身邊沒有人能使它再唱，連死神也彷彿坐在床邊。","py":"huáng dì shēng bìng shí ， shēn biān méi yǒu rén néng shǐ tā zài chàng ， lián sǐ shén yě fǎng fú zuò zài chuáng biān 。","paragraph":2},{"zh":"夜鶯聽聞消息，重新飛到窗外，用活生生的歌聲陪伴他。","py":"yè yīng tīng wén xiāo xī ， chóng xīn fēi dào chuāng wài ， yòng huó shēng shēng de gē shēng péi bàn tā 。","paragraph":2},{"zh":"歌聲使黑暗退去，皇帝恢復氣力。","py":"gē shēng shǐ hēi àn tuì qù ， huáng dì huī fù qì lì 。","paragraph":3},{"zh":"他想永遠留下夜鶯，夜鶯卻要保留自由，只答應有空來唱，告訴他宮外人們的喜樂與苦難，讓皇帝聽見城牆外的生活。","py":"tā xiǎng yǒng yuǎn liú xià yè yīng ， yè yīng què yào bǎo liú zì yóu ， zhǐ dā ying yǒu kòng lái chàng ， gào sù tā gōng wài rén men de xǐ lè yǔ kǔ nàn ， ràng huáng dì tīng jiàn chéng qiáng wài de shēng huó 。","paragraph":3}]},{"id":"andersen-red_shoe","paragraphs":["貧窮的嘉倫被一位老婦人收養，生活漸漸安定。她得到一雙漂亮的紅皮鞋，卻在應該專心祈禱的場合，只顧低頭欣賞鞋子，把心思全放在別人怎樣看自己。","老婦人生病，需要有人照顧，她卻穿着紅鞋去參加舞會。奇怪的事情發生了：鞋子開始不停跳舞，無論她想停下、休息或回家，雙腳都不再聽從自己。","紅鞋帶她越過田野與森林，連恐懼和疲倦也不能使舞步停止。嘉倫付出失去雙腳的沉痛代價，才擺脫鞋子的控制，但先前的經歷仍不斷提醒她反省。","後來，她在牧師家幫忙，慢慢學會關心別人，不再只求外表漂亮。故事最後，她在祈禱與歌聲中得到心靈的安寧，離開人世，留下關於虛榮、悔悟和寬恕的思考。"],"questions":[{"q":"嘉倫在應該專心祈禱時，心思放在哪裏？","options":["國王丟失的銀斧","自己的漂亮紅鞋","森林中的受傷燕子","怎樣照顧所有窮人"],"answer":1,"explanation":"她太在意鞋子和別人的目光，忽略了當下應做的事。","id":"andersen-red_shoe:q0"},{"q":"紅鞋的魔法造成甚麼困難？","options":["所有道路都變成冰","她想停下也無法停止跳舞","她再也看不見紅色","她的聲音變成鳥叫"],"answer":1,"explanation":"舞步失去控制，原本喜愛的鞋子變成了束縛。","id":"andersen-red_shoe:q1"},{"q":"後來在牧師家生活時，嘉倫有甚麼轉變？","options":["決定當機械鳥的主人","要求所有人停止唱歌","開始關心別人並反省自己","只想買更多新紅鞋"],"answer":2,"explanation":"故事用她的轉變，表現悔悟與對安寧的尋求。","id":"andersen-red_shoe:q2"}],"title":"紅鞋","author":"安徒生","group":"andersen","sourceTitle":"The Red Shoes","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#red_shoe","lines":[{"zh":"貧窮的嘉倫被一位老婦人收養，生活漸漸安定。","py":"pín qióng de jiā lún bèi yī wèi lǎo fù rén shōu yǎng ， shēng huó jiàn jiàn ān dìng 。","paragraph":0},{"zh":"她得到一雙漂亮的紅皮鞋，卻在應該專心祈禱的場合，只顧低頭欣賞鞋子，把心思全放在別人怎樣看自己。","py":"tā dé dào yī shuāng piào liàng de hóng pí xié ， què zài yīng gāi zhuān xīn qí dǎo de chǎng hé ， zhǐ gù dī tóu xīn shǎng xié zi ， bǎ xīn sī quán fàng zài bié rén zěn yàng kàn zì jǐ 。","paragraph":0},{"zh":"老婦人生病，需要有人照顧，她卻穿着紅鞋去參加舞會。","py":"lǎo fù rén shēng bìng ， xū yào yǒu rén zhào gù ， tā què chuān zhe hóng xié qù cān jiā wǔ huì 。","paragraph":1},{"zh":"奇怪的事情發生了：鞋子開始不停跳舞，無論她想停下、休息或回家，雙腳都不再聽從自己。","py":"qí guài de shì qíng fā shēng le ： xié zi kāi shǐ bù tíng tiào wǔ ， wú lùn tā xiǎng tíng xià 、 xiū xī huò huí jiā ， shuāng jiǎo dōu bù zài tīng cóng zì jǐ 。","paragraph":1},{"zh":"紅鞋帶她越過田野與森林，連恐懼和疲倦也不能使舞步停止。","py":"hóng xié dài tā yuè guò tián yě yǔ sēn lín ， lián kǒng jù hé pí juàn yě bù néng shǐ wǔ bù tíng zhǐ 。","paragraph":2},{"zh":"嘉倫付出失去雙腳的沉痛代價，才擺脫鞋子的控制，但先前的經歷仍不斷提醒她反省。","py":"jiā lún fù chū shī qù shuāng jiǎo de chén tòng dài jià ， cái bǎi tuō xié zi de kòng zhì ， dàn xiān qián de jīng lì réng bù duàn tí xǐng tā fǎn xǐng 。","paragraph":2},{"zh":"後來，她在牧師家幫忙，慢慢學會關心別人，不再只求外表漂亮。","py":"hòu lái ， tā zài mù shī jiā bāng máng ， màn màn xué huì guān xīn bié rén ， bù zài zhǐ qiú wài biǎo piào liàng 。","paragraph":3},{"zh":"故事最後，她在祈禱與歌聲中得到心靈的安寧，離開人世，留下關於虛榮、悔悟和寬恕的思考。","py":"gù shì zuì hòu ， tā zài qí dǎo yǔ gē shēng zhōng dé dào xīn líng de ān níng ， lí kāi rén shì ， liú xià guān yú xū róng 、 huǐ wù hé kuān shù de sī kǎo 。","paragraph":3}]},{"id":"andersen-fir_tree","paragraphs":["森林裏有一棵小樅樹，身旁有陽光、空氣和採野果的孩子，卻總覺得不夠快樂。牠一心盼着長高，羨慕被砍走的大樹，想知道外面的世界會有甚麼榮耀。","一天，小樅樹也被選中，搬進屋裏當聖誕樹。枝上掛滿點心和燭光，頂上還有金星，孩子圍着牠歡笑。牠太緊張，只盼明天能再來一次，沒有好好享受眼前。","節日過後，牠被放進閣樓的暗角。小老鼠來聽牠講聖誕夜和人們說過的故事，牠才發現，自己在森林的日子與那一夜，其實都曾有值得珍惜的快樂。","春天，樹被搬到院子，枝葉已乾枯，再不能重新生長。最後牠被劈成木柴，火光裏仍想着夏日森林。那顆金星留在孩子胸前，樹卻再沒有機會回到從前。"],"questions":[{"q":"小樅樹在森林裏最常盼望甚麼？","options":["變成一口深井","快快長高，到外面見識榮耀","永遠不要見到太陽","把所有小鳥趕走"],"answer":1,"explanation":"牠總嚮往未來，忽略了已經擁有的陽光和陪伴。","id":"andersen-fir_tree:q0"},{"q":"聖誕節後，小樅樹先被放到哪裏？","options":["公主的金車","冰山的山頂","閣樓的暗角","海底的宮殿"],"answer":2,"explanation":"離開客廳後，牠在閣樓與來訪的老鼠講起往事。","id":"andersen-fir_tree:q1"},{"q":"樹在回想時才明白甚麼？","options":["所有樹都能變成天鵝","閣樓比森林永遠更好","從前平常的日子也曾充滿快樂","只要有金星就能重新長根"],"answer":2,"explanation":"當下沒有珍惜的生活，後來成了牠懷念的時光。","id":"andersen-fir_tree:q2"}],"title":"樅樹","author":"安徒生","group":"andersen","sourceTitle":"The Fir Tree","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#fir_tree","lines":[{"zh":"森林裏有一棵小樅樹，身旁有陽光、空氣和採野果的孩子，卻總覺得不夠快樂。","py":"sēn lín lǐ yǒu yī kē xiǎo cōng shù ， shēn páng yǒu yáng guāng 、 kōng qì hé cǎi yě guǒ de hái zi ， què zǒng jué de bù gòu kuài lè 。","paragraph":0},{"zh":"牠一心盼着長高，羨慕被砍走的大樹，想知道外面的世界會有甚麼榮耀。","py":"tā yī xīn pàn zhe zhǎng gāo ， xiàn mù bèi kǎn zǒu de dà shù ， xiǎng zhī dào wài miàn de shì jiè huì yǒu shén me róng yào 。","paragraph":0},{"zh":"一天，小樅樹也被選中，搬進屋裏當聖誕樹。","py":"yī tiān ， xiǎo cōng shù yě bèi xuǎn zhōng ， bān jìn wū lǐ dāng shèng dàn shù 。","paragraph":1},{"zh":"枝上掛滿點心和燭光，頂上還有金星，孩子圍着牠歡笑。","py":"zhī shàng guà mǎn diǎn xīn hé zhú guāng ， dǐng shàng hái yǒu jīn xīng ， hái zi wéi zhe tā huān xiào 。","paragraph":1},{"zh":"牠太緊張，只盼明天能再來一次，沒有好好享受眼前。","py":"tā tài jǐn zhāng ， zhǐ pàn míng tiān néng zài lái yī cì ， méi yǒu hǎo hǎo xiǎng shòu yǎn qián 。","paragraph":1},{"zh":"節日過後，牠被放進閣樓的暗角。","py":"jié rì guò hòu ， tā bèi fàng jìn gé lóu de àn jiǎo 。","paragraph":2},{"zh":"小老鼠來聽牠講聖誕夜和人們說過的故事，牠才發現，自己在森林的日子與那一夜，其實都曾有值得珍惜的快樂。","py":"xiǎo lǎo shǔ lái tīng tā jiǎng shèng dàn yè hé rén men shuō guò de gù shì ， tā cái fā xiàn ， zì jǐ zài sēn lín de rì zi yǔ nà yī yè ， qí shí dōu céng yǒu zhí de zhēn xī de kuài lè 。","paragraph":2},{"zh":"春天，樹被搬到院子，枝葉已乾枯，再不能重新生長。","py":"chūn tiān ， shù bèi bān dào yuàn zi ， zhī yè yǐ gān kū ， zài bù néng chóng xīn shēng zhǎng 。","paragraph":3},{"zh":"最後牠被劈成木柴，火光裏仍想着夏日森林。","py":"zuì hòu tā bèi pǐ chéng mù chái ， huǒ guāng lǐ réng xiǎng zhe xià rì sēn lín 。","paragraph":3},{"zh":"那顆金星留在孩子胸前，樹卻再沒有機會回到從前。","py":"nà kē jīn xīng liú zài hái zi xiōng qián ， shù què zài méi yǒu jī huì huí dào cóng qián 。","paragraph":3}]},{"id":"andersen-snow_man","paragraphs":["孩子們在院子堆起一個雪人，用瓦片做眼睛，用舊耙子做嘴。雪人喜歡冰冷的空氣，不懂太陽是甚麼，也不明白為甚麼白天與黑夜會輪流出現。","院裏的狗向牠介紹屋子和人們的生活。雪人隔着窗，看見屋內的火爐，竟產生強烈的嚮往。狗提醒牠，火爐的熱會把雪融化，牠卻仍想靠近。","幾天來，雪人一直望着那扇窗。天氣轉暖，牠的身體慢慢縮小，終於倒下，露出孩子堆雪時放在裏面的支架；支架上還有一把清理火爐的鏟子。","狗這才說，難怪雪人總惦記火爐，原來身體裏藏着火爐的用具。冬天過去，院子響起迎春的歌，大家開始忙新事，只有這段奇特的嚮往留在故事裏。"],"questions":[{"q":"雪人的眼睛是用甚麼做的？","options":["藍寶石","金幣","胡桃殼","瓦片"],"answer":3,"explanation":"孩子用身邊材料堆雪人，瓦片成了牠的眼睛。","id":"andersen-snow_man:q0"},{"q":"狗為甚麼勸雪人別靠近火爐？","options":["熱力會把雪融化","火爐不喜歡聽故事","屋裏沒有任何窗戶","雪人會立刻變成樹"],"answer":0,"explanation":"雪人嚮往的溫暖，正是會使牠失去身體的熱。","id":"andersen-snow_man:q1"},{"q":"雪人倒下後，支架上露出了甚麼？","options":["清理火爐的鏟子","一把魔法雨傘","一隻金色小鳥","一枚公主戒指"],"answer":0,"explanation":"狗把藏在雪人身體裏的爐鏟，與牠的嚮往聯繫起來。","id":"andersen-snow_man:q2"}],"title":"雪人","author":"安徒生","group":"andersen","sourceTitle":"The Snow Man","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#snow_man","lines":[{"zh":"孩子們在院子堆起一個雪人，用瓦片做眼睛，用舊耙子做嘴。","py":"hái zi men zài yuàn zi duī qǐ yí gè xuě rén ， yòng wǎ piàn zuò yǎn jīng ， yòng jiù pá zi zuò zuǐ 。","paragraph":0},{"zh":"雪人喜歡冰冷的空氣，不懂太陽是甚麼，也不明白為甚麼白天與黑夜會輪流出現。","py":"xuě rén xǐ huān bīng lěng de kōng qì ， bù dǒng tài yáng shì shén me ， yě bù míng bái wèi shén me bái tiān yǔ hēi yè huì lún liú chū xiàn 。","paragraph":0},{"zh":"院裏的狗向牠介紹屋子和人們的生活。","py":"yuàn lǐ de gǒu xiàng tā jiè shào wū zi hé rén men de shēng huó 。","paragraph":1},{"zh":"雪人隔着窗，看見屋內的火爐，竟產生強烈的嚮往。","py":"xuě rén gé zhe chuāng ， kàn jiàn wū nèi de huǒ lú ， jìng chǎn shēng qiáng liè de xiàng wǎng 。","paragraph":1},{"zh":"狗提醒牠，火爐的熱會把雪融化，牠卻仍想靠近。","py":"gǒu tí xǐng tā ， huǒ lú de rè huì bǎ xuě róng huà ， tā què réng xiǎng kào jìn 。","paragraph":1},{"zh":"幾天來，雪人一直望着那扇窗。","py":"jǐ tiān lái ， xuě rén yì zhí wàng zhe nà shàn chuāng 。","paragraph":2},{"zh":"天氣轉暖，牠的身體慢慢縮小，終於倒下，露出孩子堆雪時放在裏面的支架；支架上還有一把清理火爐的鏟子。","py":"tiān qì zhuǎn nuǎn ， tā de shēn tǐ màn màn suō xiǎo ， zhōng yú dǎo xià ， lù chū hái zi duī xuě shí fàng zài lǐ miàn de zhī jià ； zhī jià shàng hái yǒu yī bǎ qīng lǐ huǒ lú de chǎn zi 。","paragraph":2},{"zh":"狗這才說，難怪雪人總惦記火爐，原來身體裏藏着火爐的用具。","py":"gǒu zhè cái shuō ， nán guài xuě rén zǒng diàn jì huǒ lú ， yuán lái shēn tǐ lǐ cáng zhe huǒ lú de yòng jù 。","paragraph":3},{"zh":"冬天過去，院子響起迎春的歌，大家開始忙新事，只有這段奇特的嚮往留在故事裏。","py":"dōng tiān guò qù ， yuàn zi xiǎng qǐ yíng chūn de gē ， dà jiā kāi shǐ máng xīn shì ， zhǐ yǒu zhè duàn qí tè de xiàng wǎng liú zài gù shì lǐ 。","paragraph":3}]},{"id":"andersen-old_hous","paragraphs":["街上有一座近三百年的老房子，鄰近的新房子都嫌它難看。對面的小男孩卻喜歡它的雕花和窗戶，也關心裏面獨住的老人，覺得他可能沒有伴。","男孩把一個錫兵送給老人，希望替他解悶。老人請男孩來訪，屋裏的舊畫和家具都像保存着往事。老人說自己有許多回憶，錫兵卻仍覺得太安靜了。","後來，老人去世，老房子被拆掉，許多東西也四散不見。男孩漸漸長大，回到同一個地方居住；新房子取代舊屋，花園也重新種起花草。","一天，他的妻子挖土時找到一個錫兵。他想起童年探訪老人的事，把往事告訴她。老屋雖已消失，小小玩具卻讓被遺忘的老人重新得到記念，回憶也有了新的聽者。"],"questions":[{"q":"男孩為甚麼把錫兵送給老人？","options":["換取一座金色城堡","讓老人交還海上的王冠","希望陪伴獨住的老人","要老人替他修理軍隊"],"answer":2,"explanation":"他想的是老人的寂寞，希望小玩具能作伴。","id":"andersen-old_hous:q0"},{"q":"老人怎樣解釋自己並不覺得孤單？","options":["窗外住着七位王子","身旁有許多過去的回憶","每天都有一百位客人","會把家具變成真人"],"answer":1,"explanation":"老屋中的物件承載着往事，對老人有特別意義。","id":"andersen-old_hous:q1"},{"q":"多年後，是甚麼喚起男孩的童年回憶？","options":["皇帝換下的新衣","閣樓的一顆金星","妻子挖到的一個錫兵","海上漂來的紙船"],"answer":2,"explanation":"重現的小玩具，把新生活與老屋中的往事連起來。","id":"andersen-old_hous:q2"}],"title":"老房子","author":"安徒生","group":"andersen","sourceTitle":"The Old House","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#old_hous","lines":[{"zh":"街上有一座近三百年的老房子，鄰近的新房子都嫌它難看。","py":"jiē shàng yǒu yī zuò jìn sān bǎi nián de lǎo fáng zi ， lín jìn de xīn fáng zi dōu xián tā nán kàn 。","paragraph":0},{"zh":"對面的小男孩卻喜歡它的雕花和窗戶，也關心裏面獨住的老人，覺得他可能沒有伴。","py":"duì miàn de xiǎo nán hái què xǐ huān tā de diāo huā hé chuāng hù ， yě guān xīn lǐ miàn dú zhù de lǎo rén ， jué de tā kě néng méi yǒu bàn 。","paragraph":0},{"zh":"男孩把一個錫兵送給老人，希望替他解悶。","py":"nán hái bǎ yí gè xī bīng sòng gěi lǎo rén ， xī wàng tì tā jiě mèn 。","paragraph":1},{"zh":"老人請男孩來訪，屋裏的舊畫和家具都像保存着往事。","py":"lǎo rén qǐng nán hái lái fǎng ， wū lǐ de jiù huà hé jiā jù dōu xiàng bǎo cún zhe wǎng shì 。","paragraph":1},{"zh":"老人說自己有許多回憶，錫兵卻仍覺得太安靜了。","py":"lǎo rén shuō zì jǐ yǒu xǔ duō huí yì ， xī bīng què réng jué de tài ān jìng le 。","paragraph":1},{"zh":"後來，老人去世，老房子被拆掉，許多東西也四散不見。","py":"hòu lái ， lǎo rén qù shì ， lǎo fáng zi bèi chāi diào ， xǔ duō dōng xī yě sì sàn bú jiàn 。","paragraph":2},{"zh":"男孩漸漸長大，回到同一個地方居住；新房子取代舊屋，花園也重新種起花草。","py":"nán hái jiàn jiàn zhǎng dà ， huí dào tóng yī gè dì fāng jū zhù ； xīn fáng zi qǔ dài jiù wū ， huā yuán yě chóng xīn zhòng qǐ huā cǎo 。","paragraph":2},{"zh":"一天，他的妻子挖土時找到一個錫兵。","py":"yī tiān ， tā de qī zǐ wā tǔ shí zhǎo dào yí gè xī bīng 。","paragraph":3},{"zh":"他想起童年探訪老人的事，把往事告訴她。","py":"tā xiǎng qǐ tóng nián tàn fǎng lǎo rén de shì ， bǎ wǎng shì gào sù tā 。","paragraph":3},{"zh":"老屋雖已消失，小小玩具卻讓被遺忘的老人重新得到記念，回憶也有了新的聽者。","py":"lǎo wū suī yǐ xiāo shī ， xiǎo xiǎo wán jù què ràng bèi yí wàng de lǎo rén chóng xīn dé dào jì niàn ， huí yì yě yǒu le xīn de tīng zhě 。","paragraph":3}]},{"id":"andersen-tinderbx","paragraphs":["士兵回鄉途中遇見女巫，被派到空心大樹下尋找打火匣。地底有三隻眼睛大小不同的狗，守着銅、銀、金三間財庫；他照女巫的方法把狗移開，拿到了錢。","他帶着財物和打火匣進城，先過了一段揮霍的日子。錢花完後，朋友也不再來找他。一次，他用舊打火匣打火，守財的狗突然現身，才發現它們會聽自己吩咐。","士兵想見被關在銅城堡的公主，狗便夜裏把她帶來。王宮追查這些行動，終於抓到士兵，準備嚴懲。他請路過的孩子替自己取回遺留的打火匣。","最後，他以再抽一次煙斗為由打火，三隻狗一起出現，打亂了國王的安排。人們推他成為新王，他與公主成婚；先前被當作普通舊物的小匣子，原來比金幣更重要。"],"questions":[{"q":"士兵最初到甚麼地方尋找打火匣？","options":["空心大樹下的地底","海底的一座教堂","皇帝的新織布房","結冰湖面的中央"],"answer":0,"explanation":"女巫讓他進入大樹，通往有三隻狗看守的財庫。","id":"andersen-tinderbx:q0"},{"q":"打火匣的特殊作用是甚麼？","options":["把所有人變成鳥","使屋子一直下雪","讓金幣變成落葉","打火時能召出守財的狗"],"answer":3,"explanation":"士兵用它打火後，才發現狗會前來聽命。","id":"andersen-tinderbx:q1"},{"q":"士兵在危急時請孩子取回甚麼？","options":["一口空鐵鍋","遺留的打火匣","公主的銀梳","國王的三匹馬"],"answer":1,"explanation":"拿回打火匣，才有機會召喚三隻狗脫困。","id":"andersen-tinderbx:q2"}],"title":"打火匣","author":"安徒生","group":"andersen","sourceTitle":"The Tinder-box","sourceUrl":"https://www.gutenberg.org/cache/epub/27200/pg27200-images.html#tinderbx","lines":[{"zh":"士兵回鄉途中遇見女巫，被派到空心大樹下尋找打火匣。","py":"shì bīng huí xiāng tú zhōng yù jiàn nǚ wū ， bèi pài dào kōng xīn dà shù xià xún zhǎo dǎ huǒ xiá 。","paragraph":0},{"zh":"地底有三隻眼睛大小不同的狗，守着銅、銀、金三間財庫；他照女巫的方法把狗移開，拿到了錢。","py":"dì dǐ yǒu sān zhǐ yǎn jīng dà xiǎo bù tóng de gǒu ， shǒu zhe tóng 、 yín 、 jīn sān jiān cái kù ； tā zhào nǚ wū de fāng fǎ bǎ gǒu yí kāi ， ná dào le qián 。","paragraph":0},{"zh":"他帶着財物和打火匣進城，先過了一段揮霍的日子。","py":"tā dài zhe cái wù hé dǎ huǒ xiá jìn chéng ， xiān guò le yī duàn huī huò de rì zi 。","paragraph":1},{"zh":"錢花完後，朋友也不再來找他。","py":"qián huā wán hòu ， péng yǒu yě bù zài lái zhǎo tā 。","paragraph":1},{"zh":"一次，他用舊打火匣打火，守財的狗突然現身，才發現它們會聽自己吩咐。","py":"yī cì ， tā yòng jiù dǎ huǒ xiá dǎ huǒ ， shǒu cái de gǒu tū rán xiàn shēn ， cái fā xiàn tā men huì tīng zì jǐ fēn fù 。","paragraph":1},{"zh":"士兵想見被關在銅城堡的公主，狗便夜裏把她帶來。","py":"shì bīng xiǎng jiàn bèi guān zài tóng chéng bǎo de gōng zhǔ ， gǒu biàn yè lǐ bǎ tā dài lái 。","paragraph":2},{"zh":"王宮追查這些行動，終於抓到士兵，準備嚴懲。","py":"wáng gōng zhuī chá zhè xiē xíng dòng ， zhōng yú zhuā dào shì bīng ， zhǔn bèi yán chéng 。","paragraph":2},{"zh":"他請路過的孩子替自己取回遺留的打火匣。","py":"tā qǐng lù guò de hái zi tì zì jǐ qǔ huí yí liú de dǎ huǒ xiá 。","paragraph":2},{"zh":"最後，他以再抽一次煙斗為由打火，三隻狗一起出現，打亂了國王的安排。","py":"zuì hòu ， tā yǐ zài chōu yī cì yān dǒu wèi yóu dǎ huǒ ， sān zhǐ gǒu yì qǐ chū xiàn ， dǎ luàn le guó wáng de ān pái 。","paragraph":3},{"zh":"人們推他成為新王，他與公主成婚；先前被當作普通舊物的小匣子，原來比金幣更重要。","py":"rén men tuī tā chéng wéi xīn wáng ， tā yǔ gōng zhǔ chéng hūn ； xiān qián bèi dàng zuò pǔ tōng jiù wù de xiǎo xiá zi ， yuán lái bǐ jīn bì gèng zhòng yào 。","paragraph":3}]},{"id":"andersen-swineher","paragraphs":["一個小國的王子想向皇帝的女兒求婚，送上珍貴的玫瑰和會唱歌的夜鶯。公主發現都是真花真鳥，反而不感興趣，連王子本人也不願接見。","王子喬裝成牧豬人，進宮照料豬隻。他做出會奏樂的小鍋，還能讓人知道城中各家在煮甚麼。公主十分想要，他卻要求用親吻作交換，不接受金錢。","得到小鍋後，公主又看上他新做的音樂玩具，答應了更多親吻。侍女圍成一圈替她遮掩，皇帝卻剛好看見，十分生氣，把公主和牧豬人一同趕出宮外。","雨中，公主後悔沒有接受王子。牧豬人這才洗去偽裝，恢復王子的模樣。他指出她不懂珍惜玫瑰與夜鶯，卻為玩具失去分寸，然後獨自回國，沒有再向她求婚。"],"questions":[{"q":"公主起初怎樣看待真正的玫瑰與夜鶯？","options":["覺得不合心意而拒絕","立刻珍藏在花園","送給森林裏的窮人","要求把牠們變成金子"],"answer":0,"explanation":"她偏愛新奇玩意，反而沒有欣賞自然的禮物。","id":"andersen-swineher:q0"},{"q":"牧豬人要公主用甚麼交換玩具？","options":["一座城堡","三根金髮","一袋麥粒","親吻"],"answer":3,"explanatio
