}
function renderFairyStories(body){
  var current=FAIRY_STORIES[0],lineIndex=0,group='all',query='',page=0,pageSize=20,showPy=true;
  body.innerHTML='<p class="hint"><b>'+FAIRY_STORIES.length+' 篇不同經典童話中文短篇改寫</b>。每篇有拼音、逐句跟讀及 3 題閱讀練習。點句子可聽示範，再用 Google 或 Whisper 核對同一句。</p><details class="story-picker"><summary>選擇故事 · '+FAIRY_STORIES.length+' 篇</summary><label>搜尋故事<input id="story-search" type="search" placeholder="輸入故事名、作者或關鍵字" aria-label="搜尋童話故事"></label><div class="chips" id="story-groups"></div><div id="story-catalogue"></div><div class="chips" id="story-pager"></div></details><div id="story-heading" class="story-heading"></div><div class="btn-row story-navigation"><button class="btn ghost sm" id="story-previous" type="button">← 上一篇</button><button class="btn ghost sm" id="story-next" type="button">下一篇 →</button><button class="btn ghost sm" id="story-go-text" type="button">看故事 ↓</button></div><div class="btn-row"><button class="btn sm" id="story-play-all" type="button">🔊 聽完整故事</button><button class="btn ghost sm" id="story-stop-audio" type="button">停止播放</button></div><label class="muted story-pinyin-toggle"><input type="checkbox" id="rd-py" checked> 顯示拼音</label><div id="rd-speak" class="speak-dock-anchor"></div><div class="muted" id="story-line-progress" role="status"></div><button class="btn sm" id="rd-next" type="button">下一句 →</button><article class="pass story-text" id="rd-pass"></article><button class="btn ghost sm" id="story-go-practice" type="button">返回跟讀區 ↑</button><section id="story-questions" class="story-questions"></section>';
  function searchKey(value){return Array.from(String(value||'').toLowerCase()).map(egZhNormChar).join('');}
  function filtered(){var key=searchKey(query.trim());return FAIRY_STORIES.filter(function(s){return (group==='all'||s.group===group)&&(!key||searchKey(s.title+' '+s.author+' '+s.paragraphs.join('')).indexOf(key)>=0);});}
  function catalogue(){var list=filtered(),pages=Math.max(1,Math.ceil(list.length/pageSize));page=Math.max(0,Math.min(page,pages-1));var box=body.querySelector('#story-catalogue');box.innerHTML='<p class="muted">'+list.length+' / '+FAIRY_STORIES.length+' 篇 · 第 '+(page+1)+' / '+pages+' 頁</p><div class="story-catalogue-grid"></div>';var grid=box.lastElementChild;list.slice(page*pageSize,(page+1)*pageSize).forEach(function(s){var button=document.createElement('button');button.type='button';button.className='story-choice'+(s.id===current.id?' on':'');button.setAttribute('data-story-id',s.id);button.innerHTML='<b>'+esc(s.title)+'</b><span>'+esc(s.author)+'</span>';bindTap(button,function(){selectStory(s);body.querySelector('.story-picker').open=false;});grid.appendChild(button);});if(!list.length)grid.innerHTML='<p class="muted">未有符合條件的故事。</p>';var pager=body.querySelector('#story-pager');pager.innerHTML='<button class="chip" id="story-page-prev" type="button" '+(page===0?'disabled':'')+'>← 上一頁</button><button class="chip" id="story-page-next" type="button" '+(page>=pages-1?'disabled':'')+'>下一頁 →</button>';bindTap(pager.querySelector('#story-page-prev'),function(){if(page>0){page--;catalogue();}});bindTap(pager.querySelector('#story-page-next'),function(){if(page<pages-1){page++;catalogue();}});}
  function markLine(){body.querySelectorAll('[data-story-line]').forEach(function(el){var selected=Number(el.getAttribute('data-story-line'))===lineIndex;el.classList.toggle('story-current-line',selected);el.setAttribute('aria-pressed',String(selected));});}
  function mountLine(play){var line=current.lines[lineIndex];mountSpeakPractice(body.querySelector('#rd-speak'),line.zh,{label:current.title+' · 第 '+(lineIndex+1)+'/'+current.lines.length+' 句',onNext:nextLine});fillTtsPlayer(line.zh);body.querySelector('#story-line-progress').textContent='正在跟讀：'+current.title+' · '+(lineIndex+1)+' / '+current.lines.length+' 句';markLine();if(play)speak(line.zh);}
  function nextLine(){if(lineIndex+1<current.lines.length){lineIndex++;mountLine(true);}else nextStory(1);}
  function nextStory(delta){var list=filtered();if(!list.length){toast('請先選擇有結果的故事分類');return;}var index=list.findIndex(function(s){return s.id===current.id;});selectStory(list[index<0?(delta<0?list.length-1:0):(index+delta+list.length)%list.length]);}
  function quizState(){try{var data=JSON.parse(localStorage.getItem('mg-fairytale-answers-v1')||'{}');return data&&typeof data==='object'&&!Array.isArray(data)?data:{};}catch(e){return {};}}
  function renderQuiz(){var section=body.querySelector('#story-questions');section.innerHTML='<h3>讀後練習 · 3 題</h3><p class="muted">先按故事內容作答，再看解釋。</p><button type="button" class="btn ghost sm" id="story-quiz-reset">重做本篇練習</button>';current.questions.forEach(function(q,qi){var item=document.createElement('div');item.className='story-question';item.setAttribute('data-story-question',q.id);item.innerHTML='<h4>'+(qi+1)+'. '+esc(q.q)+'</h4><div class="story-answer-options"></div><p role="status" class="story-answer-feedback"></p>';var hold=item.querySelector('.story-answer-options'),feedback=item.querySelector('[role=status]');function showAnswer(choice){hold.querySelectorAll('button').forEach(function(b,i){b.disabled=true;b.classList.toggle('story-answer-correct',i===q.answer);b.classList.toggle('story-answer-wrong',i===choice&&choice!==q.answer);});feedback.textContent=(choice===q.answer?'✓ 正確。':'再比較一下正確答案。')+q.explanation;}q.options.forEach(function(option,i){var button=document.createElement('button');button.type='button';button.className='btn ghost sm';button.textContent=option;button.setAttribute('data-story-answer',String(i));bindTap(button,function(){var state=quizState();if(Number.isInteger(state[q.id])&&state[q.id]>=0&&state[q.id]<4)return;state[q.id]=i;try{localStorage.setItem('mg-fairytale-answers-v1',JSON.stringify(state));}catch(e){toast('練習記錄未能儲存');}showAnswer(i);if(i===q.answer)bumpProgress(1);});hold.appendChild(button);});var saved=quizState()[q.id];if(Number.isInteger(saved)&&saved>=0&&saved<4)showAnswer(saved);section.appendChild(item);});bindTap(section.querySelector('#story-quiz-reset'),function(){var state=quizState();current.questions.forEach(function(q){delete state[q.id];});try{localStorage.setItem('mg-fairytale-answers-v1',JSON.stringify(state));}catch(e){toast('練習記錄未能重設');return;}renderQuiz();});}
  function selectStory(story){egStopSpeech();current=story;lineIndex=0;var index=FAIRY_STORIES.indexOf(story);body.querySelector('#story-heading').innerHTML='<div class="muted">第 '+(index+1)+' / '+FAIRY_STORIES.length+' 篇 · '+esc(story.author)+'</div><h3>'+esc(story.title)+'</h3><p class="muted">經典童話中文短篇改寫 · <a href="'+esc(story.sourceUrl)+'" target="_blank" rel="noopener noreferrer">參考原著 ↗</a></p>';var text=body.querySelector('#rd-pass');text.innerHTML='';for(var pi=0;pi<story.paragraphs.length;pi++){var paragraph=document.createElement('div');paragraph.className='story-paragraph';story.lines.forEach(function(line,i){if(line.paragraph!==pi)return;var wrap=document.createElement('div');wrap.className='story-line';var sentence=document.createElement('button');sentence.type='button';sentence.className='sent story-sentence';sentence.textContent=line.zh;sentence.setAttribute('data-story-line',String(i));sentence.setAttribute('aria-label','聽及跟讀：'+line.zh);bindTap(sentence,function(){lineIndex=i;mountLine(true);});var py=document.createElement('div');py.className='pinyin story-pinyin';py.hidden=!showPy;py.textContent=line.py;wrap.appendChild(sentence);wrap.appendChild(py);paragraph.appendChild(wrap);});text.appendChild(paragraph);}renderQuiz();mountLine(false);body.querySelectorAll('[data-story-id]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-story-id')===story.id);});}
  var groups=[['all','全部'],['grimm','格林童話'],['andersen','安徒生童話'],['perrault','佩羅童話']];groups.forEach(function(item){var button=document.createElement('button');button.type='button';button.className='chip'+(item[0]===group?' on':'');button.textContent=item[1]+' · '+(item[0]==='all'?FAIRY_STORIES.length:FAIRY_STORIES.filter(function(s){return s.group===item[0];}).length);button.setAttribute('data-story-group',item[0]);bindTap(button,function(){group=item[0];page=0;body.querySelectorAll('[data-story-group]').forEach(function(b){b.classList.toggle('on',b===button);});catalogue();});body.querySelector('#story-groups').appendChild(button);});
  body.querySelector('#story-search').oninput=function(){query=this.value;page=0;catalogue();};body.querySelector('#rd-py').onchange=function(){showPy=this.checked;body.querySelectorAll('.story-pinyin').forEach(function(py){py.hidden=!showPy;});};bindTap(body.querySelector('#rd-next'),nextLine);bindTap(body.querySelector('#story-next'),function(){nextStory(1);});bindTap(body.querySelector('#story-previous'),function(){nextStory(-1);});bindTap(body.querySelector('#story-play-all'),function(){speak(current.paragraphs.join(''));});bindTap(body.querySelector('#story-stop-audio'),egStopSpeech);bindTap(body.querySelector('#story-go-text'),function(){body.querySelector('#rd-pass').scrollIntoView({behavior:'auto',block:'start'});});bindTap(body.querySelector('#story-go-practice'),function(){body.querySelector('#rd-speak').scrollIntoView({behavior:'auto',block:'start'});});catalogue();selectStory(current);
}

function renderReadLegacy(body){
  var idx=0;
  body.innerHTML='<p class="hint">撳任何一句聽示範；亦可跟讀俾 AI 核對。頂部「下一題」跳下一句。</p>'+
    '<label class="muted" style="display:flex;align-items:center;gap:8px;margin:0 0 10px">'+
    '<input type="checkbox" id="rd-py" checked> 顯示拼音</label>'+
    '<div id="rd-speak" class="speak-dock-anchor"></div>'+
    '<button class="btn sm" type="button" id="rd-next" style="margin-bottom:8px;background:linear-gradient(180deg,#ffb4c8,#f07a9a)">下一題 →</button>'+
    '<div class="pass" id="rd-pass"></div>';
  var show=true;
  document.getElementById('rd-py').onchange=function(){show=!!this.checked;paint();};
  function mountCur(){
    var s=READ_PASS[idx%READ_PASS.length];
    fillTtsPlayer(s.zh);
    mountSpeakPractice(document.getElementById('rd-speak'),s.zh,{
      label:'朗讀跟讀',
      onNext:function(){idx=(idx+1)%READ_PASS.length;speak(READ_PASS[idx].zh);mountCur();}
    });
  }
  function paint(){
    var p=document.getElementById('rd-pass');p.innerHTML='';
    READ_PASS.forEach(function(s,i){
      var wrap=document.createElement('div');wrap.style.marginBottom='12px';
      var sent=document.createElement('span');sent.className='sent';sent.textContent=s.zh;
      bindTap(sent,function(){speak(s.zh);fillTtsPlayer(s.zh);idx=i;mountCur();});
      wrap.appendChild(sent);
      if(show){
        var py=document.createElement('div');py.className='pinyin';py.textContent=s.py;wrap.appendChild(py);
      }
      p.appendChild(wrap);
    });
  }
  bindTap(document.getElementById('rd-next'),function(){idx=(idx+1)%READ_PASS.length;speak(READ_PASS[idx].zh);mountCur();});
  paint();
  mountCur();
}

function renderDaily(body){
  var st=loadState();
  var tk=todayKey();
  if(!st.daily || st.daily.day!==tk){
    var qs=[];
    shuffle(LISTEN_BANK).slice(0,2).forEach(function(x){qs.push({type:'listen',item:x});});
    shuffle(BAIHUA).slice(0,2).forEach(function(x){qs.push({type:'baihua',item:x});});
    var set=TONE_SETS[(Math.random()*TONE_SETS.length)|0].items;
    var correct=set[(Math.random()*4)|0];
    qs.push({type:'tone',item:{speak:correct.speak,ans:correct.py+' '+correct.zh,opts:shuffle(set.map(function(it){return it.py+' '+it.zh;}))}});
    st.daily={day:tk,qs:qs,i:0,score:0,done:false};
    saveState(st);
  }
  body.innerHTML='<p class="hint">今日 5 題 · 「下一題」可隨時跳過</p>'+
    '<div class="progress"><i id="day-bar"></i></div><div id="day-q"></div>'+
    '<button class="btn sm" type="button" id="day-next" style="margin-top:10px;background:linear-gradient(180deg,#ffb4c8,#f07a9a)">下一題 →</button>';
  function paint(){
    st=loadState();
    var d=st.daily;if(!d)return;
    var bar=document.getElementById('day-bar');
    bar.style.width=((d.i/5)*100)+'%';
    var box=document.getElementById('day-q');
    var nextBtn=document.getElementById('day-next');
    if(d.i>=5 || d.done){
      d.done=true;saveState(st);
      box.innerHTML='<p class="q-big">今日完成！得分 '+d.score+'/5</p>'+
        '<button class="btn" type="button" id="day-again">再練一組（唔計入每日）</button>';
      if(nextBtn)nextBtn.style.display='none';
      bindTap(document.getElementById('day-again'),function(){
        st.daily=null;saveState(st);renderDaily(body);
      });
      return;
    }
    if(nextBtn)nextBtn.style.display='inline-block';
    var q=d.qs[d.i];
    if(q.type==='listen'){
      var item=q.item;
      box.innerHTML='<span class="tag">聽力</span><p class="q-big">'+esc(item.q)+'</p>'+
        '<button class="btn sm" type="button" id="d-play">🔊 聽</button><div id="d-opts" style="margin-top:10px"></div>';
      bindTap(document.getElementById('d-play'),function(){speak(item.speak);});
      var opts=shuffle(item.opts.map(function(t,idx){return {t:t,idx:idx};}));
      var ob=document.getElementById('d-opts');
      opts.forEach(function(o){
        var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=o.t;
        bindTap(b,function(){answer(o.idx===item.ans);});
        ob.appendChild(b);
      });
    }else if(q.type==='baihua'){
      var it=q.item;
      box.innerHTML='<span class="tag blue">轉換</span><span class="tag">'+esc(it.dir)+'</span>'+
        '<p class="q-big">'+esc(it.src)+'</p><div id="d-opts"></div>';
      var choices=shuffle([it.ans].concat(it.distractors||[]).slice(0,4));
      var ob2=document.getElementById('d-opts');
      choices.forEach(function(c){
        var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=c;
        bindTap(b,function(){answer(c===it.ans);});
        ob2.appendChild(b);
      });
    }else{
      var it2=q.item;
      box.innerHTML='<span class="tag green">聲調</span><p class="q-big">聽完揀正確讀音</p>'+
        '<button class="btn sm" type="button" id="d-play">🔊 聽</button><div id="d-opts" style="margin-top:10px"></div>';
      bindTap(document.getElementById('d-play'),function(){speak(it2.speak);});
      var ob3=document.getElementById('d-opts');
      it2.opts.forEach(function(c){
        var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=c;
        bindTap(b,function(){answer(c===it2.ans);});
        ob3.appendChild(b);
      });
    }
    function answer(ok){
      if(ok){d.score++;toast('✅ 正確');bumpProgress(1);}
      else toast('❌ 唔啱');
      d.i++;saveState(st);paint();
    }
  }
  bindTap(document.getElementById('day-next'),function(){
    st=loadState();var d=st.daily;if(!d||d.done)return;
    d.i++;saveState(st);paint();
  });
  paint();
}

  '吉林':{title:'米飯、冷麵與山地物產',paragraphs:[
    '吉林的飲食與稻米、玉米等作物，以及山地、森林的物產有關。家常菜裡可以見到燉煮的蔬菜、肉類和菌菇，主食則有米飯，也有不同的麵食。',
    '在延邊，朝鮮族飲食文化十分鮮明，冷麵、打糕和辣白菜都很有代表性。冷麵重視湯、麵和配菜的搭配，不同店家在酸甜度和麵條口感上各有習慣。',
    '吉林省內各地的飲食並不完全相同，也不能把延邊的特色當作每個家庭的日常。點菜時問問當地時令食材，再搭配一份主食，往往比只選名菜更能認識地方。'
  ],practice:'延邊的冷麵重視湯和配菜的搭配。'},
  '黑龍江':{title:'冬日熱菜與城市交流的味道',paragraphs:[
    '黑龍江的冬天漫長，熱湯、燉菜和有飽足感的主食，在許多家庭的餐桌上十分常見。餃子、黏豆包和酸菜等食物，也與節慶和季節保存的經驗相連。',
    '哈爾濱的紅腸和大列巴，則讓人看到城市歷史中跨地域交流留下的痕跡。這些食物與東北家常菜並存，形成了街頭小店、麵包店和餐館各有風味的景象。',
    '旅行時不妨把市場、早餐店和家庭式餐館放在一起觀察。冬天吃一碗熱湯，夏天試試當季蔬菜，便會發現同一座城市也有截然不同的季節味道。'
  ],practice:'哈爾濱的紅腸和大列巴很有特色。'},
  '上海':{title:'本幫菜與弄堂早餐',paragraphs:[
    '上海的本幫菜常以醬香、燒煮和濃淡有致的調味見長，紅燒肉是容易認識的例子。不過，上海菜並不只有甜味，清蒸、白斬和時令蔬菜也佔有重要位置。',
    '早餐時，生煎、餛飩、粢飯糰和豆漿常出現在街坊小店。生煎的底部煎得香脆，上部麵皮則保留柔軟，吃的時候可以先小口咬開，感受湯汁和肉餡。',
    '上海長期匯聚不同地區的人口與飲食，海派風格也在交流中形成。從一份弄堂早餐到一桌家常本幫菜，都是理解這座城市日常節奏的入口。'
  ],practice:'上海生煎的底部香脆，麵皮柔軟。'},
  '江蘇':{title:'淮揚刀工與江南點心',paragraphs:[
    '江蘇南北的飲食有明顯差異。淮揚菜常重視刀工、火候與食材本味，文思豆腐細緻的切絲、清鮮的湯品，便能展示廚房裡耐心而精細的工夫。',
    '揚州、淮安等地的早茶可以見到包子和燙乾絲；南京的鹽水鴨、蘇州的糕團與麵食，又呈現不同風格。只用一道名菜，很難說完江蘇餐桌的豐富。',
    '到不同城市旅行，可以比較同一種主食的湯頭與配菜，再留意節令點心。春夏秋冬更換的食材，讓江南飲食與季節之間保持緊密的聯繫。'
  ],practice:'淮揚菜重視刀工、火候與食材本味。'},
  '浙江':{title:'從茶香蝦仁到海邊家常菜',paragraphs:[
    '浙江的飲食與江河、湖泊和海洋密切相關。杭州菜裡可以看到茶葉入菜、清鮮湯品和細緻燒煮，龍井蝦仁就是把地方茶香帶到餐桌上的例子。',
    '到了寧波、舟山等地，海鮮與不同保存、調味方法更加突出；紹興的黃酒和糟香菜式，又有自己的性格。山區的筍、菌菇和家常醃製食物，同樣值得留意。',
    '閱讀浙江的飲食文化，不妨把一杯茶、一碗麵和一份時令小菜放在一起。各地的水土與生活方式，常常比一張名菜排行榜更能說明味道的來歷。'
  ],practice:'龍井蝦仁把地方茶香帶到餐桌上。'},
  '安徽':{title:'山間食材與慢火工夫',paragraphs:[
    '安徽各地的飲食並不相同，皖北麵食、沿江風味與徽州菜各有特色。談到徽菜，山區物產、燉燒火候，以及利用醃製、發酵增添風味，是常見的觀察方向。',
    '臭鱖魚和毛豆腐都有鮮明的發酵氣味，經過烹調後呈現獨特口感；筍、菌菇和家常燉菜，則讓人看到山地食材的另一面。並非每一道徽菜都氣味濃烈。',
    '旅行時可以請店家介紹今天的時令菜，搭配一份清淡蔬菜和主食，再慢慢試有特色的菜式。認識地方風味，不必一次點遍所有名菜，也可以從一餐平常飯開始。'
  ],practice:'徽州菜常用山間食材，講究燉燒火候。'},
  '福建':{title:'湯、海味與閩南街頭小吃',paragraphs:[
    '福建山海相接，飲食隨地區呈現不同樣子。福州的魚丸與肉燕、泉州的麵線糊、廈門的沙茶麵，各有自己的口感和搭配，不能只用「海鮮」兩字概括。',
    '許多福建菜重視湯的鮮味，也擅長運用海產和地方調味。沙茶麵的湯底帶有醬香，配料可按喜好選擇；麵線糊則以細軟口感，融入不少人的早餐或宵夜。',
    '喝茶與小吃也連著社交生活。到街坊店試一碗湯、一份主食，留意老闆推薦的吃法，便能從簡單的一餐，看見不同城市之間細緻而鮮明的差別。'
  ],practice:'福建不同城市的小吃各有特色。'},
  '江西':{title:'米粉、瓦罐湯與家常鮮辣',paragraphs:[
    '江西的早餐常能見到米粉，南昌拌粉配瓦罐湯便是廣為人知的組合。米粉拌入醬料和配菜，湯則以不同食材慢慢煨煮，一乾一湯，形成有層次的一餐。',
    '江西不少家常菜調味鮮辣，也常利用醃菜、豆製品和當季蔬菜。鄱陽湖及各地水域提供魚鮮，山區則有筍、菌菇等物產，讓省內各地的菜式充滿變化。',
    '點菜時可以先問清辣度，再按人數安排主食和湯品。除了名店，市場附近的粉店與家常小館，也很適合觀察當地人如何把食材配成一頓日常飯。'
  ],practice:'南昌拌粉常搭配一盅瓦罐湯。'},
  '山東':{title:'麥香、海味與魯菜火候',paragraphs:[
    '山東的飲食，能從麥食、沿海物產和魯菜技法三方面認識。饅頭、煎餅、餃子在不少地方十分常見，不同地區在麵皮、餡料和吃法上又有差異。',
    '魯菜重視火候、湯與蔥香、醬香的運用，菜式既有濃郁的一面，也有清鮮細緻的做法。沿海城市的魚、蝦、貝類，則可以用蒸、煮等方式表現食材本味。',
    '走進市場看麵食和當季海產，再到家常餐館點一湯一菜，往往比只記住幾道宴席名菜更有收穫。山東的味道，也藏在一隻剛出鍋的熱饅頭裡。'
  ],practice:'山東的麥食與沿海海鮮各有風味。'},
  '河南':{title:'胡辣湯與燴麵的日常',paragraphs:[
    '河南是重要的麥作地區，麵食在許多人的日常飲食裡佔有位置。饅頭、烙餅、麵條各有做法，從早餐攤到家庭餐桌，都能看到小麥帶來的多樣口感。',
    '胡辣湯常見於早餐，帶有胡椒和香料的滋味，配料隨地方、店家而變。燴麵則把麵、湯和配菜放在同一碗中，有些做法以羊肉湯見長，吃起來溫暖而飽足。',
    '河南各城市還有不同的小吃和地方菜，不能把一種早餐當作全省的唯一風味。到訪時問問附近人平常去哪裡吃麵，往往就能找到一條貼近日常生活的美食路線。'
  ],practice:'河南的胡辣湯和燴麵都很有代表性。'},
  '湖北':{title:'從武漢過早到魚米餐桌',paragraphs:[
    '在武漢，「過早」就是吃早餐，熱乾麵、豆皮、麵窩等食物，讓一頓早餐有了豐富選擇。熱乾麵常拌芝麻醬，重點是麵條與醬料均勻融合的口感。',
    '湖北江河湖泊眾多，魚、蓮藕等食材常走進家常菜。蓮藕排骨湯以慢煨呈現湯香，魚菜則依地區有蒸、煮、燒等不同做法，展示魚米之鄉的物產。',
    '旅行時可以早起試一份過早，再在正餐點一道當地湯菜。早餐與家常湯並排來看，便會發現湖北飲食既有街頭的爽快，也有慢火燉煮的耐心。'
  ],practice:'在武漢，吃早餐也叫做過早。'},
  '湖南':{title:'米粉、剁椒與煙火家常',paragraphs:[
    '湖南的飲食常讓人聯想到鮮辣和香氣，但各地口味與家庭習慣不盡相同。長沙、常德等地的米粉，在麵條形態、湯頭與配碼上都有自己的講究。',
    '剁椒魚頭把發酵辣椒的鹹鮮帶入蒸菜，臘味則呈現保存食材與煙燻香氣的經驗。家常小炒常重視鍋氣和新鮮配料，配一碗米飯，便是一頓有滋味的飯。',
    '第一次嘗試湘菜，可以主動說明能接受的辣度，搭配蒸蛋、蔬菜或湯品。認識一地飲食，不只是挑戰辣味，也可以留意米香、發酵香和季節食材。'
  ],practice:'湖南米粉的湯頭與配碼各有講究。'},
  '廣東':{title:'一盅兩件之外的粵味',paragraphs:[
    '廣東飲食十分多樣，廣府、潮汕、客家等風味各有特色。廣府早茶以茶和點心串起相聚時光，蝦餃、燒賣、腸粉只是其中幾種，並不是每一餐都要點齊。',
    '廣府菜常重視食材鮮味與火候；潮汕的粿品、滷味和牛肉料理，呈現另一套細緻手藝；客家釀豆腐、梅菜配肉等菜式，則讓人看到家常烹調的豐富變化。',
    '喝茶時可按需要添水、分享點心，餐桌習慣也會因家庭而異。與其把粵菜簡化成「清淡」，不如留意蒸、煲、燒、滷如何在同一地區並存。'
  ],practice:'廣東的廣府、潮汕和客家風味各有特色。'},
  '廣西':{title:'一碗米粉與多樣的節慶食物',paragraphs:[
    '廣西的米粉種類豐富，桂林米粉、柳州螺螄粉和南寧老友粉，各有自己的滷水、湯底和配菜。即使都叫米粉，拌著吃、帶湯吃，入口感受也很不一樣。',
    '螺螄粉的風味來自湯底與酸筍等配料，成品不一定看得到螺肉。糯米飯、粽子和各地節慶食物，則連著壯族等不同群體的生活，做法與場合因地而異。',
    '逛市場時，可以看看米粉之外的時令蔬菜和糯米小食。選一碗喜歡的粉，再聽店家介紹怎樣加料，常能從小小的餐桌認識一座城市的性格。'
  ],practice:'桂林、柳州和南寧的米粉各有風味。'},
  '海南':{title:'雞飯、椰香與島嶼日常',paragraphs:[
    '海南的飲食與熱帶物產、海洋和移民交流有關。文昌雞重視雞肉口感與蘸料，雞湯也可以用來做飯，讓主食帶上香氣，呈現看似簡單卻講究細節的吃法。',
    '海南粉有自己的醬料和配料，清補涼則以不同豆類、果乾或椰奶等組合，成為常見甜品。沿海的海鮮、不同地區的糟粕醋料理，又為島嶼味道添上變化。',
    '到海南不妨把海邊餐廳與街坊粉店排在不同餐次，留意地方之間的差異。一份雞飯、一碗粉，再加當季水果，便能認識旅遊印象之外的日常生活。'
  ],practice:'文昌雞講究雞肉口感和蘸料的搭配。'},
  '重慶':{title:'火鍋之外，還有一碗小麵',paragraphs:[
    '重慶火鍋以麻辣風味聞名，食材在滾燙的鍋裡分次下鍋，蘸料則按店家和食客習慣調配。聚在同一口鍋前，邊煮邊聊，也是這種吃法吸引人的地方。',
    '早餐或簡單的一餐，小麵同樣重要。麵條配上調料、蔬菜和不同澆頭，看起來樸實，卻講究麵的軟硬與作料比例；酸辣粉等街頭小吃，也有自己的愛好者。',
    '並不是每道重慶菜都必須很辣，餐館也有清湯、家常菜等選擇。點餐前先說明口味，再選一碗麵或一桌火鍋，更容易體會當地飲食親切而熱鬧的節奏。'
  ],practice:'重慶小麵講究麵條口感和調料比例。'},
  '四川':{title:'一菜一格，不只麻辣',paragraphs:[
    '川菜以多樣的調味見長，麻辣只是其中一種風格。魚香、宮保、怪味等名稱，說明不同調料比例能創造各有層次的味道，並不是所有川菜都同一個辣法。',
    '麻婆豆腐展現麻、辣、燙、香的組合，開水白菜則以清澈湯色和細緻工夫見長。擔擔麵、抄手、甜水麵等小吃，讓正餐之外也有豐富的味覺選擇。',
    '到四川可以試著比較一份辣菜與一份清鮮菜，再到茶館坐一坐。喝茶、聊天和慢慢吃點心的日常，也同樣是理解地方飲食文化的重要部分。'
  ],practice:'川菜有不同味型，並不只有麻辣。'},
  '貴州':{title:'酸湯、米粉與山地風味',paragraphs:[
    '貴州飲食常見酸香與辣味的搭配，酸味可以來自不同食材與發酵方法。凱里酸湯魚是有代表性的例子，湯底、蘸水和配菜一起，構成完整的用餐體驗。',
    '米粉在不少地方也是日常主食，牛肉粉、羊肉粉等各有做法。折耳根常作為配料或涼拌食材，氣味鮮明，喜歡與否因人而異，並不是每道菜都一定加入。',
    '貴州不同地區與群體的飲食相當多樣，山地物產也帶來季節變化。到市場看看醃製品、蔬菜和香草，再吃一碗粉，便能感受到名菜之外的生活細節。'
  ],practice:'貴州酸湯常把酸香和辣味搭配起來。'},
  '雲南':{title:'米線與山野物產的多樣餐桌',paragraphs:[
    '雲南地形與氣候差異很大，也有多樣的族群和地方傳統，飲食很難用單一口味概括。米線在許多地方常見，湯米線、拌米線與過橋米線，各有不同的配料和吃法。',
    '過橋米線讓食客把米線、肉片和蔬菜配入熱湯，重視湯與配料的安排。不同地區還有豆製品、乳扇、香草和時令菌菇等特色，呈現山地物產帶來的豐富選擇。',
    '認識雲南，可以把城市小吃與當地家庭菜分開嘗試，留意同一種食材如何被不同方式烹調。問清楚一道菜的地方名稱，也常會聽到很有趣的生活故事。'
  ],practice:'雲南不同地區的米線和配料各有特色。'},
  '西藏':{title:'糌粑、酥油茶與高原待客',paragraphs:[
    '西藏各地的飲食隨地形、物產與家庭習慣而變。青稞製成的糌粑，是認識部分藏族傳統飲食的代表，配合茶或其他材料，可以成為方便而有飽足感的食物。',
    '酥油茶與甜茶各有風味，並不是同一種飲品。茶館除了提供飲食，也是聊天與休息的地方；麵食、牛羊肉、奶製品和蔬菜，則依地區與季節出現在餐桌。',
    '拜訪家庭時，可以先請教主人如何接茶與搭配食物，不必把某一套禮節當作全區通用。慢慢品嘗、尊重個人飲食選擇，會讓認識高原生活的過程更自在。'
  ],practice:'酥油茶和甜茶是不同風味的飲品。'},
  '陝西':{title:'泡饃、麵食與三秦風味',paragraphs:[
    '陝西的關中、陝北與陝南，在主食和調味上各有面貌。談到西安及關中，肉夾饃、羊肉泡饃和不同麵食常被提起，展示了麵粉與肉湯搭配的多種可能。',

function egMountCultureArticle(card,c,onPractice){
  var article=CULTURE_ARTICLES[c.region];if(!article)return;
  var details=document.createElement('details');details.className='culture-article';
  var summary=document.createElement('summary');summary.textContent='📖 閱讀飲食文化文章';details.appendChild(summary);
  var title=document.createElement('h3');title.textContent=article.title;details.appendChild(title);
  var note=document.createElement('p');note.className='muted';note.textContent='約 1 分鐘閱讀 · 地方及家庭習慣各有差異';details.appendChild(note);
  article.paragraphs.forEach(function(paragraph,i){
    var p=document.createElement('p');p.className='article-paragraph';p.textContent=paragraph;details.appendChild(p);
    var listen=document.createElement('button');listen.type='button';listen.className='btn ghost sm';listen.textContent='🔊 聽第 '+(i+1)+' 段';
    bindTap(listen,function(){speak(paragraph);});details.appendChild(listen);
  });
  egAddCultureQuiz(details,c.region);
  var practice=document.createElement('div');practice.className='article-practice';
  var line=document.createElement('p');line.textContent='跟讀句：'+article.practice;practice.appendChild(line);
  var button=document.createElement('button');button.type='button';button.className='btn sm';button.textContent='🎤 用呢句練習';
  bindTap(button,function(){onPractice(article.practice);});practice.appendChild(button);details.appendChild(practice);card.appendChild(details);
}

function egAddCultureQuiz(host,region){
  var questions=EG_CULTURE_QUESTIONS[region];if(!questions)return;
  var box=document.createElement('section');box.className='article-comprehension';box.setAttribute('aria-label',region+'閱讀理解練習');
  var heading=document.createElement('h3');heading.textContent='閱讀練習 · 2 題';box.appendChild(heading);
  var guide=document.createElement('p');guide.className='muted';guide.textContent='讀完文章揀答案；答錯有提示，可以再試。';box.appendChild(guide);
  questions.forEach(function(q,index){
    var field=document.createElement('fieldset');field.className='article-question';field.dataset.articleQuestion=String(index);
    var legend=document.createElement('legend');legend.textContent=(index+1)+'. '+q.q;field.appendChild(legend);
    var feedback=document.createElement('p');feedback.setAttribute('role','status');feedback.textContent='請揀一個答案。';
    var locked=false,awarded=false;
    shuffle(q.o.map(function(t,i){return {text:t,correct:i===0};})).forEach(function(option){
      var button=document.createElement('button');button.type='button';button.className='opt';button.textContent=option.text;
      bindTap(button,function(){
        if(locked)return;
        field.querySelectorAll('.opt').forEach(function(b){b.classList.remove('wrong');});
        if(option.correct){locked=true;button.classList.add('correct');feedback.textContent='✅ 正確。'+q.e;if(!awarded){awarded=true;bumpProgress(1);}field.querySelectorAll('.opt').forEach(function(b){b.disabled=true;});}
        else{button.classList.add('wrong');feedback.textContent='再試一次。提示：'+q.e;}
      });field.appendChild(button);
    });
    field.appendChild(feedback);box.appendChild(field);
  });
  host.appendChild(box);
}

function renderCulture(body){
  body.innerHTML='<p class="hint">中國大陸 31 省級：重點飲食同地方文化；問候各有特色（唔係全部「你好」）。頂部可跟讀關鍵句。</p>'+
    '<div class="chips" id="cul-filter" style="margin-bottom:8px"></div>'+
    '<div id="cul-speak" class="speak-dock-anchor"></div>'+
    '<button class="btn sm" type="button" id="cul-next" style="margin-bottom:8px;background:linear-gradient(180deg,#ffb4c8,#f07a9a)">下一題 →</button>'+
    '<div id="cul-list"></div>';
  var filter=document.getElementById('cul-filter');
  var regions=['全部'].concat(CULTURE.map(function(c){return c.region;}));
  var cur='全部';
  var itemIdx=0;
  regions.forEach(function(r,i){
    var b=document.createElement('button');b.type='button';b.className='chip'+(i===0?' on':'');b.textContent=r;
    bindTap(b,function(){
      filter.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');cur=r;itemIdx=0;paint();
    });
    filter.appendChild(b);
  });
  function items(){return CULTURE.filter(function(c){return cur==='全部'||c.region===cur;});}
  function mountCur(){
    var list=items();if(!list.length)return;
    var c=list[itemIdx%list.length];
    fillTtsPlayer(c.phrase);
    mountSpeakPractice(document.getElementById('cul-speak'),c.phrase,{
      label:c.region+' · 關鍵句跟讀',
      onNext:function(){itemIdx=(itemIdx+1)%list.length;speak(list[itemIdx%list.length].phrase);mountCur();}
    });
  }
  function paint(){
    var listEl=document.getElementById('cul-list');listEl.innerHTML='';
    var list=items();
    list.forEach(function(c,ix){
      var div=document.createElement('div');div.className='panel culture-card';div.style.padding='12px';
      var seasonLine=c.seasonPhraseTrad?('<p style="margin:4px 0"><span class="tag">節慶句</span> '+esc(c.seasonPhraseTrad)+'</p>'):'';
      div.innerHTML='<h3>'+c.emoji+' '+esc(c.region)+'</h3>'+
        '<div><span class="tag">問候</span> <b>'+esc(c.greet)+'</b> <span class="muted">'+esc(c.greetNote)+'</span></div>'+
        '<ul>'+
        '<li><b>飲食：</b>'+esc(c.food)+'</li>'+
        '<li><b>節慶／景點：</b>'+esc(c.fest)+'</li>'+
        '<li><b>習俗提示：</b>'+esc(c.custom)+'</li>'+
        '</ul>'+
        '<p style="margin:8px 0 4px"><span class="tag green">關鍵句</span> '+esc(c.phraseTrad)+'</p>'+seasonLine+
        '<div class="btn-row">'+
        '<button class="btn ghost sm" type="button" data-act="phrase">🔊 關鍵句</button>'+
        '<button class="btn ghost sm" type="button" data-act="greet">🔊 問候</button>'+
        (c.seasonPhrase?'<button class="btn ghost sm" type="button" data-act="season">🔊 節慶句</button>':'')+
        '<button class="btn sm" type="button" data-act="practice">🎤 練習＋AI</button>'+
        '</div>';
      bindTap(div.querySelector('[data-act=phrase]'),function(){speak(c.phrase);fillTtsPlayer(c.phrase);});
      bindTap(div.querySelector('[data-act=greet]'),function(){speak(c.greet);fillTtsPlayer(c.greet);});
      var sb=div.querySelector('[data-act=season]');
      if(sb)bindTap(sb,function(){speak(c.seasonPhrase);fillTtsPlayer(c.seasonPhrase);});
      bindTap(div.querySelector('[data-act=practice]'),function(){
        itemIdx=ix;mountCur();
        try{document.getElementById('cul-speak').scrollIntoView({behavior:'instant',block:'start'});}catch(e){}
      });
      egMountCultureArticle(div,c,function(sentence){
        mountSpeakPractice(document.getElementById('cul-speak'),sentence,{label:c.region+' · 文章跟讀',onNext:function(){itemIdx=(ix+1)%list.length;mountCur();}});
        fillTtsPlayer(sentence);
        document.getElementById('cul-speak').scrollIntoView({behavior:'instant',block:'start'});
      });
      listEl.appendChild(div);
    });
    if(list.length)mountCur();
  }
  bindTap(document.getElementById('cul-next'),function(){
    var list=items();if(!list.length)return;
    itemIdx=(itemIdx+1)%list.length;speak(list[itemIdx].phrase);mountCur();
  });
  paint();
}

function renderBaihua(body){
  var bank=shuffle(BAIHUA.slice());
  var i=0, mode='quiz';
  body.innerHTML='<p class="hint">粵語白話 ↔ 普通話書面語雙向練習；「下一題」永遠可見。</p>'+
    '<div class="chips"><button type="button" class="chip on" id="bh-quiz">選擇題</button>'+
    '<button type="button" class="chip" id="bh-reveal">點撃揭曉</button>'+
    '<button type="button" class="chip" id="bh-speakmode">朗讀 AI</button></div>'+
    '<div id="bh-speak" class="speak-dock-anchor"></div>'+
    '<button class="btn sm" type="button" id="bh-next-top" style="margin:6px 0 8px;background:linear-gradient(180deg,#ffb4c8,#f07a9a)">下一題 →</button>'+
    '<div id="bh-q"></div>'+
    '<p class="review-flag">🏷 BAIHUA 題庫 · Trad. Chinese · 雙向</p>';
  function setMode(m,btn){
    mode=m;
    ['bh-quiz','bh-reveal','bh-speakmode'].forEach(function(id){document.getElementById(id).classList.remove('on');});
    btn.classList.add('on');paint();
  }
  bindTap(document.getElementById('bh-quiz'),function(){setMode('quiz',this);});
  bindTap(document.getElementById('bh-reveal'),function(){setMode('reveal',this);});
  bindTap(document.getElementById('bh-speakmode'),function(){setMode('speak',this);});
  function speakTarget(it){
    if(it.speak)return it.speak;
    if(it.dir.indexOf('白話→')===0)return it.ans;
    return it.src;
  }
  function goNext(){i++;document.getElementById('bh-speak').innerHTML='';paint();}
  bindTap(document.getElementById('bh-next-top'),goNext);
  function paint(){
    var it=bank[i%bank.length];
    var q=document.getElementById('bh-q');
    var st=speakTarget(it);
    if(mode==='quiz'){
      q.innerHTML='<span class="tag">'+esc(it.dir)+'</span>'+
        '<p class="q-big">'+esc(it.src)+'</p>'+
        '<p class="muted">揀正確轉換</p><div id="bh-opts"></div>'+
        '<button class="btn sm" type="button" id="bh-next" style="margin-top:8px;background:linear-gradient(180deg,#ffb4c8,#f07a9a)">下一題 →</button>';
      var choices=shuffle([it.ans].concat(it.distractors||[]).slice(0,4));
      var box=document.getElementById('bh-opts');var locked=false;
      choices.forEach(function(c){
        var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=c;
        bindTap(b,function(){
          if(locked)return;locked=true;
          var ok=c===it.ans;
          b.classList.add(ok?'correct':'wrong');
          Array.prototype.forEach.call(box.children,function(el){if(el.textContent===it.ans)el.classList.add('correct');});
          toast(ok?'✅ 正確':'❌ 參考：'+it.note);
          if(ok){bumpProgress(1);mountSpeakPractice(document.getElementById('bh-speak'),st,{label:'朗讀目標句（普通話）',onNext:goNext});}
        });
        box.appendChild(b);
      });
      bindTap(document.getElementById('bh-next'),goNext);
    }else if(mode==='reveal'){
      q.innerHTML='<span class="tag">'+esc(it.dir)+'</span>'+
        '<p class="q-big">'+esc(it.src)+'</p>'+
        '<button class="btn sm" type="button" id="bh-show">顯示答案</button>'+
        '<div class="reveal" id="bh-ans"><b>'+esc(it.ans)+'</b><div class="muted" style="margin-top:4px">'+esc(it.note)+'</div></div>'+
        '<button class="btn sm" type="button" id="bh-next" style="margin-top:8px;background:linear-gradient(180deg,#ffb4c8,#f07a9a)">下一題 →</button>';
      bindTap(document.getElementById('bh-show'),function(){
        document.getElementById('bh-ans').classList.add('on');
        mountSpeakPractice(document.getElementById('bh-speak'),st,{label:'朗讀目標句（普通話）',onNext:goNext});
      });
      bindTap(document.getElementById('bh-next'),goNext);
    }else{
      q.innerHTML='<span class="tag">'+esc(it.dir)+'</span><span class="tag green">朗讀 AI</span>'+
        '<p class="q-big">'+esc(it.src)+'</p>'+
        '<p class="muted">目標普通話句：<b>'+esc(st)+'</b></p>'+
        '<p class="muted">'+esc(it.note)+'</p>'+
        '<button class="btn sm" type="button" id="bh-next" style="background:linear-gradient(180deg,#ffb4c8,#f07a9a)">下一題 →</button>';
      mountSpeakPractice(document.getElementById('bh-speak'),st,{label:'白話轉換 · 朗讀核對',onNext:goNext});
      bindTap(document.getElementById('bh-next'),goNext);
    }
  }
  paint();
}
