  function goNext(){if(typeof opts.onNext==='function'){egCancelPractice();opts.onNext();}else toast('撳卡片揀下一題');}
  function started(id){
    if(!current(id)||phase!=='opening')return;
    t0=performance.now();state('recording');
    status.textContent='咪已開 · '+(shortReading?'請讀「'+(shortStyle==='single'?target:shortReading.sentence)+'」':shortTarget?'請讀「'+carrierLine+'」':'請讀目標句')+'，讀完撳停止';
    limitTimer=setTimeout(function(){if(current(id)&&phase==='recording'){status.textContent='已錄 2 分鐘，自動停止…';stop();}},120000);
  }
  function fallback(reason){
    if(!alive())return;
    egStopRecognizeHard();clearTimeout(limitTimer);state('idle');
    var message=reason==='no-speech'?'Google 多次未回傳語音。':reason==='start-timeout'?'Google 語音服務啟動逾時。':egMicError({error:reason});
    if(egStableAvailable()&&!/not-allowed|NotAllowed|Permission/.test(reason)){
      setPracticeMode('stable');setHint();warmup();status.textContent='已轉 Whisper，請再撳咪重新讀一次。';
      result.classList.add('on');result.innerHTML='<div>'+esc(message)+'</div><div class="muted">已選本機 Whisper；上一段 Google 收音無錄音檔，請重新讀。</div>';
    }else{tag('fail','開咪失敗');error(message);}
  }
  function begin(){
    if(phase!=='idle')return;setDockCollapsed(false);egStopSpeech();lastRecording=null;replayBox.hidden=true;recordedAudio.removeAttribute('src');egClearRec();
    var id=++serial;activeMode=getPracticeMode();result.classList.remove('on');result.innerHTML='';heardEl.textContent='';
    var level=root.querySelector('[data-level]');level.style.transform='scaleX(0)';
    if(window.isSecureContext===false){error(egMicError());return;}
    if(activeMode==='fast'&&!egFastAvailable()){
      if(!egStableAvailable()){error('瀏覽器未有可用語音功能，請用 HTTPS 網址及最新版 Chrome／Safari。');return;}
      setPracticeMode('stable');activeMode='stable';setHint();warmup();
    }
    state('opening');status.textContent='開緊麥克風；請允許網站收音，等「咪已開」先讀。';
    if(activeMode==='fast'){
      var ok=egStartRecognize(target,function(text,isFinal){if(current(id)){heardEl.textContent='聽到：'+text+(isFinal?'':'…');}},function(reason){if(current(id))fallback(reason);},function(){if(current(id)){tag('ready','Google · 咪已開');started(id);}});
      if(!ok&&current(id)&&phase==='opening')fallback(egRecog.lastError||'unsupported');return;
    }
    if(!egStableAvailable()){error(egMicError());return;}
    egStartStableOnly(function(msg){if(current(id)){egClearRec();error(msg);}}).then(function(ok){
      if(!current(id))return;
      if(!ok){error(egWhisper.lastErr||'開唔到咪');return;}
      started(id);warmup();
    });
  }
  function stop(){
    if(phase!=='recording')return;var id=serial;clearTimeout(limitTimer);state('stopping');status.textContent='完成錄音中…';
    if(activeMode==='fast'){
      egStopRecognize().then(function(text){if(current(id))showScore(text,{via:'google'});},function(err){if(current(id))error(err.message);});return;
    }
    egStopStableOnly().then(function(res){
      if(!current(id))return;
      if(!res.blob||res.blob.size<100)throw new Error('錄音未收到資料，請重新開咪。');
      if(res.pcm&&res.samples/res.pcm.rate<0.18)throw new Error('錄音太短，請等咪開好再讀完整提示句。');
      lastRecording=res;recordedAudio.src=egRec.url;replayBox.hidden=false;

  function transcribeRecording(res,id){

function bindTap(el,fn){
  if(!el)return;
  el.style.cursor='pointer';
  var last=0;
  el.onclick=function(ev){
    try{if(ev){ev.preventDefault();ev.stopPropagation();}}catch(e){}
    var now=Date.now();
    if(now-last<400)return;
    last=now;
    try{fn.call(el,ev);}catch(err){console.error('操作未完成',err);toast('操作未完成，請再試');}
  };
}
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  clearTimeout(toast._tm);toast._tm=setTimeout(function(){t.classList.remove('on');},1700);
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0;var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function todayKey(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function loadState(){
  try{return JSON.parse(localStorage.getItem('mg-progress-v1')||'{}')||{};}catch(e){return {};}
}
function saveState(st){try{localStorage.setItem('mg-progress-v1',JSON.stringify(st));}catch(e){}}
function bumpProgress(n){
  n=n||1;
  var st=loadState();
  var tk=todayKey();
  if(st.lastDay!==tk){
    if(st.lastDay){
      var prev=new Date(st.lastDay+'T12:00:00');
      var cur=new Date(tk+'T12:00:00');
      var diff=Math.round((cur-prev)/86400000);
      st.streak=(diff===1)?((st.streak|0)+1):1;
    }else st.streak=1;
    st.lastDay=tk;st.today=0;
  }
  st.today=(st.today|0)+n;
  st.total=(st.total|0)+n;
  saveState(st);refreshStats();
}
function refreshStats(){
  var st=loadState();
  var el=document.getElementById('st-streak');if(el)el.textContent=st.streak|0;
  el=document.getElementById('st-today');if(el)el.textContent=st.today|0;
  el=document.getElementById('st-done');if(el)el.textContent=st.total|0;
}

var SCENARIOS=[{"id":1,"cat":"food","catLabel":"飲食","region":"全國","title":"餐廳入座","scene":"你走進一家普通餐廳，服務員帶位並請你看菜單。","lines":[{"who":"店員","zh":"您好，请问几位？","py":"nín hǎo, qǐng wèn jǐ wèi?"},{"who":"你","zh":"两位。","py":"liǎng wèi."},{"who":"店員","zh":"这边请，请看菜单。","py":"zhè biān qǐng, qǐng kàn cài dān."},{"who":"你","zh":"谢谢。","py":"xiè xie."}],"practice":["请问几位？","两位。","请看菜单。"],"notes":"內地餐廳常先問人數再帶位，菜單有時分紙本與電子二維碼。"},{"id":2,"cat":"food","catLabel":"飲食","region":"全國","title":"點主食","scene":"點菜時店員問你要什麼主食。","lines":[{"who":"店員","zh":"主食要米饭还是面？","py":"zhǔ shí yào mǐ fàn hái shì miàn?"},{"who":"你","zh":"两碗米饭，谢谢。","py":"liǎng wǎn mǐ fàn, xiè xie."},{"who":"店員","zh":"好的，马上为您安排。","py":"hǎo de, mǎ shàng wèi nín ān pái."}],"practice":["主食要米饭还是面？","两碗米饭，谢谢。"],"notes":"華北、西北常配麵與饅頭；華南、華東更常配米飯。"},{"id":3,"cat":"food","catLabel":"飲食","region":"全國","title":"忌口與辣度","scene":"點菜時說明忌口與能否吃辣。","lines":[{"who":"店員","zh":"您能吃辣吗？","py":"nín néng chī là ma?"},{"who":"你","zh":"不能太辣，请少放辣椒。","py":"bù néng tài là, qǐng shǎo fàng là jiāo."},{"who":"店員","zh":"有海鲜过敏吗？","py":"yǒu hǎi xiān guò mǐn ma?"},{"who":"你","zh":"没有，谢谢。","py":"méi yǒu, xiè xie."}],"practice":["您能吃辣吗？","请少放辣椒。"],"notes":"點菜時主動說忌口可減少換菜麻煩；「微辣／中辣／特辣」各地標準不同。"},{"id":4,"cat":"food","catLabel":"飲食","region":"全國","title":"結帳埋單","scene":"用餐結束，你準備結帳。","lines":[{"who":"你","zh":"买单，谢谢。","py":"mǎi dān, xiè xie."},{"who":"店員","zh":"一共八十五元。","py":"yī gòng bā shí wǔ yuán."},{"who":"你","zh":"可以扫码支付吗？","py":"kě yǐ sǎo mǎ zhī fù ma?"},{"who":"店員","zh":"可以，微信或支付宝都行。","py":"kě yǐ, Wēi xìn huò Zhī fù bǎo dōu xíng."}],"practice":["买单，谢谢。","可以扫码支付吗？"],"notes":"內地日常多用微信／支付寶掃碼；現金仍可用但部分店較少備零錢。"},{"id":5,"cat":"food","catLabel":"飲食","region":"全國","title":"外賣打包","scene":"吃不完想打包帶走。","lines":[{"who":"你","zh":"剩下的请打包。","py":"shèng xià de qǐng dǎ bāo."},{"who":"店員","zh":"好的，稍等。","py":"hǎo de, shāo děng."},{"who":"店員","zh":"给您，请拿好。","py":"gěi nín, qǐng ná hǎo."}],"practice":["剩下的请打包。","请拿好。"],"notes":"「打包」即 takeaway；部分城市鼓勵自備餐盒減塑。"},{"id":6,"cat":"food","catLabel":"飲食","region":"全國","title":"茶位與茶水","scene":"茶餐廳或中餐廳問你喝什麼茶。","lines":[{"who":"店員","zh":"喝点什么茶？","py":"hē diǎn shén me chá?"},{"who":"你","zh":"请来一壶茉莉花茶。","py":"qǐng lái yī hú mò lì huā chá."},{"who":"店員","zh":"好的，茶马上到。","py":"hǎo de, chá mǎ shàng dào."}],"practice":["喝点什么茶？","请来一壶茉莉花茶。"],"notes":"華北常見花茶、綠茶；華南、福建更常烏龍、普洱；「茶位」在粵式早茶另計。"},{"id":7,"cat":"food","catLabel":"飲食","region":"全國","title":"早餐包子油條","scene":"早上在街邊早餐攤點吃。","lines":[{"who":"店員","zh":"要几个包子？","py":"yào jǐ gè bāo zi?"},{"who":"你","zh":"两个猪肉包，一根油条。","py":"liǎng gè zhū ròu bāo, yī gēn yóu tiáo."},{"who":"店員","zh":"豆浆要甜的还是咸的？","py":"dòu jiāng yào tián de hái shì xián de?"},{"who":"你","zh":"甜豆浆，谢谢。","py":"tián dòu jiāng, xiè xie."}],"practice":["两个猪肉包，一根油条。","甜豆浆，谢谢。"],"notes":"北方早餐常見豆漿配油條；南方亦有腸粉、粥品等。"},{"id":8,"cat":"food","catLabel":"飲食","region":"全國","title":"火鍋桌邊禮儀","scene":"第一次吃火鍋，朋友教你注意事項。","lines":[{"who":"朋友","zh":"先煮蔬菜，再下肉片。","py":"xiān zhǔ shū cài, zài xià ròu piàn."},{"who":"你","zh":"肉要煮多久？","py":"ròu yào zhǔ duō jiǔ?"},{"who":"朋友","zh":"薄肉片变色就可以夹起来。","py":"báo ròu piàn biàn sè jiù kě yǐ jiā qǐ lái."},{"who":"朋友","zh":"公用筷子和自己的筷子要分开。","py":"gōng yòng kuài zi hé zì jǐ de kuài zi yào fēn kāi."}],"practice":["先煮蔬菜，再下肉片。","公用筷子和自己的筷子要分开。"],"notes":"公筷／公勺在內地餐桌上日益普遍，尤其多人同鍋時。"},{"id":9,"cat":"food","catLabel":"飲食","region":"全國","title":"超市買水果","scene":"在超市生鮮區選水果並問價錢。","lines":[{"who":"你","zh":"这些苹果怎么卖？","py":"zhè xiē píng guǒ zěn me mài?"},{"who":"店員","zh":"八块钱一斤。","py":"bā kuài qián yī jīn."},{"who":"你","zh":"请帮我称两斤。","py":"qǐng bāng wǒ chēng liǎng jīn."}],"practice":["这些苹果怎么卖？","请帮我称两斤。"],"notes":"市斤約 500 克；不少超市已改用公斤標價，問清楚單位較穩妥。"},{"id":10,"cat":"food","catLabel":"飲食","region":"全國","title":"夜市小吃","scene":"晚上逛夜市，想點幾樣小吃。","lines":[{"who":"你","zh":"这个烤串多少钱？","py":"zhè ge kǎo chuàn duō shǎo qián?"},{"who":"店員","zh":"羊肉串三块一串。","py":"yáng ròu chuàn sān kuài yī chuàn."},{"who":"你","zh":"来五串，微辣。","py":"lái wǔ chuàn, wēi là."}],"practice":["这个烤串多少钱？","来五串，微辣。"],"notes":"夜市攤位現金與掃碼都常見；注意衛生與現烤現賣時段。"},{"id":11,"cat":"food","catLabel":"飲食","region":"北京","title":"北京烤鴨點餐","scene":"在北京特色餐廳點烤鴨。","lines":[{"who":"店員","zh":"烤鸭要一只还是半只？","py":"kǎo yā yào yī zhī hái shì bàn zhī?"},{"who":"你","zh":"半只就够了。","py":"bàn zhī jiù gòu le."},{"who":"店員","zh":"饼和甜面酱要吗？","py":"bǐng hé tián miàn jiàng yào ma?"},{"who":"你","zh":"都要，谢谢。","py":"dōu yào, xiè xie."}],"practice":["烤鸭要一只还是半只？","半只就够了。"],"notes":"北京烤鴨傳統配荷葉餅、蔥絲與甜麵醬；片皮與鴨架可另做湯。"},{"id":12,"cat":"food","catLabel":"飲食","region":"北京","title":"涮羊肉","scene":"冬天在京味店吃銅鍋涮肉。","lines":[{"who":"朋友","zh":"这是鲜切羊肉片。","py":"zhè shì xiān qiē yáng ròu piàn."},{"who":"你","zh":"怎么蘸料最好？","py":"zěn me zhàn liào zuì hǎo?"},{"who":"朋友","zh":"芝麻酱加点香菜和葱花。","py":"zhī ma jiàng jiā diǎn xiāng cài hé cōng huā."}],"practice":["这是鲜切羊肉片。","芝麻酱加点香菜和葱花。"],"notes":"京式涮羊肉以清湯為主，重在肉質與麻醬調料，與川渝麻辣鍋不同。"},{"id":13,"cat":"culture","catLabel":"文化","region":"北京","title":"天安門廣場問路","scene":"遊客在北京市中心問路去故宮方向。","lines":[{"who":"旅客","zh":"请问故宫怎么走？","py":"qǐng wèn Gù gōng zěn me zǒu?"},{"who":"路人","zh":"往北走就是午门。","py":"wǎng běi zǒu jiù shì Wǔ mén."},{"who":"旅客","zh":"需要预约吗？","py":"xū yào yù yuē ma?"},{"who":"路人","zh":"一般要提前网上预约。","py":"yī bān yào tí qián wǎng shàng yù yuē."}],"practice":["请问故宫怎么走？","一般要提前网上预约。"],"notes":"故宮等熱門景點多需網上預約限流，出行前查開放時間較穩妥。"},{"id":14,"cat":"food","catLabel":"飲食","region":"天津","title":"天津狗不理包子","scene":"在天津點著名包子作早餐。","lines":[{"who":"店員","zh":"要几屉包子？","py":"yào jǐ tì bāo zi?"},{"who":"你","zh":"一屉猪肉的。","py":"yī tì zhū ròu de."},{"who":"店員","zh":"配碗豆腐脑吗？","py":"pèi wǎn dòu fu nǎo ma?"},{"who":"你","zh":"要一碗咸的。","py":"yào yī wǎn xián de."}],"practice":["一屉猪肉的。","要一碗咸的。"],"notes":"天津早餐以包子、煎餅果子、豆腐腦聞名；豆腐腦口味分鹹甜。"},{"id":15,"cat":"food","catLabel":"飲食","region":"天津","title":"煎餅果子","scene":"街邊攤點一份煎餅果子。","lines":[{"who":"你","zh":"来一个煎饼果子。","py":"lái yī gè jiān bǐng guǒ zi."},{"who":"店員","zh":"加蛋吗？要不要脆饼？","py":"jiā dàn ma? yào bu yào cuì bǐng?"},{"who":"你","zh":"加蛋，多放点酱。","py":"jiā dàn, duō fàng diǎn jiàng."}],"practice":["来一个煎饼果子。","加蛋，多放点酱。"],"notes":"煎餅果子是天津街頭快餐代表，常加雞蛋、脆薄餅與甜麵醬。"},{"id":16,"cat":"food","catLabel":"飲食","region":"河北","title":"驢肉火燒","scene":"在河北或京津冀交界品嚐驢肉火燒。","lines":[{"who":"店員","zh":"火烧要热的还是温的？","py":"huǒ shāo yào rè de hái shì wēn de?"},{"who":"你","zh":"热的，多放点肉。","py":"rè de, duō fàng diǎn ròu."},{"who":"店員","zh":"配碗粉汤吗？","py":"pèi wǎn fěn tāng ma?"}],"practice":["热的，多放点肉。","配碗粉汤吗？"],"notes":"保定、河間等地以驢肉火燒聞名，常配高湯或粉湯。"},{"id":17,"cat":"food","catLabel":"飲食","region":"山西","title":"刀削麵","scene":"在山西麵館看師傅削麵入鍋。","lines":[{"who":"店員","zh":"刀削面要什么浇头？","py":"dāo xiāo miàn yào shén me jiāo tou?"},{"who":"你","zh":"番茄鸡蛋浇头。","py":"fān qié jī dàn jiāo tou."},{"who":"店員","zh":"汤要清汤还是炸酱？","py":"tāng yào qīng tāng hái shì zhá jiàng?"},{"who":"你","zh":"清汤就可以。","py":"qīng tāng jiù kě yǐ."}],"practice":["刀削面要什么浇头？","番茄鸡蛋浇头。"],"notes":"刀削麵是山西代表麵食，麵片中厚邊薄，配各種澆頭。"},{"id":18,"cat":"culture","catLabel":"文化","region":"山西","title":"平遙古城參觀","scene":"在平遙古城門口了解門票與開放時間。","lines":[{"who":"旅客","zh":"门票包含哪些景点？","py":"mén piào bāo hán nǎ xiē jǐng diǎn?"},{"who":"店員","zh":"古城通票含几处博物馆。","py":"gǔ chéng tōng piào hán jǐ chù bó wù guǎn."},{"who":"旅客","zh":"可以骑自行车吗？","py":"kě yǐ qí zì xíng chē ma?"}],"practice":["门票包含哪些景点？","可以骑自行车吗？"],"notes":"平遙是保存較完整的明清古城，遊覽時注意古城牆與商號建築保護。"},{"id":19,"cat":"food","catLabel":"飲食","region":"山東","title":"魯菜蔥燒海參","scene":"在山東餐廳瞭解魯菜特點。","lines":[{"who":"店員","zh":"推荐葱烧海参。","py":"tuī jiàn cōng shāo hǎi shēn."},{"who":"你","zh":"味道会很咸吗？","py":"wèi dào huì hěn xián ma?"},{"who":"店員","zh":"偏鲜香，葱香很重。","py":"piān xiān xiāng, cōng xiāng hěn zhòng."}],"practice":["推荐葱烧海参。","偏鲜香，葱香很重。"],"notes":"魯菜注重火候與鮮香，蔥、蒜運用多，是傳統四大菜系之一。"},{"id":20,"cat":"food","catLabel":"飲食","region":"山東","title":"煎餅捲大蔥","scene":"在濟南或泰安吃地方小吃。","lines":[{"who":"朋友","zh":"山东煎饼可以卷大葱。","py":"Shān dōng jiān bǐng kě yǐ juǎn dà cōng."},{"who":"你","zh":"甜面酱也要吗？","py":"tián miàn jiàng yě yào ma?"},{"who":"朋友","zh":"加点酱更香。","py":"jiā diǎn jiàng gèng xiāng."}],"practice":["山东煎饼可以卷大葱。","加点酱更香。"],"notes":"山東煎餅多為雜糧製成，可卷大蔥、醬菜，與天津煎餅果子不同。"},{"id":21,"cat":"food","catLabel":"飲食","region":"遼寧","title":"瀋陽烤冷麵","scene":"在瀋陽夜市點烤冷麵。","lines":[{"who":"你","zh":"来一份烤冷面。","py":"lái yī fèn kǎo lěng miàn."},{"who":"店員","zh":"加蛋和火腿吗？","py":"jiā dàn hé huǒ tuǐ ma?"},{"who":"你","zh":"都加，酱多一点。","py":"dōu jiā, jiàng duō yī diǎn."}],"practice":["来一份烤冷面。","都加，酱多一点。"],"notes":"烤冷麵是東北街頭小吃，把冷麵皮煎香後加醬與配料。"},{"id":22,"cat":"food","catLabel":"飲食","region":"吉林","title":"延邊冷麵","scene":"在延邊或吉林市品嚐朝鮮族冷麵。","lines":[{"who":"店員","zh":"冷面要牛肉汤底吗？","py":"lěng miàn yào niú ròu tāng dǐ ma?"},{"who":"你","zh":"要，再加一个鸡蛋。","py":"yào, zài jiā yī gè jī dàn."},{"who":"店員","zh":"辣白菜要多吗？","py":"là bái cài yào duō ma?"}],"practice":["冷面要牛肉汤底吗？","要，再加一个鸡蛋。"],"notes":"延邊冷麵受朝鮮族飲食影響，湯清爽，常配牛肉、雞蛋與泡菜。"},{"id":23,"cat":"food","catLabel":"飲食","region":"黑龍江","title":"鍋包肉","scene":"在哈爾濱點東北經典菜。","lines":[{"who":"店員","zh":"锅包肉要酸甜口。","py":"guō bāo ròu yào suān tián kǒu."},{"who":"你","zh":"一份锅包肉，再来个地三鲜。","py":"yī fèn guō bāo ròu, zài lái gè dì sān xiān."},{"who":"店員","zh":"主食要米饭吗？","py":"zhǔ shí yào mǐ fàn ma?"}],"practice":["一份锅包肉，再来个地三鲜。","主食要米饭吗？"],"notes":"鍋包肉外酥裏嫩、酸甜適口，是黑龍江代表性菜式之一。"},{"id":24,"cat":"culture","catLabel":"文化","region":"黑龍江","title":"冰雪大世界","scene":"冬天在哈爾濱了解冰雪活動入場。","lines":[{"who":"旅客","zh":"门票几点开始入场？","py":"mén piào jǐ diǎn kāi shǐ rù chǎng?"},{"who":"店員","zh":"下午开门，晚上灯光最漂亮。","py":"xià wǔ kāi mén, wǎn shàng dēng guāng zuì piào liang."},{"who":"旅客","zh":"里面很冷，要多穿。","py":"lǐ miàn hěn lěng, yào duō chuān."}],"practice":["门票几点开始入场？","晚上灯光最漂亮。"],"notes":"哈爾濱冰雪季活動豐富，戶外停留需注意保暖與防滑。"},{"id":25,"cat":"culture","catLabel":"文化","region":"內蒙古","title":"草原奶茶","scene":"在內蒙古品嚐鹹味奶茶與奶食。","lines":[{"who":"主人","zh":"这是蒙古族奶茶，偏咸。","py":"zhè shì Měng gǔ zú nǎi chá, piān xián."},{"who":"你","zh":"可以加奶皮子吗？","py":"kě yǐ jiā nǎi pí zi ma?"},{"who":"主人","zh":"可以，再配一点奶豆腐。","py":"kě yǐ, zài pèi yī diǎn nǎi dòu fu."}],"practice":["这是蒙古族奶茶，偏咸。","可以加奶皮子吗？"],"notes":"草原奶茶常為鹹口，與甜奶茶不同；奶食是日常待客常見搭配。"},{"id":26,"cat":"food","catLabel":"飲食","region":"上海","title":"生煎包","scene":"在上海早餐店點生煎。","lines":[{"who":"你","zh":"来四个生煎包。","py":"lái sì gè shēng jiān bāo."},{"who":"店員","zh":"要猪肉还是虾仁的？","py":"yào zhū ròu hái shì xiā rén de?"},{"who":"你","zh":"猪肉的，再来一碗豆浆。","py":"zhū ròu de, zài lái yī wǎn dòu jiāng."}],"practice":["来四个生煎包。","猪肉的，再来一碗豆浆。"],"notes":"生煎包底部煎至金黃，湯汁較多，小心燙口。"},{"id":27,"cat":"food","catLabel":"飲食","region":"上海","title":"小籠包蘸醋","scene":"學吃小籠包的正確方式。","lines":[{"who":"朋友","zh":"先咬小口，吸一口汤。","py":"xiān yǎo xiǎo kǒu, xī yī kǒu tāng."},{"who":"你","zh":"要蘸醋和姜丝吗？","py":"yào zhàn cù hé jiāng sī ma?"},{"who":"朋友","zh":"可以，别一下咬破。","py":"kě yǐ, bié yī xià yǎo pò."}],"practice":["先咬小口，吸一口汤。","要蘸醋和姜丝吗？"],"notes":"小籠包特色是皮薄湯多；南翔等地最為人熟知。"},{"id":28,"cat":"culture","catLabel":"文化","region":"上海","title":"外灘夜景","scene":"晚上在外灘看對岸陸家嘴。","lines":[{"who":"朋友","zh":"对岸是陆家嘴的高楼。","py":"duì àn shì Lù jiā zuǐ de gāo lóu."},{"who":"你","zh":"可以坐轮渡过去吗？","py":"kě yǐ zuò dù lún guò qù ma?"},{"who":"朋友","zh":"可以，地铁也很方便。","py":"kě yǐ, dì tiě yě hěn fāng biàn."}],"practice":["对岸是陆家嘴的高楼。","地铁也很方便。"],"notes":"外灘與陸家嘴隔黃浦江相望，夜景是上海經典遊覽路線。"},{"id":29,"cat":"food","catLabel":"飲食","region":"江蘇","title":"南京鴨血粉絲湯","scene":"在南京點鴨血粉絲湯。","lines":[{"who":"你","zh":"来一碗鸭血粉丝汤。","py":"lái yī wǎn yā xuè fěn sī tāng."},{"who":"店員","zh":"要不要加鸭肝？","py":"yào bu yào jiā yā gān?"},{"who":"你","zh":"加，辣椒油少一点。","py":"jiā, là jiāo yóu shǎo yī diǎn."}],"practice":["来一碗鸭血粉丝汤。","辣椒油少一点。"],"notes":"南京鴨製品豐富，鴨血粉絲湯是常見小吃與早餐選擇。"},{"id":30,"cat":"food","catLabel":"飲食","region":"江蘇","title":"蘇州麵湯分開","scene":"在蘇州麵店體驗「麵湯分開」。","lines":[{"who":"店員","zh":"面条和汤是分开的。","py":"miàn tiáo hé tāng shì fēn kāi de."},{"who":"你","zh":"为什么要分开？","py":"wèi shén me yào fēn kāi?"},{"who":"店員","zh":"这样面条更劲道。","py":"zhè yàng miàn tiáo gèng jìn dao."}],"practice":["面条和汤是分开的。","这样面条更劲道。"],"notes":"蘇式麵常「麵湯分開」或寬湯窄麵，強調麵的口感與澆頭。"},{"id":31,"cat":"food","catLabel":"飲食","region":"浙江","title":"西湖醋魚","scene":"在杭州點杭幫菜。","lines":[{"who":"店員","zh":"西湖醋鱼是酸甜口。","py":"Xī hú cù yú shì suān tián kǒu."},{"who":"你","zh":"再来一份龙井虾仁。","py":"zài lái yī fèn Lóng jǐng xiā rén."},{"who":"店員","zh":"主食要米饭吗？","py":"zhǔ shí yào mǐ fàn ma?"}],"practice":["西湖醋鱼是酸甜口。","再来一份龙井虾仁。"],"notes":"杭幫菜口味偏清淡鮮嫩；龍井蝦仁用茶葉提香是地方特色。"},{"id":32,"cat":"culture","catLabel":"文化","region":"浙江","title":"西湖遊船","scene":"在杭州問西湖遊船班次。","lines":[{"who":"旅客","zh":"游船多久一班？","py":"yóu chuán duō jiǔ yī bān?"},{"who":"店員","zh":"大约二十分钟一班。","py":"dà yuē èr shí fēn zhōng yī bān."},{"who":"旅客","zh":"可以看三潭印月吗？","py":"kě yǐ kàn Sān tán yìn yuè ma?"}],"practice":["游船多久一班？","可以看三潭印月吗？"],"notes":"西湖是杭州核心景區，遊船可近距離看湖心島嶼與堤岸景色。"},{"id":33,"cat":"food","catLabel":"飲食","region":"浙江","title":"寧波湯圓","scene":"冬至或平時吃寧波風味湯圓。","lines":[{"who":"朋友","zh":"宁波汤圆是黑芝麻馅。","py":"Níng bō tāng yuán shì hēi zhī ma xiàn."},{"who":"你","zh":"要煮多久？","py":"yào zhǔ duō jiǔ?"},{"who":"朋友","zh":"浮起来再煮一两分钟。","py":"fú qǐ lái zài zhǔ yī liǎng fēn zhōng."}],"practice":["宁波汤圆是黑芝麻馅。","浮起来再煮一两分钟。"],"notes":"寧波湯圓以豬油黑芝麻餡聞名，冬至吃湯圓是常見習俗。"},{"id":34,"cat":"food","catLabel":"飲食","region":"安徽","title":"徽州臭鱖魚","scene":"在安徽餐廳瞭解徽菜代表菜。","lines":[{"who":"店員","zh":"臭鳜鱼闻着臭，吃着香。","py":"chòu guì yú wén zhe chòu, chī zhe xiāng."},{"who":"你","zh":"味道会很重吗？","py":"wèi dào huì hěn zhòng ma?"},{"who":"店員","zh":"咸鲜为主，可以先尝一小块。","py":"xián xiān wéi zhǔ, kě yǐ xiān cháng yī xiǎo kuài."}],"practice":["臭鳜鱼闻着臭，吃着香。","可以先尝一小块。"],"notes":"徽菜重火功與醃鮮；臭鱖魚經發酵工藝，是黃山一帶名菜。"},{"id":35,"cat":"culture","catLabel":"文化","region":"安徽","title":"黃山登山提示","scene":"登黃山前了解天氣與索道。","lines":[{"who":"旅客","zh":"今天山上有云海吗？","py":"jīn tiān shān shàng yǒu yún hǎi ma?"},{"who":"工作人員","zh":"看天气，早上更常见。","py":"kàn tiān qì, zǎo shang gèng cháng jiàn."},{"who":"旅客","zh":"索道还在运行吗？","py":"suǒ dào hái zài yùn xíng ma?"}],"practice":["今天山上有云海吗？","索道还在运行吗？"],"notes":"黃山雲海、奇松聞名；登山請查即時天氣、索道與安全提示。"},{"id":36,"cat":"food","catLabel":"飲食","region":"福建","title":"佛跳牆介紹","scene":"在福州餐廳聽店員介紹名菜。","lines":[{"who":"店員","zh":"佛跳墙是多种海鲜炖的。","py":"Fó tiào qiáng shì duō zhǒng hǎi xiān dùn de."},{"who":"你","zh":"分量适合几个人？","py":"fèn liàng shì hé jǐ gè rén?"},{"who":"店員","zh":"一小盅适合两到三位。","py":"yī xiǎo zhōng shì hé liǎng dào sān wèi."}],"practice":["佛跳墙是多种海鲜炖的。","一小盅适合两到三位。"],"notes":"佛跳牆是閩菜高端代表，用多種山珍海味長期煨製。"},{"id":37,"cat":"food","catLabel":"飲食","region":"福建","title":"廈門沙茶麵","scene":"在廈門點一碗沙茶麵。","lines":[{"who":"你","zh":"来一碗沙茶面。","py":"lái yī wǎn shā chá miàn."},{"who":"店員","zh":"要加什么料？","py":"yào jiā shén me liào?"},{"who":"你","zh":"加豆腐和瘦肉。","py":"jiā dòu fu hé shòu ròu."}],"practice":["来一碗沙茶面。","加豆腐和瘦肉。"],"notes":"沙茶醬帶花生與香料風味，是閩南、廈門常見麵湯底。"},{"id":38,"cat":"culture","catLabel":"文化","region":"福建","title":"土樓參觀","scene":"在福建土樓景區了解建築特點。","lines":[{"who":"導遊","zh":"土楼是客家人的传统民居。","py":"tǔ lóu shì Kè jiā rén de chuán tǒng mín jū."},{"who":"旅客","zh":"里面可以住人吗？","py":"lǐ miàn kě yǐ zhù rén ma?"},{"who":"導遊","zh":"部分楼栋仍有居民生活。","py":"bù fèn lóu dòng réng yǒu jū mín shēng huó."}],"practice":["土楼是客家人的传统民居。","部分楼栋仍有居民生活。"],"notes":"福建土樓以圓樓、方樓聞名，體現客家聚居與防禦需求，參觀時尊重居民隱私。"},{"id":39,"cat":"food","catLabel":"飲食","region":"江西","title":"瓦罐湯","scene":"在南昌喝瓦罐湯。","lines":[{"who":"店員","zh":"瓦罐汤要排骨还是鸡汤？","py":"wǎ guàn tāng yào pái gǔ hái shì jī tāng?"},{"who":"你","zh":"排骨汤，再来一份拌粉。","py":"pái gǔ tāng, zài lái yī fèn bàn fěn."},{"who":"店員","zh":"粉要辣一点吗？","py":"fěn yào là yī diǎn ma?"}],"practice":["排骨汤，再来一份拌粉。","粉要辣一点吗？"],"notes":"南昌瓦罐湯以小瓦罐慢燉，常配拌粉或米粉，是地方早餐特色。"},{"id":40,"cat":"culture","catLabel":"文化","region":"江西","title":"景德鎮瓷器","scene":"在景德鎮了解瓷器購買與包裝。","lines":[{"who":"旅客","zh":"这个杯子可以托运吗？","py":"zhè ge bēi zi kě yǐ tuō yùn ma?"},{"who":"店員","zh":"可以，我们会加固包装。","py":"kě yǐ, wǒ men huì jiā gù bāo zhuāng."},{"who":"旅客","zh":"是手工还是机器做的？","py":"shì shǒu gōng hái shì jī qì zuò de?"}],"practice":["这个杯子可以托运吗？","我们会加固包装。"],"notes":"景德鎮有「瓷都」之稱；購買易碎品請確認包裝與運輸方式。"},{"id":41,"cat":"food","catLabel":"飲食","region":"河南","title":"胡辣湯配包子","scene":"在河南早餐店點胡辣湯。","lines":[{"who":"你","zh":"来一碗胡辣汤。","py":"lái yī wǎn hú là tāng."},{"who":"店員","zh":"要不要配包子？","py":"yào bu yào pèi bāo zi?"},{"who":"你","zh":"配两个素包。","py":"pèi liǎng gè sù bāo."}],"practice":["来一碗胡辣汤。","配两个素包。"],"notes":"胡辣湯是河南經典早餐，胡椒與香料味突出，常配油條或包子。"},{"id":42,"cat":"culture","catLabel":"文化","region":"河南","title":"龍門石窟","scene":"在洛陽參觀龍門石窟。","lines":[{"who":"旅客","zh":"参观大约需要多久？","py":"cān guān dà yuē xū yào duō jiǔ?"},{"who":"工作人員","zh":"走主要洞窟大概两小时。","py":"zǒu zhǔ yào dòng kū dà gài liǎng xiǎo shí."},{"who":"旅客","zh":"可以拍照吗？","py":"kě yǐ pāi zhào ma?"}],"practice":["参观大约需要多久？","走主要洞窟大概两小时。"],"notes":"龍門石窟是中國重要石刻藝術遺產，部分區域對閃光燈有限制。"},{"id":43,"cat":"food","catLabel":"飲食","region":"湖北","title":"熱乾麵","scene":"在武漢早餐點熱乾麵。","lines":[{"who":"你","zh":"来一碗热干面。","py":"lái yī wǎn rè gān miàn."},{"who":"店員","zh":"酸豆角要多吗？","py":"suān dòu jiǎo yào duō ma?"},{"who":"你","zh":"多一点，辣椒少一点。","py":"duō yī diǎn, là jiāo shǎo yī diǎn."}],"practice":["来一碗热干面。","辣椒少一点。"],"notes":"熱乾麵以芝麻醬拌麵、無湯，是武漢最具代表性的過早（早餐）麵食。"},{"id":44,"cat":"food","catLabel":"飲食","region":"湖北","title":"小龍蝦季節","scene":"夏天在湖北點小龍蝦。","lines":[{"who":"店員","zh":"小龙虾要什么味道？","py":"xiǎo lóng xiā yào shén me wèi dào?"},{"who":"你","zh":"蒜蓉微辣。","py":"suàn róng wēi là."},{"who":"店員","zh":"要几斤？","py":"yào jǐ jīn?"},{"who":"你","zh":"两斤，谢谢。","py":"liǎng jīn, xiè xie."}],"practice":["蒜蓉微辣。","两斤，谢谢。"],"notes":"潛江等地小龍蝦產業知名；口味有香辣、蒜蓉、十三香等。"},{"id":45,"cat":"food","catLabel":"飲食","region":"湖南","title":"湘菜剁椒魚頭","scene":"在長沙點湘菜，先確認辣度。","lines":[{"who":"店員","zh":"剁椒鱼头很下饭。","py":"duò jiāo yú tóu hěn xià fàn."},{"who":"你","zh":"可以做成微辣吗？","py":"kě yǐ zuò chéng wēi là ma?"},{"who":"店員","zh":"可以，我们少放辣椒。","py":"kě yǐ, wǒ men shǎo fàng là jiāo."}],"practice":["可以做成微辣吗？","我们少放辣椒。"],"notes":"湘菜重辣重油香；點菜時可明確「微辣／免辣」以便廚房調整。"},{"id":46,"cat":"culture","catLabel":"文化","region":"湖南","title":"張家界景區","scene":"在張家界了解百龍天梯與行程。","lines":[{"who":"旅客","zh":"百龙电梯还开放吗？","py":"Bǎi lóng diàn tī hái kāi fàng ma?"},{"who":"工作人員","zh":"开放，但可能排队。","py":"kāi fàng, dàn kě néng pái duì."},{"who":"旅客","zh":"景区车票怎么买？","py":"jǐng qū chē piào zěn me mǎi?"}],"practice":["百龙电梯还开放吗？","景区车票怎么买？"],"notes":"張家界砂岩峰林地貌獨特；旺季建議預留排隊與交通接駁時間。"},{"id":47,"cat":"food","catLabel":"飲食","region":"廣東","title":"早茶點心","scene":"在廣州茶樓食早茶。","lines":[{"who":"店員","zh":"请问要什么茶？","py":"qǐng wèn yào shén me chá?"},{"  zhí zǒu jiù dào."},{"who":"旅客","zh":"附近有公交吗？","py":"fù jìn yǒu gōng jiāo ma?"}],"practice":["中山桥怎么走？","沿河边一直走就到。"],"notes":"中山橋是蘭州黃河上的歷史橋梁，夜景與河邊步道適合散步。"},{"id":85,"cat":"daily","catLabel":"日常","region":"陝西","title":"回民街購物禮貌","scene":"在西安回民街買點心注意禮貌用語。","lines":[{"who":"你","zh":"老板，这个怎么卖？","py":"lǎo bǎn, zhè ge zěn me mài?"},{"who":"店員","zh":"二十元一斤。","py":"èr shí yuán yī jīn."},{"who":"你","zh":"请给我装一点。","py":"qǐng gěi wǒ zhuāng yī diǎn."}],"practice":["老板，这个怎么卖？","请给我装一点。"],"notes":"回民街商販眾多；購買清真食品時可禮貌詢問成分與新鮮程度。"},{"id":86,"cat":"culture","catLabel":"文化","region":"全國","title":"春節拜年問候","scene":"春節期間用普通話拜年。","lines":[{"who":"你","zh":"过年好！祝您新年快乐。","py":"guò nián hǎo! zhù nín xīn nián kuài lè."},{"who":"親戚","zh":"恭喜发财，万事如意。","py":"gōng xǐ fā cái, wàn shì rú yì."},{"who":"你","zh":"谢谢，也祝您身体健康。","py":"xiè xie, yě zhù nín shēn tǐ jiàn kāng."}],"practice":["过年好！祝您新年快乐。","也祝您身体健康。"],"notes":"春節是中國最重要傳統節日之一，拜年用語各地略有差異但祝福相通。"},{"id":87,"cat":"food","catLabel":"飲食","region":"全國","title":"年夜飯餃子","scene":"北方家庭年夜飯常包餃子。","lines":[{"who":"家人","zh":"过年要吃饺子。","py":"guò nián yào chī jiǎo zi."},{"who":"你","zh":"我来帮忙包。","py":"wǒ lái bāng máng bāo."},{"who":"家人","zh":"馅里有白菜和猪肉。","py":"xiàn lǐ yǒu bái cài hé zhū ròu."}],"practice":["过年要吃饺子。","我来帮忙包。"],"notes":"許多北方家庭除夕吃餃子；南方年夜飯菜式更豐富多樣。"},{"id":88,"cat":"culture","catLabel":"文化","region":"全國","title":"中秋月餅分享","scene":"中秋節與同事分享月餅。","lines":[{"who":"同事","zh":"中秋快乐，吃块月饼。","py":"Zhōng qiū kuài lè, chī kuài yuè bǐng."},{"who":"你","zh":"谢谢，这是什么馅？","py":"xiè xie, zhè shì shén me xiàn?"},{"who":"同事","zh":"莲蓉蛋黄的。","py":"lián róng dàn huáng de."}],"practice":["中秋快乐，吃块月饼。","这是什么馅？"],"notes":"中秋賞月、食月餅象徵團圓；餡料有蓮蓉、五仁、鮮肉等。"},{"id":89,"cat":"food","catLabel":"飲食","region":"廣東","title":"冬至湯圓或餃子","scene":"冬至在南方吃湯圓的對話。","lines":[{"who":"朋友","zh":"冬至吃汤圆，圆圆满满。","py":"dōng zhì chī tāng yuán, yuán yuán mǎn mǎn."},{"who":"你","zh":"北方是不是吃饺子？","py":"běi fāng shì bu shì chī jiǎo zi?"},{"who":"朋友","zh":"很多地方会吃饺子。","py":"hěn duō dì fāng huì chī jiǎo zi."}],"practice":["冬至吃汤圆，圆圆满满。","很多地方会吃饺子。"],"notes":"冬至飲食南北有別：南方常食湯圓，北方多食餃子。"},{"id":90,"cat":"food","catLabel":"飲食","region":"上海","title":"本幫紅燒肉","scene":"在上海本幫菜館點紅燒肉。","lines":[{"who":"店員","zh":"推荐本帮红烧肉。","py":"tuī jiàn běn bāng hóng shāo ròu."},{"who":"你","zh":"会不会很甜？","py":"huì bu huì hěn tián?"},{"who":"店員","zh":"偏甜咸，配米饭很合适。","py":"piān tián xián, pèi mǐ fàn hěn hé shì."}],"practice":["推荐本帮红烧肉。","会不会很甜？"],"notes":"本幫菜常用糖提鮮，紅燒肉色澤紅亮、甜鹹平衡。"},{"id":91,"cat":"food","catLabel":"飲食","region":"湖南","title":"臭豆腐街頭","scene":"在長沙街頭嘗試臭豆腐。","lines":[{"who":"店員","zh":"臭豆腐要炸得脆吗？","py":"chòu dòu fu yào zhá de cuì ma?"},{"who":"你","zh":"要脆的，酱汁少一点。","py":"yào cuì de, jiàng zhī shǎo yī diǎn."},{"who":"店員","zh":"加香菜和辣椒吗？","py":"jiā xiāng cài hé là jiāo ma?"}],"practice":["要脆的，酱汁少一点。","加香菜和辣椒吗？"],"notes":"長沙臭豆腐外酥內嫩，氣味發酵獨特；可自選醬料與辣度。"},{"id":92,"cat":"culture","catLabel":"文化","region":"北京","title":"胡同騎行","scene":"在北京胡同租自行車遊覽。","lines":[{"who":"旅客","zh":"可以在胡同骑车吗？","py":"kě yǐ zài hú tòng qí chē ma?"},{"who":"店員","zh":"可以，请慢行注意行人。","py":"kě yǐ, qǐng màn xíng zhù yì xíng rén."},{"who":"旅客","zh":"附近有四合院参观吗？","py":"fù jìn yǒu sì hé yuàn cān guān ma?"}],"practice":["可以在胡同骑车吗？","请慢行注意行人。"],"notes":"胡同與四合院是北京傳統居住形態；遊覽時請尊重居民生活。"},{"id":93,"cat":"food","catLabel":"飲食","region":"貴州","title":"腸旺麵","scene":"在貴陽早餐點腸旺麵。","lines":[{"who":"你","zh":"来一碗肠旺面。","py":"lái yī wǎn cháng wàng miàn."},{"who":"店員","zh":"血旺和肥肠都要吗？","py":"xuè wàng hé féi cháng dōu yào ma?"},{"who":"你","zh":"都要，辣度中等。","py":"dōu yào, là dù zhōng děng."}],"practice":["来一碗肠旺面。","辣度中等。"],"notes":"腸旺麵是貴陽代表性早餐麵，以豬血旺、肥腸與酸辣湯底為特色。"},{"id":94,"cat":"culture","catLabel":"文化","region":"內蒙古","title":"那達慕介紹","scene":"夏天瞭解草原那達慕活動內容。","lines":[{"who":"導遊","zh":"那达慕有摔跤、赛马和射箭。","py":"Nà dá mù yǒu shuāi jiāo, sài mǎ hé shè jiàn."},{"who":"旅客","zh":"一般在哪个季节？","py":"yī bān zài nǎ ge jì jié?"},{"who":"導遊","zh":"多在夏季举行。","py":"duō zài xià jì jǔ xíng."}],"practice":["那达慕有摔跤、赛马和射箭。","多在夏季举行。"],"notes":"那達慕是蒙古族傳統盛會，以「男兒三藝」等競技與歌舞為核心。"},{"id":95,"cat":"food","catLabel":"飲食","re   egCancelPractice();

  var body=document.getElementById('mod-body');

/* 拼音花園：聲母／韻母解析 + 例字例句（唔讀單字） */
function mgToneStripPy(py){
  return String(py||'').toLowerCase()
    .replace(/[āáǎà]/g,'a').replace(/[ēéěè]/g,'e').replace(/[īíǐì]/g,'i')
    .replace(/[ōóǒò]/g,'o').replace(/[ūúǔù]/g,'u').replace(/[ǖǘǚǜ]/g,'ü')
    .replace(/v/g,'ü').replace(/[ńňǹṅ]/g,'n').replace(/[0-5]/g,'').trim();
}
function mgSplitPinyin(py){
  var base=mgToneStripPy(py), initials=['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s'], i, ini, fin;
  if(!base)return {initial:'ø',final:''};
  if(base.charAt(0)==='y'){
    fin=base.slice(1);
    if(fin.charAt(0)==='u')fin='ü'+fin.slice(1);
    else if(fin.charAt(0)!=='i')fin='i'+fin;
    if(fin==='iou')fin='iu';
    if(fin==='uei')fin='ui';
    if(fin==='uen')fin='un';
    return {initial:'ø',final:fin};
  }
  if(base.charAt(0)==='w'){
    fin=base.slice(1);
    if(fin.charAt(0)!=='u')fin='u'+fin;
    if(fin==='iou')fin='iu';
    if(fin==='uei')fin='ui';
    if(fin==='uen')fin='un';
    return {initial:'ø',final:fin};
  }
  for(i=0;i<initials.length;i++){
    ini=initials[i];
    if(base.indexOf(ini)===0){
      fin=base.slice(ini.length);
      if((ini==='j'||ini==='q'||ini==='x')&&fin.charAt(0)==='u')fin='ü'+fin.slice(1);
      if(fin==='iou')fin='iu';
      if(fin==='uei')fin='ui';
      if(fin==='uen')fin='un';
      return {initial:ini,final:fin||''};
    }
  }
  fin=base;
  if(fin==='iou')fin='iu';
  if(fin==='uei')fin='ui';
  if(fin==='uen')fin='un';
  return {initial:'ø',final:fin};
}
function mgCharSentence(c){
  if(!c)return '';
  if(c.sentence&&String(c.sentence).trim())return String(c.sentence).trim();
  var zh=c.zh||c.speak||'';
  return zh?('请跟我一起读「'+zh+'」这个字。'):'';
}
function mgPinyinSamplesFromBank(){
  if(typeof CHAR_BANK==='undefined'||!CHAR_BANK.length){
    return (PINYIN.samples||[]).map(function(s){
      return {zh:s.zh,py:s.py,speak:s.speak||s.zh,sentence:s.sentence||('请跟我一起读「'+(s.zh||'')+'」这个字。'),initial:mgSplitPinyin(s.py).initial,final:mgSplitPinyin(s.py).final};
    });
  }
  return CHAR_BANK.map(function(c){
    var sp=mgSplitPinyin(c.py);
    return {zh:c.zh,py:c.py,speak:c.speak||c.zh,sentence:mgCharSentence(c),initial:sp.initial,final:sp.final,tone:c.tone};
  });
}

  body.innerHTML='<p class="hint">撳下面字詞聽<strong>例句</strong>示範；每個例字用例句跟讀，練完 AI 核對。聲母／韻母會列出用嗰個音嘅字。頂部有「下一題」。</p>'+
    '<div id="py-speak" class="speak-dock-anchor"></div>'+
    '<div class="chips" id="py-tabs"></div><div id="py-panel"></div>';

  function practiceText(it){
    var s=(it&&it.sentence)||'';

    return s;

  function mountCur(){
    if(!curList.length){
      var host=document.getElementById('py-speak');
      if(host)host.innerHTML='<p class="muted">呢個音暫時未有對應例字。</p>';
      return;
    }
    var it=curList[curIdx%curList.length];
    var sent=practiceText(it);
    fillTtsPlayer(sent);
    mountSpeakPractice(document.getElementById('py-speak'),sent,{
      focusWord:it.zh,label:'拼音跟讀 · '+it.zh+'（'+(curIdx%curList.length+1)+'/'+curList.length+'）· 目標例句',
      onNext:function(){
        curIdx=(curIdx+1)%curList.length;
        speak(practiceText(curList[curIdx]));
        mountCur();
      }
    });
  }
  function paintGrid(container, list, heading){
    var total=list.length, pages=Math.max(1, Math.ceil(Math.max(total,1)/pageSize));
    if(page>=pages)page=0;
    var start=page*pageSize, end=Math.min(start+pageSize, total);
    var head=document.createElement('div');
    head.innerHTML=heading;

      g.innerHTML='<p class="muted">未有對應字。</p>';
      document.getElementById('py-speak').innerHTML='<p class="muted">呢個音暫時未有對應例字。</p>';
      return;
    }
    for(var ix=start;ix<end;ix++){
      (function(ix){
        var it=list[ix];
        var btn=document.createElement('button');btn.type='button';btn.className='tone-btn';

        bindTap(btn,function(){curList=list;curIdx=ix;mountCur();speak(practiceText(it));});
        g.appendChild(btn);
      })(ix);
    }

function renderListen(body){
  var bank=shuffle(LISTEN_BANK);
  var i=0,locked=false;
  body.innerHTML='<div class="progress"><i id="lis-bar"></i></div><div id="lis-q"></div>';
  function paint(){
    locked=false;
    var item=bank[i%bank.length];
    var bar=document.getElementById('lis-bar');
    if(bar)bar.style.width=Math.min(100,((i%bank.length)/bank.length)*100)+'%';
    var q=document.getElementById('lis-q');
    q.innerHTML='<p class="q-big">'+esc(item.q)+'</p>'+
      '<button class="btn" type="button" id="lis-play">🔊 先聽示範</button>'+
      '<div id="lis-opts" style="margin-top:12px"></div>'+
      '<button class="btn sm" type="button" id="lis-next" style="margin-top:10px;background:linear-gradient(180deg,#ffb4c8,#f07a9a)">下一題 →</button>';
    bindTap(document.getElementById('lis-play'),function(){speak(item.speak);});
    var opts=shuffle(item.opts.map(function(t,idx){return {t:t,idx:idx};}));
    var box=document.getElementById('lis-opts');
    opts.forEach(function(o){
      var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=o.t;
      bindTap(b,function(){
        if(locked)return;locked=true;
        var ok=o.idx===item.ans;
        b.classList.add(ok?'correct':'wrong');
        Array.prototype.forEach.call(box.children,function(el){
          if(el.textContent===item.opts[item.ans])el.classList.add('correct');
        });

    bindTap(document.getElementById('lis-next'),function(){i++;paint();});
  }
  paint();
}

function egDialogTotal(){
  if(typeof SCENARIOS!=='undefined' && SCENARIOS && SCENARIOS.length)return SCENARIOS.length;
  var n=0,cats=Object.keys(DIALOGS);for(var i=0;i<cats.length;i++)n+=DIALOGS[cats[i]].length;return n;
}
function egScenariosByCat(catLabel){
  if(typeof SCENARIOS==='undefined'||!SCENARIOS)return DIALOGS[catLabel]||[];
  return SCENARIOS.filter(function(s){return s.catLabel===catLabel;});
}
function egDialogGlobalIndex(cat,idx){
  if(typeof SCENARIOS!=='undefined' && SCENARIOS && SCENARIOS.length){
    var list=egScenariosByCat(cat);var s=list[idx];if(!s)return idx;
    for(var i=0;i<SCENARIOS.length;i++){if(SCENARIOS[i].id===s.id)return i;}
    return idx;
  }
  var n=0,cats=Object.keys(DIALOGS);
  for(var i=0;i<cats.length;i++){
    if(cats[i]===cat)return n+idx;
    n+=DIALOGS[cats[i]].length;
  }
  return n+idx;
}
function egDialogPracticeLines(sc){
  if(!sc)return [];
  var lines=(sc.lines||[]).map(function(line){return String(line.zh||'').trim();}).filter(Boolean);
  var practice=sc.practice&&sc.practice.length?sc.practice:lines;
  return practice.map(function(value){
    var raw=String(value||'').trim(),norm=egZhNormText(raw);
    var exact=lines.filter(function(line){return egZhNormText(line)===norm;});if(exact.length)return exact[0];
    var matches=lines.filter(function(line){return norm&&egZhNormText(line).indexOf(norm)>=0;});
    return matches.length===1?matches[0]:raw;
  }).filter(Boolean);
}
function egDialogContextLine(text){
  var key=egZhNormText(text),map={'两位':'我们一共两位。','要微辣':'我要微辣的。','谢谢':'谢谢您的帮助。','好的':'好的，我明白了。'};
  return map[key]||String(text||'');
}
